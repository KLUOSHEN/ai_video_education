<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="栈知映学习论坛 —— 计算机学生的交流社区：前端、算法、后端、AI 四大技能模块，发帖讨论、学习打卡、进度追踪。">
<title>栈知映 · 学习论坛</title>
<link rel="stylesheet" href="forum.css">
<script src="../mdrender.js" defer></script>
<script src="forum.js" defer></script>
    <script defer src="https://unpkg.com/lucide@1.21.0/dist/umd/lucide.min.js"></script>
    <script defer src="../lucide-unify.js"></script>
  </head>
<body>
<a class="skip-link" href="#feed">跳到主内容</a>

<!-- ══ 顶栏 ══ -->
<header class="topbar" id="topbar">
  <a class="tb-logo" href="#/" aria-label="栈知映学习论坛首页">
    <span class="tb-logo-badge">栈</span>
    <span class="tb-logo-text">栈知映<em>论坛</em></span>
  </a>

  <div class="tb-search" role="search">
    <span class="tb-search-icon" aria-hidden="true" data-icon="search"></span>
    <input type="search" id="globalSearch" placeholder="搜索帖子、标签、用户…" aria-label="搜索帖子、标签、用户">
    <kbd>/</kbd>
  </div>

  <div class="tb-actions">
    <button class="tb-btn" id="themeBtn" title="切换明暗主题" aria-label="切换明暗主题"><span data-icon="moon"></span></button>
    <button class="tb-btn has-badge" id="notifBtn" title="通知" aria-label="通知">
      <span data-icon="bell"></span><b class="tb-badge" id="notifBadge" hidden>0</b>
    </button>
    <a class="tb-btn" href="#/messages" title="私信" aria-label="私信"><span data-icon="message"></span></a>
    <div class="tb-user" id="tbUser"></div>
  </div>
</header>

<div class="layout">
  <!-- ══ 左侧导航 ══ -->
  <aside class="sidebar" id="sidebar" aria-label="论坛导航"></aside>

  <!-- ══ 主内容 ══ -->
  <main class="feed" id="feed" tabindex="-1" aria-live="polite"></main>

  <!-- ══ 右侧栏 ══ -->
  <aside class="rail" id="rail" aria-label="热门与推荐"></aside>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="assertive"></div>

<noscript><div class="noscript">本论坛需要启用 JavaScript 才能使用。</div></noscript>
</body>
</html>
