<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栈知映 · AI 生成技能树</title>
<style>
  :root {
    --bg: #020617; --panel: #0b1220; --panel-2: #0f172a; --border: #1e293b;
    --border-soft: #334155; --text: #e2e8f0; --text-dim: #94a3b8; --text-muted: #64748b;
    --cyan: #22d3ee; --cyan-soft: rgba(34,211,238,0.12); --amber: #fbbf24;
    --emerald: #34d399; --yellow: #facc15; --danger: #f87171;
    --ease: cubic-bezier(.23,1,.32,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: 'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px;
    height: 60px; padding: 0 18px; flex-shrink: 0; background: rgba(2,6,23,0.9);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 50; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .back { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
    border-radius: 10px; color: var(--text-dim); text-decoration: none; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--border); transition: .2s var(--ease); }
  .back:hover { color: var(--cyan); border-color: var(--cyan); }
  .brand h1 { font-size: 16px; font-weight: 700; }

  .gen-bar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; flex-shrink: 0;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .gen-bar input { height: 38px; padding: 0 14px; border-radius: 10px; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--text); font-size: 13.5px; outline: none;
    font-family: inherit; transition: .2s var(--ease); }
  .gen-bar input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,0.15); }
  #topicInput { flex: 1; min-width: 200px; max-width: 420px; }
  #goalInput { flex: 1; min-width: 200px; max-width: 420px; }
  .gen-bar input::placeholder { color: var(--text-muted); }
  .gen-btn { height: 38px; padding: 0 20px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #22d3ee, #0891b2); color: #052e2b; font-size: 14px;
    font-weight: 700; font-family: inherit; transition: .2s var(--ease); white-space: nowrap; }
  .gen-btn:hover { box-shadow: 0 4px 20px rgba(34,211,238,0.4); }
  .gen-btn:disabled { opacity: .5; cursor: not-allowed; }
  .gen-hint { font-size: 11.5px; color: var(--text-muted); }

  .main { flex: 1; min-height: 0; display: flex; }
  .canvas-wrap { flex: 1; min-width: 0; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 0%, rgba(8,145,178,0.08), transparent 40%), var(--bg);
    cursor: grab; }
  .canvas-wrap.dragging { cursor: grabbing; }
  .viewport { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  .edge-svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

  .node { position: absolute; width: 190px; min-height: 76px; padding: 10px 12px; border-radius: 14px;
    border: 2px solid var(--border-soft); background: rgba(15,23,42,0.92); color: var(--text-dim);
    cursor: pointer; user-select: none; transition: box-shadow .35s var(--ease), border-color .35s var(--ease), transform .18s var(--ease); }
  .node:hover { z-index: 10; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  .node.selected { transform: scale(1.05); z-index: 20; box-shadow: 0 0 0 2px rgba(34,211,238,0.7), 0 8px 34px rgba(0,0,0,0.6); }
  .node.not_started { border-color: #334155; background: rgba(15,23,42,0.85); color: #94a3b8; }
  .node.in_progress { border-color: #fcd34d; background: rgba(69,26,3,0.82); color: #fef3c7; animation: pulse 2.2s ease-in-out infinite; }
  .node.completed { border-color: #a7f3d0; background: rgba(52,211,153,0.16); color: #052e1b; box-shadow: 0 0 26px rgba(52,211,153,0.35); }
  .node.mastered { border-color: #fef08a; background: rgba(250,204,21,0.18); color: #4a2c00; box-shadow: 0 0 30px rgba(250,204,21,0.4); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 18px rgba(251,191,36,0.35); } 50% { box-shadow: 0 0 32px rgba(251,191,36,0.65); } }
  .node-head { display: flex; align-items: flex-start; gap: 8px; }
  .node-icon { font-size: 20px; line-height: 1.2; flex-shrink: 0; }
  .node-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.25; word-break: break-word; }
  .node-meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .node-meta span { font-size: 10px; padding: 2px 7px; border-radius: 999px; border: 1px solid rgba(148,163,184,0.35); color: var(--text-dim); }
  .node.not_started .node-meta span { border-color: #334155; color: #64748b; }
  .node-cat { font-weight: 600; }
  .handle { position: absolute; left: 50%; width: 8px; height: 8px; border-radius: 50%; background: #64748b; transform: translateX(-50%); }
  .handle.top { top: -5px; } .handle.bottom { bottom: -5px; }

  .detail { width: 300px; flex-shrink: 0; overflow-y: auto; background: var(--panel);
    border-left: 1px solid var(--border); padding: 20px 18px; }
  .detail-empty { height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 13px; text-align: center; line-height: 1.8; }
  .detail-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .detail-head .big-icon { font-size: 30px; line-height: 1; }
  .detail-head h2 { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .detail-tags span { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--text-dim); }
  .detail-tags .tag-depth { color: var(--cyan); border-color: rgba(34,211,238,0.35); background: rgba(34,211,238,0.08); }
  .detail-desc { font-size: 13px; line-height: 1.7; color: var(--text-dim); margin-bottom: 14px; }
  .detail-section { margin-bottom: 16px; }
  .detail-section h3 { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 8px; }
  .detail-section ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .detail-section li { font-size: 13px; line-height: 1.6; color: var(--text-dim); display: flex; gap: 8px; }
  .detail-section li .bullet { flex-shrink: 0; }
  .detail-section.objective li .bullet { color: var(--cyan); }
  .detail-section.evidence li .bullet { color: var(--emerald); }
  .detail-section.rationale p { font-size: 13px; line-height: 1.65; color: var(--text-dim);
    padding: 10px 12px; border-radius: 10px; background: rgba(34,211,238,0.06); border: 1px solid rgba(34,211,238,0.18); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; padding: 4px 10px; border-radius: 8px; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--text-dim); }

  .canvas-tools { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 40; }
  .canvas-tools button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text-dim); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: .18s var(--ease); }
  .canvas-tools button:hover { color: var(--cyan); border-color: var(--cyan); }

  .progressbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 16px;
    padding: 0 18px; background: var(--panel); border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); }
  .progressbar strong { color: var(--text); font-size: 12.5px; }
  .progress-track { flex: 1; height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; display: flex; }
  .progress-track .seg { height: 100%; transition: width .4s var(--ease); }
  .seg.completed { background: var(--emerald); } .seg.mastered { background: var(--yellow); } .seg.current { background: var(--amber); }
  .stat { white-space: nowrap; } .stat b { font-weight: 700; }

  .edge { fill: none; stroke: #334155; stroke-width: 1.4; }
  .edge.completed { stroke: var(--emerald); stroke-width: 2; }
  .edge.mastered { stroke: var(--yellow); stroke-width: 2; }
  .edge.animated { stroke-dasharray: 6 6; animation: dashflow 0.8s linear infinite; }
  @keyframes dashflow { to { stroke-dashoffset: -12; } }

  .loading-mask { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: rgba(2,6,23,0.82); color: var(--text-dim); }
  .loading-mask .spinner { width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid var(--border-soft); border-top-color: var(--cyan); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .error-box .inner { max-width: 440px; background: rgba(127,29,29,0.25); border: 1px solid rgba(248,113,113,0.4);
    border-radius: 14px; padding: 18px 20px; color: #fecaca; font-size: 13.5px; line-height: 1.7; text-align: center; }
  .error-box .inner button { margin-top: 12px; padding: 7px 16px; border-radius: 8px; border: 1px solid rgba(248,113,113,0.5);
    background: transparent; color: #fecaca; cursor: pointer; font-family: inherit; font-size: 12.5px; }
  @media (max-width: 860px) { .detail { width: 260px; } .gen-hint { display: none; } }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="back" href="/skilltree.html">← 内置技能树</a>
      <h1>AI 生成学习路线图</h1>
    </div>
  </header>

  <div class="gen-bar">
    <input id="topicInput" placeholder="学习方向,如:Go 后端开发" value="">
    <input id="goalInput" placeholder="目标(可选),如:进大厂做高并发服务">
    <button class="gen-btn" id="genBtn" onclick="generate()">⚡ 生成技能树</button>
    <span class="gen-hint">调用 deepseek-v4-flash,约 10~60 秒</span>
  </div>

  <main class="main">
    <section class="canvas-wrap" id="canvasWrap">
      <div class="viewport" id="viewport"><svg class="edge-svg" id="edgeSvg"></svg></div>
      <div class="canvas-tools">
        <button onclick="zoomBy(1.25)" title="放大">+</button>
        <button onclick="zoomBy(0.8)" title="缩小">−</button>
        <button onclick="fitView()" title="适应画布" style="font-size:15px">⤢</button>
      </div>
      <div class="detail-empty" id="emptyHint" style="position:absolute;inset:0;z-index:1;">
        输入学习方向,点击「生成技能树」<br>AI 会生成一棵由浅入深的知识树
      </div>
      <div class="loading-mask" id="loadingMask" style="display:none;">
        <div class="spinner"></div>
        <div>AI 正在生成技能树…</div>
      </div>
      <div class="error-box" id="errorBox" style="display:none;">
        <div class="inner" id="errorText"></div>
      </div>
    </section>
    <aside class="detail" id="detailPanel"><div class="detail-empty">点击节点查看学习目标与掌握证据</div></aside>
  </main>

  <footer class="progressbar" id="progressbar"><strong>尚未生成</strong><div class="progress-track" style="flex:1"></div><span class="stat">输入方向后点击生成</span></footer>

<script>
var ICON_EMOJI = {
  activity:'📈', book:'📖', brain:'🧠', bug:'🐛', cloud:'☁️', compass:'🧭',
  code:'⌨️', cube:'🧊', database:'🗄️', edit:'✏️', gauge:'📊', history:'🕘',
  layers:'🗂️', lightbulb:'💡', link:'🔗', map:'🗺️', message:'💬', network:'🕸️',
  output:'📤', pause:'⏸️', puzzle:'🧩', radio:'📻', refresh:'🌀', rocket:'🚀',
  scissors:'✂️', server:'🖥️', settings:'⚙️', shield:'🛡️', sort:'↕️', sync:'🔄',
  template:'📋', tool:'🛠️', trending:'📉', trophy:'🏆', workflow:'🔀', wrench:'🔧'
};
var DEPTH_LABELS = { Recognize:'认识', Understand:'理解', Use:'应用', Transfer:'迁移', DeepMastery:'深度掌握' };
var STATUS_LABELS = { not_started:'未学习', in_progress:'正在学习', completed:'已完成', mastered:'已掌握' };

var NODE_W = 190, NODE_H = 88, HGAP = 34, VGAP = 58;
var state = { snapshot: null, selected: null, scale: 1, tx: 0, ty: 0, nodes: [], edges: [], positions: {} };

var canvasWrap = document.getElementById('canvasWrap');
var viewport = document.getElementById('viewport');
var edgeSvg = document.getElementById('edgeSvg');
var detailPanel = document.getElementById('detailPanel');
var progressbar = document.getElementById('progressbar');

// 解析字符串化 JSON 数组或原生数组
function parseArr(v) {
  if (Array.isArray(v)) return v;
  if (typeof v === 'string' && v.trim()) { try { return JSON.parse(v); } catch (e) { return []; } }
  return [];
}

// SKILL_TREE.json -> 渲染快照
function convertSnapshot(snap) {
  var nodes = (snap.nodes || []).map(function (n) {
    var prog = (snap.progress || []).filter(function (p) { return p.node_id === n.id; })[0];
    return {
      id: n.id, title: n.title, icon: n.icon, category: n.category || '未分类',
      depth_level: n.depth_level || 1, recommended_depth: n.recommended_depth || 'Understand',
      status: prog ? prog.status : 'not_started', order: n.order_in_level || 0,
      description: n.description || null, learning_objectives: parseArr(n.learning_objectives),
      key_concepts: parseArr(n.key_concepts), observable_evidence: parseArr(n.observable_evidence),
      depth_rationale: n.depth_rationale || '', difficulty: n.difficulty || 1, estimated_minutes: n.estimated_minutes || 90
    };
  });
  var edges = (snap.edges || []).map(function (e) {
    return { id: e.id, source: e.source_node_id, target: e.target_node_id };
  });
  return {
    tree: snap.tree || { id: '', topic: '', title: '', description: '' },
    current: snap.current_node_id || (nodes[0] ? nodes[0].id : null),
    nodes: nodes, edges: edges
  };
}

function iconEmoji(icon) { return ICON_EMOJI[icon] || '📖'; }

// 布局:拓扑排序 + 最长路径 + barycenter
function computeLayout(nodes, edges) {
  var children = {}, parents = {}, depth = {}, span = {};
  nodes.forEach(function (n) { children[n.id] = []; parents[n.id] = []; depth[n.id] = n.depth_level || 1; });
  edges.forEach(function (e) {
    children[e.source].push(e.target); parents[e.target].push(e.source);
    span[e.source + '>' + e.target] = Math.max(1, (depth[e.target] || 1) - (depth[e.source] || 1));
  });
  var indegree = {}, layer = {};
  nodes.forEach(function (n) { indegree[n.id] = parents[n.id].length; layer[n.id] = 0; });
  var queue = nodes.filter(function (n) { return parents[n.id].length === 0; }).map(function (n) { return n.id; });
  while (queue.length) {
    var u = queue.shift();
    children[u].forEach(function (v) {
      layer[v] = Math.max(layer[v] || 0, (layer[u] || 0) + (span[u + '>' + v] || 1));
      indegree[v]--; if (indegree[v] === 0) queue.push(v);
    });
  }
  var levels = {};
  nodes.forEach(function (n) { var l = layer[n.id] || 0; (levels[l] = levels[l] || []).push(n); });
  var ordered = Object.keys(levels).map(Number).sort(function (a, b) { return a - b; });
  var colStep = NODE_W + HGAP, rowStep = NODE_H + VGAP;
  var orderInLayer = {}, positions = {};
  ordered.forEach(function (lvl) {
    var levelNodes = levels[lvl];
    var sorted = levelNodes.slice().sort(function (a, b) {
      if (lvl === 0) return (a.order || 0) - (b.order || 0);
      function avg(id) { var ps = parents[id] || []; if (!ps.length) return 0;
        return ps.reduce(function (s, p) { return s + (orderInLayer[p] || 0); }, 0) / ps.length; }
      return avg(a.id) - avg(b.id);
    });
    var levelWidth = sorted.length * colStep - HGAP;
    var startX = -levelWidth / 2;
    sorted.forEach(function (n, i) { orderInLayer[n.id] = i; positions[n.id] = { x: startX + i * colStep, y: lvl * rowStep }; });
  });
  return positions;
}

function edgePath(sx, sy, tx, ty) { var midY = (sy + ty) / 2;
  return 'M ' + sx + ' ' + sy + ' C ' + sx + ' ' + midY + ' ' + tx + ' ' + midY + ' ' + tx + ' ' + ty; }

function render() {
  var s = state.snapshot; if (!s) return;
  var nodes = s.nodes, edges = s.edges;
  state.nodes = nodes; state.edges = edges;
  state.positions = computeLayout(nodes, edges);
  state.selected = null;

  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  nodes.forEach(function (n) { var p = state.positions[n.id];
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x + NODE_W); maxY = Math.max(maxY, p.y + NODE_H); });
  var pad = 60, vbW = (maxX - minX) + pad * 2, vbH = (maxY - minY) + pad * 2, ox = minX - pad, oy = minY - pad;

  var svgParts = [];
  edges.forEach(function (e) {
    var sp = state.positions[e.source], tp = state.positions[e.target];
    if (!sp || !tp) return;
    var sx = sp.x + NODE_W / 2, sy = sp.y + NODE_H, tx = tp.x + NODE_W / 2, ty = tp.y;
    var cls = 'edge', src = nodes.filter(function (n) { return n.id === e.source; })[0];
    if (src && (src.status === 'completed' || src.status === 'mastered')) { cls += ' ' + src.status + ' animated'; }
    svgParts.push('<path class="' + cls + '" d="' + edgePath(sx, sy, tx, ty) + '"/>');
  });
  edgeSvg.setAttribute('viewBox', ox + ' ' + oy + ' ' + vbW + ' ' + vbH);
  edgeSvg.setAttribute('width', vbW); edgeSvg.setAttribute('height', vbH);
  edgeSvg.style.left = ox + 'px'; edgeSvg.style.top = oy + 'px';
  edgeSvg.innerHTML = svgParts.join('');

  var nodeHtml = nodes.map(function (n) {
    var p = state.positions[n.id], flag = n.status === 'mastered' ? '★' : (n.status === 'completed' ? '✓' : '');
    return '<div class="node ' + n.status + '" data-id="' + n.id + '" style="left:' + p.x + 'px; top:' + p.y + 'px;">' +
      '<span class="handle top"></span><span class="handle bottom"></span>' +
      '<div class="node-head"><span class="node-icon">' + iconEmoji(n.icon) + '</span>' +
      '<span class="node-title">' + n.title + '</span>' + (flag ? '<span class="node-flag">' + flag + '</span>' : '') + '</div>' +
      '<div class="node-meta"><span class="node-cat">' + n.category + '</span>' +
      '<span>' + (DEPTH_LABELS[n.recommended_depth] || n.recommended_depth) + ' · ' + n.recommended_depth + '</span></div></div>';
  }).join('');
  viewport.querySelectorAll('.node').forEach(function (el) { el.remove(); });
  var holder = document.createElement('div'); holder.innerHTML = nodeHtml;
  while (holder.firstChild) viewport.appendChild(holder.firstChild);

  renderDetailEmpty(); renderProgress(); fitView();
}

function renderDetail(node) {
  if (!node) { renderDetailEmpty(); return; }
  var objList = (node.learning_objectives || []).map(function (o) { return '<li><span class="bullet">•</span>' + o + '</li>'; }).join('');
  var evList = (node.observable_evidence || []).map(function (o) { return '<li><span class="bullet">✓</span>' + o + '</li>'; }).join('');
  var chipHtml = (node.key_concepts || []).map(function (c) { return '<span class="chip">' + c + '</span>'; }).join('');
  detailPanel.innerHTML =
    '<div class="detail-head"><span class="big-icon">' + iconEmoji(node.icon) + '</span>' +
    '<div><h2>' + node.title + '</h2><div class="detail-tags">' +
    '<span>' + node.category + '</span>' +
    '<span class="tag-depth">' + (DEPTH_LABELS[node.recommended_depth] || '') + ' · ' + node.recommended_depth + '</span>' +
    '<span class="chip">难度 ' + (node.difficulty || 1) + '/5</span>' +
    '<span class="chip">约 ' + (node.estimated_minutes || 90) + ' 分钟</span>' +
    '</div></div></div>' +
    (node.description ? '<p class="detail-desc">' + node.description + '</p>' : '') +
    (node.depth_rationale ? '<section class="detail-section rationale"><h3>目标深度理由</h3><p>' + node.depth_rationale + '</p></section>' : '') +
    (objList ? '<section class="detail-section objective"><h3>学习目标</h3><ul>' + objList + '</ul></section>' : '') +
    (chipHtml ? '<section class="detail-section"><h3>关键概念</h3><div class="chip-row">' + chipHtml + '</div></section>' : '') +
    (evList ? '<section class="detail-section evidence"><h3>通过标准</h3><ul>' + evList + '</ul></section>' : '');
}

function renderDetailEmpty() { detailPanel.innerHTML = '<div class="detail-empty">点击节点查看学习目标与掌握证据</div>'; }

function renderProgress() {
  var nodes = state.nodes;
  if (!nodes.length) { progressbar.innerHTML = '<strong>尚未生成</strong><div class="progress-track" style="flex:1"></div><span class="stat">输入方向后点击生成</span>'; return; }
  var completed = nodes.filter(function (n) { return n.status === 'completed'; }).length;
  var mastered = nodes.filter(function (n) { return n.status === 'mastered'; }).length;
  var current = nodes.filter(function (n) { return n.status === 'in_progress'; }).length;
  var untouched = nodes.length - completed - mastered - current, total = nodes.length;
  var pct = total ? Math.round((completed + mastered) / total * 100) : 0;
  progressbar.innerHTML =
    '<strong>' + state.snapshot.tree.title + ' · 共 ' + total + ' 节点</strong>' +
    '<div class="progress-track">' +
    '<div class="seg completed" style="width:' + (completed / total * 100) + '%"></div>' +
    '<div class="seg mastered" style="width:' + (mastered / total * 100) + '%"></div>' +
    '<div class="seg current" style="width:' + (current / total * 100) + '%"></div></div>' +
    '<span class="stat">未学习 <b>' + untouched + '</b></span>';
}

function applyTransform() { viewport.style.transform = 'translate(' + state.tx + 'px,' + state.ty + 'px) scale(' + state.scale + ')'; }

function fitView() {
  if (!state.nodes.length) return;
  var wrapW = canvasWrap.clientWidth, wrapH = canvasWrap.clientHeight;
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  state.nodes.forEach(function (n) { var p = state.positions[n.id];
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x + NODE_W); maxY = Math.max(maxY, p.y + NODE_H); });
  var scale = Math.min(wrapW / (maxX - minX), wrapH / (maxY - minY)) * 0.9;
  scale = Math.max(0.1, Math.min(2.2, scale));
  var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  state.scale = scale; state.tx = wrapW / 2 - cx * scale; state.ty = wrapH / 2 - cy * scale;
  applyTransform();
}

function zoomBy(factor) {
  var rect = canvasWrap.getBoundingClientRect();
  var mx = rect.width / 2, my = rect.height / 2;
  var newScale = Math.max(0.1, Math.min(2.5, state.scale * factor));
  var wx = (mx - state.tx) / state.scale, wy = (my - state.ty) / state.scale;
  state.tx = mx - wx * newScale; state.ty = my - wy * newScale; state.scale = newScale;
  applyTransform();
}

// 交互
canvasWrap.addEventListener('wheel', function (e) {
  e.preventDefault();
  var rect = canvasWrap.getBoundingClientRect();
  var factor = e.deltaY < 0 ? 1.12 : 0.89;
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var newScale = Math.max(0.1, Math.min(2.5, state.scale * factor));
  var wx = (mx - state.tx) / state.scale, wy = (my - state.ty) / state.scale;
  state.tx = mx - wx * newScale; state.ty = my - wy * newScale; state.scale = newScale;
  applyTransform();
}, { passive: false });

var dragging = false, lastX = 0, lastY = 0;
canvasWrap.addEventListener('mousedown', function (e) {
  if (e.target.closest('.node')) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY; canvasWrap.classList.add('dragging');
});
window.addEventListener('mousemove', function (e) {
  if (!dragging) return; state.tx += e.clientX - lastX; state.ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY; applyTransform();
});
window.addEventListener('mouseup', function () { dragging = false; canvasWrap.classList.remove('dragging'); });

viewport.addEventListener('click', function (e) {
  var el = e.target.closest('.node'); if (!el) return;
  var id = el.getAttribute('data-id');
  var node = state.nodes.filter(function (n) { return n.id === id; })[0];
  if (!node) return;
  state.selected = id;
  viewport.querySelectorAll('.node').forEach(function (n) { n.classList.toggle('selected', n.getAttribute('data-id') === id); });
  renderDetail(node);
});

window.addEventListener('resize', function () { if (state.snapshot) fitView(); });

// 生成
function setLoading(on) {
  document.getElementById('loadingMask').style.display = on ? 'flex' : 'none';
  document.getElementById('genBtn').disabled = on;
}
function showError(msg) {
  var box = document.getElementById('errorBox'), text = document.getElementById('errorText');
  text.innerHTML = '<b>生成失败</b><br>' + msg + '<br><button onclick="hideError()">关闭</button>';
  box.style.display = 'flex';
}
function hideError() { document.getElementById('errorBox').style.display = 'none'; }

async function generate() {
  var topic = document.getElementById('topicInput').value.trim();
  var goal = document.getElementById('goalInput').value.trim();
  if (!topic) { showError('请输入学习方向'); return; }
  hideError();
  document.getElementById('emptyHint').style.display = 'none';
  setLoading(true);
  try {
    var resp = await fetch('/api/v1/generate-tree', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: topic, goal: goal })
    });
    if (!resp.ok) {
      var err = await resp.json().catch(function () { return {}; });
      throw new Error(err.error || ('HTTP ' + resp.status));
    }
    var snap = await resp.json();
    if (!snap.nodes || !snap.nodes.length) throw new Error('AI 未返回节点数据');
    state.snapshot = convertSnapshot(snap);
    render();
  } catch (e) {
    showError(e.message || String(e));
  } finally {
    setLoading(false);
  }
}

// 回车触发
document.getElementById('topicInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') generate(); });
document.getElementById('goalInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') generate(); });
</script>
</body>
