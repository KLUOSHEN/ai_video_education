<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>职业技能树 · 计算机就业</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F7F9FC;--bg2:#FBFCFE;--panel:#FFFFFF;--panel2:#F7F9FC;
      --line:#E2E8F0;--line-bright:#C7D2FE;
      --muted:#64748B;--muted2:#7A86A0;
      --text:#0F172A;--text2:#475569;
      --primary:#4F6BF0;--primary2:#6D83F5;--primary-glow:rgba(79,107,240,.2);
      --accent:#F59E0B;--success:#16A34A;--danger:#DC2626;
      --shadow:0 2px 12px rgba(15,23,42,.06);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{color:var(--text);font-family:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;min-height:100vh;overflow-x:hidden;background:radial-gradient(1200px 600px at 12% -10%,rgba(79,107,240,.12),transparent 60%),radial-gradient(900px 520px at 92% -5%,rgba(109,131,245,.10),transparent 55%),radial-gradient(1000px 640px at 50% 115%,rgba(34,195,230,.07),transparent 60%),var(--bg)}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(79,107,240,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(79,107,240,.02) 1px,transparent 1px),linear-gradient(rgba(79,107,240,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(79,107,240,.014) 1px,transparent 1px);background-size:28px 28px,28px 28px,140px 140px,140px 140px;pointer-events:none;z-index:0}
    body::after{content:'';position:fixed;left:-10%;width:120%;height:30vh;top:-40vh;background:linear-gradient(180deg,transparent,rgba(109,131,245,.07),transparent);pointer-events:none;z-index:0}
    .app{max-width:1500px;margin:auto;padding:20px 24px 28px;position:relative;z-index:1}
    .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .brand{display:flex;gap:13px;align-items:center}
    .badge{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));font-family:"Orbitron","Inter";font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(79,107,240,.2);animation:badgeGlow 3.2s ease-in-out infinite;position:relative}
    .badge::after{content:'';position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);background-size:220% 220%;z-index:0}
    .badge:hover::after{animation:badgeShine .9s ease-in-out}
    .badge span{position:relative;z-index:1}
    @keyframes badgeGlow{0%,100%{box-shadow:0 6px 18px rgba(79,107,240,.2)}50%{box-shadow:0 6px 30px rgba(79,107,240,.5)}}
    @keyframes badgeShine{0%,55%{background-position:220% 220%}75%,100%{background-position:-60% -60%}}
    .eyebrow{font:10px "Orbitron","Inter";font-weight:600;letter-spacing:.16em;color:var(--primary);margin-bottom:1px}
    .brand h1{font-size:19px;letter-spacing:.03em;font-weight:800;color:var(--text)}
    .actions{display:flex;gap:8px}
    .ghost{padding:7px 14px;border-radius:8px;font-size:12.5px;color:var(--text2);background:var(--panel);border:1px solid var(--line);cursor:pointer;font-family:inherit;transition:all .2s;position:relative;overflow:hidden}
    .ghost::after{content:'';position:absolute;top:0;bottom:0;left:-80%;width:50%;background:linear-gradient(100deg,transparent,rgba(79,107,240,.18),transparent);transform:skewX(-20deg);transition:left .5s;pointer-events:none}
    .ghost:hover{color:var(--primary);border-color:var(--primary);background:rgba(79,107,240,.04)}
    .ghost:hover::after{left:130%}
    .video-link{padding:8px 16px;border-radius:10px;font-size:12px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));cursor:pointer;font-family:inherit;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;box-shadow:0 2px 10px rgba(79,107,240,.25);position:relative;overflow:hidden}
    .video-link::after{content:'';position:absolute;top:0;bottom:0;left:-80%;width:50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .5s;pointer-events:none}
    .video-link:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(79,107,240,.35)}
    .video-link:hover::after{left:130%}
    .video-rec-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:all .2s;text-decoration:none;margin-top:6px}
    .video-rec-card:hover{border-color:var(--primary);box-shadow:0 2px 12px rgba(79,107,240,.1);background:#f8fbff}
    .video-rec-icon{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:15px}
    .video-rec-info{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
    .video-rec-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .video-rec-source{font-size:10px;color:var(--muted);margin-top:2px}
    .layout{display:grid;grid-template-columns:1fr minmax(300px,330px);height:min(900px,calc(100vh - 106px));border:1px solid var(--line-bright);border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow),0 0 46px rgba(79,107,240,.06)}
    .tree{position:relative;overflow:hidden;height:100%;background:radial-gradient(700px 340px at 50% -8%,rgba(79,107,240,.07),transparent 70%),var(--bg2)}
    .tree::before{content:'';position:absolute;left:16px;right:16px;top:46px;height:1px;background:linear-gradient(90deg,transparent,rgba(79,107,240,.28),transparent);z-index:0;pointer-events:none}
    .tree:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(79,107,240,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(79,107,240,.025) 1px,transparent 1px),linear-gradient(rgba(79,107,240,.016) 1px,transparent 1px),linear-gradient(90deg,rgba(79,107,240,.016) 1px,transparent 1px);background-size:24px 24px,24px 24px,120px 120px,120px 120px;z-index:0}
    .cp-decor{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .cp-decor::before,.cp-decor::after{content:'';position:absolute;width:16px;height:16px;border:1.5px solid rgba(79,107,240,.4);border-radius:2px}
    .cp-decor::before{top:8px;left:8px;border-right:none;border-bottom:none}
    .cp-decor::after{bottom:8px;right:8px;border-left:none;border-top:none}
    .cp-particles{position:absolute;inset:0;z-index:0;pointer-events:none}
    .cp-particles span{position:absolute;width:var(--ps);height:var(--ps);border-radius:50%;background:linear-gradient(135deg,#A5B4FC,var(--primary));opacity:0;filter:blur(.4px);animation:drift var(--pdur,10s) linear infinite;animation-delay:var(--pdelay,0s)}
    @keyframes drift{0%{transform:translate3d(0,0,0) scale(.6);opacity:0}12%{opacity:var(--pop,.45)}85%{opacity:var(--pop,.45)}100%{transform:translate3d(var(--px,30px),var(--py,-46px),0) scale(1.15);opacity:0}}
    .cp-canvas{position:relative;z-index:1;width:100%;height:100%}
    .cp-svg{position:absolute;inset:0;z-index:1;pointer-events:none}
    .cp-cnode{position:absolute;width:86px;height:86px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-family:inherit;z-index:3;transition:transform .25s,box-shadow .35s,opacity .35s,filter .35s;border:3px solid rgba(255,255,255,.95);background:linear-gradient(rgba(255,255,255,.78),rgba(255,255,255,.78)),var(--cc,var(--primary));color:var(--text);box-shadow:0 6px 16px var(--cc-shadow,rgba(79,107,240,.2)),inset 0 2px 0 rgba(255,255,255,.65),inset 0 -4px 10px rgba(255,255,255,.15);transform:rotate(var(--rot,0deg));overflow:hidden}
    .cp-cnode .cni{font-size:20px;position:relative;z-index:1;line-height:1;color:var(--cc,var(--primary));filter:none}
    .cp-cnode .cnn{font-size:14px;font-weight:800;position:relative;z-index:1;line-height:1.2;margin-top:1px;white-space:nowrap;color:var(--text);text-shadow:none}
    .cp-cnode .ccount{font-size:10px;font-weight:700;position:relative;z-index:1;line-height:1;margin-top:2px;color:var(--cc,var(--primary));font-family:"DM Mono","Inter";letter-spacing:.04em;text-shadow:none}
    .cp-cnode.sel .ccount{color:#fff}
    .cp-cnode:hover{transform:scale(1.14) rotate(var(--rot,0deg));z-index:5;box-shadow:0 12px 26px var(--cc-shadow,rgba(79,107,240,.25)),inset 0 2px 0 rgba(255,255,255,.5);background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.6)),var(--cc,var(--primary))}
    .cp-cnode.sel{background:var(--cc,var(--primary));box-shadow:0 0 18px var(--cc-shadow),0 0 42px var(--cc-shadow),inset 0 2px 0 rgba(255,255,255,.45);animation:selPulse 2.6s ease-in-out infinite}
    @keyframes selPulse{0%,100%{box-shadow:0 0 18px var(--cc-shadow),0 0 42px var(--cc-shadow),inset 0 2px 0 rgba(255,255,255,.45)}50%{box-shadow:0 0 30px var(--cc-shadow),0 0 62px var(--cc-shadow),inset 0 2px 0 rgba(255,255,255,.5)}}
    .cp-cnode.sel .cnn{color:#fff}
    .cp-cnode.sel .cni{color:#fff}
    .cp-cnode.dim{opacity:.22;filter:grayscale(.4)}
    .cp-snode{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;cursor:grab;z-index:2;transition:transform .25s,opacity .35s,filter .25s;transform:rotate(var(--rot,0deg));animation:float var(--dur,4s) ease-in-out infinite alternate;animation-delay:var(--delay,-1s);touch-action:none;user-select:none;line-height:1}
    .cp-snode canvas{display:block;width:100%;height:100%;pointer-events:none}
    .cp-snode:hover{animation-play-state:paused;transform:scale(1.14) rotate(var(--rot,0deg));z-index:5}
    .cp-snode.dragging{animation-play-state:paused;transform:scale(1.12) rotate(var(--rot,0deg));cursor:grabbing;filter:drop-shadow(0 14px 20px rgba(15,35,70,.28))}
    .cp-snode.on{filter:drop-shadow(0 0 7px rgba(79,107,240,.95)) drop-shadow(0 0 16px rgba(79,107,240,.45))}
    .cp-snode.hl{filter:drop-shadow(0 0 5px var(--sc-glow,rgba(79,107,240,.55)))}
    .cp-snode.dim{opacity:.22;animation-play-state:paused;filter:grayscale(.5)}
    .cp-snode canvas{will-change:transform}
    .cp-curve{fill:none;stroke-width:1;opacity:0;transition:opacity .4s,stroke-width .4s,filter .4s}
    .cp-curve.glow{opacity:1;stroke-width:2.5;filter:drop-shadow(0 0 3px currentColor)}
    .cp-curve.dim{opacity:.08;stroke-width:.5}
    @keyframes float{from{transform:translate3d(0,-3px,0) rotate(calc(var(--rot,0deg) - 1.2deg))}to{transform:translate3d(0,5px,0) rotate(calc(var(--rot,0deg) + 1.2deg))}}
    .tree-head{position:absolute;top:10px;left:16px;right:16px;z-index:4;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}
    .tree-head h2{font-size:14px;margin:0;font-weight:700;letter-spacing:.02em;color:var(--text)}
    .points{font:600 11px "Orbitron","Inter";padding:5px 10px;color:var(--primary);border:1px solid rgba(79,107,240,.18);background:rgba(79,107,240,.04);border-radius:8px;pointer-events:auto;letter-spacing:.06em;box-shadow:inset 0 0 12px rgba(79,107,240,.05)}
    aside{padding:24px 20px;background:var(--bg2);border-left:1px solid var(--line);height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(79,107,240,.25) transparent}
    aside::-webkit-scrollbar{width:6px}
    aside::-webkit-scrollbar-thumb{background:rgba(79,107,240,.22);border-radius:3px}
    aside::-webkit-scrollbar-thumb:hover{background:rgba(79,107,240,.42)}
    aside::-webkit-scrollbar-track{background:transparent}
    .aside-title{font:600 10px "Orbitron","Inter";letter-spacing:.16em;color:var(--primary);margin:0 0 6px;text-transform:uppercase}
    .route-title{font-size:21px;font-weight:800;letter-spacing:.01em;margin:0 0 8px;color:var(--text)}
    .description{font-size:13px;line-height:1.8;color:var(--text2);margin:0 0 18px}
    .section-label{font:700 13px "Inter","Noto Sans SC";letter-spacing:.06em;color:var(--text);text-transform:uppercase;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px}
    .section-label::before{content:'';width:3px;height:12px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--primary2));box-shadow:0 0 8px var(--primary-glow);flex-shrink:0}
    .current-skills{font-size:13px;color:var(--muted);min-height:20px;line-height:1.6}
    .current-skills .sk-chip{display:inline-flex;align-items:center;gap:4px;margin:3px 5px 3px 0;padding:4px 8px 4px 11px;font-size:12px;background:rgba(79,107,240,.06);border:1px solid rgba(79,107,240,.14);border-radius:14px;color:var(--primary);font-weight:500}
    .current-skills .sk-close{cursor:pointer;font-size:14px;line-height:1;color:var(--muted);padding:0 2px;border-radius:50%;transition:all .15s}
    .current-skills .sk-close:hover{color:#ef4444;background:rgba(239,68,68,.08)}
    .stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
    .stat-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;font-weight:500}
    .stat-top span:first-child{color:var(--text2)}
    .stat-top span:last-child{font-family:"Orbitron","Inter";font-weight:600;color:var(--primary);letter-spacing:.03em}
    .bar{height:4px;background:var(--line);border-radius:20px;overflow:hidden}
    .fill{height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:.4s;position:relative;overflow:hidden}
    .fill::after{content:'';position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:barFlow 2.4s ease-in-out infinite}
    @keyframes barFlow{0%{transform:translateX(-110%)}55%,100%{transform:translateX(330%)}}
    .log{margin-top:20px;font:400 11px/1.7 "DM Mono","Inter";color:var(--muted);border-left:2px solid var(--line);padding-left:10px;min-height:32px}

    /* ══ 节点详情面板（参考 MapFlow NodeDetailPanel） ══ */
    .node-detail{display:none;margin:16px 0 4px;padding:16px;border:1px solid var(--line-bright);border-radius:14px;background:linear-gradient(165deg,#FFFFFF 0%,var(--bg2) 100%);box-shadow:var(--shadow),0 6px 24px rgba(79,107,240,.08);animation:ndIn .32s cubic-bezier(.22,.61,.36,1)}
    .node-detail.show{display:block}
    @keyframes ndIn{from{opacity:0;transform:translateY(10px)}}
    .nd-head{display:flex;align-items:flex-start;gap:11px}
    .nd-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0;color:#fff;box-shadow:0 4px 12px rgba(79,107,240,.25);background:linear-gradient(135deg,var(--primary),var(--primary2))}
    .nd-ico.career{background:linear-gradient(135deg,var(--cc,var(--primary)),var(--primary2))}
    .nd-head-main{min-width:0}
    .nd-title{font-size:15px;font-weight:800;color:var(--text);margin:0;line-height:1.3;letter-spacing:.01em}
    .nd-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
    .nd-tag{font-size:10.5px;padding:2.5px 9px;border-radius:999px;background:rgba(79,107,240,.07);border:1px solid rgba(79,107,240,.16);color:var(--primary);font-weight:600;white-space:nowrap}
    .nd-tag.depth{background:rgba(34,195,230,.09);border-color:rgba(34,195,230,.3);color:#0E7490}
    .nd-tag.hard{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:#B45309}
    .nd-close{margin-left:auto;width:26px;height:26px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;flex-shrink:0;transition:all .16s}
    .nd-close:hover{background:rgba(239,68,68,.1);color:#EF4444}
    .nd-desc{font-size:12.5px;line-height:1.8;color:var(--text2);margin:12px 0 0}
    .nd-sec{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
    .nd-sec h4{font:700 10.5px "Inter","Noto Sans SC";letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin:0 0 8px;display:flex;align-items:center;gap:6px}
    .nd-sec h4::before{content:'';width:3px;height:11px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--primary2))}
    .nd-sec p{font-size:12.5px;line-height:1.75;color:var(--text2);margin:0}
    .nd-sec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
    .nd-sec li{font-size:12.5px;line-height:1.6;color:var(--text2);display:flex;gap:8px}
    .nd-sec li::before{content:'•';color:var(--primary);font-weight:800;flex-shrink:0}
    .nd-sec li.ev::before{content:'✓';color:var(--success);font-weight:800;flex-shrink:0}
    .nd-chips{display:flex;flex-wrap:wrap;gap:6px}
    .nd-chip{font-size:11.5px;padding:4px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--text2);cursor:pointer;transition:all .16s}
    .nd-chip:hover{border-color:var(--primary);color:var(--primary);background:rgba(79,107,240,.06);box-shadow:0 2px 8px rgba(79,107,240,.12)}
    .nd-chip.on{background:rgba(79,107,240,.12);border-color:var(--primary);color:var(--primary);font-weight:700}
    .nd-stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
    .nd-stat{flex:1;min-width:76px;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
    .nd-stat b{font:600 15px "DM Mono","Inter";color:var(--primary);display:block}
    .nd-stat span{font-size:10px;color:var(--muted);display:block;margin-top:2px;letter-spacing:.04em}
    .nd-empty{font-size:12px;color:var(--muted);padding:4px 0}

    /* ══ 参赛增强：入场过渡 ══ */
    .cp-canvas{animation:fadeUp .7s cubic-bezier(.22,.61,.36,1) both}
    .tree-head{animation:fadeIn .55s ease-out .12s both}
    aside{animation:fadeUp .7s cubic-bezier(.22,.61,.36,1) .18s both}
    @keyframes fadeUp{0%{opacity:0;transform:translateY(26px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
    .tree-head h2{background:linear-gradient(90deg,var(--text),var(--primary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

    /* ══ 参赛增强：计数跳动 ══ */
    #count{display:inline-block}
    #count.bump{animation:bump .35s cubic-bezier(.34,1.56,.64,1)}
    @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}

    /* ══ 参赛增强：节点点击涟漪 ══ */
    .cp-ripple{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid rgba(79,107,240,.55);pointer-events:none;z-index:6;animation:ripple .65s cubic-bezier(.16,.84,.44,1) forwards}
    @keyframes ripple{0%{transform:scale(.2);opacity:1}100%{transform:scale(6);opacity:0}}

    /* ══ 参赛增强：粒子分层 ══ */
    .cp-particles span.l-far{background:linear-gradient(135deg,#D7DFFE,#A5B4FC)}
    .cp-particles span.l-mid{background:linear-gradient(135deg,#CBD6FE,#22C3E6)}
    .cp-particles span.l-close{background:linear-gradient(135deg,#EEF2FF,var(--primary-light));box-shadow:0 0 6px rgba(109,131,245,.55)}

    @media(max-width:900px){.app{padding:12px}.layout{grid-template-columns:1fr;height:auto}.tree{height:620px}.aside,aside{height:auto;overflow:visible}.top{align-items:flex-start}.actions{display:none}}

    /* ══ UI 优化：按压反馈 + 减少动态效果 ══ */
    button:active{transform:scale(.97)}
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><div class="badge"><span>01</span></div><div><div class="eyebrow">CAREER SKILL TREE</div><h1>计算机就业 · 职业加点图</h1></div></div>
      <div class="actions"><a href="../search.html" class="ghost" style="text-decoration:none;display:inline-flex;align-items:center;gap:4px">返回</a><button class="ghost" id="reset">重置</button></div>
    </header>
    <section class="layout">
      <div class="tree">
        <div class="cp-decor" aria-hidden="true"><div class="cp-particles" id="cpParticles"></div></div>

      /* ── die-cut 文字贴纸渲染（build.txt renderSticker 移植） ── */
      function roundRectPath(c,x,y,w,h,r){
        c.beginPath();
        c.moveTo(x+r,y);
        c.arcTo(x+w,y,x+w,y+h,r);
        c.arcTo(x+w,y+h,x,y+h,r);
        c.arcTo(x,y+h,x,y,r);
        c.arcTo(x,y,x+w,y,r);
        c.closePath();
      }
      function renderSticker(text,fs,color,dpr){
        const fontStr='600 '+fs+'px "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
        const mctx=document.createElement('canvas').getContext('2d');
        mctx.font=fontStr;
        const m=mctx.measureText(text);
        const ascent=m.actualBoundingBoxAscent||fs*.8;
        const descent=m.actualBoundingBoxDescent||fs*.2;
        const textW=m.width,textH=ascent+descent;
        const border=Math.max(4,Math.round(fs*.18));
        const pad=border+3;
        const cssW=Math.ceil(textW+pad*2),cssH=Math.ceil(textH+pad*2);
        const canvas=document.createElement('canvas');
        canvas.width=Math.ceil(cssW*dpr);canvas.height=Math.ceil(cssH*dpr);
        const c=canvas.getContext('2d');
        c.scale(dpr,dpr);
        c.font=fontStr;c.textBaseline='alphabetic';
        const bx=pad,by=pad+ascent;
        /* 圆角缓冲：圆角矩形裁剪，贴纸边缘圆润 */
        const rr=Math.min(10,Math.floor(border*1.5));
        c.save();
        roundRectPath(c,0,0,cssW,cssH,rr);
        c.clip();
        /* 白色轮廓底：沿圆形一圈盖章把文字轮廓撑厚（紧贴字形、保留笔画内孔） */
        c.fillStyle='#ffffff';
        for(let r=border;r>0.5;r-=1){
          const stamps=Math.max(16,Math.ceil(r*3));
          for(let a=0;a<stamps;a++){
            const ang=(a/stamps)*Math.PI*2;
            c.fillText(text,bx+Math.cos(ang)*r,by+Math.sin(ang)*r);
          }
        }
        c.fillText(text,bx,by);
        /* 彩色文字叠上 */
        c.fillStyle=color;
        c.fillText(text,bx,by);
        c.restore();
        return {canvas:canvas,width:cssW,height:cssH};
      }

            for(let i=0;i<skillPositions.length;i++){
              for(let j=i+1;j<skillPositions.length;j++){
                let a=skillPositions[i],b=skillPositions[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.sqrt(dx*dx+dy*dy),md=(a.size+b.size)/2+8;
                if(dist<md&&dist>.1){const ov=(md-dist)/2,fx=dx/dist*ov,fy=dy/dist*ov;a.x+=fx;a.y+=fy;b.x-=fx;b.y-=fy;}
              }
            }
            skillPositions.forEach(p=>{
              p.x=Math.max(sx0,Math.min(sx0+sxW,p.x));
              p.y=Math.max(sy0,Math.min(sy0+sxH,p.y));
            });
          }
        }

        skillPositions.forEach(p=>{
          let e=skillEls[p.id];
          if(!e){e=document.createElement('div');e.className='cp-snode';e.dataset.sn=p.id;canvas.appendChild(e);skillEls[p.id]=e;
            e.addEventListener('pointerdown',e=>startDrag(e,p.id));
            e.addEventListener('click',e=>{if(!dragTarget&&!justDragged) toggleSkill(p.id);});
            e.style.setProperty('--dur',(3.2+((p.id.length*7)%24)/10)+'s');
            e.style.setProperty('--delay',(-((p.id.charCodeAt(0)*13)%30)/10)+'s');
            e.style.setProperty('--rot',((Math.random()*6-3)).toFixed(1)+'deg');
          }
          paintSkillNode(p);
        });

        drawCurves();renderHL();
      }

      /* 按文字长度自适应字号，贴纸宽度不超过 p.size*1.5 */
      function paintSkillNode(p){
        const e=skillEls[p.id];if(!e)return;
        const cc=careers.find(x=>x.id===p.cid);
        const sc=cc?cc.color:'var(--primary)';
        const cw=calcCJK(p.id);
        const fs=Math.max(10,Math.min(16,Math.floor((p.size*1.6-24)/cw)));
        const r=renderSticker(p.id,fs,sc,Math.min(window.devicePixelRatio||1,2));
        e.style.width=r.width+'px';e.style.height=r.height+'px';
        e.style.left=(p.x-r.width/2)+'px';e.style.top=(p.y-r.height/2)+'px';
        let cv=e.querySelector('canvas');
        if(!cv){cv=document.createElement('canvas');e.appendChild(cv);}
        cv.width=r.canvas.width;cv.height=r.canvas.height;
        cv.getContext('2d').drawImage(r.canvas,0,0);
        if(cc)e.style.setProperty('--sc-glow',cc.color+'66');
      }

      function center(el){if(!el)return{x:0,y:0};const r=el.getBoundingClientRect(),cr=canvas.getBoundingClientRect();return{x:r.left+r.width/2-cr.left,y:r.top+r.height/2-cr.top};}

      function drawCurves(){
        svg.innerHTML='';pathMap={};const w=canvas.clientWidth,h=canvas.clientHeight;
        svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.style.width=w+'px';svg.style.height=h+'px';
        /* 分割线 */
        const sY=splitYVal;
        const div=document.createElementNS('http://www.w3.org/2000/svg','line');
        div.setAttribute('x1','0');div.setAttribute('x2',w);div.setAttribute('y1',sY);div.setAttribute('y2',sY);
        div.setAttribute('stroke','var(--line)');div.setAttribute('stroke-width','1');
        div.setAttribute('stroke-dasharray','8 12');div.classList.add('cp-divider');
        svg.appendChild(div);
        /* 曲线 */
        skills.forEach(s=>{
          const se=skillEls[s.n];if(!se)return;
          const sc=center(se);
          s.c.forEach(cid=>{
            const ce=careerEls[cid];if(!ce)return;
            const cc=center(ce),p=document.createElementNS('http://www.w3.org/2000/svg','path');
            const mx=(sc.x+cc.x)/2;
            p.setAttribute('d','M'+sc.x+','+sc.y+' Q'+mx+','+(Math.min(sc.y,cc.y)+(Math.abs(cc.y-sc.y)*.3))+' '+cc.x+','+cc.y);
            p.classList.add('cp-curve');p.dataset.skill=s.n;p.dataset.career=cid;
            const cobj=careers.find(x=>x.id===cid);
            p.setAttribute('stroke',cobj?cobj.color:'var(--primary)');
            p.style.color=cobj?cobj.color:'var(--primary)';
            svg.appendChild(p);
            if(!pathMap[s.n])pathMap[s.n]=[];
            pathMap[s.n].push({el:p,cid:cid,cx:cc.x,cy:cc.y});
          });
        });
      }

      function redrawSkillPaths(sn){
        if(!pathMap[sn])return;
        const sc=center(skillEls[sn]);
        pathMap[sn].forEach(e=>{
          const mx=(sc.x+e.cx)/2;
          e.el.setAttribute('d','M'+sc.x+','+sc.y+' Q'+mx+','+(Math.min(sc.y,e.cy)+(Math.abs(e.cy-sc.y)*.3))+' '+e.cx+','+e.cy);
        });
      }

      function renderHL(){
        Object.values(careerEls).forEach(e=>e.classList.remove('sel','dim'));
        Object.values(skillEls).forEach(e=>e.classList.remove('on','hl','dim'));
        svg.querySelectorAll('.cp-curve').forEach(e=>{e.classList.remove('glow','dim');e.style.opacity='';});

        const scores=getScores();
        Object.entries(scores).forEach(([cid,sc])=>{
          if(sc>=3&&careerEls[cid])careerEls[cid].classList.add('sel');
        });

        /* 更新计数器 */
        careers.forEach(c=>{const cnt=el('cnt_'+c.id);if(cnt)cnt.textContent=scores[c.id]+'/'+careerTotal[c.id];});

        if(curCareer){
          const cd=careers.find(c=>c.id===curCareer);
          if(cd&&careerEls[curCareer])careerEls[curCareer].classList.add('sel');
          const careerSkills=new Set(skills.filter(s=>s.c.includes(curCareer)).map(s=>s.n));
          careerSkills.forEach(sn=>{if(skillEls[sn])skillEls[sn].classList.add('hl');});
          svg.querySelectorAll('.cp-curve').forEach(e=>{
            if(e.dataset.career===curCareer){e.classList.add('glow');e.style.opacity='1';}
            else{e.style.opacity='0';}
          });
          skills.forEach(s=>{if(!careerSkills.has(s.n)&&skillEls[s.n])skillEls[s.n].classList.add('dim');});
          careers.forEach(c=>{if(c.id!==curCareer&&careerEls[c.id])careerEls[c.id].classList.add('dim');});
          return;
        }

        selected.forEach(sn=>{if(skillEls[sn])skillEls[sn].classList.add('on');});

        if(curSkill){
          const sd=skills.find(s=>s.n===curSkill);if(!sd)return;
          if(skillEls[curSkill])skillEls[curSkill].classList.add('on');
          const relatedCareers=new Set(sd.c);
          sd.c.forEach(cid=>{if(careerEls[cid])careerEls[cid].classList.add('sel');});
          svg.querySelectorAll('.cp-curve').forEach(e=>{
            if(e.dataset.skill===curSkill){e.classList.add('glow');}
            else if(relatedCareers.has(e.dataset.career)){e.classList.add('dim');}
          });
          skills.forEach(s=>{if(s.n!==curSkill&&!s.c.some(cid=>relatedCareers.has(cid))&&skillEls[s.n])skillEls[s.n].classList.add('dim');});
          careers.forEach(c=>{if(!relatedCareers.has(c.id)&&careerEls[c.id])careerEls[c.id].classList.add('dim');});
        }
      }

      function getScores(){const s={};careers.forEach(c=>s[c.id]=0);selected.forEach(sn=>{const sk=skills.find(x=>x.n===sn);if(sk)sk.c.forEach(cid=>s[cid]++);});return s;}

      /* ── 节点点击涟漪（一次性扩散波纹） ── */
      function spawnRipple(x,y,color){
        const r=document.createElement('div');
        r.className='cp-ripple';
        r.style.left=x+'px';r.style.top=y+'px';
        if(color)r.style.borderColor=color;
        canvas.appendChild(r);
        r.addEventListener('animationend',()=>r.remove());
      }
      function nodeCenter(e){return{x:parseFloat(e.style.left)+e.offsetWidth/2,y:parseFloat(e.style.top)+e.offsetHeight/2};}

      function toggleSkill(sn){
        curCareer=null;
        const e=skillEls[sn];
        if(e){const c=nodeCenter(e);spawnRipple(c.x,c.y,'rgba(79,107,240,.55)');}
        if(curSkill===sn){curSkill=null;selected.delete(sn);}
        else{curSkill=sn;selected.add(sn);}
        renderHL();updatePanel();showSkillDetail(sn);
      }

      function toggleCareer(cid){
        curSkill=null;
        const e=careerEls[cid],cd=careers.find(c=>c.id===cid);
        if(e){const c=nodeCenter(e);spawnRipple(c.x,c.y,cd?cd.color+'88':'rgba(79,107,240,.55)');}
        if(curCareer===cid){curCareer=null;}
        else{curCareer=cid;}
        renderHL();updatePanel();showCareerDetail(cid);
      }

      /* ── 贴纸拖拽 + 抛掷 ── */
      function beginDrag(sn,px,py){
        if(!dragCand)return;
        dragCand.active=true;
        dragTarget=skillEls[sn];
        if(!dragTarget)return;
        dragTarget.style.zIndex='9';dragTarget.style.animationPlayState='paused';
        dragTarget.classList.add('dragging');
        dragStartX=px;dragStartY=py;
        dragOrigX=parseFloat(dragTarget.style.left);dragOrigY=parseFloat(dragTarget.style.top);
        lastPX=px;lastPY=py;dragVel={x:0,y:0};
      }
      function startDrag(e,sn){
        dragCand={sn:sn,x:e.clientX,y:e.clientY,active:false};
        clearTimeout(dragTimer);
        dragTimer=setTimeout(()=>{if(dragCand&&!dragCand.active)beginDrag(dragCand.sn,dragCand.x,dragCand.y);},DRAG_HOLD);
      }
      window.addEventListener('pointermove',e=>{
        /* 短按+移动判定：120ms 内位移超过 6px 立即进入拖拽 */
        if(dragCand&&!dragCand.active&&!dragTarget){
          const dx=e.clientX-dragCand.x, dy=e.clientY-dragCand.y;
          if(Math.hypot(dx,dy)>DRAG_MOVE){clearTimeout(dragTimer);beginDrag(dragCand.sn,dragCand.x,dragCand.y);}
        }
        if(!dragTarget)return;
        if(rafPending)return;
        rafPending=true;
        requestAnimationFrame(()=>{
          rafPending=null;
          dragVel={x:e.clientX-lastPX,y:e.clientY-lastPY};
          lastPX=e.clientX;lastPY=e.clientY;
          const dx=e.clientX-dragStartX, dy=e.clientY-dragStartY;
          let nx=dragOrigX+dx, ny=dragOrigY+dy;
          const sz=dragTarget.offsetWidth;
          /* 边界约束 */
          const minX=0, maxX=canvasW-sz;
          const minY=splitYVal+2, maxY=canvasH-sz-2;
          nx=Math.max(minX,Math.min(maxX,nx));
          ny=Math.max(minY,Math.min(maxY,ny));
          dragTarget.style.left=nx+'px';
          dragTarget.style.top=ny+'px';
          const sp=skillPositions.find(p=>p.id===dragTarget.dataset.sn);
          if(sp){sp.x=nx+sz/2;sp.y=ny+sz/2;sp.moved=true;}
          redrawSkillPaths(dragTarget.dataset.sn);
        });
      });
      window.addEventListener('pointerup',()=>{
        clearTimeout(dragTimer);
        if(dragTarget){
          const t=dragTarget, vx=dragVel.x*THROW_SCALE, vy=dragVel.y*THROW_SCALE;
          t.classList.remove('dragging');
          t.style.zIndex='';t.style.animationPlayState='';
          t.style.transform='';
          dragTarget=null;dragCand=null;
          justDragged=true;setTimeout(()=>{justDragged=false;},250);
          if(Math.hypot(vx,vy)>1.4){
            phys={sn:t.dataset.sn,vx:vx,vy:vy};
            requestAnimationFrame(physLoop);
          }
        }else{dragCand=null;}
      });

      /* 惯性抛掷：摩擦衰减 + 边界反弹 */
      function physLoop(){
        if(!phys)return;
        const p=phys, sp=skillPositions.find(x=>x.id===p.sn), e=skillEls[p.sn];
        if(!sp||!e){phys=null;return;}
        const sz=e.offsetWidth;
        let nx=parseFloat(e.style.left)+p.vx, ny=parseFloat(e.style.top)+p.vy;
        if(nx<0){nx=0;p.vx=Math.abs(p.vx)*PHYS_BOUNCE;}
        else if(nx>canvasW-sz){nx=canvasW-sz;p.vx=-Math.abs(p.vx)*PHYS_BOUNCE;}
        if(ny<splitYVal+2){ny=splitYVal+2;p.vy=Math.abs(p.vy)*PHYS_BOUNCE;}
        else if(ny>canvasH-sz-2){ny=canvasH-sz-2;p.vy=-Math.abs(p.vy)*PHYS_BOUNCE;}
        p.vx*=PHYS_FRICTION;p.vy*=PHYS_FRICTION;
        e.style.left=nx+'px';e.style.top=ny+'px';
        sp.x=nx+sz/2;sp.y=ny+sz/2;sp.moved=true;
        redrawSkillPaths(p.sn);
        if(Math.abs(p.vx)<PHYS_MIN_VEL&&Math.abs(p.vy)<PHYS_MIN_VEL){phys=null;return;}
        requestAnimationFrame(physLoop);
      }

      /* ── 节点详情面板（可交互：关闭 / 前置跳转 / 方向跳转） ── */
      function bindDetailActions(){
        const box=el('nodeDetail');
        box.querySelectorAll('[data-act]').forEach(btn=>{
          btn.addEventListener('click',()=>{
            const act=btn.getAttribute('data-act');
            if(act==='nd-close'){closeNodeDetail();}
            else if(act==='nd-pre'){toggleSkill(btn.getAttribute('data-sn'));}
            else if(act==='nd-career'){toggleCareer(btn.getAttribute('data-cid'));}
            else if(act==='nd-skill'){toggleSkill(btn.getAttribute('data-sn'));}
          });
        });
      }
      function closeNodeDetail(){
        const box=el('nodeDetail');
        box.classList.remove('show');
        box.innerHTML='';
      }
      function showSkillDetail(sn){
        const s=skills.find(x=>x.n===sn); if(!s)return;
        const d=detailFor(s);
        const pc=careers.find(c=>c.id===d.primary)||careers[0];
        const stars='★'.repeat(d.difficulty)+'☆'.repeat(Math.max(0,5-d.difficulty));
        const box=el('nodeDetail');
        box.innerHTML=
          '<div class="nd-head"><div class="nd-ico" style="background:linear-gradient(135deg,'+pc.color+',var(--primary2))">'+pc.icon+'</div>'+
          '<div class="nd-head-main"><h3 class="nd-title">'+s.n+'</h3><div class="nd-tags">'+
            '<span class="nd-tag">'+d.category+'</span>'+
            '<span class="nd-tag depth">'+DEPTH_LABELS[d.recommended_depth]+' · '+d.recommended_depth+'</span>'+
            '<span class="nd-tag hard">难度 '+stars+'</span>'+
            '<span class="nd-tag">约 '+d.estimated_minutes+' 分钟</span>'+
          '</div></div>'+
          '<button class="nd-close" data-act="nd-close" aria-label="关闭详情">×</button></div>'+
          (d.description?'<p class="nd-desc">'+d.description+'</p>':'')+
          '<div class="nd-sec"><h4>目标深度</h4><p>'+d.depth_rationale+'</p></div>'+
          (d.learning_objectives.length?'<div class="nd-sec"><h4>学习目标</h4><ul>'+d.learning_objectives.map(o=>'<li>'+o+'</li>').join('')+'</ul></div>':'')+
          (d.key_concepts.length?'<div class="nd-sec"><h4>关键概念</h4><div class="nd-chips">'+d.key_concepts.map(k=>'<span class="nd-chip">'+k+'</span>').join('')+'</div></div>':'')+
          (d.observable_evidence.length?'<div class="nd-sec"><h4>通过标准</h4><ul>'+d.observable_evidence.map(e=>'<li class="ev">'+e+'</li>').join('')+'</ul></div>':'')+
          (d.prerequisites.length?'<div class="nd-sec"><h4>前置技能</h4><div class="nd-chips">'+d.prerequisites.map(p=>'<button class="nd-chip" data-act="nd-pre" data-sn="'+p+'">'+p+' →</button>').join('')+'</div></div>':'')+
          '<div class="nd-sec"><h4>适合方向</h4><div class="nd-chips">'+s.c.map(cid=>{const c=careers.find(x=>x.id===cid);return c?'<button class="nd-chip" data-act="nd-career" data-cid="'+cid+'">'+c.icon+' '+c.name+'</button>':'';}).join('')+'</div></div>';
        box.classList.add('show');
        bindDetailActions();
        box.scrollIntoView({behavior:'smooth',block:'nearest'});
      }
      function showCareerDetail(cid){
        const c=careers.find(x=>x.id===cid); if(!c)return;
        const related=skills.filter(s=>s.c.includes(cid));
        const done=related.filter(s=>selected.has(s.n)).length;
        const pct=Math.round(related.length?done/related.length*100:0);
        const box=el('nodeDetail');
        box.innerHTML=
          '<div class="nd-head"><div class="nd-ico career" style="--cc:'+c.color+';background:linear-gradient(135deg,'+c.color+',var(--primary2))">'+c.icon+'</div>'+
          '<div class="nd-head-main"><h3 class="nd-title">'+c.name+' · 职业方向</h3><div class="nd-tags">'+
            '<span class="nd-tag">'+related.length+' 个技能点</span>'+
            '<span class="nd-tag depth">已点亮 '+done+'</span>'+
          '</div></div>'+
          '<button class="nd-close" data-act="nd-close" aria-label="关闭详情">×</button></div>'+
          '<p class="nd-desc">「'+c.name+'」方向共 '+related.length+' 个技能，点击下方技能查看学习详情，并把它加入你的加点计划。</p>'+
          '<div class="nd-stat-row">'+
            '<div class="nd-stat"><b>'+related.length+'</b><span>技能点</span></div>'+
            '<div class="nd-stat"><b>'+done+'</b><span>已点亮</span></div>'+
            '<div class="nd-stat"><b>'+pct+'%</b><span>覆盖率</span></div>'+
          '</div>'+
          '<div class="nd-sec"><h4>方向技能</h4><div class="nd-chips">'+related.map(s=>'<button class="nd-chip'+(selected.has(s.n)?' on':'')+'" data-act="nd-skill" data-sn="'+s.n+'">'+s.n+'</button>').join('')+'</div></div>';
        box.classList.add('show');
        bindDetailActions();
        box.scrollIntoView({behavior:'smooth',block:'nearest'});
      }

      /* ── 面板 ── */
      function updatePanel(){
        const scores=getScores();
        const countEl=el('count');
        countEl.textContent=String(selected.size).padStart(2,'0');
        countEl.classList.remove('bump');void countEl.offsetWidth;countEl.classList.add('bump');
        const ranked=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
        const top3=ranked.slice(0,3).filter(x=>x[1]>0);
        const unlocked=ranked.filter(x=>x[1]>=3);

        /* 当前技能 */
        const csEl=el('currentSkills');
        if(!selected.size){csEl.textContent='尚未选择技能';}
        else{csEl.innerHTML='';[...selected].forEach(sn=>{const c=document.createElement('span');c.className='sk-chip';c.textContent=sn;const x=document.createElement('span');x.className='sk-close';x.textContent='\u00d7';x.addEventListener('click',e=>{e.stopPropagation();selected.delete(sn);curSkill=null;curCareer=null;renderHL();updatePanel();});c.appendChild(x);csEl.appendChild(c);});}

        /* 推荐方向 —— 只展示匹配度最高的 3 个大项 */
        const tcEl=el('topCareers');
        if(!selected.size){tcEl.innerHTML='<div style="font-size:13px;color:var(--muted);padding:6px 0">点亮技能后自动计算匹配方向</div>';}
        else{
          tcEl.innerHTML='';
          top3.forEach(([cid,sc],idx)=>{
            const c=careers.find(x=>x.id===cid); if(!c)return;
            const total=careerTotal[cid]||1;
            const pct=Math.round(sc/total*100);
            const bar=Math.min(100,pct);
            const stat=document.createElement('div');stat.className='stat';
            const accent=idx===0?'border-left:3px solid '+c.color+';padding-left:11px;':'';
            stat.style.cssText=accent+'--cc2:'+c.color;
            stat.innerHTML='<div class="stat-top"><span style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:'+c.color+'"></span>'+c.name+'</span><span>'+sc+'/'+total+' ('+pct+'%)</span></div><div class="bar"><div class="fill" style="width:'+bar+'%;background:'+c.color+'"></div></div>';
            tcEl.appendChild(stat);
          });
        }

        if(curCareer){
          const cname=careerNames[curCareer];
          el('routeTitle').textContent='聚焦 · '+cname;
          el('routeDesc').textContent='当前查看「'+cname+'」方向的全部关联技能（'+careerTotal[curCareer]+'项），其中'+scores[curCareer]+'项已点亮。';
          el('log').textContent='FILTER · 查看'+cname+'方向 | 已点'+scores[curCareer]+'/'+careerTotal[curCareer]+' 技能';
          return;
        }
        if(!selected.size){el('routeTitle').textContent='规划职业方向';el('routeDesc').textContent='点击技能进行多选，系统按每个大类的高频三技能组合计算最接近的方向。';}
        else{el('routeTitle').textContent=selected.size+'项技能 · 已选择';el('routeDesc').textContent='系统已为你计算最匹配的职业方向，基于各方向的技能覆盖率排名。';}
        el('log').textContent='SYSTEM · 已选 '+selected.size+' 项 | '+(unlocked.length?unlocked.map(x=>careerNames[x[0]]).join('/')+' 已解锁':'继续探索中');

        // 推荐学习视频（基于选中技能，展示 Bilibili 封面+标题+链接）
        const recs=el('videoRecs');
        const recLabel=el('videoRecLabel');
        if(selected.size>0){
          const matched=[];
          [...selected].forEach(sn=>{if(bilibiliVideos[sn])matched.push({skill:sn,...bilibiliVideos[sn]});});
          if(matched.length>0){
            recLabel.style.display='block';
            recs.innerHTML=matched.map(v=>`<a class="video-rec-card" href="https://www.bilibili.com/video/${v.bvid}/" target="_blank" rel="noopener"><div class="video-rec-icon">▶</div><div class="video-rec-info"><div class="video-rec-title">${v.title}</div><div class="video-rec-source">Bilibili · ${v.skill}</div></div></a>`).join('');
          }else{
            recLabel.style.display='none';
            recs.innerHTML='';
          }
        }else{
          recLabel.style.display='none';
          recs.innerHTML='';
        }
      }

      el('reset').onclick=()=>{selected.clear();curSkill=null;curCareer=null;renderHL();updatePanel();closeNodeDetail();};

      /* ── 背景粒子（三层视差：远层小淡慢、中层青蓝、近层大亮快，纯 CSS 动画，不拦截交互） ── */
      (function initParticles(){
        const host=el('cpParticles');
        if(!host)return;
        const small=window.innerWidth<=900;
        const layers=small
          ?[{n:5,size:[1.4,2.2],dur:[12,18],cls:'l-far',pop:[.18,.28]},{n:4,size:[2,3],dur:[8,12],cls:'l-mid',pop:[.28,.38]},{n:3,size:[3,4.5],dur:[5,8],cls:'l-close',pop:[.4,.5]}]
          :[{n:12,size:[1.4,2.2],dur:[13,20],cls:'l-far',pop:[.16,.26]},{n:10,size:[2,3],dur:[9,13],cls:'l-mid',pop:[.26,.36]},{n:8,size:[3,4.5],dur:[6,9],cls:'l-close',pop:[.4,.5]}];
        layers.forEach(L=>{
          for(let i=0;i<L.n;i++){
            const s=document.createElement('span');
            s.className=L.cls;
            s.style.left=(Math.random()*100)+'%';
            s.style.top=(24+Math.random()*72)+'%';
            s.style.setProperty('--ps',(L.size[0]+Math.random()*(L.size[1]-L.size[0])).toFixed(1)+'px');
            s.style.setProperty('--px',((Math.random()*2-1)*70).toFixed(0)+'px');
            s.style.setProperty('--py',(-(Math.random()*46+18)*(L.cls==='l-close'?1.4:1)).toFixed(0)+'px');
            s.style.setProperty('--pdur',(L.dur[0]+Math.random()*(L.dur[1]-L.dur[0])).toFixed(1)+'s');
            s.style.setProperty('--pdelay',(-Math.random()*L.dur[1]).toFixed(1)+'s');
            s.style.setProperty('--pop',(L.pop[0]+Math.random()*(L.pop[1]-L.pop[0])).toFixed(2));
            host.appendChild(s);
          }
        });
      })();

      layout();window.addEventListener('resize',()=>{layout();});updatePanel();
      /* 等 web 字体加载完成后重绘贴纸，保证轮廓紧贴真实字形 */
      if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>{skillPositions.forEach(p=>paintSkillNode(p));drawCurves();renderHL();});}
    })();
  </script>
</body>
</html>
