<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栈知映 · AI 生成技能树</title>
<style>
  :root {
    --primary: #4F6BF0; --primary-light: #6D83F5; --primary-soft: #EEF2FF; --cyan: #22C3E6;
    --bg: #F7F9FC; --panel: #FFFFFF; --panel-2: #FFFFFF; --border: #E2E8F0;
    --border-soft: #CBD5E1; --text: #0F172A; --text-dim: #475569; --text-muted: #64748B;
    --amber: #F59E0B; --emerald: #16A34A; --yellow: #EAB308; --danger: #DC2626;
    --ease: cubic-bezier(.23,1,.32,1);
    --ease-snap: cubic-bezier(0.2, 0, 0, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-fade: cubic-bezier(0.4, 0, 0.2, 1);
    --dur-fast: 90ms; --dur-base: 180ms; --dur-slow: 260ms; --dur-delight: 400ms;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { font-family: 'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:
      radial-gradient(1100px 560px at 12% -10%, rgba(79,107,240,.10), transparent 60%),
      radial-gradient(900px 520px at 92% -5%, rgba(109,131,245,.08), transparent 55%),
      radial-gradient(1000px 640px at 50% 115%, rgba(34,195,230,.06), transparent 60%),
      var(--bg);
    color: var(--text); display: flex; flex-direction: column; }
  body::after { content: ''; position: fixed; left: -10%; width: 120%; height: 26vh; top: -36vh;
    background: linear-gradient(180deg, transparent, rgba(109,131,245,.05), transparent);
    pointer-events: none; z-index: 0; animation: scanLine 18s linear infinite; }
  @keyframes scanLine { to { transform: translateY(175vh); } }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px;
    height: 60px; padding: 0 18px; flex-shrink: 0; background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px) saturate(180%); border-bottom: 1px solid var(--border); z-index: 50; position: relative; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .back { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
    border-radius: 10px; color: var(--text-dim); text-decoration: none; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--border); transition: color var(--dur-fast) var(--ease-snap), border-color var(--dur-fast) var(--ease-snap), background var(--dur-fast) var(--ease-snap); }
  .back:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
  .brand h1 { font-size: 16px; font-weight: 700; }

  .gen-bar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; flex-shrink: 0;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; position: relative; z-index: 2; }
  .gen-bar input { height: 38px; padding: 0 14px; border-radius: 10px; background: var(--bg);
    border: 1px solid var(--border); color: var(--text); font-size: 13.5px; outline: none;
    font-family: inherit; transition: border-color var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap); }
  .gen-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,107,240,0.15); }
  .dropdown { position: relative; flex: 1; min-width: 200px; max-width: 420px; }
  .dropdown input { width: 100%; }
  .gen-bar input::placeholder { color: var(--text-muted); }
  .gen-btn { height: 38px; padding: 0 20px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #FFFFFF; font-size: 14px;
    font-weight: 700; font-family: inherit; transition: box-shadow var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-snap); white-space: nowrap; }
  .gen-btn:hover { box-shadow: 0 4px 20px rgba(79,107,240,0.35); }
  .gen-btn:active { transform: scale(0.97); }
  .gen-btn:disabled { opacity: .5; cursor: not-allowed; }
  .save-btn { height: 38px; padding: 0 20px; border-radius: 10px; cursor: pointer;
    background: var(--panel-2); color: var(--primary); font-size: 14px; font-weight: 700;
    border: 1px solid var(--border); font-family: inherit; white-space: nowrap;
    transition: border-color var(--dur-fast) var(--ease-snap), background var(--dur-fast) var(--ease-snap), color var(--dur-fast) var(--ease-snap); }
  .save-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
  .save-btn:disabled { opacity: .5; cursor: not-allowed; }
  .gen-hint { font-size: 11.5px; color: var(--text-muted); }
  .dd-panel { position: absolute; top: 44px; left: 0; right: 0; max-height: 320px; overflow-y: auto;
    background: #FFFFFF; border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(15,23,42,0.16); z-index: 200; padding: 6px;
    visibility: hidden; opacity: 0; transform: scaleY(0.96); transform-origin: top;
    transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out), visibility var(--dur-base); }
  .dd-panel.open { visibility: visible; opacity: 1; transform: scaleY(1); }
  .dd-option { display: flex; align-items: baseline; gap: 10px; padding: 9px 12px; border-radius: 8px;
    cursor: pointer; transition: background var(--dur-fast) var(--ease-snap); }
  .dd-option:hover { background: var(--primary-soft); }
  .dd-option .opt-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; flex-shrink: 0; }
  .dd-option .opt-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
  .dd-empty { padding: 10px 12px; font-size: 12px; color: var(--text-muted); text-align: center; }

  .main { flex: 1; min-height: 0; display: flex; position: relative; z-index: 1; }
  .canvas-wrap { flex: 1; min-width: 0; position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 50% 0%, rgba(79,107,240,0.06), transparent 40%),
      linear-gradient(rgba(79,107,240,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,107,240,.08) 1px, transparent 1px),
      var(--bg);
    background-size: auto, 24px 24px, 24px 24px, auto;
    cursor: grab; user-select: none; -webkit-user-select: none; }
  .canvas-wrap.dragging { cursor: grabbing; }
  .viewport { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  .edge-svg { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: auto; }

  .node { position: absolute; width: 190px; min-height: 76px; padding: 10px 12px; border-radius: 14px;
    border: 2px solid var(--border-soft); background: #FFFFFF; color: var(--text-dim);
    cursor: pointer; user-select: none; box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 6px 20px rgba(79,107,240,.08);
    transition: box-shadow var(--dur-fast) var(--ease-snap), border-color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-spring); }
  .node:active { transform: scale(0.97); }
  .node.selected { z-index: 20; box-shadow: 0 0 0 2px rgba(79,107,240,0.7), 0 8px 28px rgba(15,23,42,0.18); }
  .node.not_started { border-color: #CBD5E1; background: #FFFFFF; color: #64748B; }
  .node.in_progress { border-color: #F59E0B; background: #FEF3C7; color: #92400E; animation: pulse 2.2s ease-in-out infinite; }
  .node.completed { border-color: #16A34A; background: #DCFCE7; color: #14532D; box-shadow: 0 0 14px rgba(22,163,74,0.22); }
  .node.mastered { border-color: #EAB308; background: #FEF9C3; color: #713F12; box-shadow: 0 0 14px rgba(234,179,8,0.26); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 12px rgba(245,158,11,0.3); } 50% { box-shadow: 0 0 22px rgba(245,158,11,0.55); } }
  .node-head { display: flex; align-items: flex-start; gap: 8px; }
  .node-icon { font-size: 20px; line-height: 1.2; flex-shrink: 0; }
  .node-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.25; word-break: break-word; }
  .node-flag { flex-shrink: 0; font-size: 16px; font-weight: 900; }
  .node-meta { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .node-meta span { font-size: 10px; padding: 2px 7px; border-radius: 999px; border: 1px solid rgba(71,85,105,0.3); color: var(--text-dim); }
  .node.not_started .node-meta span { border-color: #CBD5E1; color: #64748B; }
  .node-cat { font-weight: 600; }
  .node .port { position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: #94A3B8; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
    opacity: 0; transition: opacity var(--dur-fast) var(--ease-snap), transform var(--dur-fast) var(--ease-snap), background var(--dur-fast) var(--ease-snap); }
  .node:hover .port, .node.selected .port { opacity: 1; }
  .node .port:hover { background: var(--primary); transform: scale(1.25); }
  .node .port.left  { left: -5px; top: 50%; transform: translateY(-50%); }
  .node .port.right { right: -5px; top: 50%; transform: translateY(-50%); }
  .node .port.top   { top: -5px; left: 50%; transform: translateX(-50%); }
  .node .port.bottom{ bottom: -5px; left: 50%; transform: translateX(-50%); }
  .node.dragging, .node.dragging:hover, .node.dragging:active { transform: none; cursor: grabbing; z-index: 30; transition: none; }

  .detail { width: 300px; flex-shrink: 0; overflow-y: auto; background: var(--panel);
    border-left: 1px solid var(--border); padding: 20px 18px; }
  .detail-empty { height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 13px; text-align: center; line-height: 1.8; }
  .detail-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .detail-head .big-icon { font-size: 30px; line-height: 1; }
  .detail-head h2 { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .detail-tags span { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; background: var(--bg);
    border: 1px solid var(--border); color: var(--text-dim); }
  .detail-tags .tag-depth { color: var(--primary); border-color: rgba(79,107,240,0.35); background: var(--primary-soft); }
  .detail-desc { font-size: 13px; line-height: 1.7; color: var(--text-dim); margin-bottom: 14px; }
  .detail-section { margin-bottom: 16px; }
  .detail-section h3 { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 8px; }
  .detail-section ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .detail-section li { font-size: 13px; line-height: 1.6; color: var(--text-dim); display: flex; gap: 8px; }
  .detail-section li .bullet { flex-shrink: 0; }
  .detail-section.objective li .bullet { color: var(--primary); }
  .detail-section.evidence li .bullet { color: var(--emerald); }
  .detail-section.rationale p { font-size: 13px; line-height: 1.65; color: var(--text-dim);
    padding: 10px 12px; border-radius: 10px; background: var(--primary-soft); border: 1px solid rgba(79,107,240,0.2); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; padding: 4px 10px; border-radius: 8px; background: var(--bg);
    border: 1px solid var(--border); color: var(--text-dim); }

  .status-actions { display: flex; gap: 6px; margin-bottom: 14px; }
  .status-btn { flex: 1; min-width: 0; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text-dim); font-size: 11.5px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: border-color var(--dur-fast) var(--ease-snap), background var(--dur-fast) var(--ease-snap), color var(--dur-fast) var(--ease-snap); }
  .status-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status-btn:hover { border-color: var(--primary); }
  .status-btn.on { font-weight: 700; }
  .status-btn.on[data-s="not_started"] { color: #64748B; border-color: #CBD5E1; background: #F1F5F9; }
  .status-btn.on[data-s="in_progress"] { color: #92400E; border-color: #F59E0B; background: #FEF3C7; }
  .status-btn.on[data-s="completed"] { color: #14532D; border-color: #16A34A; background: #DCFCE7; }
  .status-btn.on[data-s="mastered"] { color: #713F12; border-color: #EAB308; background: #FEF9C3; }

  .ctx-menu { position: fixed; z-index: 400; display: none; min-width: 132px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(15,23,42,.16); padding: 5px; }
  .ctx-menu.show { display: block; }
  .ctx-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px;
    border: none; background: transparent; border-radius: 7px; font-size: 12.5px; color: var(--text-dim);
    cursor: pointer; font-family: inherit; text-align: left; }
  .ctx-menu button:hover { background: var(--primary-soft); color: var(--text); }
  .ctx-menu button .dot { width: 9px; height: 9px; border-radius: 50%; }

  .canvas-tools { position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 40; }
  .canvas-tools button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text-dim); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: color var(--dur-fast) var(--ease-snap), border-color var(--dur-fast) var(--ease-snap), transform var(--dur-fast) var(--ease-snap); }
  .canvas-tools button:hover { color: var(--primary); border-color: var(--primary); }
  .canvas-tools button:active { transform: scale(0.94); }

  /* ── 添加笔记 / 添加节点按钮 ── */
  .add-btns { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 40;
    display: flex; align-items: center; gap: 10px; }
  .add-node-btn, .add-note-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 999px;
    border: 1px solid var(--border); background: #fff; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit; box-shadow: 0 4px 14px rgba(15,23,42,.12);
    transition: border-color var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap), transform var(--dur-fast) var(--ease-snap); }
  .add-node-btn { color: var(--primary); }
  .add-note-btn { color: var(--emerald); }
  .add-node-btn:hover, .add-note-btn:hover { border-color: var(--primary); box-shadow: 0 6px 20px rgba(79,107,240,.28); transform: translateY(-1px); }
  .add-node-btn:active, .add-note-btn:active { transform: scale(.96); }

  /* ── 笔记卡片(4:3) ── */
  .note-card { width: 300px; height: 225px; padding: 0; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; }
  .note-head { padding: 10px 14px 6px; }
  .note-title { display: block; font-size: 15px; font-weight: 800; color: var(--text); line-height: 1.3; word-break: break-word; }
  .note-title.placeholder { color: var(--text-dim); font-style: normal; opacity: 1; }
  .note-body { flex: 1; padding: 4px 14px 12px; font-size: 13px; line-height: 1.65; color: var(--text-dim);
    white-space: pre-wrap; word-break: break-word; min-height: 120px; cursor: text; }
  .note-body.placeholder { color: var(--text-muted); font-style: italic; opacity: .72; }
  .note-card .title-editor { font-size: 15px; font-weight: 800; color: var(--text); }
  .note-editor { width: 100%; min-height: 110px; border: none; outline: none; resize: none; background: transparent;
    font-family: inherit; font-size: 13px; line-height: 1.65; color: var(--text-dim); padding: 0; }

  /* ── 笔记卡片缩放手柄 ── */
  .note-card .resize-h { position: absolute; z-index: 6; }
  .note-card .resize-e, .note-card .resize-w { width: 8px; height: 100%; top: 0; }
  .note-card .resize-e { right: 0; cursor: ew-resize; }
  .note-card .resize-w { left: 0; cursor: ew-resize; }
  .note-card .resize-n, .note-card .resize-s { height: 8px; width: 100%; left: 0; }
  .note-card .resize-n { top: 0; cursor: ns-resize; }
  .note-card .resize-s { bottom: 0; cursor: ns-resize; }
  .note-card .resize-se, .note-card .resize-sw, .note-card .resize-ne, .note-card .resize-nw { width: 16px; height: 16px; }
  .note-card .resize-se { right: 0; bottom: 0; cursor: nwse-resize; }
  .note-card .resize-sw { left: 0; bottom: 0; cursor: nesw-resize; }
  .note-card .resize-ne { right: 0; top: 0; cursor: nesw-resize; }
  .note-card .resize-nw { left: 0; top: 0; cursor: nwse-resize; }
  .note-card .resize-h { background: transparent; opacity: 0; transition: opacity var(--dur-fast) var(--ease-snap); }
  .note-card:hover .resize-h, .note-card .resize-h:hover { opacity: 1; }
  .note-card .resize-se, .note-card .resize-sw, .note-card .resize-ne, .note-card .resize-nw {
    background: linear-gradient(135deg, transparent 52%, rgba(79,107,240,.55) 52%); }
  .note-card .resize-sw, .note-card .resize-ne { background: linear-gradient(225deg, transparent 52%, rgba(79,107,240,.55) 52%); }

  /* ── 标题内联编辑 ── */
  .title-editor { width: 100%; border: none; outline: none; background: transparent; padding: 0; margin: 0;
    font: inherit; color: inherit; border-bottom: 1px solid var(--primary); border-radius: 0; min-width: 0; }
  .node-title.placeholder { color: var(--text-muted); font-style: italic; opacity: .72; }
  .node-meta .node-cat, .node-meta .node-tag { cursor: text; }
  .node-meta .node-cat:hover, .node-meta .node-tag:hover { outline: 1px dashed rgba(79,107,240,.5); }

  /* ── 自定义节点详情编辑表单 ── */
  .detail-edit-form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .detail-field { display: flex; flex-direction: column; gap: 5px; }
  .detail-field label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-muted); }
  .detail-field input, .detail-field textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px; line-height: 1.5;
    box-sizing: border-box; resize: vertical; outline: none;
    transition: border-color var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap); }
  .detail-field input:focus, .detail-field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,107,240,.12); }
  .detail-field input::placeholder, .detail-field textarea::placeholder { color: var(--text-muted); }
  .detail-field.row { flex-direction: row; align-items: center; }
  .detail-field.row label { margin: 0; min-width: 52px; flex-shrink: 0; }
  .detail-field.row input { flex: 1; }

  .progressbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 16px;
    padding: 0 18px; background: var(--panel); border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); position: relative; z-index: 1; }
  .progressbar strong { color: var(--text); font-size: 12.5px; }
  .progress-track { flex: 1; height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; display: flex; }
  .progress-track .seg { height: 100%; transition: width var(--dur-base) var(--ease-snap); }
  .seg.completed { background: var(--emerald); } .seg.mastered { background: var(--yellow); } .seg.current { background: var(--amber); }
  .stat { white-space: nowrap; } .stat b { font-weight: 700; }

  .edge { fill: none; stroke: #CBD5E1; stroke-width: 1.2; transition: stroke var(--dur-fast) var(--ease-snap), stroke-width var(--dur-fast) var(--ease-snap), filter var(--dur-fast) var(--ease-snap); cursor: pointer; marker-end: url(#arrowhead); pointer-events: none; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; pointer-events: stroke; }
  .edge-hit:hover + .edge, .edge:hover { stroke: var(--primary); stroke-width: 2.2; filter: drop-shadow(0 0 3px rgba(79,107,240,0.35)); marker-end: url(#arrowhead-active); }
  .edge.selected { stroke: var(--danger); stroke-width: 2.4; filter: drop-shadow(0 0 4px rgba(239,68,68,0.35)); marker-end: url(#arrowhead-danger); }
  .edge.completed { stroke: var(--emerald); stroke-width: 2; marker-end: url(#arrowhead-completed); }
  .edge.mastered  { stroke: var(--yellow); stroke-width: 2; marker-end: url(#arrowhead-mastered); }
  .edge.selected { marker-end: url(#arrowhead-danger); }
  .edge.animated { filter: drop-shadow(0 0 2px currentColor); }
  .edge-preview { fill: none; stroke: var(--primary); stroke-width: 1.8; pointer-events: none; opacity: 0.85; filter: drop-shadow(0 0 4px rgba(79,107,240,0.4)); marker-end: url(#arrowhead-active); }

  .loading-mask { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: rgba(247,249,252,0.9); color: var(--text-dim);
    opacity: 0; transition: opacity var(--dur-base) var(--ease-fade); }
  .loading-mask .spinner { width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid var(--border-soft); border-top-color: var(--primary); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px;

var NODE_W = 190, NODE_H = 88, HGAP = 34, VGAP = 58;
var NOTE_W = 300, NOTE_H = 225;
var state = { snapshot: null, selected: null, selectedEdge: null, treeId: null, scale: 1, tx: 0, ty: 0, nodes: [], edges: [], positions: {} };

// 解析字符串化 JSON 数组或原生数组
function parseArr(v) {
  if (Array.isArray(v)) return v;

  return [];
}

// SKILL_TREE.json -> 渲染快照
function convertSnapshot(snap) {
  var nodes = (snap.nodes || []).map(function (n) {
    var prog = (snap.progress || []).filter(function (p) { return p.node_id === n.id; })[0];
    return {
      id: n.id, title: n.title, icon: n.icon, category: n.category || '未分类',
      depth_level: n.depth_level || 1, recommended_depth: n.recommended_depth || 'Understand',
      status: prog ? prog.status : 'not_started', order: n.order_in_level || 0,
      description: n.description || null, learning_objectives: parseArr(n.learning_objectives),
      key_concepts: parseArr(n.key_concepts), observable_evidence: parseArr(n.observable_evidence),
      depth_rationale: n.depth_rationale || '', difficulty: n.difficulty || 1, estimated_minutes: n.estimated_minutes || 90
    };
  });
  var edges = (snap.edges || []).map(function (e) {
    return { id: e.id, source: e.source_node_id, target: e.target_node_id };
  });
  return {
    tree: snap.tree || { id: '', topic: '', title: '', description: '' },
    current: snap.current_node_id || (nodes[0] ? nodes[0].id : null),
    nodes: nodes, edges: edges
  };
}

function iconEmoji(icon) { return ICON_EMOJI[icon] || (icon && /[^\x00-\x7F]/.test(icon) ? icon : '📖'); }

// 布局:拓扑排序 + 最长路径 + barycenter
function computeLayout(nodes, edges) {
  var children = {}, parents = {}, depth = {}, span = {};
  nodes.forEach(function (n) { children[n.id] = []; parents[n.id] = []; depth[n.id] = n.depth_level || 1; });
  edges.forEach(function (e) {
    children[e.source].push(e.target); parents[e.target].push(e.source);
    span[e.source + '>' + e.target] = Math.max(1, (depth[e.target] || 1) - (depth[e.source] || 1));
  });
  var indegree = {}, layer = {};
  nodes.forEach(function (n) { indegree[n.id] = parents[n.id].length; layer[n.id] = 0; });
  var queue = nodes.filter(function (n) { return parents[n.id].length === 0; }).map(function (n) { return n.id; });
  while (queue.length) {
    var u = queue.shift();
    children[u].forEach(function (v) {
      layer[v] = Math.max(layer[v] || 0, (layer[u] || 0) + (span[u + '>' + v] || 1));
      indegree[v]--; if (indegree[v] === 0) queue.push(v);
    });
  }
  var levels = {};
  nodes.forEach(function (n) { var l = layer[n.id] || 0; (levels[l] = levels[l] || []).push(n); });
  var ordered = Object.keys(levels).map(Number).sort(function (a, b) { return a - b; });
  var colStep = NODE_W + HGAP, rowStep = NODE_H + VGAP;
  var orderInLayer = {}, positions = {};
  ordered.forEach(function (lvl) {
    var levelNodes = levels[lvl];
    var sorted = levelNodes.slice().sort(function (a, b) {
      if (lvl === 0) return (a.order || 0) - (b.order || 0);
      function avg(id) { var ps = parents[id] || []; if (!ps.length) return 0;
        return ps.reduce(function (s, p) { return s + (orderInLayer[p] || 0); }, 0) / ps.length; }
      return avg(a.id) - avg(b.id);
    });
    var levelWidth = sorted.length * colStep - HGAP;
    var startX = -levelWidth / 2;
    sorted.forEach(function (n, i) { orderInLayer[n.id] = i; positions[n.id] = { x: startX + i * colStep, y: lvl * rowStep }; });
  });
  return positions;
}

function inferPorts(sx, sy, tx, ty) {
  var dx = tx - sx, dy = ty - sy;
  if (Math.abs(dx) > Math.abs(dy) * 1.2) {
    return dx > 0 ? { sourcePort: 'right', targetPort: 'left' } : { sourcePort: 'left', targetPort: 'right' };
  }
  return dy > 0 ? { sourcePort: 'bottom', targetPort: 'top' } : { sourcePort: 'top', targetPort: 'bottom' };
}

function edgePath(sx, sy, tx, ty, sourcePort, targetPort) {
  var ports = inferPorts(sx, sy, tx, ty);
  sourcePort = sourcePort || ports.sourcePort;
  targetPort = targetPort || ports.targetPort;
  var dx = Math.abs(tx - sx), dy = Math.abs(ty - sy);
  var dist = Math.sqrt(dx * dx + dy * dy);
  var curve = Math.min(120, Math.max(40, dist * 0.4));
  var c1x = sx, c1y = sy, c2x = tx, c2y = ty;
  if (sourcePort === 'bottom') c1y += curve;
  else if (sourcePort === 'top') c1y -= curve;
  else if (sourcePort === 'right') c1x += curve;
  else if (sourcePort === 'left') c1x -= curve;
  if (targetPort === 'bottom') c2y += curve;
  else if (targetPort === 'top') c2y -= curve;
  else if (targetPort === 'right') c2x += curve;
  else if (targetPort === 'left') c2x -= curve;
  return 'M ' + sx + ' ' + sy + ' C ' + c1x + ' ' + c1y + ' ' + c2x + ' ' + c2y + ' ' + tx + ' ' + ty;
}

function getPortCenter(nodeId, port) {
  var p = state.positions[nodeId];
  if (!p) return null;
  var x = p.x + NODE_W / 2, y = p.y + NODE_H / 2;
  if (port === 'left') x = p.x;
  else if (port === 'right') x = p.x + NODE_W;
  else if (port === 'top') y = p.y;
  else if (port === 'bottom') y = p.y + NODE_H;
  return { x: x, y: y };
}

var AI_EDGE_KEY = 'dsh.skilltree.app.aiEdges';
var AI_POS_KEY = 'dsh.skilltree.app.aiPositions';
function loadTreeEdges(treeId) {
  try { var all = JSON.parse(localStorage.getItem(AI_EDGE_KEY) || '{}'); return all[treeId] || null; } catch (e) { return null; }
}
function saveTreeEdges(treeId, edges) {
  try { var all = JSON.parse(localStorage.getItem(AI_EDGE_KEY) || '{}'); all[treeId] = edges; localStorage.setItem(AI_EDGE_KEY, JSON.stringify(all)); } catch (e) {}
}
function loadTreePositions(treeId) {
  try { var all = JSON.parse(localStorage.getItem(AI_POS_KEY) || '{}'); return all[treeId] || null; } catch (e) { return null; }
}
function saveTreePositions(treeId, positions) {
  try { var all = JSON.parse(localStorage.getItem(AI_POS_KEY) || '{}'); all[treeId] = positions; localStorage.setItem(AI_POS_KEY, JSON.stringify(all)); } catch (e) {}
}

function redrawEdges() {
  var existing = {};
  edgeSvg.querySelectorAll('path[data-eid]').forEach(function (p) { existing[p.getAttribute('data-eid')] = p; });
  var keep = {};
  state.edges.forEach(function (e) {
    keep[e.id] = true;
    var sp = state.positions[e.source], tp = state.positions[e.target];
    if (!sp || !tp) return;
    var ports = inferPorts(sp.x + NODE_W / 2, sp.y + NODE_H / 2, tp.x + NODE_W / 2, tp.y + NODE_H / 2);
    var sourcePort = e.sourcePort || ports.sourcePort;
    var targetPort = e.targetPort || ports.targetPort;
    var sCenter = getPortCenter(e.source, sourcePort);
    var tCenter = getPortCenter(e.target, targetPort);
    if (!sCenter || !tCenter) return;
    var d = edgePath(sCenter.x, sCenter.y, tCenter.x, tCenter.y, sourcePort, targetPort);
    var path = existing[e.id];
    var src = state.nodes.filter(function (n) { return n.id === e.source; })[0];
    var cls = 'edge';
    if (src && (src.status === 'completed' || src.status === 'mastered')) { cls += ' ' + src.status + ' animated'; }
    if (state.selectedEdge === e.id) cls += ' selected';
    var marker = 'url(#arrowhead)';
    if (state.selectedEdge === e.id) marker = 'url(#arrowhead-danger)';
    else if (src && src.status === 'completed') marker = 'url(#arrowhead-completed)';
    else if (src && src.status === 'mastered') marker = 'url(#arrowhead-mastered)';
    if (path) {
      path.setAttribute('class', cls);
      path.setAttribute('d', d);
      path.setAttribute('marker-end', marker);
      var hit = edgeSvg.querySelector('path.edge-hit[data-eid="' + e.id + '"]');
      if (hit) hit.setAttribute('d', d);
      return;
    }
    var hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hitPath.setAttribute('class', 'edge-hit'); hitPath.setAttribute('data-eid', e.id); hitPath.setAttribute('d', d);
    edgeSvg.appendChild(hitPath);
    var np = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    np.setAttribute('class', cls); np.setAttribute('data-eid', e.id); np.setAttribute('d', d); np.setAttribute('marker-end', marker);
    edgeSvg.appendChild(np);
  });
  edgeSvg.querySelectorAll('path[data-eid]').forEach(function (p) {
    if (!keep[p.getAttribute('data-eid')]) p.remove();
  });
}

function render() {
  var s = state.snapshot; if (!s) return;
  var nodes = s.nodes.slice(), edges = s.edges;
  state.treeId = (s.tree && (s.tree.id || s.tree.topic)) || 'default';
  nodes = nodes.concat((loadCustomNodes()[state.treeId] || []).map(function (n) { return Object.assign({}, n); }));
  state.nodes = nodes;
  var savedEdges = loadTreeEdges(state.treeId);
  var savedPositions = loadTreePositions(state.treeId);
  state.edges = savedEdges || edges;
  state.positions = savedPositions ? savedPositions : computeLayout(nodes, edges);
  state.selected = null;
  state.selectedEdge = null;

  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  nodes.forEach(function (n) { var p = state.positions[n.id];
    var w = n.note ? NOTE_W : NODE_W, h = n.note ? NOTE_H : NODE_H;
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x + w); maxY = Math.max(maxY, p.y + h); });
  var pad = 60, vbW = (maxX - minX) + pad * 2, vbH = (maxY - minY) + pad * 2, ox = minX - pad, oy = minY - pad;

  redrawEdges();
  edgeSvg.setAttribute('viewBox', ox + ' ' + oy + ' ' + vbW + ' ' + vbH);
  edgeSvg.setAttribute('width', vbW); edgeSvg.setAttribute('height', vbH);
  edgeSvg.style.left = ox + 'px'; edgeSvg.style.top = oy + 'px';

  var nodeHtml = nodes.map(function (n) {
    var p = state.positions[n.id];
    if (n.note) {
      var nw = (p.w || 300), nh = (p.h || 225);
      return '<div class="node note-card" data-id="' + n.id + '" style="left:' + p.x + 'px; top:' + p.y + 'px; width:' + nw + 'px; height:' + nh + 'px;">' +
        '<span class="port left" data-port="left"></span><span class="port right" data-port="right"></span>' +
        '<span class="port top" data-port="top"></span><span class="port bottom" data-port="bottom"></span>' +
        '<span class="resize-h resize-nw" data-r="nw"></span><span class="resize-h resize-n" data-r="n"></span>' +
        '<span class="resize-h resize-ne" data-r="ne"></span><span class="resize-h resize-e" data-r="e"></span>' +

function animateTreeEntrance() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function splitLines(s) {
  return String(s == null ? '' : s).split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
}
function customDetailHtml(node) {

      '<div class="detail-field"><label>学习目标（每行一条）</label><textarea data-ef="objectives" rows="3" placeholder="每行一条">' + escHtml((node.learning_objectives || []).join('\n')) + '</textarea></div>' +
      '<div class="detail-field"><label>关键概念（每行一条）</label><textarea data-ef="concepts" rows="3" placeholder="每行一条">' + escHtml((node.key_concepts || []).join('\n')) + '</textarea></div>' +

function bindCustomDetailEvents(id) {
  detailPanel.querySelectorAll('[data-ef]').forEach(function (el) {
    el.addEventListener('change', function () { commitCustomField(id, el); });
    el.addEventListener('keydown', function (ev) {

}
function commitCustomField(id, el) {
  var node = state.nodes.find(function (n) { return n.id === id; });

  var f = el.getAttribute('data-ef');

  switch (f) {
    case 'icon': node.icon = val.trim() || '📝'; break;
    case 'title': node.title = val.trim(); break;
    case 'category': node.category = val.trim(); break;
    case 'tag': node.tag = val.trim(); break;
    case 'content': node.content = val; break;
    case 'objectives': node.learning_objectives = splitLines(val); break;
    case 'concepts': node.key_concepts = splitLines(val); break;

var STATUS_OPTIONS = [
  { s: 'not_started', label: '未学习', color: '#CBD5E1' },
  { s: 'in_progress', label: '学习中', color: '#F59E0B' },
  { s: 'completed', label: '完成', color: '#16A34A' },
  { s: 'mastered', label: '掌握', color: '#EAB308' }
];

function markPrereqsCompleted(nodeId) {
  state.edges.filter(function (e) { return e.target === nodeId; }).forEach(function (e) {
    var src = state.nodes.find(function (n) { return n.id === e.source; });
    if (src && src.status !== 'completed' && src.status !== 'mastered') {
      src.status = 'completed';
      refreshNodeVisual(src.id);
      markPrereqsCompleted(src.id);
    }
  });
}

function refreshNodeVisual(nodeId) {
  var node = state.nodes.find(function (n) { return n.id === nodeId; });
  if (!node) return;
  var el = viewport.querySelector('.node[data-id="' + nodeId + '"]');
  if (!el) return;
  el.className = 'node ' + node.status + (state.selected === nodeId ? ' selected' : '');
  var flag = node.status === 'mastered' ? '★' : (node.status === 'completed' ? '✓' : '');
  var flagEl = el.querySelector('.node-flag');
  if (flag) {
    if (!flagEl) { flagEl = document.createElement('span'); flagEl.className = 'node-flag'; el.querySelector('.node-head').appendChild(flagEl); }
    flagEl.textContent = flag;
  } else if (flagEl) { flagEl.remove(); }
  var isDone = node.status === 'completed' || node.status === 'mastered';
  state.edges.forEach(function (e) {
    if (e.source !== nodeId) return;
    var path = edgeSvg.querySelector('path.edge[data-eid="' + e.id + '"]');
    if (path) path.setAttribute('class', 'edge' + (isDone ? ' ' + node.status + ' animated' : '') + (state.selectedEdge === e.id ? ' selected' : ''));
  });
}

function setNodeStatus(nodeId, status) {
  var node = state.nodes.find(function (n) { return n.id === nodeId; });
  if (!node) return;
  if (status === 'completed') markPrereqsCompleted(nodeId);
  if (status === 'in_progress') {
    state.nodes.forEach(function (n) {
      if (n.id !== nodeId && n.status === 'in_progress') { n.status = 'not_started'; refreshNodeVisual(n.id); }
    });
  }
  node.status = status;
  refreshNodeVisual(nodeId);
  renderProgress();
  if (state.selected === nodeId) renderDetail(node);
}

function statusActionsHtml(node) {
  return '<div class="status-actions">' + STATUS_OPTIONS.map(function (o) {
    return '<button class="status-btn' + (node.status === o.s ? ' on' : '') + '" data-id="' + node.id + '" data-s="' + o.s + '">' +
      '<span class="dot" style="background:' + o.color + '"></span>' + o.label + '</button>';
  }).join('') + '</div>';
}

detailPanel.addEventListener('click', function (e) {
  var btn = e.target.closest('.status-btn');
  if (!btn) return;
  setNodeStatus(btn.getAttribute('data-id'), btn.getAttribute('data-s'));
});

function renderProgress() {
  var nodes = state.nodes;
  if (!nodes.length) { progressbar.innerHTML = '<strong>尚未生成</strong><div class="progress-track" style="flex:1"></div><span class="stat">输入方向后点击生成</span>'; return; }
  var completed = nodes.filter(function (n) { return n.status === 'completed'; }).length;
  var mastered = nodes.filter(function (n) { return n.status === 'mastered'; }).length;
  var current = nodes.filter(function (n) { return n.status === 'in_progress'; }).length;
  var untouched = nodes.length - completed - mastered - current, total = nodes.length;
  var pct = total ? Math.round((completed + mastered) / total * 100) : 0;
  progressbar.innerHTML =
    '<strong>' + state.snapshot.tree.title + ' · 共 ' + total + ' 节点</strong>' +
    '<div class="progress-track">' +
    '<div class="seg completed" style="width:' + (completed / total * 100) + '%"></div>' +
    '<div class="seg mastered" style="width:' + (mastered / total * 100) + '%"></div>' +
    '<div class="seg current" style="width:' + (current / total * 100) + '%"></div></div>' +
    '<span class="stat">未学习 <b>' + untouched + '</b></span>';
}

function applyTransform() { viewport.style.transform = 'translate(' + state.tx + 'px,' + state.ty + 'px) scale(' + state.scale + ')'; }

function fitView(animate) {
  if (!state.nodes.length) return;
  var wrapW = canvasWrap.clientWidth, wrapH = canvasWrap.clientHeight;
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  state.nodes.forEach(function (n) { var p = state.positions[n.id];
    var w = n.note ? NOTE_W : NODE_W, h = n.note ? NOTE_H : NODE_H;
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x + w); maxY = Math.max(maxY, p.y + h); });
  var scale = Math.min(wrapW / (maxX - minX), wrapH / (maxY - minY)) * 0.9;
  scale = Math.max(0.1, Math.min(2.2, scale));
  var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  state.scale = scale; state.tx = wrapW / 2 - cx * scale; state.ty = wrapH / 2 - cy * scale;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (animate && !reduced) {
    viewport.style.transition = 'transform 260ms cubic-bezier(0.34,1.56,0.64,1)';
    applyTransform();
    clearTimeout(fitView._timer);
    fitView._timer = setTimeout(function () { viewport.style.transition = ''; }, 280);
  } else {
    applyTransform();
  }
}

function zoomBy(factor) {
  var rect = canvasWrap.getBoundingClientRect();
  var mx = rect.width / 2, my = rect.height / 2;
  var newScale = Math.max(0.1, Math.min(2.5, state.scale * factor));
  var wx = (mx - state.tx) / state.scale, wy = (my - state.ty) / state.scale;
  state.tx = mx - wx * newScale; state.ty = my - wy * newScale; state.scale = newScale;
  applyTransform();
}

// 交互
canvasWrap.addEventListener('wheel', function (e) {
  e.preventDefault();
  var rect = canvasWrap.getBoundingClientRect();
  var factor = e.deltaY < 0 ? 1.12 : 0.89;
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var newScale = Math.max(0.1, Math.min(2.5, state.scale * factor));
  var wx = (mx - state.tx) / state.scale, wy = (my - state.ty) / state.scale;
  state.tx = mx - wx * newScale; state.ty = my - wy * newScale; state.scale = newScale;
  applyTransform();
}, { passive: false });

var dragging = false, lastX = 0, lastY = 0, velHist = [], momentumId = null;
canvasWrap.addEventListener('pointerdown', function (e) {
  if (e.target.closest('.node') || e.target.closest('.canvas-tools') || e.target.closest('.add-btns')) return;
  e.preventDefault();
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  velHist = [{ t: performance.now(), x: e.clientX, y: e.clientY }];
  try { canvasWrap.setPointerCapture(e.pointerId); } catch (err) {}
  document.body.style.userSelect = 'none';
  canvasWrap.classList.add('dragging');
});
canvasWrap.addEventListener('pointermove', function (e) {
  if (!dragging) return; state.tx += e.clientX - lastX; state.ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  velHist.push({ t: performance.now(), x: e.clientX, y: e.clientY });
  if (velHist.length > 5) velHist.shift();
  applyTransform();
});
canvasWrap.addEventListener('pointerup', function () { dragging = false; canvasWrap.classList.remove('dragging'); document.body.style.userSelect = ''; releaseMomentum(); });
canvasWrap.addEventListener('pointercancel', function () { dragging = false; canvasWrap.classList.remove('dragging'); document.body.style.userSelect = ''; });
function releaseMomentum() {
  if (velHist.length < 2) return;
  var a = velHist[0], b = velHist[velHist.length - 1];
  var dt = b.t - a.t; if (dt <= 0) return;
  var vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;
  if (Math.abs(vx) < 0.05 && Math.abs(vy) < 0.05) return;
  cancelAnimationFrame(momentumId);
  var lastT = performance.now();
  function step(now) {
    var d = now - lastT; lastT = now;
    if (d > 0) { state.tx += vx * d; state.ty += vy * d; vx *= 0.94; vy *= 0.94; applyTransform(); }
    if (Math.abs(vx) > 0.02 || Math.abs(vy) > 0.02) momentumId = requestAnimationFrame(step);
  }
  momentumId = requestAnimationFrame(step);
}

viewport.addEventListener('click', function (e) {
  var el = e.target.closest('.node'); if (!el) return;
  var id = el.getAttribute('data-id');
  var node = state.nodes.filter(function (n) { return n.id === id; })[0];
  if (!node) return;
  state.selected = id;
  state.selectedEdge = null;
  viewport.querySelectorAll('.node').forEach(function (n) { n.classList.toggle('selected', n.getAttribute('data-id') === id); });
  renderDetail(node);
});

// ---- 节点拖动 / 端口拖拽连线 / 连线选中删除 ----
var nodeDrag = null;
var edgeEdit = null;

function isPortTarget(e) { return !!e.target.closest('.port'); }

function nearestPort(nodeId, x, y) {
  var ports = ['left','right','top','bottom'];
  var best = null, bestDist = Infinity;
  ports.forEach(function (port) {
    var c = getPortCenter(nodeId, port);
    if (!c) return;
    var d = Math.hypot(c.x - x, c.y - y);
    if (d < bestDist) { bestDist = d; best = port; }
  });
  return best;
}

function startEdgePreview(sourceId, sourcePort) {
  var center = getPortCenter(sourceId, sourcePort);
  if (!center) return;
  var preview = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  preview.setAttribute('class', 'edge-preview');
  edgeSvg.appendChild(preview);
  edgeEdit = { sourceId: sourceId, sourcePort: sourcePort, previewPath: preview };
}

function updateEdgePreview(clientX, clientY) {
  if (!edgeEdit) return;
  var rect = canvasWrap.getBoundingClientRect();
  var tx = (clientX - rect.left - state.tx) / state.scale;
  var ty = (clientY - rect.top - state.ty) / state.scale;
  var s = getPortCenter(edgeEdit.sourceId, edgeEdit.sourcePort);
  if (!s) return;
  var targetEl = document.elementFromPoint(clientX, clientY);
  var targetNode = targetEl ? targetEl.closest('.node') : null;
  var t = null, tp = null, tgtId = null;
  if (targetNode) {
    tgtId = targetNode.getAttribute('data-id');
    if (tgtId !== edgeEdit.sourceId) {
      tp = nearestPort(tgtId, tx, ty);
      t = getPortCenter(tgtId, tp);
    }
  }
  if (!t) { t = { x: tx, y: ty }; }
  var d = edgePath(s.x, s.y, t.x, t.y, edgeEdit.sourcePort, tp);
  edgeEdit.previewPath.setAttribute('d', d);
}

function endEdgePreview(clientX, clientY) {
  if (!edgeEdit) return;
  var sourceId = edgeEdit.sourceId, sourcePort = edgeEdit.sourcePort;
  var preview = edgeEdit.previewPath;
  edgeEdit = null;
  if (preview && preview.parentNode) preview.remove();
  var targetEl = document.elementFromPoint(clientX, clientY);
  if (!targetEl) return;
  var targetNode = targetEl.closest('.node');
  if (!targetNode) return;
  var targetId = targetNode.getAttribute('data-id');
  if (targetId === sourceId) return;
  if (state.edges.some(function (e) { return e.source === sourceId && e.target === targetId; })) return;
  var rect = canvasWrap.getBoundingClientRect();
  var tx = (clientX - rect.left - state.tx) / state.scale;
  var ty = (clientY - rect.top - state.ty) / state.scale;
  var targetPort = nearestPort(targetId, tx, ty) || 'top';
  state.edges.push({ id: sourceId + '>' + targetId, source: sourceId, sourcePort: sourcePort, target: targetId, targetPort: targetPort });
  saveTreeEdges(state.treeId, state.edges);
  redrawEdges();
}

// 端口拖拽创建连线(捕获阶段优先,避免触发节点拖动)
viewport.addEventListener('pointerdown', function (e) {
  if (e.button !== 0) return;
  var port = e.target.closest('.port');
  if (!port) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  var nodeEl = e.target.closest('.node');
  if (!nodeEl) return;
  startEdgePreview(nodeEl.getAttribute('data-id'), port.getAttribute('data-port'));
}, true);

// 节点拖动
viewport.addEventListener('pointerdown', function (e) {
  if (e.button !== 0) return;
  if (isPortTarget(e)) return;
  if (e.target.closest('.resize-h')) return;
  var el = e.target.closest('.node');
  if (!el) return;
  var id = el.getAttribute('data-id');
  var p = state.positions[id];
  if (!p) return;
  nodeDrag = { id: id, el: el, dx: e.clientX - p.x, dy: e.clientY - p.y };
  el.classList.add('dragging');
  e.preventDefault();
});

viewport.addEventListener('pointermove', function (e) {
  if (edgeEdit) { updateEdgePreview(e.clientX, e.clientY); return; }
  if (!nodeDrag) return;
  var p = state.positions[nodeDrag.id];
  p.x = e.clientX - nodeDrag.dx;
  p.y = e.clientY - nodeDrag.dy;
  nodeDrag.el.style.left = p.x + 'px';
  nodeDrag.el.style.top = p.y + 'px';
  redrawEdges();
});

viewport.addEventListener('pointerup', function (e) {
  if (edgeEdit) { endEdgePreview(e.clientX, e.clientY); return; }
  if (!nodeDrag) return;
  nodeDrag.el.classList.remove('dragging');
  nodeDrag = null;
  saveTreePositions(state.treeId, state.positions);
});

// ---- 笔记卡片缩放 ----
var noteResize = null;
viewport.addEventListener('pointerdown', function (e) {
  if (e.button !== 0) return;
  var h = e.target.closest('.resize-h');
  if (!h) return;
  e.preventDefault();
  e.stopPropagation();
  var el = h.closest('.node.note-card');
  if (!el) return;
  var id = el.getAttribute('data-id');
  var p = state.positions[id];
  if (!p) return;
  noteResize = {
    id: id, el: el, dir: h.getAttribute('data-r'),
    startX: e.clientX, startY: e.clientY,
    origW: el.offsetWidth, origH: el.offsetHeight,
    origX: p.x, origY: p.y
  };
  el.classList.add('resizing');
  document.body.style.userSelect = 'none';
});
window.addEventListener('pointermove', function (e) {
  if (!noteResize) return;
  var r = noteResize;
  var dx = (e.clientX - r.startX) / state.scale;
  var dy = (e.clientY - r.startY) / state.scale;
  var dir = r.dir, w = r.origW, h = r.origH, x = r.origX, y = r.origY;
  if (dir.indexOf('e') !== -1) w = Math.max(140, r.origW + dx);
  if (dir.indexOf('s') !== -1) h = Math.max(110, r.origH + dy);
  if (dir.indexOf('w') !== -1) { var nw = Math.max(140, r.origW - dx); x = r.origX + (r.origW - nw); w = nw; }
  if (dir.indexOf('n') !== -1) { var nh = Math.max(110, r.origH - dy); y = r.origY + (r.origH - nh); h = nh; }
  r.el.style.width = w + 'px';
  r.el.style.height = h + 'px';
  r.el.style.left = x + 'px';
  r.el.style.top = y + 'px';
  state.positions[r.id] = { x: x, y: y, w: w, h: h };
  redrawEdges();
});
function endNoteResize() {
  if (!noteResize) return;
  noteResize.el.classList.remove('resizing');
  document.body.style.userSelect = '';
  noteResize = null;
  saveTreePositions(state.treeId, state.positions);
}
window.addEventListener('pointerup', endNoteResize);
window.addEventListener('pointercancel', endNoteResize);

// 连线选中
function closestEdgePath(el) {
  return el && (el.closest('path.edge') || el.closest('path.edge-hit'));
}

edgeSvg.addEventListener('click', function (e) {
  var path = closestEdgePath(e.target);
  if (!path) { state.selectedEdge = null; redrawEdges(); return; }
  e.stopPropagation();
  state.selectedEdge = path.getAttribute('data-eid');
  redrawEdges();
});

// 删除选中连线
window.addEventListener('keydown', function (e) {
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedEdge) {
    state.edges = state.edges.filter(function (ed) { return ed.id !== state.selectedEdge; });
    saveTreeEdges(state.treeId, state.edges);
    state.selectedEdge = null;
    redrawEdges();
  }
});

// 右键连线删除
var ctxEdgeId = null;
edgeSvg.addEventListener('contextmenu', function (e) {
  var path = closestEdgePath(e.target);
  if (!path) return;
  e.preventDefault();
  e.stopPropagation();
  ctxEdgeId = path.getAttribute('data-eid');
  ctxNodeId = null;
  ctxMenu.innerHTML = '<button data-action="delete-edge">🗑 删除连线</button>';
  ctxMenu.classList.add('show');
  var mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
  var x = e.clientX, y = e.clientY;
  if (x + mw > window.innerWidth) x = window.innerWidth - mw - 8;
  if (y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
  ctxMenu.style.left = x + 'px'; ctxMenu.style.top = y + 'px';
});

window.addEventListener('resize', function () { if (state.snapshot) fitView(true); });

// 生成
function setLoading(on) {
  var mask = document.getElementById('loadingMask');
  if (on) {
    mask.style.display = 'flex';
    requestAnimationFrame(function () { mask.style.opacity = '1'; });
  } else {
    mask.style.opacity = '0';
    setTimeout(function () { mask.style.display = 'none'; }, 200);
  }
  document.getElementById('genBtn').disabled = on;
}
function showError(msg) {
  var box = document.getElementById('errorBox'), text = document.getElementById('errorText');
  text.innerHTML = '<b>生成失败</b><br>' + msg + '<br><button onclick="hideError()">关闭</button>';
  box.style.display = 'flex';
  requestAnimationFrame(function () { box.style.opacity = '1'; box.style.transform = 'translateY(0)'; });
}
function hideError() {
  var box = document.getElementById('errorBox');
  box.style.opacity = '0'; box.style.transform = 'translateY(6px)';
  setTimeout(function () { box.style.display = 'none'; }, 200);
}

function saveSnapshot() {
  if (!state.snapshot) { showError('还没有生成技能树，请先点击「生成技能树」'); return; }
  var data = JSON.stringify(state.snapshot, null, 2);
  var blob = new Blob([data], { type: 'application/json;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = ((state.snapshot.tree && state.snapshot.tree.topic) || '技能树') + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function generate() {
  var topic = document.getElementById('topicInput').value.trim();
  var goal = document.getElementById('goalInput').value.trim();
  if (!topic) { showError('请输入学习方向'); return; }
  hideError();
  document.getElementById('emptyHint').style.display = 'none';
  setLoading(true);
  try {
    var resp = await fetch('/api/v1/generate-tree', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: topic, goal: goal })
    });
    if (!resp.ok) {
      var err = await resp.json().catch(function () { return {}; });
      throw new Error(err.error || ('HTTP ' + resp.status));
    }
    var snap = await resp.json();
    if (!snap.nodes || !snap.nodes.length) throw new Error('AI 未返回节点数据');
    state.snapshot = convertSnapshot(snap);
    render();
    document.getElementById('saveBtn').disabled = false;
  } catch (e) {
    showError(e.message || String(e));
  } finally {
    setLoading(false);
  }
}

// 回车触发
document.getElementById('topicInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') generate(); });
document.getElementById('goalInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') generate(); });

var ctxMenu = document.getElementById('ctxMenu');
var ctxNodeId = null;

viewport.addEventListener('contextmenu', function (e) {
  var el = e.target.closest('.node');
  if (!el) return;
  e.preventDefault();
  ctxNodeId = el.getAttribute('data-id');
  var node = state.nodes.find(function (n) { return n.id === ctxNodeId; });
  if (!node) return;
  ctxMenu.innerHTML = STATUS_OPTIONS.map(function (o) {
    return '<button data-s="' + o.s + '"><span class="dot" style="background:' + o.color + '"></span>' + o.label + (node.status === o.s ? ' ✓' : '') + '</button>';
  }).join('');
  if (node.custom) ctxMenu.innerHTML += '<button data-action="delete-node">🗑 ' + (node.note ? '删除笔记' : '删除节点') + '</button>';
  ctxMenu.classList.add('show');
  var mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
  var x = e.clientX, y = e.clientY;
  if (x + mw > window.innerWidth) x = window.innerWidth - mw - 8;
  if (y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
  ctxMenu.style.left = x + 'px';
  ctxMenu.style.top = y + 'px';
});

ctxMenu.addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  if (btn.getAttribute('data-action') === 'delete-edge') {
    if (ctxEdgeId) {
      state.edges = state.edges.filter(function (ed) { return ed.id !== ctxEdgeId; });
      saveTreeEdges(state.treeId, state.edges);
      state.selectedEdge = null;
      redrawEdges();
    }
    hideCtxMenu();
    return;
  }
  if (btn.getAttribute('data-action') === 'delete-node') {
    if (ctxNodeId) deleteCustomNode(ctxNodeId);
    hideCtxMenu();
    return;
  }
  if (!ctxNodeId) return;
  setNodeStatus(ctxNodeId, btn.getAttribute('data-s'));
  hideCtxMenu();
});

function hideCtxMenu() { ctxMenu.classList.remove('show'); ctxNodeId = null; ctxEdgeId = null; }

document.addEventListener('click', function (e) { if (!e.target.closest('.ctx-menu')) hideCtxMenu(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideCtxMenu(); });
window.addEventListener('scroll', hideCtxMenu);

/* ── 自定义节点 ── */
var AI_CUSTOM_KEY = 'dsh.skilltree.app.aiCustomNodes';
function loadCustomNodes() {
  try { return JSON.parse(localStorage.getItem(AI_CUSTOM_KEY) || '{}'); } catch (e) { return {}; }
}
function saveCustomNodes() {
  var all = loadCustomNodes();
  all[state.treeId] = state.nodes.filter(function (n) { return n.custom; });
  try { localStorage.setItem(AI_CUSTOM_KEY, JSON.stringify(all)); } catch (e) {}
}

function startEditTitle(id) {
  var el = viewport.querySelector('.node[data-id="' + id + '"]');
  if (!el) return;
  var titleEl = el.querySelector('.node-title') || el.querySelector('.note-title');
  if (!titleEl) return;
  var node = state.nodes.find(function (n) { return n.id === id; });
  if (!node) return;
  if (titleEl.querySelector('input.title-editor')) return;
  var orig = node.title || '';
  var input = document.createElement('input');
  input.className = 'title-editor';
  input.value = orig;
  input.placeholder = node.note ? '输入笔记标题' : '输入节点名称';
  titleEl.textContent = '';
  titleEl.appendChild(input);
  input.focus();
  input.select();
  var done = false;
  function commit() {
    if (done) return;
    done = true;
    var val = input.value.trim();
    node.title = val;
    titleEl.textContent = val || '';
    titleEl.classList.toggle('placeholder', !val);
    if (state.selected === id) renderDetail(node);
    saveCustomNodes();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); commit(); input.blur(); }
    else if (ev.key === 'Escape') {
      done = true;
      node.title = orig;
      titleEl.textContent = orig || '';
      titleEl.classList.toggle('placeholder', !orig);
      input.blur();
    }
  });
}

function startInlineEdit(opts) {
  var el = opts.el, node = opts.node, field = opts.field, placeholder = opts.placeholder, emptyText = opts.emptyText;
  if (el.querySelector('input.title-editor')) return;
  var orig = node[field] || '';
  var input = document.createElement('input');
  input.className = 'title-editor';
  input.value = orig;
  input.placeholder = placeholder;
  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();
  var done = false;
  function commit() {
    if (done) return;
    done = true;
    var val = input.value.trim();
    node[field] = val;
    el.textContent = val || emptyText;
    el.classList.toggle('placeholder', !val);
    if (state.selected === node.id) renderDetail(node);
    saveCustomNodes();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); commit(); input.blur(); }
    else if (ev.key === 'Escape') {
      done = true;
      node[field] = orig;
      el.textContent = orig || emptyText;
      el.classList.toggle('placeholder', !orig);
      input.blur();
    }
  });
}

function startEditCategory(id) {
  var node = state.nodes.find(function (n) { return n.id === id; });
  if (!node) return;
  var el = viewport.querySelector('.node[data-id="' + id + '"] .node-cat');
  if (!el) return;
  startInlineEdit({ el: el, node: node, field: 'category', placeholder: '输入分类', emptyText: '自定义' });
}

function startEditTag(id) {
  var node = state.nodes.find(function (n) { return n.id === id; });
  if (!node) return;
  var el = viewport.querySelector('.node[data-id="' + id + '"] .node-tag');
  if (!el) return;
  startInlineEdit({ el: el, node: node, field: 'tag', placeholder: '输入自定义标签', emptyText: '自定义' });
}

function startEditNoteBody(id) {
  var el = viewport.querySelector('.node[data-id="' + id + '"]');
  if (!el) return;
  var bodyEl = el.querySelector('.note-body');
  if (!bodyEl) return;
  var node = state.nodes.find(function (n) { return n.id === id; });
  if (!node) return;
  if (bodyEl.querySelector('textarea.note-editor')) return;
  var orig = node.content || '';
  var ta = document.createElement('textarea');
  ta.className = 'note-editor';
  ta.value = orig;
  ta.placeholder = '记录你的想法…';
  bodyEl.textContent = '';
  bodyEl.appendChild(ta);
  ta.focus();
  var done = false;
  function commit() {
    if (done) return;
    done = true;
    var val = ta.value;
    node.content = val;
    bodyEl.textContent = val || '';
    bodyEl.classList.toggle('placeholder', !val);
    if (state.selected === id) renderDetail(node);
    saveCustomNodes();
  }
  ta.addEventListener('blur', commit);
  ta.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      done = true;
      node.content = orig;
      bodyEl.textContent = orig || '';
      bodyEl.classList.toggle('placeholder', !orig);
      ta.blur();
    }
  });
}

function addNote() {
  if (!state.snapshot) { showError('还没有技能树，请先点击「生成技能树」'); return; }
  var id = 'note-' + Date.now();
  var wrap = canvasWrap.getBoundingClientRect();
  var wx = (wrap.width / 2 - state.tx) / state.scale - NOTE_W / 2;
  var wy = (wrap.height / 2 - state.ty) / state.scale - NOTE_H / 2;
  var node = { id: id, title: '', content: '', icon: '📝', category: '笔记', status: 'not_started', depth_level: 1, recommended_depth: 'Understand', custom: true, note: true };
  state.nodes.push(node);
  state.positions[id] = { x: wx, y: wy };
  var holder = document.createElement('div');
  holder.innerHTML = '<div class="node note-card" data-id="' + node.id + '" style="left:' + wx + 'px; top:' + wy + 'px; width:300px; height:225px;">' +
    '<span class="port left" data-port="left"></span><span class="port right" data-port="right"></span>' +
    '<span class="port top" data-port="top"></span><span class="port bottom" data-port="bottom"></span>' +
    '<span class="resize-h resize-nw" data-r="nw"></span><span class="resize-h resize-n" data-r="n"></span>' +
    '<span class="resize-h resize-ne" data-r="ne"></span><span class="resize-h resize-e" data-r="e"></span>' +
    '<span class="resize-h resize-se" data-r="se"></span><span class="resize-h resize-s" data-r="s"></span>' +
    '<span class="resize-h resize-sw" data-r="sw"></span><span class="resize-h resize-w" data-r="w"></span>' +
    '<div class="note-head"><span class="note-title placeholder">未命名</span></div>' +
    '<div class="note-body placeholder">双击编辑内容</div></div>';
  viewport.appendChild(holder.firstChild);
  saveCustomNodes();
  saveTreePositions(state.treeId, state.positions);
  renderProgress();
  state.selected = id;
  state.selectedEdge = null;
  viewport.querySelectorAll('.node').forEach(function (n) { n.classList.toggle('selected', n.getAttribute('data-id') === id); });
  renderDetail(node);
  startEditTitle(id);
}

function addCustomNode() {
  if (!state.snapshot) { showError('还没有技能树，请先点击「生成技能树」'); return; }
  var id = 'custom-' + Date.now();
  var wrap = canvasWrap.getBoundingClientRect();
  var wx = (wrap.width / 2 - state.tx) / state.scale - NODE_W / 2;
  var wy = (wrap.height / 2 - state.ty) / state.scale - NODE_H / 2;
  var node = { id: id, title: '', icon: '📝', category: '自定义', status: 'not_started', depth_level: 1, recommended_depth: 'Understand', custom: true };
  state.nodes.push(node);
  state.positions[id] = { x: wx, y: wy };
  var holder = document.createElement('div');
  holder.innerHTML = '<div class="node ' + node.status + '" data-id="' + node.id + '" style="left:' + wx + 'px; top:' + wy + 'px;">' +
    '<span class="port left" data-port="left"></span><span class="port right" data-port="right"></span>' +
    '<span class="port top" data-port="top"></span><span class="port bottom" data-port="bottom"></span>' +
    '<div class="node-head"><span class="node-icon">📝</span>' +
    '<span class="node-title placeholder">双击编辑</span></div>' +
    '<div class="node-meta"><span class="node-cat">自定义</span><span class="node-tag">自定义</span></div></div>';
  viewport.appendChild(holder.firstChild);
  saveCustomNodes();
  saveTreePositions(state.treeId, state.positions);
  renderProgress();
  state.selected = id;
  state.selectedEdge = null;
  viewport.querySelectorAll('.node').forEach(function (n) { n.classList.toggle('selected', n.getAttribute('data-id') === id); });
  renderDetail(node);
  startEditTitle(id);
}

function deleteCustomNode(id) {
  var idx = -1;
  state.nodes.forEach(function (n, i) { if (n.id === id) idx = i; });
  if (idx < 0) return;
  state.nodes.splice(idx, 1);
  state.edges = state.edges.filter(function (e) { return e.source !== id && e.target !== id; });
  delete state.positions[id];
  var el = viewport.querySelector('.node[data-id="' + id + '"]');
  if (el) el.remove();
  if (state.selected === id) { state.selected = null; renderDetailEmpty(); }
  saveCustomNodes();
  saveTreePositions(state.treeId, state.positions);
  saveTreeEdges(state.treeId, state.edges);
  redrawEdges();
  renderProgress();
}

document.getElementById('addNodeBtn').addEventListener('click', function (e) {
  e.stopPropagation();
  addCustomNode();
});

document.getElementById('addNoteBtn').addEventListener('click', function (e) {
  e.stopPropagation();
  addNote();
});

viewport.addEventListener('dblclick', function (e) {
  var el = e.target.closest('.node');
  if (!el) return;
  if (e.target.closest('.port')) return;
  e.preventDefault();
  e.stopPropagation();
  var id = el.getAttribute('data-id');
  var node = state.nodes.find(function (n) { return n.id === id; });
  if (node && node.note) {
    if (e.target.closest('.note-title')) startEditTitle(id);
    else startEditNoteBody(id);
    return;
  }
  if (node && node.custom) {
    if (e.target.closest('.node-cat')) { startEditCategory(id); return; }
    if (e.target.closest('.node-tag')) { startEditTag(id); return; }
  }
  startEditTitle(id);
});
