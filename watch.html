                        });
                        var done = area.querySelector('#qDone');
                        done.className = 'quiz-done show';
                        done.innerHTML = '<div class="qd-score">' + (right * QPT) + ' / ' + (qs.length * QPT) + ' 分</div><div class="qd-tip">' + (right === qs.length ? '全部正确，太棒了！' : '答对 ' + right + ' / ' + qs.length + ' 题，解析见上方') + '</div>';
                        subBtn.textContent = '已提交';
                        subBtn.classList.remove('ready');
                        subBtn.disabled = true;
                    });
                }
                function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
                startBtn.addEventListener('click', begin);
            })();
            vp.appendChild(stage);
            poster.appendChild(vp);
            requestAnimationFrame(function () { fitDeckSlides(stage); });
            setTimeout(function () { fitDeckSlides(stage); }, 250);
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () { fitDeckSlides(stage); });
            }
            window._deckViewport = vp;
            window._deck = new SlidePresentation(stage, vp);
            window._deckShow = function (idx, reason) { if (window._deck) window._deck.goTo(idx, reason || 'api'); };
            return window._deck;
        }
        // 演示控制器：整台等比缩放 + 键盘/滚轮/触屏翻页 + onChange 同步
        class SlidePresentation {
            constructor(stage, viewport) {
                this.stage = stage;
                this.viewport = viewport;
                this.slides = Array.from(stage.querySelectorAll('.slide'));
                this.index = 0;
                this.onChange = null;
                this._touchX = null;
                this._flashEl = this._makeFlash();
                this._setupScale();
                this._setupKeys();
                this._setupWheel();
                this._setupTouch();
                this._goTo(0, 'init');
            }
            destroy() {
                window.removeEventListener('resize', this._onResize);
                this._flashEl && this._flashEl.remove();
            }
            _makeFlash() {
                const el = document.createElement('div');
                el.className = 'deck-page-flash';
                document.body.appendChild(el);
                return el;
            }
            _setupScale() {
                this._onResize = () => {
                    const w = this.viewport.clientWidth, h = this.viewport.clientHeight;
                    if (!w || !h) return;
                    const factor = Math.min(w / 1920, h / 1080);
                    const x = (w - 1920 * factor) / 2;
                    const y = (h - 1080 * factor) / 2;
                    this.stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + factor + ')';
                };
                this._setupScaleRef = this._onResize;
                this._onResize();
                window.addEventListener('resize', this._onResize);
            }
            _setupKeys() {
                document.addEventListener('keydown', function _dkKey(e) {
                    const d = window._deck; if (!d) return;
                    const t = e.target;
                    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
                    if (e.metaKey || e.ctrlKey || e.altKey) return;
                    const k = e.key;
                    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') d.goTo(d.index + 1, 'user');
                    else if (k === 'ArrowLeft' || k === 'PageUp') d.goTo(d.index - 1, 'user');
                    else if (k === 'Home') d.goTo(0, 'user');
                    else if (k === 'End') d.goTo(d.slides.length - 1, 'user');
                    else return;
                    e.preventDefault(); d._flash();
                });
            }
            _setupWheel() {
                // 已按用户要求完全禁用：上下滚动不再触发 PPT 翻页
                // （翻页仅保留：键盘方向键/空格、触屏横向滑动、点击侧栏与按钮）
            }
            _setupTouch() {
                this.viewport.addEventListener('touchstart', (e) => { this._touchX = e.changedTouches[0].clientX; }, { passive: true });
                this.viewport.addEventListener('touchend', (e) => {
                    if (this._touchX === null) return;
                    const dx = e.changedTouches[0].clientX - this._touchX;
                    if (Math.abs(dx) > 46) window._deck.goTo(this.index + (dx < 0 ? 1 : -1), 'user');
                    this._touchX = null;
                }, { passive: true });
            }
            _goTo(i, reason) {
                const n = Math.max(0, Math.min(this.slides.length - 1, i));
                if (n === this.index) return;
                this.index = n;
                this.slides.forEach((s, ix) => {
                    s.classList.toggle('active', ix === n);
                    s.classList.toggle('visible', ix === n);
                });
                if (this.onChange) this.onChange({ index: n, reason: reason });
            }
            goTo(i, reason) { this._goTo(i, reason); }
            next(reason) { this._goTo(this.index + 1, reason || 'api'); }
            prev(reason) { this._goTo(this.index - 1, reason || 'api'); }
            _flash() {
                if (!this._flashEl) return;
                this._flashEl.textContent = (this.index + 1) + ' / ' + this.slides.length;
                this._flashEl.classList.add('show');
                clearTimeout(this._flashTimer);
                this._flashTimer = setTimeout(() => this._flashEl.classList.remove('show'), 650);
            }
        }
        // 内联编辑：E 键 + Ctrl+S（入口为键盘快捷键，不再显示热区/浮动按钮）
        function initDeckEditor(getPause) {
            let active = false;
            // ── AI 修改本页工具条（编辑模式下显示）──
            const aiBar = document.createElement('div');
            aiBar.className = 'ai-edit-bar';
            aiBar.innerHTML =
                '<span class="ai-page-tag" id="aiPageTag">本页</span>'
                + '<input id="aiEditInput" type="text" placeholder="用一句话描述要改什么，如：把右侧图表换成雷达图" maxlength="200">'
                + '<button id="aiEditBtn" title="调用 AI 按指令增量修改本页"><i class="fas fa-wand-magic-sparkles"></i> AI 修改本页</button>'
                + '<button id="aiUndoBtn" class="ghost" title="撤销上一次 AI 修改" style="display:none;">撤销</button>'
                + '<button id="aiSaveBtn" class="ghost" title="把当前编辑结果保存到服务器">保存到服务器</button>'
                + '<span class="ai-status" id="aiStatus"></span>';
            document.body.appendChild(aiBar);
            const aiHistory = []; // 每页的撤销栈：{ idx, prev }
            function setAiStatus(msg) { const el = document.getElementById('aiStatus'); if (el) el.textContent = msg || ''; }
            function refreshAiBar() {
                if (!active) return;
                const tag = document.getElementById('aiPageTag');
                const idx = window._currentSlideIdx || 0;
                const total = (window._slidesData || []).length;
                if (tag) tag.textContent = idx < total ? '第 ' + (idx + 1) + '/' + total + ' 页' : '随堂测验页';
                const dis = idx >= total;
                const inp = document.getElementById('aiEditInput'); if (inp) inp.disabled = dis;
                const btn = document.getElementById('aiEditBtn'); if (btn) btn.disabled = dis;
            }
            async function doAiPatch() {
                const idx = window._currentSlideIdx || 0;
                const slides = window._slidesData;
                const input = document.getElementById('aiEditInput');
                const btn = document.getElementById('aiEditBtn');
                const instruction = input && input.value.trim();
                if (!slides || !slides[idx] || !instruction) { setAiStatus('请先输入修改指令'); return; }
                btn.disabled = true; setAiStatus('AI 修改中…');
                try {
                    const res = await fetch('/api/v1/ppt/patch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task_id: window._currentTaskId, slide_index: idx, instruction })
                    });
                    const payload = await res.json();
                    if (!res.ok) throw new Error(payload.error?.message || 'AI 修改失败');
                    aiHistory.push({ idx, prev: slides[idx] });
                    document.getElementById('aiUndoBtn').style.display = '';
                    slides[idx] = payload.data.slide;
                    // 仅重渲染该页
                    const sec = document.querySelectorAll('#deckStage .slide')[idx];
                    if (sec) renderDeckSlideInto(sec, slides[idx], idx);
                    try { localStorage.setItem('watch_deck_edit_' + window._currentTaskId, JSON.stringify(slides)); } catch (e) {}
                    const warns = payload.data.warnings || [];
                    setAiStatus(warns.length ? '已修改（自动修正 ' + warns.length + ' 处格式）' : '已修改');
                    if (input) input.value = '';
                } catch (e) {
                    setAiStatus(e.message);
                } finally {
                    btn.disabled = false;
                }
            }
            function doAiUndo() {
                const last = aiHistory.pop();
                if (!last) return;
                const slides = window._slidesData;
                slides[last.idx] = last.prev;
                const sec = document.querySelectorAll('#deckStage .slide')[last.idx];
                if (sec) { renderDeckSlideInto(sec, slides[last.idx], last.idx); if (active) applyEdit(true); }
                try { localStorage.setItem('watch_deck_edit_' + window._currentTaskId, JSON.stringify(slides)); } catch (e) {}
                if (!aiHistory.length) document.getElementById('aiUndoBtn').style.display = 'none';
                setAiStatus('已撤销');
            }
            async function saveToServer() {
                const slides = window._slidesData;
                if (!slides || !window._currentTaskId) { setAiStatus('无可保存内容'); return; }
                setAiStatus('保存中…');
                try {
                    const res = await fetch('/api/v1/video/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task_id: window._currentTaskId, slides })
                    });
                    const payload = await res.json();
                    if (!res.ok) throw new Error(payload.error?.message || '保存失败');
                    setAiStatus('已保存到服务器（' + payload.data.saved + ' 页）');
                } catch (e) { setAiStatus(e.message); }
            }
            aiBar.addEventListener('click', function (ev) { ev.stopPropagation(); });
            aiBar.addEventListener('keydown', function (ev) {
                ev.stopPropagation();
                if (ev.key === 'Enter' && ev.target.id === 'aiEditInput') doAiPatch();
            });
            document.getElementById('aiEditBtn').addEventListener('click', doAiPatch);
            document.getElementById('aiUndoBtn').addEventListener('click', doAiUndo);
            document.getElementById('aiSaveBtn').addEventListener('click', saveToServer);
            function applyEdit(on) {
                document.querySelectorAll('#playerPoster #deckStage .dk-title, #playerPoster #deckStage .dk-subtitle, #playerPoster #deckStage .dk-bottom, #playerPoster #deckStage .dk-kicker, #playerPoster #deckStage [data-edit="points"], #playerPoster #deckStage [data-edit="body"]')
                    .forEach(el => { el.setAttribute('contenteditable', on ? 'true' : 'false'); });
            }
            function saveEdits() {
                const slides = window._slidesData; if (!slides) return;
                document.querySelectorAll('#deckStage .slide').forEach(function (sec, idx) {
                    const s = slides[idx]; if (!s) return;
                    const t = sec.querySelector('.dk-title');
                    const b = sec.querySelector('.dk-bottom');
                    const p = sec.querySelector('[data-edit="points"]');
                    const body = sec.querySelector('[data-edit="body"]');
                    if (t) s.title = t.textContent.trim();
                    if (b) s.bottom = b.textContent.trim();
                    if (p) s.left = p.textContent.trim();
                    if (body) s.text = body.textContent.trim();
                });
                try { localStorage.setItem('watch_deck_edit_' + window._currentTaskId, JSON.stringify(slides)); } catch (e) {}
            }
            function toggleEdit() {
                active = !active;
                applyEdit(active);
                aiBar.classList.toggle('show', active);
                if (active) refreshAiBar(); else setAiStatus('');
                if (!active) saveEdits();
                const btn = document.getElementById('deckEditBtn');
                if (btn) btn.classList.toggle('active', active);
                if (typeof getPause === 'function') getPause(active);
            }
            window.toggleDeckEdit = toggleEdit;
            // 翻页时同步 AI 条的页码标签
            setInterval(function () { if (active) refreshAiBar(); }, 500);
            document.addEventListener('keydown', function _dkEdit(e) {
                if (active && (e.target.closest && e.target.closest('.ai-edit-bar'))) return;
                if ((e.key === 'e' || e.key === 'E') && !e.target.getAttribute('contenteditable')) toggleEdit();
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && active) { e.preventDefault(); saveEdits(); saveToServer(); }
            });
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || input.disabled) return;

            input.value = '';
            input.style.height = 'auto';
            addChatMsg('user', text);
            chatHistory.push({ role: 'user', content: text });

            const sendBtn = document.getElementById('chatSendBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            input.disabled = true;

            const bubble = addChatMsg('ai', '正在思考…');
            try {
                const response = await fetch('/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text, history: chatHistory.slice(0, -1) })
                });
                if (!response.ok) {
                    let message = '请求失败，请稍后重试';
                    try { message = (await response.json()).error?.message || message; } catch (e) {}
                    throw new Error(message);
                }

                // 流式读取 SSE
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let full = '';
                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) >= 0) {
                        const event = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        const dataLine = event.split('\n').find(l => l.trim().startsWith('data:'));
                        if (!dataLine) continue;
                        const data = dataLine.trim().slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const evt = JSON.parse(data);
                            if (evt.type === 'delta') {
                                full += evt.delta;
                                bubble.innerHTML = (window.renderMarkdown ? renderMarkdown(full) : full);
                                scrollChatPanel();
                            } else if (evt.type === 'done') {
                                full = evt.content;
                            }
                        } catch (e) {}
                    }
                }
                if (!full) full = '（未收到回复，请重试）';
                bubble.innerHTML = (window.renderMarkdown ? renderMarkdown(full) : full);
                chatHistory.push({ role: 'assistant', content: full });
                scrollChatPanel();
                rebuildChatRail();
            } catch (e) {
                bubble.innerHTML = renderMarkdown('**出错了**：' + e.message);
                chatHistory.push({ role: 'assistant', content: '出错：' + e.message });
                scrollChatPanel();
                rebuildChatRail();
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                input.disabled = false;
                input.focus();
            }
        }

        // ===== On this page 滚动导航（scrollspy） =====
        // 导航条贴顶偏移：rail 距内容区顶部 12px + 标题行约 22px
        const CHAT_RAIL_OFFSET = 34;
        let chatSectionSeq = 0;
        let chatSectionEls = [];   // [{ id, title, el }]
        let chatObserver = null;

        function resetChatRail() {
            if (chatObserver) { chatObserver.disconnect(); chatObserver = null; }
            chatSectionEls = [];
            chatSectionSeq = 0;
            const rail = document.getElementById('chatRail');
            if (rail) { rail.hidden = true; document.getElementById('chatRailLinks').innerHTML = ''; }
        }

        // 收集 AI 回复中的标题 → 生成锚点 + 导航链接 + 建立 IntersectionObserver
        function rebuildChatRail() {
            const rail = document.getElementById('chatRail');
            const linksBox = document.getElementById('chatRailLinks');
            const headings = document.querySelectorAll('#chatMsgs .chat-msg--ai .chat-msg-content h1, #chatMsgs .chat-msg--ai .chat-msg-content h2, #chatMsgs .chat-msg--ai .chat-msg-content h3, #chatMsgs .chat-msg--ai .chat-msg-content h4');
            if (!headings.length) { resetChatRail(); return; }

            chatSectionEls = [];
            headings.forEach(function (h) {
                if (!h.id) h.id = 'chatsec-' + (chatSectionSeq++);
                const title = (h.textContent || '').trim();
                if (title) chatSectionEls.push({ id: h.id, title: title, el: h });
            });
            if (!chatSectionEls.length) { resetChatRail(); return; }

            linksBox.innerHTML = chatSectionEls.map(function (s) {
                return '<a class="chat-rail-link" href="#' + s.id + '" onclick="chatRailJump(event, \'' + s.id + '\')">' + escapeHtml(s.title) + '</a>';
            }).join('');
            rail.hidden = false;

            if (chatObserver) chatObserver.disconnect();
            chatObserver = new IntersectionObserver(chatRailOnObserve, {
                root: document.getElementById('chatPanelBody'),
                // 顶边按导航条高度偏移（CHAT_RAIL_OFFSET），底部让出 60% 视区，
                // 使"当前章节"只在顶部激活区判定，且同一时刻仅一个章节命中
                rootMargin: '-' + CHAT_RAIL_OFFSET + 'px 0px -60% 0px',
                threshold: 0
            });
            chatSectionEls.forEach(function (s) { chatObserver.observe(s.el); });
            setChatRailActive(chatSectionEls[0].id);
        }

        // 计算当前章节：越过激活线（容器顶部 + CHAT_RAIL_OFFSET）的最后一个章节。
        // 不依赖 IO 回调的 entries（点击跳转时目标恰好停在边界上，entries 不会上报它），
        // 而是遍历全部章节按实际位置判定，保证点击后高亮与滚动位置严格一致。
        function chatRailPickCurrent() {
            const body = document.getElementById('chatPanelBody');
            const zoneTop = body.getBoundingClientRect().top + CHAT_RAIL_OFFSET + 2;
            let current = null;
            for (let i = 0; i < chatSectionEls.length; i++) {
                if (chatSectionEls[i].el.getBoundingClientRect().top <= zoneTop) current = chatSectionEls[i].id;
            }
            return current || (chatSectionEls.length ? chatSectionEls[0].id : null);
        }

        function chatRailOnObserve() {
            const id = chatRailPickCurrent();
            if (id) setChatRailActive(id);
        }

        function setChatRailActive(id) {
            document.querySelectorAll('.chat-rail-link').forEach(function (a) {
                const on = a.getAttribute('href') === '#' + id;
                a.classList.toggle('active', on);
                if (on) a.setAttribute('aria-current', 'location');
                else a.removeAttribute('aria-current');
            });
        }

        // 导航点击：平滑滚动到目标章节（补偿导航条高度）
        function chatRailJump(event, id) {
            event.preventDefault();
            const el = document.getElementById(id);
            if (!el) return;
            const body = document.getElementById('chatPanelBody');
            const target = body.scrollTop + el.getBoundingClientRect().top - body.getBoundingClientRect().top - CHAT_RAIL_OFFSET;
            body.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
        }

        // 顶部横杠拖拽移动面板（等待 DOM 就绪后再绑定，避免脚本先于元素执行）
        document.addEventListener('DOMContentLoaded', function () {
            const panel = document.getElementById('chatPanel');
            const bar = document.getElementById('chatDragBar');
            if (!panel || !bar) return;
            let dragging = false, startX = 0, startY = 0, baseLeft = 0, baseTop = 0;
            bar.addEventListener('pointerdown', function (e) {
                if (e.button !== 0) return;
                // 将固定定位从 right/bottom 切换为 left/top，以当前位置为基准
                const r = panel.getBoundingClientRect();
                panel.style.right = 'auto';
                panel.style.bottom = 'auto';
                panel.style.left = r.left + 'px';
                panel.style.top = r.top + 'px';
                dragging = true;
                startX = e.clientX;
                startY = e.clientY;
                baseLeft = r.left;
                baseTop = r.top;
                try { bar.setPointerCapture(e.pointerId); } catch (err) {}
                document.body.style.userSelect = 'none';
            });
            bar.addEventListener('pointermove', function (e) {
                if (!dragging) return;
                let nx = baseLeft + (e.clientX - startX);
                let ny = baseTop + (e.clientY - startY);
                // 限制在视口内（保留 8px 边距）
                const maxX = Math.max(8, window.innerWidth - panel.offsetWidth - 8);
                const maxY = Math.max(8, window.innerHeight - panel.offsetHeight - 8);
                nx = Math.max(8, Math.min(nx, maxX));
                ny = Math.max(8, Math.min(ny, maxY));
                panel.style.left = Math.round(nx) + 'px';
                panel.style.top = Math.round(ny) + 'px';
            });
            function endDrag() {
                if (!dragging) return;
                dragging = false;
                document.body.style.userSelect = '';
            }
            bar.addEventListener('pointerup', endDrag);
            bar.addEventListener('pointercancel', endDrag);
        });

        // 右下角手柄拖拽调整面板大小 + 尺寸/位置记忆（localStorage 持久化，桌面端生效）
        (function () {
            const RECT_KEY = 'chat_panel_rect';
            const MIN_W = 360, MIN_H = 420, MARGIN = 26;
            function loadRect() {
                try { const v = JSON.parse(localStorage.getItem(RECT_KEY) || 'null'); return v && typeof v === 'object' ? v : null; } catch (e) { return null; }
            }
            function saveRect() {
                const panel = document.getElementById('chatPanel');
                if (!panel) return;
                const r = panel.getBoundingClientRect();
                const rect = { w: Math.round(r.width), h: Math.round(r.height) };
                // 仅当面板被拖拽移动过（内联 left/top 生效）才记忆位置，否则保持 right/bottom 贴角定位
                if (panel.style.left && panel.style.top) { rect.left = Math.round(r.left); rect.top = Math.round(r.top); }
                try { localStorage.setItem(RECT_KEY, JSON.stringify(rect)); } catch (e) {}
            }
            function isMobile() { return window.innerWidth <= 540; }

            // 恢复记忆的尺寸与位置（DOM 就绪后执行一次）
            function restoreRect() {
                const panel = document.getElementById('chatPanel');
                const rect = loadRect();
                if (!panel || isMobile() || !rect) return;
                const vw = window.innerWidth, vh = window.innerHeight;
                const w = Math.max(MIN_W, Math.min(rect.w, vw - MARGIN * 2));
                const h = Math.max(MIN_H, Math.min(rect.h, vh - MARGIN * 2));
                panel.style.width = w + 'px';
                panel.style.height = h + 'px';
                if (typeof rect.left === 'number' && typeof rect.top === 'number') {
                    const maxX = Math.max(8, vw - w - 8);
                    const maxY = Math.max(8, vh - h - 8);
                    panel.style.right = 'auto';
                    panel.style.bottom = 'auto';
                    panel.style.left = Math.max(8, Math.min(rect.left, maxX)) + 'px';
                    panel.style.top = Math.max(8, Math.min(rect.top, maxY)) + 'px';
                }
            }

            // 整圈缩放：四条边 + 四个角（data-x/data-y 标记拖动方向），按住任意边框/角改变大小
            function initResizeHandles() {
                const panel = document.getElementById('chatPanel');
                if (!panel) return;
                const handles = document.querySelectorAll('.chat-resize');
                if (!handles.length) return;
                let resizing = null; // { x, y, base, sx, sy, moved }
                function onDown(e) {
                    if (e.button !== 0 || isMobile()) return;
                    const handle = e.currentTarget;
                    const x = handle.getAttribute('data-x'); // 'none' | 'w' | 'e'
                    const y = handle.getAttribute('data-y'); // 'none' | 'n' | 's'
                    const r = panel.getBoundingClientRect();
                    // moved：面板此前已被拖拽移动（内联 left/top 生效）。
                    // 未移动的面板保持 right/bottom 贴角锚定：只缩放 w/n 侧时才固化为 left/top，
                    // 纯 e/s/se 缩放保持锚定，浏览器窗口变化时面板仍能自动贴角。
                    const moved = !!(panel.style.left && panel.style.top);
                    if (!moved && (x === 'w' || y === 'n')) {
                        panel.style.right = 'auto';
                        panel.style.bottom = 'auto';
                        panel.style.left = r.left + 'px';
                        panel.style.top = r.top + 'px';
                    }
                    resizing = { x, y, base: { left: r.left, top: r.top, right: r.right, bottom: r.bottom }, sx: e.clientX, sy: e.clientY, moved: moved || x === 'w' || y === 'n' };
                    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
                    document.body.style.userSelect = 'none';
                    e.preventDefault();
                }
                function onMove(e) {
                    if (!resizing) return;
                    const s = resizing, base = s.base, dx = e.clientX - s.sx, dy = e.clientY - s.sy;
                    const vw = window.innerWidth, vh = window.innerHeight;
                    // 被拖动的一侧在最小尺寸与视口内夹取；另一侧保持基准位置不动（对角/对边同时夹取）
                    let L = base.left, R = base.right, T = base.top, B = base.bottom;
                    if (s.x === 'w') L = Math.max(8, Math.min(base.left + dx, base.right - MIN_W));
                    else if (s.x === 'e') R = Math.max(base.left + MIN_W, Math.min(base.right + dx, vw - 8));
                    if (s.y === 'n') T = Math.max(8, Math.min(base.top + dy, base.bottom - MIN_H));
                    else if (s.y === 's') B = Math.max(base.top + MIN_H, Math.min(base.bottom + dy, vh - 8));
                    if (s.moved) {
                        panel.style.left = Math.round(L) + 'px';
                        panel.style.top = Math.round(T) + 'px';
                    }
                    panel.style.width = Math.round(R - L) + 'px';
                    panel.style.height = Math.round(B - T) + 'px';
                }
                function endResize() {
                    if (!resizing) return;
                    resizing = null;
                    document.body.style.userSelect = '';
                    saveRect();
                }
                handles.forEach(function (h) {
                    h.addEventListener('pointerdown', onDown);
                    h.addEventListener('pointermove', onMove);
                    h.addEventListener('pointerup', endResize);
                    h.addEventListener('pointercancel', endResize);
                });
            }

            document.addEventListener('DOMContentLoaded', restoreRect);
            document.addEventListener('DOMContentLoaded', initResizeHandles);
            // 顶栏拖拽移动结束后也记忆位置（saveRect 仅在面板被移动过时记录位置）
            document.addEventListener('DOMContentLoaded', function () {
                const bar = document.getElementById('chatDragBar');
                if (bar) bar.addEventListener('pointerup', saveRect);
            });
        })();

        // 输入框自适应高度
        document.addEventListener('input', function (e) {
            if (e.target && e.target.id === 'chatInput') {
                e.target.style.height = 'auto';
                e.target.style.height = Math.min(e.target.scrollHeight, 110) + 'px';
            }
        });

    </script>
    <!-- AI 解题助手 -->
    <button class="chat-fab" id="chatFab" onclick="toggleChatPanel()" title="AI 解题助手" aria-label="打开 AI 解题助手">
        <i class="fas fa-comments"></i>
        <span class="chat-fab-badge"></span>
    </button>
    <div class="chat-panel" id="chatPanel" role="dialog" aria-label="AI 解题助手">
        <div class="chat-panel-dragbar" id="chatDragBar" title="按住拖动面板"></div>
        <div class="chat-panel-header">
            <div class="chat-panel-title"><i class="fas fa-robot"></i> AI 解题助手</div>
            <div class="chat-panel-actions">
                <button onclick="clearChat()" title="清空对话"><i class="fas fa-trash-can"></i></button>
                <button onclick="toggleChatPanel()" title="收起"><i class="fas fa-minus"></i></button>
            </div>
        </div>
        <div class="chat-panel-body" id="chatPanelBody">
            <nav class="chat-rail" id="chatRail" aria-label="本页导航" hidden>
                <div class="chat-rail-title">On this page</div>
                <div class="chat-rail-links" id="chatRailLinks"></div>
            </nav>
            <div class="chat-msgs" id="chatMsgs">
                <div class="chat-msg chat-msg--ai">
                    <div class="chat-msg-avatar"><i class="fas fa-robot"></i></div>
                    <div class="chat-msg-content">你好，我是 AI 解题助手。把不会的题目或知识点发给我，我会给出分步讲解；也可以继续追问"为什么"或"再讲细一点"。</div>
                </div>
            </div>
        </div>
        <div class="chat-suggest" id="chatSuggest">
            <button onclick="quickExplain()">分步讲解当前知识点</button>
            <button onclick="fillChatInput('结合这道题给我出一道相似的练习题，并给出解析')">出一道练习题</button>
            <button onclick="fillChatInput('总结一下这个知识点的核心考点和易错点')">总结考点</button>
        </div>
        <div class="chat-panel-input">
            <textarea id="chatInput" placeholder="输入题目或追问…（Enter 发送，Shift+Enter 换行）" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
            <button class="chat-send-btn" id="chatSendBtn" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
        </div>
        <!-- 整圈缩放热区：四条边 + 四个角，data-x/data-y 标记该手柄拖动的方向（none 表示该侧不动） -->
        <div class="chat-resize chat-resize--n"  data-x="none" data-y="n"></div>
        <div class="chat-resize chat-resize--s"  data-x="none" data-y="s"></div>
        <div class="chat-resize chat-resize--e"  data-x="e" data-y="none"></div>
        <div class="chat-resize chat-resize--w"  data-x="w" data-y="none"></div>
        <div class="chat-resize chat-resize--nw" data-x="w" data-y="n"></div>
        <div class="chat-resize chat-resize--ne" data-x="e" data-y="n"></div>
        <div class="chat-resize chat-resize--sw" data-x="w" data-y="s"></div>
        <div class="chat-resize chat-resize--se" data-x="e" data-y="s"></div>
        <div class="chat-resize-handle" id="chatResizeHandle" title="拖拽边框或右下角调整大小" aria-hidden="true"><i class="fas fa-up-right-and-down-left-from-center"></i></div>
    </div>

    <!-- 错题本弹层 -->
    <div class="overlay" id="mistakeOverlay" hidden>
        <div class="overlay-panel" role="dialog" aria-label="错题本">
            <div class="overlay-header">
                <div class="overlay-title"><i class="fas fa-book-medical" style="color:var(--primary)"></i> 错题本 <span class="overlay-count" id="mistakeCount"></span></div>
                <div class="overlay-actions">
                    <button class="chip" id="mistakeFilterBtn" onclick="toggleMistakeFilter()">未复习</button>
                    <button class="overlay-close" onclick="closeOverlay('mistakeOverlay')" title="关闭"><i class="fas fa-xmark"></i></button>
                </div>
            </div>
            <div class="overlay-body" id="mistakeList"></div>
        </div>
    </div>

    <!-- 学情诊断弹层 -->
    <div class="overlay" id="diagOverlay" hidden>
        <div class="overlay-panel overlay-panel--wide" role="dialog" aria-label="学情诊断">
            <div class="overlay-header">
                <div class="overlay-title"><i class="fas fa-chart-line" style="color:var(--primary)"></i> 学情诊断</div>
                <div class="overlay-actions">
                    <button class="chip" onclick="openDiagnostics()"><i class="fas fa-rotate"></i> 重新诊断</button>
                    <button class="chip" onclick="exportDiagnostics()"><i class="fas fa-download"></i> 导出报告</button>
                    <button class="overlay-close" onclick="closeOverlay('diagOverlay')" title="关闭"><i class="fas fa-xmark"></i></button>
                </div>
            </div>
            <div class="overlay-body" id="diagBody"></div>
        </div>
    </div>

</body>
</html>
