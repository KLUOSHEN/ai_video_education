<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栈知映 · 视频播放</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="mdrender.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #4F6BF0;
            --primary-light: #6D83F5;
            --primary-dark: #3B4FE0;
            --primary-soft: #EEF2FF;
            --cyan: #22C3E6;
            --accent: #F59E0B;
            --success: #16A34A;
            --danger: #DC2626;
            --bg: #F7F9FC;
            --bg-card: #FFFFFF;
            --bg-dark: #0B1220;
            --ink-light: #E6EDF7;
            --ink-dim: #8CA3C0;
            --border: #E2E8F0;
            --border-focus: #C7D2FE;
            --text: #0F172A;
            --text-dim: #475569;
            --text-muted: #64748B;
            --ease-out: cubic-bezier(.23,1,.32,1);
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* ── 顶栏 ── */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 24px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px) saturate(180%);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .topbar-logo i {
            font-size: 20px;
            color: var(--primary);
            background: rgba(79,107,240,0.12);
            padding: 8px;
            border-radius: 10px;
        }
        .topbar-logo span {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
        }
        .topbar-search {
            flex: 1;
            max-width: 480px;
            position: relative;
            margin: 0 auto;
        }
        .topbar-search input {
            width: 100%;
            height: 40px;
            padding: 0 44px 0 16px;
            background: var(--bg);
            border: 1.5px solid #e6edf4;
            border-radius: 24px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            font-family: inherit;
            transition: 0.2s;
        }
        .topbar-search input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79,107,240,0.12);
            background: #fff;
        }
        .topbar-search input::placeholder { color: var(--text-muted); }
        .topbar-search button {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .topbar-search button:hover { background: var(--primary-light); }
        .topbar-nav {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .topbar-nav button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #e6edf4;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .topbar-nav button:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }

        /* ── 主布局 ── */
        .main-layout {
            display: flex;
            gap: 0;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px;
        }
        .player-col {
            flex: 1;
            min-width: 0;
        }
        .sidebar-col {
            width: 340px;
            flex-shrink: 0;
            padding-left: 24px;
        }

        /* ── 视频播放器区域 ── */
        .player-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
            margin-bottom: 20px;
            cursor: pointer;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
        }
        .player-poster {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(800px 400px at 50% 0%, rgba(79,107,240,.30), transparent 70%), linear-gradient(160deg, #0B1220 0%, #12203C 55%, #0B1220 100%);
            position: relative;
        }
        .player-poster-inner {
            text-align: center;
            z-index: 1;
        }
        .player-poster-inner i {
            font-size: 80px;
            color: rgba(230,237,247,0.25);
            transition: 0.3s;
        }
        .player-container:hover .player-poster-inner i { color: rgba(230,237,247,0.85); transform: scale(1.1); }
        .player-poster-inner p {
            margin-top: 16px;
            font-size: 15px;
            color: var(--ink-dim);
            letter-spacing: 0.5px;
        }

        /* 播放覆盖层 */
        .player-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 60px 20px 16px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .player-progress {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            touch-action: none;          /* 触摸拖动 */
            user-select: none;
            -webkit-user-select: none;
        }
        /* 用伪元素扩大点击/拖拽热区，不改变进度条自身尺寸 */
        .player-progress::before {
            content: '';
            position: absolute;
            top: -10px;
            bottom: -10px;
            left: 0;
            right: 0;
        }
        .player-progress.dragging { cursor: grabbing; }
        .player-progress.dragging .player-progress-fill { transition: none; }
        .player-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
            position: relative;
        }
        .player-progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 14px;
            height: 14px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .player-container:hover .player-progress-fill::after { opacity: 1; }
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .player-controls-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .player-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .player-btn:hover { background: rgba(255,255,255,0.1); }
        .player-btn.play-btn {
            width: 44px;
            height: 44px;
            font-size: 22px;
            background: rgba(255,255,255,0.15);
        }
        .player-time {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
            font-variant-numeric: tabular-nums;
        }
        .player-controls-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-volume {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── 视频信息 ── */
        .video-info-section {
            margin-bottom: 24px;
        }
        .video-info-section h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .video-meta-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .video-meta-chip {
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 14px;
            background: var(--bg-card);
            color: var(--text-dim);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .video-meta-chip i { color: var(--primary); font-size: 11px; }
        .video-desc {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.7;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
        }
        .video-desc:hover { border-color: var(--border-focus); }

        /* ── 字幕区 ── */
        .subtitle-bar {
            text-align: center;
            padding: 12px 0;
            font-size: 16px;
            color: var(--ink-light);
            background: var(--bg-dark);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(140,163,192,.18);
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #subtitleText { transition: opacity .15s ease; }

        /* ── 右侧：场景导航 ── */
        .sidebar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 14px;
        }
        .scene-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .scene-item {
            display: flex;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .scene-item:hover { background: var(--bg-card); border-color: var(--border); }
        .scene-item.active { background: var(--bg-card); border-color: var(--primary); }
        .scene-thumb {
            width: 100px;
            height: 56px;
            border-radius: 8px;
            background: linear-gradient(135deg, #e8f0fe, #d8e4fa);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .scene-thumb i { color: rgba(79,107,240,0.18); font-size: 20px; }
        .scene-item.active .scene-thumb i { color: var(--primary); }
        .scene-info { flex: 1; min-width: 0; }
        .scene-info .scene-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .scene-info .scene-dur {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── 知识测评 ── */
        .quiz-section {
            margin-top: 8px;
        }
        .quiz-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px 26px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            transition: 0.2s;
        }
        .quiz-card:hover { border-color: var(--border-focus); }
        .quiz-card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 18px;
        }
        .quiz-num {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quiz-question {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.6;
            padding-top: 4px;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 44px;
        }
        .quiz-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1.5px solid #e6edf4;
            cursor: pointer;
            transition: all 0.18s;
            background: #FBFCFE;
        }
        .quiz-option:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
            transform: translateX(3px);
        }
        .quiz-option.selected {
            border-color: var(--primary);
            background: #eef5ff;
            box-shadow: 0 0 0 3px rgba(79,107,240,0.1);
        }
        .quiz-option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }
        .quiz-option.wrong {
            border-color: #f44336;
            background: #ffebee;
            box-shadow: 0 0 0 3px rgba(244,67,54,0.08);
        }
        .quiz-option-label {
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 8px;
            background: #ecf3ff;
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.18s;
        }
        .quiz-option.selected .quiz-option-label {
            background: var(--primary);
            color: #fff;
        }
        .quiz-option.correct .quiz-option-label {
            background: #4caf50;
            color: #fff;
        }
        .quiz-option.wrong .quiz-option-label {
            background: #f44336;
            color: #fff;
        }
        .quiz-option-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
        }
        .quiz-feedback {
            padding: 10px 16px;
            margin-left: 44px;
            margin-top: 8px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }
        .quiz-feedback.correct-fb {
            background: #e8f5e9;
            color: #2e7d32;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-feedback.wrong-fb {
            background: #ffebee;
            color: #c62828;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-score {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .quiz-score-val {
            font-weight: 700;
            color: var(--primary);
            font-size: 18px;
        }
        .quiz-reset {
            padding: 8px 20px;
            border-radius: 20px;
            background: #fff;
            border: 1px solid #e6edf4;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            font-family: inherit;
        }
        .quiz-reset:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .quiz-explanation {
            padding: 12px 16px;
            margin-left: 44px;
            margin-top: 6px;
            border-radius: 10px;
            background: #f8fafd;
            border-left: 4px solid var(--primary);
            font-size: 13px;
            color: #3d517e;
            line-height: 1.65;
            display: none;
        }
        .quiz-card.answered .quiz-explanation {
            display: block;
        }

        /* ── 搜索无结果 ── */
        .search-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 40px 20px;
        }
        .search-hero i { font-size: 72px; color: rgba(79,107,240,0.15); margin-bottom: 20px; }
        .search-hero h2 { font-size: 22px; color: var(--text-dim); font-weight: 400; margin-bottom: 8px; }
        .search-hero p { font-size: 14px; color: var(--text-muted); max-width: 500px; }

        /* ── 参赛增强：背景光晕 + 扫描光带 ── */
        body {
            background:
                radial-gradient(1100px 560px at 12% -10%, rgba(79,107,240,.10), transparent 60%),
                radial-gradient(800px 480px at 90% -5%, rgba(109,131,245,.08), transparent 55%),
                var(--bg);
        }
        body::after {
            content: '';
            position: fixed;
            left: -10%;
            width: 120%;
            height: 26vh;
            top: -36vh;
            background: linear-gradient(180deg, transparent, rgba(109,131,245,.06), transparent);
            pointer-events: none;
            z-index: 0;
            animation: scanLine 16s linear infinite;
        }
        @keyframes scanLine { 0% { transform: translateY(0); } 100% { transform: translateY(175vh); } }

        /* ── 参赛增强：滚动条 ── */
        *::-webkit-scrollbar { width: 8px; height: 8px; }
        *::-webkit-scrollbar-thumb { background: #C7D2FE; border-radius: 8px; }
        *::-webkit-scrollbar-thumb:hover { background: #9dbdf5; }
        *::-webkit-scrollbar-track { background: transparent; }

        /* ── 参赛增强：logo 呼吸 ── */
        .topbar-logo i { animation: iconGlow 3.4s ease-in-out infinite; }
        @keyframes iconGlow {
            0%, 100% { box-shadow: 0 0 0 rgba(79,107,240,0); }
            50% { box-shadow: 0 0 16px rgba(79,107,240,.35); }
        }

        /* ── 参赛增强：播放器光晕 ── */
        .player-container { transition: box-shadow .3s, transform .3s; }
        .player-container:hover { box-shadow: 0 6px 44px rgba(79,107,240,.35); transform: translateY(-2px); }
        .player-btn.play-btn { transition: box-shadow .25s, transform .25s, background .25s; }
        .player-btn.play-btn:hover { box-shadow: 0 0 26px rgba(79,107,240,.5); transform: scale(1.06); }

        /* ── 参赛增强：卡片 hover 上浮 ── */
        .scene-item { position: relative; }
        .scene-item::before {
            content: '';
            position: absolute;
            left: 0; top: 24%; bottom: 24%;
            width: 3px;
            border-radius: 2px;
            background: linear-gradient(180deg, var(--primary), var(--primary-light));
            opacity: 0;
            transition: opacity .2s;
        }
        .scene-item:hover { transform: translateX(2px); }
        .scene-item:hover::before { opacity: 1; }
        .quiz-card, .video-desc { transition: box-shadow .25s, transform .25s, border-color .25s; }
        .quiz-card:hover, .video-desc:hover { box-shadow: 0 6px 24px rgba(79,107,240,.10); transform: translateY(-2px); }

        /* ── AI 解题助手 ── */
        .chat-fab {
            position: fixed;
            right: 26px;
            bottom: 26px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 26px rgba(79,107,240,.4);
            transition: transform .25s, box-shadow .25s;
            z-index: 300;
        }
        .chat-fab:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 34px rgba(79,107,240,.5); }
        .chat-fab .chat-fab-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ef4444;
            border: 2px solid #fff;
        }

        .chat-panel {
            position: fixed;
            right: 26px;
            bottom: 26px;
            width: 480px;
            max-width: min(1200px, calc(100vw - 52px));
            height: min(660px, calc(100vh - 140px));
            min-width: 360px;
            min-height: 420px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 60px rgba(20,50,110,.22);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 310;
            transform: translateY(24px) scale(.96);
            opacity: 0;
            visibility: hidden;
            transition: transform .28s ease, opacity .28s ease, visibility .28s;
        }
        .chat-panel.open { transform: none; opacity: 1; visibility: visible; }
        /* 整圈边框缩放：四条边 + 四个角都是热区，悬停显示对应方向的光标并高亮边框，按住拖动即缩放。
           手柄在面板内层（overflow:hidden 不影响），7px 宽热区落在边框内侧，几乎与边框重合。 */
        .chat-resize {
            position: absolute;
            z-index: 6;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .chat-resize--n  { top: 0; left: 0; right: 0; height: 8px; cursor: n-resize; }
        .chat-resize--s  { bottom: 0; left: 0; right: 0; height: 8px; cursor: s-resize; }
        .chat-resize--e  { right: 0; top: 0; bottom: 0; width: 8px; cursor: e-resize; }
        .chat-resize--w  { left: 0; top: 0; bottom: 0; width: 8px; cursor: w-resize; }
        .chat-resize--nw { top: 0; left: 0; width: 18px; height: 18px; cursor: nwse-resize; }
        .chat-resize--ne { top: 0; right: 0; width: 18px; height: 18px; cursor: nesw-resize; }
        .chat-resize--sw { bottom: 0; left: 0; width: 18px; height: 18px; cursor: nesw-resize; }
        .chat-resize--se { bottom: 0; right: 0; width: 18px; height: 18px; cursor: nwse-resize; }
        /* 悬停时整条边框亮起蓝环，明确"此处可拖拽缩放" */
        .chat-resize:hover { background: rgba(79,107,240,.22); box-shadow: inset 0 0 0 1.5px rgba(79,107,240,.55); }
        /* 右下角图标仅作视觉提示（不拦截鼠标事件），缩到 16x16 角热区内，避免"点了图标却拖不动" */
        .chat-resize-handle {
            position: absolute;
            right: 1px;
            bottom: 1px;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a6bce0;
            font-size: 11px;
            pointer-events: none;
            z-index: 5;
        }
        /* 顶部"虚幻"拖拽横杠：半透明渐变 + 流动高光 */
        .chat-panel-dragbar {
            height: 18px;
            flex-shrink: 0;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, rgba(79,107,240,.03), rgba(79,107,240,.14) 50%, rgba(79,107,240,.03));
            border-bottom: 1px solid rgba(79,107,240,.10);
        }
        .chat-panel-dragbar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, transparent 25%, rgba(255,255,255,.6) 50%, transparent 75%);
            background-size: 240% 100%;
            background-position: 120% 0;
            animation: dragbar-sheen 3.6s linear infinite;
            pointer-events: none;
        }
        .chat-panel-dragbar:hover { background: linear-gradient(90deg, rgba(79,107,240,.06), rgba(79,107,240,.22) 50%, rgba(79,107,240,.06)); }
        .chat-panel-dragbar:active { cursor: grabbing; }
        @keyframes dragbar-sheen {
            0% { background-position: 120% 0; }
            100% { background-position: -120% 0; }
        }
        .chat-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--primary);
            color: #fff;
            flex-shrink: 0;
        }
        .chat-panel-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .chat-panel-title i { font-size: 17px; }
        .chat-panel-actions { display: flex; gap: 4px; }
        .chat-panel-actions button {
            width: 30px; height: 30px;
            border: none; border-radius: 8px;
            background: rgba(255,255,255,.16);
            color: #fff; cursor: pointer;
            font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s;
        }
        .chat-panel-actions button:hover { background: rgba(255,255,255,.3); }

        .chat-panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            display: flex;
            align-items: flex-start;
            background: var(--primary-soft);
        }
        .chat-msgs {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-msg {
            display: flex;
            gap: 10px;
            max-width: 92%;
            animation: chatIn .28s ease-out;
        }
        @keyframes chatIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .chat-msg--user { align-self: flex-end; flex-direction: row-reverse; }
        .chat-msg-avatar {
            width: 30px; height: 30px;
            min-width: 30px;
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; color: #fff;
        }
        .chat-msg--ai .chat-msg-avatar { background: linear-gradient(135deg, var(--primary), var(--primary-light)); }
        .chat-msg--user .chat-msg-avatar { background: linear-gradient(135deg, #7C5CF0, #A78BFA); }
        .chat-msg-content {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .chat-msg--ai .chat-msg-content {
            background: #fff;
            border: 1px solid var(--border);
            border-top-left-radius: 4px;
            color: var(--text);
        }
        .chat-msg--user .chat-msg-content {
            background: linear-gradient(135deg, #7C5CF0, #A78BFA);
            color: #fff;
            border-top-right-radius: 4px;
            white-space: pre-wrap;
        }
        .chat-msg-content .md-paragraph:first-child { margin-top: 0; }
        .chat-msg-content .md-paragraph:last-child { margin-bottom: 0; }
        /* 章节锚点：滚动时不被顶部导航条遮住 */
        .chat-msg--ai .chat-msg-content .md-heading { scroll-margin-top: 40px; }

        /* ── On this page 滚动导航（scrollspy） ── */
        .chat-rail {
            width: 132px;
            flex-shrink: 0;
            order: 2;
            position: sticky;
            top: 12px;                 /* 贴住面板内容区顶部 */
            margin-left: 12px;
            max-height: calc(100% - 24px);
            overflow-y: auto;
            border-left: 1px solid #e2eaf6;
            padding: 2px 0 4px 10px;
        }
        .chat-rail-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .7px;
            color: #9db0cd;
            margin-bottom: 8px;
            white-space: nowrap;
        }
        .chat-rail-links { display: flex; flex-direction: column; }
        .chat-rail-link {
            display: block;
            position: relative;
            padding: 5px 6px;
            margin: 2px 0;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.45;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color .2s, background .2s;
        }
        .chat-rail-link:hover { color: var(--primary); background: var(--primary-soft); }
        /* 高对比竖向指示条 */
        .chat-rail-link::before {
            content: '';
            position: absolute;
            left: -11px;
            top: 5px;
            bottom: 5px;
            width: 3px;
            border-radius: 2px;
            background: transparent;
            transition: background .2s, box-shadow .2s;
        }
        /* 当前章节：更重的字重 + 亮色背景 + 发光指示条 */
        .chat-rail-link.active {
            color: var(--primary);
            background: #e8f2ff;
            font-weight: 700;
        }
        .chat-rail-link.active::before {
            background: var(--primary);
            box-shadow: 0 0 8px rgba(79,107,240,.6);
        }

        .chat-panel-input {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            background: #fff;
            flex-shrink: 0;
        }
        .chat-panel-input textarea {
            flex: 1;
            border: 1.5px solid #e6edf4;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13.5px;
            font-family: inherit;
            resize: none;
            outline: none;
            color: var(--text);
            max-height: 110px;
            line-height: 1.5;
            background: #FBFCFE;
            transition: border-color .2s;
        }
        .chat-panel-input textarea:focus { border-color: var(--primary); background: #fff; }
        .chat-send-btn {
            width: 42px; height: 42px;
            min-width: 42px;
            border: none; border-radius: 12px;
            background: var(--primary);
            color: #fff; font-size: 15px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform .2s, box-shadow .2s;
        }
        .chat-send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(79,107,240,.35); }
        .chat-send-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .chat-suggest {
            display: flex;
            gap: 8px;
            padding: 0 14px 10px;
            flex-wrap: wrap;
            background: #fff;
            flex-shrink: 0;
        }
        .chat-suggest button {
            padding: 5px 12px;
            border-radius: 14px;
            border: 1px solid #d8e6ff;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 12px;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
        }
        .chat-suggest button:hover { background: var(--primary-soft); border-color: var(--primary); }

        /* ── 响应式 ── */
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; padding: 12px 16px; }
            .sidebar-col { width: 100%; padding-left: 0; padding-top: 24px; }
            .topbar-search { max-width: 300px; }
            .topbar-logo span { display: none; }
        }
        @media (max-width: 540px) {
            .topbar { padding: 10px 12px; gap: 8px; }
            .topbar-search { max-width: 200px; }
            .topbar-search input { height: 36px; font-size: 13px; }
            .video-info-section h1 { font-size: 18px; }
            .chat-panel { right: 16px; bottom: 16px; left: 16px; width: auto; height: calc(100vh - 140px); min-width: 0; min-height: 0; }
            .chat-panel-dragbar { display: none; }
            .chat-resize, .chat-resize-handle { display: none; }
            .chat-fab { right: 18px; bottom: 18px; }
        }

        /* ── 通用弹层（错题本 / 学情诊断） ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 30, 60, 0.45);
            backdrop-filter: blur(4px);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .overlay[hidden] { display: none; }
        .overlay-panel {
            width: min(720px, 100%);
            max-height: 85vh;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 24px 80px rgba(10, 30, 70, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .overlay-panel--wide { width: min(880px, 100%); }
        /* ══ UI 优化：弹层入场 + 按压反馈 + 减少动态效果 ══ */
        .overlay { animation: overlayScrimIn .2s ease-out; }
        .overlay-panel { animation: overlayPopIn .25s var(--ease-out); }
        @keyframes overlayScrimIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes overlayPopIn { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
        button:active { transform: scale(.97); }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
        .overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .overlay-title { font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .overlay-count { font-size: 13px; font-weight: 500; color: var(--text-muted); }
        .overlay-actions { display: flex; align-items: center; gap: 8px; }
        .overlay-close {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid var(--border); background: #fff; color: var(--text-dim);
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .overlay-close:hover { color: #e0555a; border-color: #e0555a; background: #fff5f5; }
        .overlay-body { padding: 18px 20px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .overlay-empty { padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 14px; line-height: 1.8; }
        .chip {
            padding: 6px 14px; border-radius: 16px;
            border: 1px solid var(--border); background: #fff; color: var(--text-dim);
            cursor: pointer; font-size: 12.5px; font-family: inherit; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
        .quiz-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        /* 测验卡片底部操作区（举一反三） */
        .quiz-card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }

        /* 错题卡片 */
        .mistake-card {
            border: 1px solid var(--border); border-radius: 12px;
            padding: 14px 16px; background: #fff;
            box-shadow: 0 2px 10px rgba(20, 50, 110, 0.05);
        }
        .mistake-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
        .mistake-head-right { display: flex; align-items: center; gap: 8px; }
        .mistake-date { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
        .mistake-topic { font-size: 12px; font-weight: 600; color: var(--primary); background: var(--primary-soft); padding: 3px 10px; border-radius: 12px; }
        .mistake-cause { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
        .cause-concept { background: #fff3e6; color: #d97b1a; }
        .cause-careless { background: #eaf6ff; color: #1a7fd9; }
        .cause-method { background: #f0ecff; color: #6f4fd8; }
        .cause-misread { background: #eafff3; color: #1a9c5c; }
        .cause-unknown { background: #f2f4f8; color: var(--text-muted); }
        .cause-pending { background: #fff8e1; color: #c99a13; }
        .cause-confusion { background: #fdf1ff; color: #a44fd8; }
        .cause-calc { background: #fff4e0; color: #cf8a12; }
        .mistake-cause-label { font-weight: 600; color: #3a4a6e; }
        .mistake-q { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.7; margin-bottom: 8px; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
        .mistake-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
        .mistake-opt { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); line-height: 1.5; }
        .mistake-opt.ok { border-color: #b5e3c4; background: #f0fbf4; }
        .mistake-opt.wrong { border-color: #f0b8b8; background: #fff2f2; }
        .mistake-opt-key { width: 20px; height: 20px; min-width: 20px; border-radius: 50%; background: #F1F5F9; color: var(--text-dim); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
        .mistake-opt.ok .mistake-opt-key { background: #1a9c5c; color: #fff; }
        .mistake-opt.wrong .mistake-opt-key { background: #d94a4a; color: #fff; }
        .mistake-opt-tag { font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-left: auto; flex-shrink: 0; font-weight: 500; }
        .mistake-opt-tag.ok { background: #e8f8ee; color: #1a9c5c; }
        .mistake-opt-tag.wrong { background: #ffecec; color: #d94a4a; }
        .mistake-ans { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .mistake-badge { font-size: 12px; padding: 3px 10px; border-radius: 8px; }
        .mistake-badge.bad { background: #ffecec; color: #d94a4a; }
        .mistake-badge.good { background: #e8f8ee; color: #1a9c5c; }
        .mistake-pending { font-size: 12.5px; color: var(--text-muted); padding: 6px 0; }
        .mistake-cause-text { font-size: 13px; color: #5a6a8c; line-height: 1.6; margin-bottom: 6px; }
        .mistake-suggestion {
            font-size: 13px; color: var(--text);
            background: var(--primary-soft); border-left: 3px solid var(--primary);
            padding: 8px 12px; border-radius: 0 8px 8px 0; line-height: 1.6;
        }
        .mistake-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .mistake-reviewed { font-size: 12px; color: var(--success); }
        .mistake-flag { font-size: 11.5px; color: #B45309; background: #FEF3C7; border: 1px solid #FDE68A; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
        .mistake-flag i { font-size: 6px; }
        .rework-box { display: flex; gap: 8px; margin-top: 10px; }
        .rework-input {
            flex: 1; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: 10px;
            font-size: 13px; outline: none; font-family: inherit;
        }
        .rework-input:focus { border-color: var(--primary); }

        /* 学情诊断 */
        .diag-overview { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .diag-stat { text-align: center; background: #f8fafd; border: 1px solid var(--border); border-radius: 12px; padding: 14px 6px; }
        .diag-stat-num { font-size: 22px; font-weight: 800; color: var(--text); }
        .diag-stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .diag-section-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 14px 0 10px; display: flex; align-items: center; gap: 6px; }
        .diag-topic { margin-bottom: 10px; }
        .diag-topic-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--text); }
        .diag-bar { height: 8px; background: #F1F5F9; border-radius: 4px; overflow: hidden; }
        .diag-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
        .diag-weak { background: #fff8f6; border: 1px solid #ffddd2; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
        .diag-weak-head { font-size: 13.5px; font-weight: 600; color: #c05a2b; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .diag-weak-sub { font-size: 12px; font-weight: 400; color: #a06a50; }
        .diag-weak-sugg { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.6; }
        .diag-none { font-size: 13px; color: var(--text-muted); padding: 8px 0; }
        .diag-trend { display: flex; align-items: flex-end; gap: 10px; padding: 12px 4px 0; overflow-x: auto; }
        .diag-trend-day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
        .diag-trend-bar { width: 22px; background: linear-gradient(180deg, var(--primary), var(--primary-light)); border-radius: 4px 4px 0 0; min-height: 4px; }
    </style>

<body>

    <!-- 顶栏 -->
    <div class="topbar">
        <div class="topbar-logo" onclick="location.href='search.html'">
            <i class="fas fa-wand-magic-sparkles"></i>
            <span>栈知映</span>
        </div>
        <div class="topbar-search">
            <input type="text" id="topSearch" placeholder="搜索题目…" onkeydown="if(event.key==='Enter') doTopSearch()">
            <button onclick="doTopSearch()"><i class="fas fa-search"></i></button>
        </div>
        <div class="topbar-nav">
            <button onclick="location.href='search.html'" title="主页"><i class="fas fa-home"></i></button>
        </div>
    </div>

    <!-- 主布局 -->
    <div class="main-layout" id="mainLayout">

        <!-- 左侧：播放器 + 信息 -->
        <div class="player-col">

            <!-- 搜索空状态 -->
            <div class="search-hero" id="searchHero">
                <i class="fas fa-search"></i>
                <h2>搜索题目，开始学习</h2>
                <p style="margin-top:4px;">输入任意计算机知识点，AI 自动生成教学视频</p>
                <div class="topbar-search" style="margin-top:24px; max-width:440px;">
                    <input type="text" id="heroSearch" placeholder="例如：快速排序算法详解…" onkeydown="if(event.key==='Enter') doHeroSearch()">
                    <button onclick="doHeroSearch()"><i class="fas fa-search"></i></button>
                </div>
                <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
                    <span class="video-meta-chip" onclick="loadVideo('TCP 三次握手与四次挥手过程')" style="cursor:pointer;">TCP 三次握手</span>
                    <span class="video-meta-chip" onclick="loadVideo('二叉树的遍历：前序中序后序层序')" style="cursor:pointer;">二叉树遍历</span>
                    <span class="video-meta-chip" onclick="loadVideo('进程与线程的区别及调度算法')" style="cursor:pointer;">进程与线程</span>
                </div>
            </div>

            <!-- 播放器面板（初始隐藏） -->
            <div id="playerPanel" style="display:none;">

                <!-- 视频播放器 -->
                <div class="player-container" id="playerContainer" onclick="togglePlay()">
                    <div class="player-poster" id="playerPoster">
                        <div class="player-poster-inner">
                            <i class="fas fa-play-circle" id="playIcon"></i>
                            <p>点击播放</p>
                        </div>
                    </div>
                    <div class="player-overlay">
                        <div class="player-progress" onclick="event.stopPropagation()">
                            <div class="player-progress-fill" id="progressFill"></div>
                        </div>
                        <div class="player-controls">
                            <div class="player-controls-left">
                                <button class="player-btn" onclick="event.stopPropagation();skipTime(-10)" title="后退 10 秒"><i class="fas fa-rotate-left"></i></button>
                                <button class="player-btn play-btn" id="playPauseBtn" onclick="event.stopPropagation();togglePlay()"><i class="fas fa-play"></i></button>
                                <button class="player-btn" onclick="event.stopPropagation();skipTime(10)" title="前进 10 秒"><i class="fas fa-rotate-right"></i></button>
                                <div class="player-volume" onclick="event.stopPropagation()">

        // 有后端时创建异步课程生成任务；直接打开 HTML 文件时保留本地演示数据。
        async function loadVideo(query) {
            if (location.protocol === 'file:') return loadLocalVideo(query);
            try {
                showGenerationState(query, 'AI 正在生成音频、课程视频和测评题…');
                const response = await fetch('/api/v1/generations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: query,
                        source: 'watch-page',
                        voice: { type: 'neutral', speed: 1 },
                        quiz: { types: ['choice', 'true_false', 'fill_blank'], difficulty: 'medium', count: 3 }
                    })
                });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error?.message || '创建生成任务失败');
                const result = await pollGeneration(payload.data);
                applyGeneratedLesson(query, payload.data.id, result);
            } catch (error) {
                console.warn('后端生成不可用，已切换为本地演示：', error);
                loadLocalVideo(query);
            }
        }

        function showGenerationState(query, message) {
            document.getElementById('searchHero').style.display = 'none';
            document.getElementById('playerPanel').style.display = 'block';
            document.getElementById('sidebarCol').style.display = 'block';
            document.getElementById('videoTitle').textContent = query;
            document.getElementById('videoDesc').textContent = message;
            document.getElementById('playerPoster').style.backgroundImage = 'linear-gradient(135deg, #152a52, var(--primary))';
            document.getElementById('quizContainer').innerHTML = '<div style="padding:18px;color:var(--text-muted)">正在生成教学测评，请稍候…</div>';
        }

        async function pollGeneration(task) {
            for (let attempt = 0; attempt < 90; attempt++) {
                const response = await fetch(task.statusUrl);
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error?.message || '无法获取生成状态');
                const info = payload.data;
                document.getElementById('videoDesc').textContent = `生成进度 ${info.progress || 0}%：正在准备“${document.getElementById('videoTitle').textContent}”`;
                if (info.status === 'completed') {
                    const resultResponse = await fetch(info.resultUrl);
                    const resultPayload = await resultResponse.json();
                    if (!resultResponse.ok) throw new Error(resultPayload.error?.message || '无法读取生成结果');
                    return resultPayload.data;
                }
                if (info.status === 'failed') throw new Error(info.error?.message || '生成任务失败');
                await new Promise(resolve => setTimeout(resolve, 800));
            }
            throw new Error('生成超时，请稍后重试');
        }

        function applyGeneratedLesson(query, taskId, result) {
            const scenes = result.scenes || [];
            videoDB[taskId] = {
                title: result.topic?.title || query,
                subject: result.topic?.subject || '综合学习',
                duration: formatGeneratedDuration(scenes.reduce((sum, scene) => sum + (scene.durationSeconds || 0), 0) || 36),
                totalSec: scenes.reduce((sum, scene) => sum + (scene.durationSeconds || 0), 0) || 36,
                scenes: scenes.length || 1,
                views: '新生成',
                desc: `题目：${result.lessonPlan?.questionText || query}\n\n解题思路：${result.lessonPlan?.solutionOverview || '先提取题干条件，再分步骤推导并检验结论。'}\n\n讲解内容已覆盖题干展示、关键步骤标注、关系图/表格分析与同步音频解说。`,
                scenesList: scenes.map(scene => ({ name: `${scene.index}. ${scene.name}`, dur: formatGeneratedDuration(scene.durationSeconds || 12), visual: scene.visual })),
                subtitles: scenes.map(scene => scene.narration || scene.name)
            };
            loadLocalVideo(taskId);
            currentQuiz = (result.questions || []).map(question => ({
                id: question.id,
                q: question.content,
                opts: question.options || [],
                ans: question.options?.length ? question.options.indexOf(question.correctAnswer) : question.correctAnswer,
                exp: question.explanation,
                type: question.type
            }));
            quizState[taskId] = { answered: new Set(), score: 0, selections: {}, correctness: {} };
            renderQuiz();
            const poster = result.poster?.url || (result.video?.mimeType === 'image/svg+xml' ? result.video.url : null);
            if (poster) document.getElementById('playerPoster').style.backgroundImage = `linear-gradient(rgba(10,25,55,.15), rgba(10,25,55,.15)), url("${poster}")`;
            generatedAudioUrl = result.audio?.url || null;
            if (generatedAudioUrl) generatedAudio = new Audio(generatedAudioUrl);
        }

        function formatGeneratedDuration(seconds) {
            return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
        }

        function loadLocalVideo(query) {
            generatedAudio = null;
            generatedAudioUrl = null;
            // 模糊匹配
            let key = null;
            const qLower = query.toLowerCase();
            for (const k of Object.keys(videoDB)) {
                if (k.toLowerCase().includes(qLower) || qLower.includes(k.toLowerCase())) {
                    key = k; break;
                }
            }
            if (!key) {
                // 取第一个作为默认
                key = Object.keys(videoDB)[0];
            }

            currentVideoKey = key;
            const v = videoDB[key];
            totalDuration = v.totalSec;
            currentTime = 0;
            isPlaying = false;
            subtitleIndex = 0;

            // 显示播放面板，隐藏搜索英雄区
            document.getElementById('searchHero').style.display = 'none';
            document.getElementById('playerPanel').style.display = 'block';
            document.getElementById('sidebarCol').style.display = 'block';

            // 更新信息
            document.getElementById('videoTitle').textContent = v.title;
            document.getElementById('videoSubject').textContent = v.subject;
            document.getElementById('videoDuration').textContent = v.duration;
            document.getElementById('videoScenes').textContent = v.scenes + ' 个场景';
            document.getElementById('videoViews').textContent = v.views + ' 次观看';
            document.getElementById('videoDesc').textContent = v.desc;
            document.getElementById('totalTime').textContent = v.duration;

            // 更新顶栏搜索
            document.getElementById('topSearch').value = v.title;

            // 更新进度
            updateProgress();

            // 更新场景列表
            renderScenes(v);

            // 更新知识测评 —— 根据搜索词动态生成
            currentVideoKey = key;
            currentQuiz = generateQuiz(query);
            renderQuiz();

            // 停止之前的播放
            stopPlayback();
            document.getElementById('playIcon').className = 'fas fa-play-circle';
            document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
            document.getElementById('subtitleBar').style.display = 'none';
            subtitleVisible = false;
        }

        function renderScenes(v) {
            const list = document.getElementById('sceneList');
            list.innerHTML = v.scenesList.map((s, i) => `
                <div class="scene-item" id="scene-${i}" onclick="seekToScene(${i})">
                    <div class="scene-thumb"><i class="fas fa-chalkboard"></i></div>
                    <div class="scene-info">
                        <div class="scene-name">${s.name}</div>
                        <div class="scene-dur" title="${s.visual || ''}">${s.dur}${s.visual ? ' · ' + s.visual : ''}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderQuiz() {
            if (!currentQuiz) return;
            const container = document.getElementById('quizContainer');
            const key = quizKey();
            const state = quizState[key] || { answered: new Set(), score: 0, selections: {}, correctness: {} };
            const answered = state.answered;
            const total = currentQuiz.length;
            const score = state.score;

            // 更新得分
            document.getElementById('quizScore').textContent = answered.size === total ? score + ' / ' + total : '—';
            document.getElementById('quizSummary').textContent = answered.size === total
                ? (score === total ? '  🎉 全部正确！' : '  答题完成')
                : '（已答 ' + answered.size + '/' + total + '）';

            const labels = ['A', 'B', 'C', 'D'];
            container.innerHTML = currentQuiz.map((item, i) => `
                <div class="quiz-card${answered.has(i) ? ' answered' : ''}">
                    <div class="quiz-card-header">
                        <div class="quiz-num">${i + 1}</div>
                        <div class="quiz-question">${item.q}</div>
                    </div>
                    <div class="quiz-options">
                        ${item.type === 'fill_blank' ? `
                            <div style="display:flex;gap:8px;width:100%">
                                <input id="fill-${i}" aria-label="第 ${i + 1} 题答案" placeholder="输入答案" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--bg-card);color:var(--text)" ${answered.has(i) ? 'disabled' : ''}>
                                <button class="quiz-reset" onclick="submitFillAnswer('${key}', ${i})" ${answered.has(i) ? 'disabled' : ''}>提交</button>
                            </div>` : item.opts.map((opt, j) => {
                            let cls = '';
                            if (answered.has(i)) {
                                if (j === item.ans) cls = 'correct';
                                else if (j !== item.ans && quizState[key] && j === getSelectedIdx(key, i)) cls = 'wrong';
                            }
                            return `<div class="quiz-option${cls ? ' ' + cls : ''}"
                                onclick="selectOption('${key}', ${i}, ${j})">
                                <span class="quiz-option-label">${labels[j]}</span>
                                <span class="quiz-option-text">${opt}</span>
                            </div>`;
                        }).join('')}
                    </div>
                    ${answered.has(i) ? `
                    <div class="quiz-feedback ${isQuestionCorrect(key, i) ? 'correct-fb' : 'wrong-fb'}">
                        <i class="fas fa-${isQuestionCorrect(key, i) ? 'check-circle' : 'times-circle'}"></i>
                        ${isQuestionCorrect(key, i) ? '回答正确！' : (item.type === 'fill_blank' ? '请参考解析中的答案。' : '回答错误！正确答案是 ' + labels[item.ans] + '. ' + item.opts[item.ans])}
                    </div>
                    <div class="quiz-explanation">
                        <i class="fas fa-lightbulb" style="color:var(--primary);margin-right:6px;"></i>${item.exp || '暂无解析'}
                    </div>
                    ${item.type === 'fill_blank' ? '' : `
                    <div class="quiz-card-actions">
                        <button class="quiz-reset" onclick="genVariants(${i})" title="基于本题生成 2 道同知识点变式题"><i class="fas fa-repeat"></i>&nbsp;举一反三</button>
                    </div>`}` : ''}
                </div>
            `).join('');
        }

        function getSelectedIdx(videoKey, qIdx) {
            // We need to track which option was selected. Store it in quizState.
            if (!quizState[videoKey] || !quizState[videoKey].selections) return -1;
            return quizState[videoKey].selections[qIdx] ?? -1;
        }

        function isQuestionCorrect(videoKey, qIdx) {
            return Boolean(quizState[videoKey]?.correctness?.[qIdx]);
        }

        async function selectOption(videoKey, qIdx, optIdx) {
            if (!currentQuiz) return;
            if (quizState[videoKey]?.answered?.has(qIdx)) return;

            const item = currentQuiz[qIdx];
            const correct = item.ans;
            let isCorrect = optIdx === correct;
            try {
                const response = await fetch('/api/v1/attempts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-client-id': getClientId() },
                    body: JSON.stringify({
                        questionId: item.id || null,
                        taskId: window._currentTaskId || null,
                        topic: currentTopic(),
                        type: item.type || 'choice',
                        answer: item.type === 'choice' ? ['A', 'B', 'C', 'D'][optIdx] : item.opts[optIdx],
                        correct: isCorrect,
                        question: item.q,
                        correctAnswer: typeof correct === 'number' ? item.opts[correct] : String(correct),
                        options: item.opts || item.options || [],
                    })
                });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error?.message || '记录失败');
                isCorrect = payload.data.correct;
            } catch (error) { console.warn('答题记录失败，已使用本地结果：', error); }

            if (!quizState[videoKey]) quizState[videoKey] = { answered: new Set(), score: 0, selections: {}, correctness: {} };
            if (!quizState[videoKey].selections) quizState[videoKey].selections = {};
            if (!quizState[videoKey].correctness) quizState[videoKey].correctness = {};
            quizState[videoKey].selections[qIdx] = optIdx;
            quizState[videoKey].correctness[qIdx] = isCorrect;
            quizState[videoKey].answered.add(qIdx);
            if (isCorrect) quizState[videoKey].score++;

            renderQuiz();
        }

        async function submitFillAnswer(videoKey, qIdx) {
            if (quizState[videoKey]?.answered?.has(qIdx)) return;
            const answer = document.getElementById('fill-' + qIdx).value.trim();
            if (!answer) return;
            const item = currentQuiz[qIdx];
            let isCorrect = answer.toLowerCase() === String(item.ans).toLowerCase();
            try {
                const response = await fetch('/api/v1/attempts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-client-id': getClientId() },
                    body: JSON.stringify({
                        questionId: item.id || null,
                        taskId: window._currentTaskId || null,
                        topic: currentTopic(),
                        type: item.type || 'fill_blank',
                        answer,
                        correct: isCorrect,
                        question: item.q,
                        correctAnswer: String(item.ans),
                        options: item.opts || item.options || [],
                    })
                });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error?.message || '记录失败');
                isCorrect = payload.data.correct;
            } catch (error) { console.warn('答题记录失败，已使用本地结果：', error); }
            if (!quizState[videoKey]) quizState[videoKey] = { answered: new Set(), score: 0, selections: {}, correctness: {} };
            quizState[videoKey].selections[qIdx] = answer;
            quizState[videoKey].correctness[qIdx] = isCorrect;
            quizState[videoKey].answered.add(qIdx);
            if (isCorrect) quizState[videoKey].score++;
            renderQuiz();
        }

        function resetQuiz() {
            const key = quizKey();
            quizState[key] = { answered: new Set(), score: 0, selections: {}, correctness: {} };
            // AI 生成的题目保留原题；本地演示题才重新随机生成。
            if (!currentQuiz?._ai && !currentQuiz?.some(item => item.id)) currentQuiz = generateQuiz(key);
            renderQuiz();
        }

        // ===== 学情：客户端标识 / 知识点（答题采集） =====
        function getClientId() {
            let id = localStorage.getItem('zx_client_id');
            if (!id) {
                id = 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
                localStorage.setItem('zx_client_id', id);
            }
            return id;
        }
        function currentTopic() {
            const text = (videoQuery || document.getElementById('topSearch')?.value || currentVideoKey || '综合学习').trim();
            return { title: text.slice(0, 60), subject: '综合学习' };
        }
        // 测验状态统一键：本地演示模式用 currentVideoKey，幻灯片模式用 task_id
        function quizKey() { return currentVideoKey || window._currentTaskId || 'local'; }

        // ===== 错题本 =====
        let mistakeFilter = 'false';
        let _mistakeCache = [];

        function closeOverlay(id) { document.getElementById(id).hidden = true; }
        function openMistakes() { document.getElementById('mistakeOverlay').hidden = false; loadMistakes(); }
        function toggleMistakeFilter() {
            mistakeFilter = mistakeFilter === 'false' ? 'all' : 'false';
            document.getElementById('mistakeFilterBtn').textContent = mistakeFilter === 'false' ? '未复习' : '全部';
            loadMistakes();
        }

        async function loadMistakes() {
            const list = document.getElementById('mistakeList');
            list.innerHTML = '<div class="overlay-empty"><i class="fas fa-spinner fa-spin"></i> 加载中…</div>';
            try {
                const res = await fetch('/api/v1/mistakes?reviewed=' + mistakeFilter, { headers: { 'x-client-id': getClientId() } });
                const payload = await res.json();
                if (!res.ok) throw new Error(payload.error?.message || '加载失败');
                const items = payload.data.items;
                _mistakeCache = items;
                document.getElementById('mistakeCount').textContent = items.length ? '(' + items.length + ')' : '';
                if (!items.length) {
                    list.innerHTML = '<div class="overlay-empty"><i class="fas fa-inbox"></i><br>暂无' + (mistakeFilter === 'false' ? '待复习' : '') + '错题，去"知识测评"答几道题吧。</div>';
                    return;
                }
                list.innerHTML = items.map((m) => `
                    <div class="mistake-card" id="mistake-${m.id}">
                        <div class="mistake-card-head">
                            <span class="mistake-topic">${escapeHtml(m.topic?.title || '未分类')}</span>
                            <span class="mistake-head-right">
                                <span class="mistake-date">${formatMistakeDate(m.createdAt)}</span>
                                <span class="mistake-cause ${m.cause ? 'cause-' + m.cause : 'cause-pending'}">${m.causeLabel || '归因中…'}</span>
                            </span>
                        </div>
                        <div class="mistake-q">${escapeHtml(m.question) || '（无题干）'}</div>
                        ${renderMistakeOptions(m)}
                        <div class="mistake-ans">
                            <span class="mistake-badge bad">你的答案：${escapeHtml(m.userAnswer) || '（空）'}</span>
                            <span class="mistake-badge good">正确答案：${escapeHtml(m.correctAnswer) || '（空）'}</span>
                        </div>
                        ${m.pending
                            ? '<div class="mistake-pending"><i class="fas fa-spinner fa-spin"></i> AI 归因分析中…</div>'
                            : `
                        <div class="mistake-cause-text"><span class="mistake-cause-label">错误原因：</span>${escapeHtml(m.causeText || '')}</div>
                        <div class="mistake-suggestion"><i class="fas fa-lightbulb"></i> ${escapeHtml(m.suggestion || '')}</div>`}
                        <div class="mistake-actions">
                            <button class="chip" onclick="reworkMistake('${m.id}')">${m.reviewed ? '再练一次' : '重做本题'}</button>
                            ${!m.pending ? '<button class="chip" onclick="reAnalyzeMistake(\'' + m.id + '\')" title="用更新的归因模型重新分析"><i class="fas fa-rotate"></i> 重新归因</button>' : ''}
                            ${m.reviewed ? '<span class="mistake-reviewed"><i class="fas fa-check-circle"></i> ' + (m.reviewCorrect ? '复习通过' : '复习待巩固') + '</span>' : '<span class="mistake-flag"><i class="fas fa-circle"></i> 未复习</span>'}
                        </div>
                    </div>`).join('');
                // 对未归因的错题自动触发 AI 归因，完成后局部刷新
                for (const m of items.filter((x) => x.pending)) {
                    analyzeMistake(m.id).then((ok) => { if (ok) refreshMistakeCard(m.id); });
                }
            } catch (error) {
                list.innerHTML = '<div class="overlay-empty">加载失败：' + escapeHtml(error.message) + '</div>';
            }
        }

        async function analyzeMistake(id, force) {
            try {
                const res = await fetch('/api/v1/mistakes/' + id + '/analyze', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-client-id': getClientId() },
                    body: JSON.stringify({ force: Boolean(force) })
                });
                return res.ok;
            } catch (e) { return false; }
        }

        // 用最新的归因模型重新分析（老错题可点击"重新归因"）
        async function reAnalyzeMistake(id) {
            const card = document.getElementById('mistake-' + id);
            if (!card) return;
            const cause = card.querySelector('.mistake-cause');
            if (cause) { cause.className = 'mistake-cause cause-pending'; cause.textContent = '归因中…'; }
            const ok = await analyzeMistake(id, true);
            if (ok) refreshMistakeCard(id);
        }

        async function refreshMistakeCard(id) {
            try {
                const res = await fetch('/api/v1/mistakes?reviewed=all', { headers: { 'x-client-id': getClientId() } });
                const payload = await res.json();
                const item = (payload.data.items || []).find((x) => x.id === id);
                if (!item) return;
                const card = document.getElementById('mistake-' + id);
                if (!card) return;
                const pending = card.querySelector('.mistake-pending');
                if (pending) {
                    pending.outerHTML = `
                        <div class="mistake-cause-text"><span class="mistake-cause-label">错误原因：</span>${escapeHtml(item.causeText || '')}</div>
                        <div class="mistake-suggestion"><i class="fas fa-lightbulb"></i> ${escapeHtml(item.suggestion || '')}</div>`;
                } else {
                    const ct = card.querySelector('.mistake-cause-text');
                    if (ct) ct.innerHTML = '<span class="mistake-cause-label">错误原因：</span>' + escapeHtml(item.causeText || '');
                    const sg = card.querySelector('.mistake-suggestion');
                    if (sg) sg.innerHTML = '<i class="fas fa-lightbulb"></i> ' + escapeHtml(item.suggestion || '');
                }
                const cause = card.querySelector('.mistake-cause');
                if (cause) { cause.className = 'mistake-cause cause-' + item.cause; cause.textContent = item.causeLabel; }
            } catch (e) { /* 忽略局部刷新失败 */ }
        }

        function reworkMistake(id) {
            const card = document.getElementById('mistake-' + id);
            if (!card) return;
            const existing = card.querySelector('.rework-box');
            if (existing) { existing.remove(); return; }
            const item = _mistakeCache.find((x) => x.id === id);
            const box = document.createElement('div');
            box.className = 'rework-box';
            box.innerHTML = '<input class="rework-input" placeholder="输入你的答案，重新作答…"><button class="chip" onclick="submitRework(\'' + id + '\', this)">提交</button>';
            card.querySelector('.mistake-actions').before(box);
            const input = box.querySelector('input');
            input.focus();
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitRework(id, box.querySelector('button')); });
        }

        async function submitRework(id, btn) {
            const box = btn.closest('.rework-box');
            const input = box.querySelector('input');
            const answer = input.value.trim();
            if (!answer) return;
            const item = _mistakeCache.find((x) => x.id === id);
            const reviewCorrect = item
                ? answer.normalize('NFC').trim().toLowerCase() === String(item.correctAnswer || '').normalize('NFC').trim().toLowerCase()
                : false;
            try {
                await fetch('/api/v1/mistakes/' + id + '/review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-client-id': getClientId() },
                    body: JSON.stringify({ reviewCorrect })
                });
            } catch (e) { /* 忽略 */ }
            loadMistakes();
        }

        // ===== 学情诊断 =====
        async function openDiagnostics() {
            document.getElementById('diagOverlay').hidden = false;
            const body = document.getElementById('diagBody');
            body.innerHTML = '<div class="overlay-empty"><i class="fas fa-spinner fa-spin"></i> 正在生成学情诊断…</div>';
            try {
                const res = await fetch('/api/v1/diagnostics', { headers: { 'x-client-id': getClientId() } });
                const payload = await res.json();
                if (!res.ok) throw new Error(payload.error?.message || '诊断失败');
                renderDiagnostics(payload.data.summary);
            } catch (error) {
                body.innerHTML = '<div class="overlay-empty">诊断失败：' + escapeHtml(error.message) + '</div>';
            }
        }

        function renderDiagnostics(s) {
            const pct = (x) => Math.round((x || 0) * 100) + '%';
            const acc = s.accuracy;
            const accColor = acc >= 0.8 ? '#1a9c5c' : (acc >= 0.6 ? '#d99a1a' : '#d94a4a');
            const topicsHtml = s.topics.length ? s.topics.map((t) => {
                const width = Math.round((t.correctRate || 0) * 100);
                const lvColor = t.masteryLevel === '掌握' ? '#1a9c5c' : t.masteryLevel === '一般' ? '#d99a1a' : '#d94a4a';
                return `<div class="diag-topic">

        // ===== AI 生成相关题目（调用后端 /api/v1/video/quiz） =====
        function escapeHtml(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        // 错题卡片选项渲染：绿色标记正确答案、红色标记用户选错的选项
        function renderMistakeOptions(m) {
            const opts = m.options;
            if (!Array.isArray(opts) || !opts.length) return '';
            const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
            const norm = (s) => String(s ?? '').normalize('NFC').trim().toLowerCase();
            let userIdx = -1;
            if (typeof m.userAnswer === 'string' && m.userAnswer.trim()) {
                const ltr = letters.indexOf(m.userAnswer.trim().toUpperCase());
                if (ltr >= 0 && ltr < opts.length) userIdx = ltr;
                else userIdx = opts.findIndex((o) => norm(o) === norm(m.userAnswer));
            }
            const correctIdx = opts.findIndex((o) => norm(o) === norm(m.correctAnswer));
            return '<div class="mistake-opts">' + opts.map((o, i) => {
                const isCorrect = i === correctIdx;
                const isUser = i === userIdx;
                let cls = 'mistake-opt';
                if (isCorrect) cls += ' ok';
                else if (isUser) cls += ' wrong';
                const tag = isCorrect ? '<span class="mistake-opt-tag ok">正确答案</span>' : (isUser ? '<span class="mistake-opt-tag wrong">你的答案</span>' : '');
                return '<div class="' + cls + '"><span class="mistake-opt-key">' + letters[i] + '</span><span class="mistake-opt-text">' + escapeHtml(o) + '</span>' + tag + '</div>';
            }).join('') + '</div>';
        }
        // 错题日期格式化：YYYY-MM-DD HH:mm
        function formatMistakeDate(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            if (isNaN(d.getTime())) return '';
            const pad = (n) => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        async function generateAIQuiz() {
            // 优先使用 search 页生成视频时输入的原始知识点文字

            if (!query) {

                console.warn('[AI Quiz] 缺少知识点关键词，无法生成题目', { topSearch: document.getElementById('topSearch')?.value, currentVideoKey });
                return;
            }
            console.log('[AI Quiz] 请求参数:', { query, time: new Date().toISOString() });
            const container = document.getElementById('quizContainer');
            const btn = document.getElementById('aiQuizBtn');
            btn.disabled = true;
            container.innerHTML = '<div style="padding:18px;color:var(--text-muted);display:flex;align-items:center;gap:8px;"><i class="fas fa-spinner fa-spin"></i> 正在根据「' + escapeHtml(query) + '」生成 3 道相关题目，请稍候…</div>';
            try {
                const res = await fetch('/api/v1/video/quiz', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const payload = await res.json();
                console.log('[AI Quiz] 响应:', { status: res.status, source: payload.data?.source, questionCount: payload.data?.questions?.length, requestId: payload.requestId, time: new Date().toISOString() });
                if (!res.ok) throw new Error(payload.error?.message || '生成失败');
                const questions = payload.data?.questions;
                if (!Array.isArray(questions) || !questions.length) throw new Error('未生成有效题目');
                currentQuiz = questions;
                currentQuiz._ai = true;
                quizState[quizKey()] = { answered: new Set(), score: 0, selections: {}, correctness: {} };
                renderQuiz();
            } catch (error) {
                console.warn('AI 生成题目失败：', error);
                container.innerHTML = '<div style="padding:18px;color:#e0555a;line-height:1.6;">AI 生成题目失败：' + escapeHtml(error.message) + '</div>';

                btn.disabled = false;
            }
        }

        // ===== 举一反三：基于某道已答题目生成同知识点变式题 =====
        let _variantsLoading = false;
        async function genVariants(qIdx) {
            if (!currentQuiz || !currentQuiz[qIdx]) return;
            if (_variantsLoading) return;
            const item = currentQuiz[qIdx];
            _variantsLoading = true;
            const container = document.getElementById('quizContainer');
            try {
                const res = await fetch('/api/v1/video/quiz', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: currentTopic().title || String(item.q).slice(0, 40),
                        variants_of: {
                            topic: currentTopic().title,
                            question: item.q,
                            options: item.opts || [],
                            answer: item.ans,
                            explanation: item.exp || ''
                        }
                    })
                });
                const payload = await res.json();
                if (!res.ok) throw new Error(payload.error?.message || '生成失败');
                const variants = payload.data?.questions;
                if (!Array.isArray(variants) || !variants.length) throw new Error('未生成变式题');
                variants.forEach((v, idx) => { v._variant = true; v._baseIdx = qIdx; });
                currentQuiz.push(...variants);
                renderQuiz();
                const cards = container.querySelectorAll('.quiz-card');
                cards[cards.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } catch (error) {
                console.warn('生成变式题失败：', error);
                alert('生成变式题失败：' + error.message);
            } finally {
                _variantsLoading = false;
            }
        }

        // ===== 播放控制 =====
        function togglePlay() {
            if (isPlaying) {

            } else {
                playVideo();
            }
        }

        function playVideo() {
            if (!currentVideoKey) return;
            isPlaying = true;
            if (generatedAudio) {
                generatedAudio.muted = isMuted;
                generatedAudio.play().catch(error => console.warn('音频播放失败：', error));

            document.getElementById('playIcon').className = 'fas fa-pause-circle';
