            playInterval = setInterval(() => {
                currentTime++;
                if (currentTime >= totalDuration) {
                    stopPlayback();
                    return;
                }
                updateProgress();
                if (subtitleVisible) updateSubtitle();
            }, 1000);
        }

        function pauseVideo() {
            isPlaying = false;
            if (generatedAudio) generatedAudio.pause();
            document.getElementById('playIcon').className = 'fas fa-play-circle';
            document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
            clearInterval(playInterval);
        }

        function stopPlayback() {
            isPlaying = false;
            if (generatedAudio) {
                generatedAudio.pause();
                generatedAudio.currentTime = 0;
            }
            clearInterval(playInterval);
            currentTime = 0;
            updateProgress();
            document.getElementById('playIcon').className = 'fas fa-play-circle';
            document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
            document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
            document.getElementById('subtitleBar').style.display = 'none';

        function skipTime(sec) {
            currentTime = Math.max(0, Math.min(totalDuration, currentTime + sec));
            if (generatedAudio) generatedAudio.currentTime = Math.min(generatedAudio.duration || currentTime, currentTime);
            updateProgress();
            highlightCurrentScene();
        }

        function seekToScene(index) {
            const v = videoDB[currentVideoKey];
            if (!v) return;
            const perScene = totalDuration / v.scenes;
            currentTime = Math.floor(index * perScene);
            updateProgress();
            highlightCurrentScene();
            document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
            document.getElementById('scene-' + index)?.classList.add('active');

        async function loadSlideshow(taskId, query) {
            let slides = [], audioUrl = null;
            const poster = document.getElementById('playerPoster');
            const descEl = document.getElementById('videoDesc');
            const maxAttempts = 300; // 300 × 2s = 最多等待 10 分钟（逐页语音合成较慢）

            for (let i = 0; i < maxAttempts; i++) {
                try {
                    const res = await fetch(`/api/v1/video/status?task_id=${encodeURIComponent(taskId)}`);
                    if (!res.ok) {
                        // 任务不存在（如服务端数据被清、历史里的 task_id 已失效）→ 提示重新生成，而非误导性的"重试"
                        if (res.status === 404) { descEl.textContent = '该视频已失效或已被清除，请返回搜索页重新生成。'; }
                        else { descEl.textContent = '查询失败，请重试。'; }
                        return;
                    }
                    const payload = await res.json();
                    const data = payload.data;
                    // 显示进度
                    if (data.status === 'queued') descEl.textContent = '任务已提交，正在排队…';
                    else if (data.status === 'generating') descEl.textContent = 'Qwen-Max 正在生成教学讲稿… (' + (data.progress || 20) + '%)';
                    else if (data.status === 'generating_tts') descEl.textContent = 'Qwen CosyVoice 正在合成语音配音… (' + (data.progress || 50) + '%)';
                    else if (data.status === 'failed') {
                        descEl.textContent = '生成失败：' + (data.error?.message || '请稍后重试') + '。请返回重新生成。';
                        return;
                    }
                    else descEl.textContent = '准备就绪…';
                    if (data.slides?.length && data.status === 'slides_ready') {
                        slides = data.slides;
                        audioUrl = data.audio_url;
                        window._slideAudioList = data.slide_audio || null;
                        break;
                    }
                } catch (e) {
                    descEl.textContent = '查询状态失败：' + e.message;
                }
                await new Promise(r => setTimeout(r, 2000));
            }

            if (!slides.length) { descEl.textContent = '生成讲稿超时，请返回重试。'; return; }

            // 设置元数据
            document.getElementById('videoDuration').textContent = slides.length + ' 页';
            document.getElementById('videoScenes').textContent = 'Qwen-Max';
            document.getElementById('videoViews').textContent = 'AI生成';
            document.getElementById('sidebarCol').style.display = 'block';
            window._slidesData = slides;
            window._currentAudio = audioUrl;
            // 预加载音频元数据：保证进度条可立即拖动（无需先播放）
            if (audioUrl) {
                const preload = new Audio(audioUrl);
                preload.preload = 'metadata';
                window._preloadedAudio = preload;
            }
            renderSlides(slides);

            // 知识点标签
            const tagBox = document.querySelector('.video-tags');
            if (tagBox) {
                tagBox.innerHTML = slides.map(s => `<span style="display:inline-block;padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--text-dim);margin:2px 4px 2px 0;"># ${s.title}</span>`).join('');
            }

            // 渲染第一张幻灯片
            renderSlideCard(poster, slides[0], 0);
            highlightScene(0);

            // ===== 视频播放器模式：逐页音频驱动进度条 + 自动翻页 =====
            const progressFill = document.getElementById('progressFill');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const playIcon = document.getElementById('playIcon');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const progressBar = document.querySelector('.player-progress');

            // 逐页音频：slideAudio = [{ index, url }]；音频与每页 PPT 文字严格对应
            const slideAudios = Array.isArray(window._slideAudioList) ? window._slideAudioList : [];
            let audio = null;            // 整段音频（旧任务兼容）
            let totalDuration = 60;      // 各页音频时长之和，metadata 加载后更新
            let currentSlideIdx = 0;
            let isSlidePlaying = false;
            let animFrameId = null;
            let slideMuted = false;
            let noAudioTimer = null;     // 无音频页的展示计时器

            // 保留"点击播放"按钮，让用户知道需要点击才能开始
            const posterInner = poster.querySelector('.player-poster-inner');
            if (posterInner) posterInner.style.display = 'flex';
            poster.style.background = '#000';

            function currentAudio() {
                const it = slideAudios[currentSlideIdx];
                return it ? it.audio : null;
            }

            // 预加载每页音频元数据：用于进度条跳转与总时长统计
            let metaLoaded = 0;
            const totalMeta = slideAudios.filter(it => it.url).length;
            slideAudios.forEach(it => {
                if (!it.url) { it.duration = 0; return; }
                const a = new Audio(it.url);
                a.preload = 'metadata';
                it.audio = a;
                a.addEventListener('loadedmetadata', () => {
                    it.duration = a.duration || 0;
                    metaLoaded++;
                    if (totalMeta > 0 && metaLoaded >= totalMeta) {
                        totalDuration = slideAudios.reduce((s, x) => s + (x.duration || 0), 0) || 60;
                        totalTimeEl.textContent = formatTime(totalDuration);
                        descEl.textContent = query + ' · ' + formatTime(totalDuration);
                        document.getElementById('videoDuration').textContent = slides.length + ' 页 · ' + formatTime(totalDuration);
                    }
                });
                a.load();
            });

            // 播放指定页：加载该页音频，播完自动切下一页
            function playPage(index) {
                currentSlideIdx = index;
                renderSlideCard(poster, slides[currentSlideIdx], currentSlideIdx);
                highlightScene(currentSlideIdx);
                if (noAudioTimer) { clearTimeout(noAudioTimer); noAudioTimer = null; }
                const a = currentAudio();
                if (a) {
                    a.muted = slideMuted;
                    a.currentTime = 0;
                    a.onended = null;
                    a.onended = () => {
                        if (currentSlideIdx === index && isSlidePlaying) {
                            if (index < slides.length - 1) playPage(index + 1);
                            else stopPlayback();
                        }
                    };
                    a.play().catch(() => onPageNoSound());
                } else {
                    onPageNoSound();
                }
            }

            // 无音频页：展示固定时长后自动切页，避免卡住
            function onPageNoSound() {
                if (!isSlidePlaying) return;
                noAudioTimer = setTimeout(() => {
                    if (currentSlideIdx < slides.length - 1) playPage(currentSlideIdx + 1);
                    else stopPlayback();
                }, 6000);
            }

            function updateUI() {
                const a = currentAudio();
                const before = slideAudios.slice(0, currentSlideIdx).reduce((s, x) => s + (x.duration || 0), 0);
                let ct = before;
                if (a && a.duration) ct += Math.min(a.currentTime, a.duration);
                totalTimeEl.textContent = formatTime(totalDuration);
                currentTimeEl.textContent = formatTime(ct);
                progressFill.style.width = Math.min(100, (ct / (totalDuration || 1)) * 100).toFixed(1) + '%';
                animFrameId = requestAnimationFrame(updateUI);
            }

            function startPlayback() {
                if (isSlidePlaying) return;
                // 隐藏"点击播放"，显示幻灯片内容
                const pi = poster.querySelector('.player-poster-inner');
                if (pi) pi.style.display = 'none';
                isSlidePlaying = true;
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                if (slideAudios.length) {
                    // 逐页音频模式
                    playPage(currentSlideIdx);
                    animFrameId = requestAnimationFrame(updateUI);
                    return;
                }
                // 旧任务兼容：整段音频
                if (audioUrl) {
                    if (!audio) {
                        audio = window._preloadedAudio || new Audio(audioUrl);
                        window._slideAudio = audio;
                        audio.addEventListener('loadedmetadata', () => {
                            totalDuration = audio.duration;
                            totalTimeEl.textContent = formatTime(totalDuration);
                            descEl.textContent = query + ' · ' + formatTime(totalDuration);
                            document.getElementById('videoDuration').textContent = slides.length + ' 页 · ' + formatTime(totalDuration);
                        });
                        audio.addEventListener('ended', () => {
                            isSlidePlaying = false;
                            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                            cancelAnimationFrame(animFrameId);
                            progressFill.style.width = '0%';
                            currentTimeEl.textContent = '0:00';
                            currentSlideIdx = 0;
                            renderSlideCard(poster, slides[0], 0);
                            highlightScene(0);
                            // 恢复"点击播放"
                            const pi2 = poster.querySelector('.player-poster-inner');
                            if (pi2) pi2.style.display = 'flex';
                        });
                    }
                    audio.muted = slideMuted;
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                    animFrameId = requestAnimationFrame(updateUI);
                    return;
                }
                // 无任何音频：虚拟时间轴，逐页展示
                animFrameId = requestAnimationFrame(updateUI);
                if (!noAudioTimer) onPageNoSound();
            }

            function pausePlayback() {
                isSlidePlaying = false;
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                if (animFrameId) cancelAnimationFrame(animFrameId);
                if (noAudioTimer) { clearTimeout(noAudioTimer); noAudioTimer = null; }
                const a = currentAudio();
                if (a) a.pause();
                if (audio) audio.pause();
            }

            function stopPlayback() {
                pausePlayback();
                const a = currentAudio();
                if (a) { a.pause(); a.currentTime = 0; a.onended = null; }
                if (audio) { audio.pause(); audio.currentTime = 0; }
                currentSlideIdx = 0;
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
                renderSlideCard(poster, slides[0], 0);
                highlightScene(0);
                const pi = poster.querySelector('.player-poster-inner');
                if (pi) pi.style.display = 'flex';
            }

            // 点击播放器区域 → 播放/暂停
            document.getElementById('playerContainer').onclick = function(e) {
                if (e.target.closest('.player-progress') || e.target.closest('.player-controls') || e.target.closest('.player-btn')) return;
                isSlidePlaying ? pausePlayback() : startPlayback();
            };

            // 播放/暂停按钮
            playPauseBtn.onclick = function(e) {
                e.stopPropagation();
                isSlidePlaying ? pausePlayback() : startPlayback();
            };

            // ===== 进度条跳转（支持点击与拖拽） =====
            // 把总时间轴定位到「页 + 页内时间」：逐页音频模式
            function locateTime(target) {
                let acc = 0;
                for (let i = 0; i < slideAudios.length; i++) {
                    const d = slideAudios[i].duration || 0;
                    if (target < acc + d || i === slideAudios.length - 1) {
                        return { index: i, remain: Math.max(0, target - acc), playingAudio: slideAudios[i].audio };
                    }
                    acc += d;
                }
                return { index: 0, remain: 0, playingAudio: null };
            }

            function seekTo(pct) {
                pct = Math.max(0, Math.min(1, pct));
                const target = pct * totalDuration;
                if (slideAudios.length) {
                    const wasPlaying = isSlidePlaying;
                    // 停掉当前页音频与计时器，避免互相干扰
                    if (noAudioTimer) { clearTimeout(noAudioTimer); noAudioTimer = null; }
                    const cur = currentAudio();
                    if (cur) { cur.pause(); cur.onended = null; }
                    const loc = locateTime(target);
                    currentSlideIdx = loc.index;
                    renderSlideCard(poster, slides[currentSlideIdx], currentSlideIdx);
                    highlightScene(currentSlideIdx);
                    if (loc.playingAudio) {
                        loc.playingAudio.currentTime = Math.max(0, Math.min(loc.playingAudio.duration || 0, loc.remain));
                        if (wasPlaying) {
                            loc.playingAudio.muted = slideMuted;
                            const idx = loc.index;
                            loc.playingAudio.onended = () => {
                                if (currentSlideIdx === idx && isSlidePlaying) {
                                    if (idx < slides.length - 1) playPage(idx + 1);
                                    else stopPlayback();
                                }
                            };
                            loc.playingAudio.play().catch(() => {});
                        }
                    } else if (wasPlaying) {
                        onPageNoSound();
                    }
                    if (wasPlaying) { animFrameId = requestAnimationFrame(updateUI); }
                    else { updateUI(); }
                    return;
                }
                if (audioUrl) {
                    // 旧任务兼容：整段音频
                    if (!audio) {
                        audio = window._preloadedAudio || new Audio(audioUrl);
                        window._slideAudio = audio;
                    }
                    const doSeek = () => {
                        audio.currentTime = Math.max(0, Math.min(audio.duration, pct * audio.duration));
                        if (!isSlidePlaying) updateUI();
                    };
                    if (audio.duration && isFinite(audio.duration)) { doSeek(); return; }
                    audio.addEventListener('loadedmetadata', doSeek, { once: true });
                    audio.load();
                    return;
                }
                // 无音频：虚拟时间轴跳转（默认总时长）
                const fakeTime = pct * totalDuration;
                currentTimeEl.textContent = formatTime(fakeTime);
                progressFill.style.width = (pct * 100).toFixed(1) + '%';
                const perSlide = totalDuration / slides.length;
                const newIdx = Math.min(slides.length - 1, Math.floor(fakeTime / perSlide));
                if (newIdx !== currentSlideIdx) {
                    currentSlideIdx = newIdx;
                    renderSlideCard(poster, slides[newIdx], newIdx);
                    highlightScene(newIdx);
                }
            }

            let seeking = false;
            function seekFromEvent(e) {
                const rect = progressBar.getBoundingClientRect();
                seekTo((e.clientX - rect.left) / rect.width);
            }
            progressBar.addEventListener('pointerdown', function (e) {
                e.stopPropagation();
                e.preventDefault();
                seeking = true;
                progressBar.classList.add('dragging');
                try { progressBar.setPointerCapture(e.pointerId); } catch (err) {}
                seekFromEvent(e);
            });
            progressBar.addEventListener('pointermove', function (e) {
                if (!seeking) return;
                seekFromEvent(e);
            });
            progressBar.addEventListener('pointerup', function (e) {
                if (!seeking) return;
                seeking = false;
                progressBar.classList.remove('dragging');
                seekFromEvent(e);
                try { progressBar.releasePointerCapture(e.pointerId); } catch (err) {}
            });
            progressBar.addEventListener('pointercancel', function () {
                seeking = false;
                progressBar.classList.remove('dragging');
            });

            // 跳过按钮（前后 10s）
            window._slideSkipTime = function (sec) {
                if (slideAudios.length) {
                    const before = slideAudios.slice(0, currentSlideIdx).reduce((s, x) => s + (x.duration || 0), 0);
                    const a = currentAudio();
                    const ct = before + (a && a.duration ? a.currentTime : 0);
                    seekTo((ct + sec) / (totalDuration || 1));
                    return;
                }
                if (audio && audio.duration && isFinite(audio.duration)) {
                    const target = Math.max(0, Math.min(audio.duration, audio.currentTime + sec));
                    audio.currentTime = target;
                    if (!isSlidePlaying) updateUI();
                } else if (!audioUrl) {
                    // 无音频：虚拟时间轴
                    const fakeTime = Math.max(0, Math.min(totalDuration, totalDuration / 2 + sec));
                    currentTimeEl.textContent = formatTime(fakeTime);
                    progressFill.style.width = (fakeTime / totalDuration * 100).toFixed(1) + '%';
                    const perSlide = totalDuration / slides.length;
                    const newIdx = Math.min(slides.length - 1, Math.floor(fakeTime / perSlide));
                    if (newIdx !== currentSlideIdx) {
                        currentSlideIdx = newIdx;
                        renderSlideCard(poster, slides[newIdx], newIdx);
                        highlightScene(newIdx);
                    }
                }
            };

            // 静音
            window._slideToggleMute = function() {
                slideMuted = !slideMuted;
                const a = currentAudio();
                if (a) a.muted = slideMuted;
                if (audio) audio.muted = slideMuted;
                document.getElementById('muteBtn').innerHTML = slideMuted
                    ? '<i class="fas fa-volume-xmark"></i>'
                    : '<i class="fas fa-volume-high"></i>';
            };

            // 覆写全局控制函数
            window.togglePlay = function() { isSlidePlaying ? pausePlayback() : startPlayback(); };
            window.skipTime = function(sec) { window._slideSkipTime(sec); };
            window.toggleMute = function() { window._slideToggleMute(); };

            // 场景导航跳页：切换到目标页并播放该页语音（逐页音频模式）
            window._slideJumpTo = function(idx) {
                if (!slides || idx < 0 || idx >= slides.length) return;
                if (slideAudios.length) {
                    // 定位到目标页起点
                    let acc = 0;
                    for (let i = 0; i < idx; i++) acc += slideAudios[i].duration || 0;
                    seekTo(totalDuration ? acc / totalDuration : 0);
                } else if (audioUrl) {
                    // 旧任务兼容：整段音频均分跳页
                    if (audio) {
                        const perSlide = totalDuration / slides.length;
                        audio.currentTime = Math.min(audio.duration || 0, idx * perSlide);
                        if (!isSlidePlaying) updateUI();
                    }
                    renderSlideCard(poster, slides[idx], idx);
                    highlightScene(idx);
                } else {
                    renderSlideCard(poster, slides[idx], idx);
                    highlightScene(idx);
                }
            };

            // 自动开始播放
            startPlayback();
            descEl.textContent = query || '幻灯片教学';
        }

        // 公式渲染：优先用 KaTeX 输出真正的数学样式，缺失时降级为转义文本
        function renderMathExpr(expr, display) {
            const e = String(expr || '');
            if (window.katex) {
                try {
                    return window.katex.renderToString(e, { displayMode: !!display, throwOnError: false, strict: false });
                } catch (err) { /* 降级 */ }
            }
            return e.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // 根据 diagram 数据生成 SVG 示意图
        function renderDiagram(dia, accent, accentLight, textMain) {
            if (!dia || dia.type === 'none' || !dia.data) return '';
            const W = 520, H = 160;
            const escape = (s) => String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const wrap = (s) => String(s).length > 8 ? String(s).slice(0,7)+'…' : s;

            if (dia.type === 'formula') {
                return `<div style="margin-top:14px;padding:16px;background:${accentLight};border-radius:10px;text-align:center;border-left:4px solid ${accent};"><div style="font-size:22px;color:${accent};font-weight:700;">${renderMathExpr(dia.data, true)}</div>${dia.caption ? `<div style="font-size:11px;color:${textMain};margin-top:6px;">${escape(dia.caption)}</div>` : ''}</div>`;
            }

            let svg = '';
            if (dia.type === 'flow') {
                const steps = dia.data.split('->').map(s => s.trim()).filter(Boolean);
                const gap = steps.length > 1 ? (W - 80) / (steps.length - 1) : 0;
                const startX = 40;
                const y = H / 2;
                let nodes = '', arrows = '';
                steps.forEach((step, i) => {
                    const x = startX + gap * i;
                    const w = Math.min(110, Math.max(70, step.length * 14));
                    nodes += `<rect x="${x - w/2}" y="${y - 24}" width="${w}" height="48" rx="8" fill="${accentLight}" stroke="${accent}" stroke-width="2"/><text x="${x}" y="${y + 5}" text-anchor="middle" fill="${accent}" font-size="12" font-weight="600">${escape(wrap(step))}</text>`;
                    if (i < steps.length - 1) {
                        arrows += `<line x1="${x + w/2}" y1="${y}" x2="${startX + gap*(i+1) - Math.min(110, Math.max(70, steps[i+1].length*14))/2 - 4}" y2="${y}" stroke="${accent}" stroke-width="2" marker-end="url(#arrow)"/>`;
                    }
                });
                svg = `<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="${accent}"/></marker></defs>${arrows}${nodes}`;
            } else if (dia.type === 'array') {
                const [vals, highlight] = dia.data.includes('|') ? dia.data.split('|') : [dia.data, ''];
                const items = vals.split(',').map(s => s.trim()).filter(Boolean);
                const cellW = Math.min(64, (W - 40) / Math.max(items.length, 1));
                const startX = (W - cellW * items.length) / 2;
                const y = H / 2 - 28;
                const hl = new Set(highlight.split(',').map(s => s.trim()).filter(Boolean).map(Number));
                let rects = '', idxs = '';
                items.forEach((v, i) => {
                    const x = startX + i * cellW;
                    const fill = hl.has(i) ? accent : '#fff';
                    const color = hl.has(i) ? '#fff' : textMain;
                    rects += `<rect x="${x}" y="${y}" width="${cellW}" height="56" fill="${fill}" stroke="${accent}" stroke-width="2"/><text x="${x + cellW/2}" y="${y + 34}" text-anchor="middle" fill="${color}" font-size="14" font-weight="700">${escape(v)}</text>`;
                    idxs += `<text x="${x + cellW/2}" y="${y + 72}" text-anchor="middle" fill="${textMain}" font-size="10">${i}</text>`;
                });
                svg = `${rects}${idxs}`;
            } else if (dia.type === 'compare') {
                const rows = dia.data.split('\n').filter(l => l.trim()).map(l => l.split('|').map(s => s.trim()));
                const cols = Math.max(...rows.map(r => r.length));
                const colW = (W - 40) / cols;
                const rowH = 42;
                const startY = (H - rows.length * rowH) / 2;
                let table = '';
                rows.forEach((row, r) => {
                    row.forEach((cell, c) => {
                        const x = 20 + c * colW;
                        const y = startY + r * rowH;
                        const isHeader = r === 0;
                        const fill = isHeader ? accent : (c === 0 ? accentLight : '#fff');
                        const color = isHeader ? '#fff' : (c === 0 ? accent : textMain);
                        table += `<rect x="${x}" y="${y}" width="${colW}" height="${rowH}" fill="${fill}" stroke="#e2e8f0"/><text x="${x + colW/2}" y="${y + 26}" text-anchor="middle" fill="${color}" font-size="12" font-weight="${isHeader||c===0?700:400}">${escape(wrap(cell))}</text>`;
                    });
                });
                svg = table;
            } else if (dia.type === 'tree') {
                const levels = dia.data.split('\n').map(l => l.split(',').map(s => s.trim()).filter(Boolean));
                const maxNodes = Math.max(...levels.map(l => l.length), 1);
                const levelH = H / (levels.length + 1);
                let nodes = '', edges = '';
                const nodePositions = [];
                levels.forEach((level, li) => {
                    const count = level.length;
                    const gap = count > 1 ? (W - 80) / (count - 1) : 0;
                    const startX = count === 1 ? W / 2 : 40;
                    level.forEach((node, ni) => {
                        const x = count === 1 ? W / 2 : startX + gap * ni;
                        const y = levelH * (li + 1);
                        nodePositions.push({ x, y, level: li, index: ni });
                    });
                });
                // 简单的父子连线：按层级顺序，每个上层节点连接下层相邻范围的节点
                nodePositions.forEach((p, i) => {
                    if (p.level < levels.length - 1) {
                        const children = nodePositions.filter(np => np.level === p.level + 1);
                        const perParent = children.length / Math.max(1, levels[p.level].length);
                        const startIdx = Math.floor(p.index * perParent);
                        const endIdx = Math.floor((p.index + 1) * perParent);
                        for (let ci = startIdx; ci < endIdx; ci++) {
                            if (children[ci]) edges += `<line x1="${p.x}" y1="${p.y + 16}" x2="${children[ci].x}" y2="${children[ci].y - 16}" stroke="#94a3b8" stroke-width="2"/>`;
                        }
                    }
                    nodes += `<circle cx="${p.x}" cy="${p.y}" r="18" fill="${accentLight}" stroke="${accent}" stroke-width="2"/><text x="${p.x}" y="${p.y + 4}" text-anchor="middle" fill="${accent}" font-size="10" font-weight="600">${escape(wrap(levels[p.level][p.index]))}</text>`;
                });
                svg = `${edges}${nodes}`;
            } else if (dia.type === 'line_chart' || dia.type === 'bar_chart') {
                // 兼容两种格式："标签1:5|标签2:8|标签3:3" 或 "1,5;2,8;3,3"
                const isBar = dia.type === 'bar_chart';
                let labels = [], values = [];
                const d = String(dia.data || '');
                if (d.includes('|')) {
                    d.split('|').map(p => p.trim()).filter(Boolean).forEach(p => {
                        const i = p.indexOf(':');
                        if (i > 0) { labels.push(p.slice(0, i).trim()); const v = parseFloat(p.slice(i + 1)); if (!isNaN(v)) values.push(v); }
                    });
                } else {
                    d.split(';').map(p => p.trim()).filter(Boolean).forEach(p => {
                        const parts = p.split(',');
                        if (parts.length >= 2) { labels.push(parts[0].trim()); const v = parseFloat(parts[1]); if (!isNaN(v)) values.push(v); }
                    });
                }
                const padL = 46, padR = 30, padT = 16, padB = 26;
                const plotW = W - padL - padR, plotH = H - padT - padB;
                const maxV = Math.max(...values, 1) * 1.1;
                const xOf = (i) => padL + (values.length > 1 ? i / (values.length - 1) : 0.5) * plotW;
                const yOf = (v) => padT + plotH - (v / maxV) * plotH;
                const colors = ['var(--primary)', '#22c55e', '#f59e0b', '#ef4444', '#A78BFA'];
                const xLabels = labels.map((l, i) => `<text x="${xOf(i)}" y="${padT + plotH + 14}" text-anchor="middle" fill="#64748b" font-size="9">${escape(wrap(l))}</text>`).join('');
                if (isBar) {
                    const bw = Math.min(36, plotW / Math.max(values.length, 1) * 0.6);
                    svg = values.map((v, i) => `<rect x="${xOf(i) - bw / 2}" y="${yOf(v)}" width="${bw}" height="${Math.max(1, padT + plotH - yOf(v))}" fill="${colors[i % colors.length]}" rx="3" opacity=".85"/><text x="${xOf(i)}" y="${yOf(v) - 5}" text-anchor="middle" fill="#1e293b" font-size="9" font-weight="700">${escape(v)}</text>`).join('') + xLabels;
                } else {
                    const pts = values.map((v, i) => `${xOf(i)},${yOf(v)}`).join(' ');
                    svg = `<polyline points="${pts}" fill="none" stroke="${colors[0]}" stroke-width="2.5" stroke-linejoin="round"/>` + values.map((v, i) => `<circle cx="${xOf(i)}" cy="${yOf(v)}" r="3.5" fill="${colors[0]}" stroke="#fff" stroke-width="1.5"/><text x="${xOf(i)}" y="${yOf(v) - 7}" text-anchor="middle" fill="#1e293b" font-size="9" font-weight="700">${escape(v)}</text>`).join('') + xLabels;
                }
            } else if (dia.type === 'complexity_curve') {
                // 多复杂度曲线对比："O(1)=1,4,16,64,256;O(n)=1,4,16,64,256;O(n²)=1,16,256,1024,4096"，横坐标 n=1,4,16,64,256
                const d = String(dia.data || '');
                const series = d.split(';').map(s => s.trim()).filter(Boolean).map(s => {
                    const eq = s.indexOf('=');
                    const name = eq > 0 ? s.slice(0, eq).trim() : s;
                    const vals = (eq > 0 ? s.slice(eq + 1) : s).split(',').map(v => parseFloat(v.trim())).filter(n => !isNaN(n) && n > 0);
                    return { name, vals };
                }).filter(s => s.vals.length > 0);
                const xs = [1, 4, 16, 64, 256];
                const padL = 46, padR = 30, padT = 16, padB = 26;
                const plotW = W - padL - padR, plotH = H - padT - padB;
                const allVals = series.flatMap(s => s.vals);
                const minY = Math.min(...allVals), maxY = Math.max(...allVals);
                const logMin = Math.log(Math.max(minY, 1)), logMax = Math.log(Math.max(maxY, logMin + 1));
                const xOf = (n) => padL + (Math.log(n) - Math.log(1)) / (Math.log(256) - Math.log(1)) * plotW;
                const yOf = (v) => padT + plotH - (Math.log(v) - logMin) / (logMax - logMin) * plotH;
                const colors = ['var(--primary)', '#22c55e', '#f59e0b', '#ef4444', '#A78BFA'];
                const grid = xs.map(n => `<line x1="${xOf(n)}" y1="${padT}" x2="${xOf(n)}" y2="${padT + plotH}" stroke="#eef2f7" stroke-width="1"/><text x="${xOf(n)}" y="${padT + plotH + 14}" text-anchor="middle" fill="#64748b" font-size="8">${n}</text>`).join('');
                const yLabels = [1, 10, 100, 1000, 10000].filter(v => v >= minY && v <= maxY * 1.05).map(v => `<line x1="${padL}" y1="${yOf(v)}" x2="${padL + plotW}" y2="${yOf(v)}" stroke="#eef2f7" stroke-width="1"/><text x="${padL - 4}" y="${yOf(v) + 3}" text-anchor="end" fill="#64748b" font-size="8">${v}</text>`).join('');
                let paths = '', legend = '';
                series.forEach((s, si) => {
                    const color = colors[si % colors.length];
                    const pts = s.vals.map((v, i) => `${xOf(xs[i] || (i + 1))},${yOf(v)}`).join(' ');
                    paths += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>` + s.vals.map((v, i) => `<circle cx="${xOf(xs[i] || (i + 1))}" cy="${yOf(v)}" r="3" fill="${color}"/>`).join('');
                    legend += `<text x="${padL + plotW + 8}" y="${padT + 14 + si * 14}" fill="${color}" font-size="9" font-weight="600">${escape(s.name)}</text>`;
                });
                svg = `${grid}${yLabels}${paths}${legend}`;
            }

            if (!svg) return '';
            const caption = dia.caption ? `<div style="text-align:center;font-size:11px;color:${textMain};margin-top:6px;">${escape(dia.caption)}</div>` : '';
            return `<div style="margin-top:14px;background:#f8fafc;border-radius:10px;padding:12px;border:1px solid #e2e8f0;"><svg viewBox="0 0 ${W} ${H}" width="100%" height="160" style="display:block;">${svg}</svg>${caption}</div>`;
        }

        // 渲染单个 visual 元素为紧凑卡片
        function renderVisual(v, accent, accentLight, textMain, textSub) {
            if (!v || !v.type) return '';
            const esc = (s) => String(s || '').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            const d = String(v.data || '');
            const caption = v.caption ? `<div style="font-size:10px;color:${textSub};text-align:center;margin-top:6px;">${esc(v.caption)}</div>` : '';

            // 紧凑表格
            if (v.type === 'table' && d.includes('|')) {
                const rows = d.split('\n').filter(l => l.trim());
                const ths = rows[0].split('|').map(c => `<th style="padding:6px 8px;background:${accent};color:#fff;font-weight:600;font-size:10px;text-align:left;">${c.trim()}</th>`).join('');
                const tds = rows.slice(1).map(row => row.split('|').map((c,ci) => `<td style="padding:5px 8px;font-size:10px;background:${ci===0?accentLight:'#fff'};color:${ci===0?accent:textMain};font-weight:${ci===0?'700':'400'};">${c.trim()}</td>`).join('')).map(r => `<tr>${r}</tr>`).join('');
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px;overflow:hidden;"><table style="width:100%;border-collapse:collapse;">${ths?`<thead><tr>${ths}</tr></thead>`:''}<tbody>${tds}</tbody></table>${caption}</div>`;
            }
            // 要点列表
            if (v.type === 'list') {
                const items = d.split('\n').filter(l => l.trim()).map(l => l.replace(/^[-••]\s*/, ''));
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;"><ul style="margin:0;padding-left:16px;font-size:11px;color:${textMain};line-height:1.7;">${items.map(it => `<li style="margin-bottom:2px;">${esc(it)}</li>`).join('')}</ul>${caption}</div>`;
            }
            // 代码块（深色代码卡片，可带语言标注）
            if (v.type === 'code') {
                const langLabel = v.lang || 'code';
                return `<div class="visual-card" style="background:#0f172a;border-radius:8px;overflow:hidden;"><div style="padding:4px 12px;font-size:9px;letter-spacing:1px;color:#8fa3c0;background:#1e293b;text-transform:uppercase;font-family:Consolas,Menlo,monospace;">${esc(langLabel)}</div><pre style="margin:0;padding:10px 12px;overflow-x:auto;font-size:11px;line-height:1.6;color:#e2e8f0;font-family:Consolas,Menlo,monospace;white-space:pre;">${esc(d)}</pre>${caption}</div>`;
            }
            // 公式（KaTeX 渲染）
            if (v.type === 'formula') {
                return `<div class="visual-card" style="background:${accentLight};border:1px solid ${accent};border-radius:8px;padding:14px;text-align:center;"><span style="font-size:18px;color:${accent};font-weight:700;">${renderMathExpr(d, false)}</span>${caption}</div>`;
            }
            // 强调框
            if (v.type === 'highlight') {
                return `<div class="visual-card" style="background:${accent};color:#fff;border-radius:8px;padding:12px 14px;font-size:12px;font-weight:600;text-align:center;line-height:1.6;">${esc(d)}${caption ? `<div style="font-size:10px;opacity:.8;margin-top:4px;">${esc(v.caption)}</div>` : ''}</div>`;
            }
            // 标签云
            if (v.type === 'badge') {
                return `<div class="visual-card" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;padding:10px;">${d.split(',').map(w => `<span style="display:inline-block;background:${accentLight};color:${accent};padding:4px 10px;border-radius:14px;font-size:10px;font-weight:600;border:1px solid ${accent};opacity:.7;">${esc(w.trim())}</span>`).join('')}${caption}</div>`;
            }
            // 引用框
            if (v.type === 'quote') {
                return `<div class="visual-card" style="background:#f8fafc;border-left:4px solid ${accent};border-radius:4px;padding:12px 14px;font-size:11px;color:${textMain};font-style:italic;line-height:1.6;">"${esc(d)}"${caption}</div>`;
            }
            // 流程图
            if (v.type === 'flow') {
                const steps = d.split('->').map(s => s.trim()).filter(Boolean);
                const w = steps.map(s => Math.min(80, Math.max(50, s.length * 9)));
                const totalW = w.reduce((a, b) => a + b + 30, 0);
                const nodes = steps.map((s,i) => {
                    const left = w.slice(0,i).reduce((a,b)=>a+b+30,0);
                    return `<rect x="${left}" y="10" width="${w[i]}" height="32" rx="6" fill="${accentLight}" stroke="${accent}" stroke-width="1.5"/><text x="${left+w[i]/2}" y="31" text-anchor="middle" fill="${accent}" font-size="10" font-weight="600">${esc(s.length>6?s.slice(0,5)+'…':s)}</text>${i<steps.length-1?`<line x1="${left+w[i]}" y1="26" x2="${left+w[i]+14}" y2="26" stroke="${accent}" stroke-width="1.5" marker-end="url(#va)"/>`:''}`;
                }).join('');
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px;overflow:hidden;"><svg viewBox="0 0 ${totalW+20} 52" width="100%" height="52"><defs><marker id="va" markerWidth="8" markerHeight="8" refX="7" refY="2" orient="auto"><path d="M0,0 L0,4 L7,2 z" fill="${accent}"/></marker></defs>${nodes}</svg>${caption}</div>`;
            }
            // 数组
            if (v.type === 'array') {
                const [vals, hl] = d.includes('|') ? d.split('|') : [d, ''];
                const items = vals.split(',').map(s => s.trim()).filter(Boolean);
                const hlSet = new Set(hl.split(',').map(s=>s.trim()).filter(Boolean).map(Number));
                const cells = items.map((val, i) => `<div style="flex:1;min-width:30px;max-width:56px;padding:8px 4px;text-align:center;font-weight:700;font-size:13px;background:${hlSet.has(i)?accent:'#fff'};color:${hlSet.has(i)?'#fff':accent};border:2px solid ${accent};border-radius:4px;">${esc(val)}</div>`).join('');
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px;"><div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap;">${cells}</div>${caption}</div>`;
            }
            // 树形图
            if (v.type === 'tree') {
                const levels = d.split('\n').map(l => l.split(',').map(s => s.trim()).filter(Boolean));
                const H = 100, W = 300;
                let svg = '';
                levels.forEach((level, li) => {
                    const y = (li + 1) * H / (levels.length + 1);
                    const gap = level.length > 1 ? (W - 60) / (level.length - 1) : 0;
                    level.forEach((node, ni) => {
                        const x = level.length === 1 ? W / 2 : 30 + gap * ni;
                        svg += `<circle cx="${x}" cy="${y}" r="14" fill="${accentLight}" stroke="${accent}" stroke-width="1.5"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="${accent}" font-size="9" font-weight="600">${esc(node.length>4?node.slice(0,3)+'…':node)}</text>`;
                    });
                });
                // 连线
                levels.forEach((level, li) => {
                    if (li >= levels.length - 1) return;
                    const py = (li + 1) * H / (levels.length + 1) + 14;
                    const ny = (li + 2) * H / (levels.length + 1) - 14;
                    levels[li].forEach((_, pi) => {
                        const pGap = level.length > 1 ? (W - 60) / (level.length - 1) : 0;
                        const px = level.length === 1 ? W / 2 : 30 + pGap * pi;
                        const children = levels[li + 1];
                        const cGap = children.length > 1 ? (W - 60) / (children.length - 1) : 0;
                        const per = children.length / Math.max(1, level.length);
                        const si = Math.floor(pi * per), ei = Math.floor((pi + 1) * per);
                        for (let ci = si; ci < ei && ci < children.length; ci++) {
                            const cx = children.length === 1 ? W / 2 : 30 + cGap * ci;
                            svg += `<line x1="${px}" y1="${py}" x2="${cx}" y2="${ny}" stroke="#94a3b8" stroke-width="1.5"/>`;
                        }
                    });
                });
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:4px;overflow:hidden;"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${svg}</svg>${caption}</div>`;
            }
            // 对比图
            if (v.type === 'compare') {
                const rows = d.split('\n').filter(l => l.trim()).map(l => l.split('|').map(s => s.trim()));
                const cols = Math.max(...rows.map(r => r.length), 1);
                const colW = Math.floor(100 / cols);
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;padding:4px;"><table style="width:100%;border-collapse:collapse;font-size:10px;">${rows.map((row,r) => `<tr>${row.map((c,ci) => `<td style="width:${colW}%;padding:6px 8px;text-align:center;background:${r===0?accent:ci===0?accentLight:'#fff'};color:${r===0?'#fff':ci===0?accent:textMain};font-weight:${r===0||ci===0?'700':'400'};">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>${caption}</div>`;
            }
            // 图表类（折线/柱状/复杂度曲线）复用大图渲染器
            if (v.type === 'line_chart' || v.type === 'bar_chart' || v.type === 'complexity_curve') {
                return renderDiagram(v, accent, accentLight, textMain);
            }
            return '';
        }

        function renderContentBlock(content, accent, accentLight, textMain, isRight) {
            if (!content) return '';
            const c = String(content).trim();
            if (c.includes('|')) {
                const rows = c.split('\n').filter(l => l.trim());
                const ths = rows[0].split('|').map(cell => `<th style="padding:${isRight?'10px 12px':'8px 10px'};background:${accent};color:#fff;font-weight:600;font-size:${isRight?'12px':'11px'};text-align:left;border:1px solid ${accent};">${cell.trim()}</th>`).join('');
                const tds = rows.slice(1).map(row => {
                    const cells = row.split('|').map((cell, ci) => {
                        const bg = ci === 0 ? accentLight : '#fff';
                        const color = ci === 0 ? accent : textMain;
                        return `<td style="padding:${isRight?'10px 12px':'8px 10px'};background:${bg};color:${color};font-weight:${ci===0?700:400};font-size:${isRight?'12px':'11px'};border:1px solid #e2e8f0;">${cell.trim()}</td>`;
                    }).join('');
                    return `<tr>${cells}</tr>`;
                }).join('');
                return `<table style="width:100%;border-collapse:collapse;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);"><thead><tr>${ths}</tr></thead><tbody>${tds}</tbody></table>`;
            } else if (/^[-•]\s+/m.test(c)) {
                const items = c.split('\n').filter(l => l.trim()).map(l => l.replace(/^[-•]\s+/, ''));
                return `<ul style="padding-left:18px;color:${textMain};font-size:14px;line-height:1.8;margin:0;">${items.map(item => `<li style="margin-bottom:8px;">${item}</li>`).join('')}</ul>`;
            } else if (c.includes('\n')) {
                return `<div style="color:${textMain};font-size:14px;line-height:1.8;white-space:pre-wrap;">${c.replace(/</g,'&lt;')}</div>`;
            } else {
                return `<pre style="background:#f1f5f9;color:${textMain};padding:14px 18px;border-radius:8px;font-size:12px;line-height:1.6;overflow:auto;text-align:left;font-family:'Consolas','Courier New',monospace;border-left:4px solid ${accent};box-shadow:0 1px 4px rgba(0,0,0,.05);margin:0;">${c.replace(/</g,'&lt;')}</pre>`;
            }
        }

        function renderSlideCard(container, slide, idx) {
            const total = window._totalSlides || 1;
            const pct = Math.round((idx + 1) / total * 100);
            const accent = '#1e40af';
            const accentLight = '#dbeafe';
            const textMain = '#1e293b';
            const textSub = '#64748b';

            const mainTitle = slide.title || '';
            const subTitle = slide.subtitle || '';

            // 生成所有 visuals + diagram（diagram 单独渲染大图，不混入 visuals 网格）
            const visuals = slide.visuals || [];
            const hasDiagram = !!(slide.diagram && slide.diagram.type && slide.diagram.type !== 'none' && slide.diagram.data);
            const visualCards = visuals.map(v => renderVisual(v, accent, accentLight, textMain, textSub)).filter(Boolean);
            const diagramBlock = hasDiagram ? renderDiagram(slide.diagram, accent, accentLight, textMain) : '';

            // visuals 网格：1列/2列/3列
            const colCount = visualCards.length <= 1 ? 1 : visualCards.length <= 4 ? 2 : 3;
            const visualsGrid = visualCards.length > 0 ? `<div style="display:grid;grid-template-columns:repeat(${colCount},1fr);gap:${colCount===1?'10px':'8px'};margin-top:${colCount===1?'10px':'12px'};">${visualCards.join('')}</div>` : '';

            const layout = slide.layout || 'default';
            let contentArea = '';

            if (layout === 'two_col') {
                const leftBlock = renderContentBlock(slide.left || slide.text, accent, accentLight, textMain, false);
                const rightBlock = renderContentBlock(slide.right || slide.code, accent, accentLight, textMain, true);
                contentArea = `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;height:100%;">
                    <div style="display:flex;flex-direction:column;gap:10px;">
                        <div style="font-size:15px;color:${accent};font-weight:700;border-left:4px solid ${accent};padding-left:10px;">核心要点</div>
                        ${leftBlock}
                    </div>
                    <div style="display:flex;flex-direction:column;gap:10px;">
                        <div style="font-size:15px;color:${accent};font-weight:700;border-left:4px solid ${accent};padding-left:10px;">可视化分析</div>
                        ${hasDiagram && diagramBlock ? diagramBlock : rightBlock}
                    </div>
                </div>${visualsGrid}`;
            } else if (layout === 'triple') {
                const leftBlock = renderContentBlock(slide.left || slide.text, accent, accentLight, textMain, false);
                const rightBlock = renderContentBlock(slide.right || slide.code, accent, accentLight, textMain, true);
                contentArea = `
                <div style="display:flex;flex-direction:column;gap:12px;height:100%;">
                    <p style="font-size:14px;line-height:1.8;margin:0;color:${textMain};">${slide.text || ''}</p>
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
                        <div style="background:${accentLight};border-radius:10px;padding:14px;text-align:center;border-top:3px solid ${accent};">
                            <div style="font-size:24px;margin-bottom:4px;">&#9312;</div>
                            <div style="font-size:12px;color:${accent};font-weight:700;line-height:1.5;">${leftBlock}</div>
                        </div>
                        <div style="background:#f8fafc;border-radius:10px;padding:14px;text-align:center;border-top:3px solid #94a3b8;">
                            <div style="font-size:24px;margin-bottom:4px;">&#9313;</div>
                            <div style="font-size:12px;color:${textMain};font-weight:700;line-height:1.5;">${rightBlock}</div>
                        </div>
                        <div style="background:#fff;border-radius:10px;padding:14px;text-align:center;border-top:3px solid ${accent};border:1px solid #e2e8f0;">
                            <div style="font-size:24px;margin-bottom:4px;">&#9314;</div>
                            <div style="font-size:12px;color:${textMain};font-weight:700;line-height:1.5;">${slide.code ? `<pre style="font-size:10px;color:${accent};white-space:pre-wrap;margin:0;text-align:left;font-family:Consolas,monospace;">${String(slide.code).replace(/</g,'&lt;').slice(0,80)}</pre>` : '—'}</div>
                        </div>
                    </div>
                    ${diagramBlock || ''}
                    ${visualsGrid}
                </div>`;
            } else if (layout === 'split') {
                const leftBlock = renderContentBlock(slide.left || slide.text, accent, accentLight, textMain, false);
                const rightBlock = renderContentBlock(slide.right || slide.code, accent, accentLight, textMain, true);
                contentArea = `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;height:100%;">
                    <div style="background:${accentLight};border-radius:10px;padding:16px;border-left:4px solid ${accent};">${leftBlock}</div>
                    <div style="background:#f8fafc;border-radius:10px;padding:16px;border-left:4px solid #94a3b8;">${rightBlock}</div>
                </div>${diagramBlock || ''}${visualsGrid}`;
            } else if (layout === 'left_text') {
                contentArea = `
                <div style="display:grid;grid-template-columns:1.1fr 0.9fr;gap:20px;align-items:start;height:100%;">
                    <div style="font-size:14px;line-height:1.9;color:${textMain};">${slide.text || ''}</div>
                    <div>${diagramBlock || visualsGrid || renderContentBlock(slide.right || slide.code, accent, accentLight, textMain, true)}</div>
                </div>`;
            } else {
                contentArea = `
                <div style="display:flex;flex-direction:column;justify-content:flex-start;height:100%;gap:10px;">
                    <p style="font-size:14px;line-height:1.85;margin:0;">${slide.text || ''}</p>
                    ${renderContentBlock(slide.code, accent, accentLight, textMain, false)}
                    ${diagramBlock || ''}
                    ${visualsGrid}
                </div>`;
            }

            const bottomBar = slide.bottom ? `<div style="background:${accent};color:#fff;text-align:center;padding:12px 24px;font-size:14px;font-weight:600;margin:0 -34px -24px -34px;">${slide.bottom}</div>` : '';

            const dotStyle = (i) => `style="display:inline-block;width:${i===idx?28:8}px;height:8px;border-radius:4px;background:${i===idx?accent:'#cbd5e1'};transition:all .3s;margin:0 3px;"`;
            const dots = Array.from({length:total},(_,i)=>`<span ${dotStyle(i)}></span>`).join('');

            container.innerHTML = `
            <div style="display:flex;flex-direction:column;width:100%;height:100%;background:#ffffff;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.08);">
                <div style="height:5px;background:#e2e8f0;width:100%;">
                    <div style="height:100%;background:${accent};width:${pct}%;transition:width .5s ease;"></div>
                </div>
                <div style="padding:18px 30px 12px;text-align:center;border-bottom:1px solid #e2e8f0;">
                    <div style="display:inline-block;background:${accentLight};color:${accent};padding:3px 12px;border-radius:12px;font-size:10px;font-weight:600;margin-bottom:8px;letter-spacing:.5px;">核心知识点 ${idx+1}/${total}</div>
                    <h2 style="color:${accent};font-size:22px;font-weight:700;margin:0;line-height:1.3;">${mainTitle}</h2>
                    ${subTitle ? `<p style="color:${textSub};font-size:13px;margin-top:4px;">${subTitle}</p>` : ''}
                </div>
                <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:18px 30px;overflow:auto;color:${textMain};">
                    ${contentArea}
                </div>
                ${bottomBar}
                <div style="padding:10px 30px;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:${textSub};border-top:1px solid #e2e8f0;">
                    <span><i class="fas fa-graduation-cap" style="color:${accent};margin-right:4px;"></i> Qwen-Max 生成</span>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <div style="display:flex;align-items:center;gap:4px;">${dots}</div>
                    </div>
                </div>
            </div>`;
        }

        function renderSlides(slides) {
            window._totalSlides = slides.length;
            const list = document.getElementById('sceneList');
            const icons = ['fa-lightbulb','fa-book-open','fa-gear','fa-chart-line','fa-check-circle'];
            list.innerHTML = slides.map((s, i) => `
                <div class="scene-item" id="slide-nav-${i}" onclick="jumpToSlide(${i})" style="display:flex;gap:12px;padding:12px 14px;border-radius:10px;cursor:pointer;transition:.2s;border:1px solid transparent;align-items:center;">
                    <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#eef2ff,#e0e7ff);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:15px;color:#818cf8;">${i+1}</div>
                    <div style="flex:1;min-width:0;">
                        <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                            <i class="fas ${icons[i%icons.length]}" style="color:#818cf8;margin-right:6px;font-size:12px;"></i>${s.title}
                        </div>
                        <div style="font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.text.slice(0,40)}…</div>
                    </div>
                    <i class="fas fa-chevron-right" style="color:var(--text-muted);font-size:10px;"></i>
                </div>
            `).join('');
            // Add scene-item class behaviors via inline styles
            list.querySelectorAll('[id^="slide-nav-"]').forEach(el => {
                el.addEventListener('mouseenter', () => { el.style.background = 'var(--bg-card)'; el.style.borderColor = 'var(--border)'; });
                el.addEventListener('mouseleave', () => { if (!el.classList.contains('active')) { el.style.background = ''; el.style.borderColor = 'transparent'; } });
            });
        }

        function jumpToSlide(idx) {
            // 逐页音频模式：走播放器闭包内的跳页逻辑（切换页面与语音）
            if (typeof window._slideJumpTo === 'function') {
                window._slideJumpTo(idx);
                return;
            }
            window._currentSlideIdx = idx;
            const slides = window._slidesData;
            if (!slides) return;
            renderSlideCard(document.getElementById('playerPoster'), slides[idx], idx);
            highlightScene(idx);
            // 同步音频进度
            const audio = document.querySelector('audio') || (window._slideAudio);
            if (audio && audio.duration) {
                const perSlide = audio.duration / slides.length;
                audio.currentTime = idx * perSlide;
            }
        }

        function highlightScene(idx) {
            document.querySelectorAll('[id^="slide-nav-"]').forEach(el => {
                el.style.background = '';
                el.style.borderColor = 'transparent';
            });
            const active = document.getElementById('slide-nav-' + idx);
            if (active) {
                active.style.background = 'var(--bg-card)';
                active.style.borderColor = 'var(--primary)';
                active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        async function pollDoubaoVideo(taskId, query) {}

        function formatTime(seconds) {
            if (!seconds || !isFinite(seconds)) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        // ===== AI 解题助手（多轮对话 + 流式输出 + 公式/代码渲染） =====
        let chatHistory = [];

        function toggleChatPanel() {
            const panel = document.getElementById('chatPanel');
            const fab = document.getElementById('chatFab');
            const open = panel.classList.toggle('open');
            fab.style.display = open ? 'none' : 'flex';

                document.getElementById('chatInput').focus();

                // 收起时移除"新消息"红点

        function clearChat() {
            chatHistory = [];
            document.getElementById('chatMsgs').innerHTML = '<div class="chat-msg chat-msg--ai"><div class="chat-msg-avatar"><i class="fas fa-robot"></i></div><div class="chat-msg-content">你好，我是 AI 解题助手。把不会的题目或知识点发给我，我会给出分步讲解；也可以继续追问"为什么"或"再讲细一点"。</div></div>';
            resetChatRail();
        }

        function fillChatInput(text) {
            const input = document.getElementById('chatInput');
            input.value = text;
            input.style.height = 'auto';
            input.style.height = input.scrollHeight + 'px';
            input.focus();
        }

        // "分步讲解当前知识点"：把当前搜索的题目作为知识点，直接发起解答
        function quickExplain() {
            const topic = (videoQuery || document.getElementById('topSearch').value || currentVideoKey || '').trim();
            fillChatInput(topic
                ? '请分步讲解当前知识点：' + topic + '，包含思路和代码'
                : '请分步讲解当前知识点，包含思路和代码');
            sendChat();
        }

        function addChatMsg(role, text) {
            const container = document.getElementById('chatMsgs');
            const msg = document.createElement('div');
            msg.className = 'chat-msg chat-msg--' + (role === 'user' ? 'user' : 'ai');
            msg.innerHTML = '<div class="chat-msg-avatar"><i class="fas ' + (role === 'user' ? 'fa-user-graduate' : 'fa-robot') + '"></i></div><div class="chat-msg-content"></div>';
            const content = msg.querySelector('.chat-msg-content');
            if (role === 'user') {
                content.textContent = text;
            } else {
                content.innerHTML = (window.renderMarkdown ? renderMarkdown(text) : text);
            }
            container.appendChild(msg);
            scrollChatPanel();
            return content;
        }

        function scrollChatPanel() {
            const body = document.getElementById('chatPanelBody');
            body.scrollTop = body.scrollHeight;
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || input.disabled) return;

            input.value = '';
            input.style.height = 'auto';
            addChatMsg('user', text);
            chatHistory.push({ role: 'user', content: text });

            const sendBtn = document.getElementById('chatSendBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            input.disabled = true;

            const bubble = addChatMsg('ai', '正在思考…');
            try {
                const response = await fetch('/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text, history: chatHistory.slice(0, -1) })
                });
                if (!response.ok) {
                    let message = '请求失败，请稍后重试';
                    try { message = (await response.json()).error?.message || message; } catch (e) {}
                    throw new Error(message);
                }

                // 流式读取 SSE
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let full = '';
                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) >= 0) {
                        const event = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        const dataLine = event.split('\n').find(l => l.trim().startsWith('data:'));
                        if (!dataLine) continue;
                        const data = dataLine.trim().slice(5).trim();
                        if (data === '[DONE]') continue;
                        try {
                            const evt = JSON.parse(data);
                            if (evt.type === 'delta') {
                                full += evt.delta;
                                bubble.innerHTML = (window.renderMarkdown ? renderMarkdown(full) : full);
                                scrollChatPanel();
                            } else if (evt.type === 'done') {
                                full = evt.content;
                            }
                        } catch (e) {}
                    }
                }
                if (!full) full = '（未收到回复，请重试）';
                bubble.innerHTML = (window.renderMarkdown ? renderMarkdown(full) : full);
                chatHistory.push({ role: 'assistant', content: full });
                scrollChatPanel();
                rebuildChatRail();
            } catch (e) {
                bubble.innerHTML = renderMarkdown('**出错了**：' + e.message);
                chatHistory.push({ role: 'assistant', content: '出错：' + e.message });
                scrollChatPanel();
                rebuildChatRail();
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                input.disabled = false;
                input.focus();
            }
        }

        // ===== On this page 滚动导航（scrollspy） =====
        // 导航条贴顶偏移：rail 距内容区顶部 12px + 标题行约 22px
        const CHAT_RAIL_OFFSET = 34;
        let chatSectionSeq = 0;
        let chatSectionEls = [];   // [{ id, title, el }]
        let chatObserver = null;

        function resetChatRail() {
            if (chatObserver) { chatObserver.disconnect(); chatObserver = null; }
            chatSectionEls = [];
            chatSectionSeq = 0;
            const rail = document.getElementById('chatRail');
            if (rail) { rail.hidden = true; document.getElementById('chatRailLinks').innerHTML = ''; }
        }

        // 收集 AI 回复中的标题 → 生成锚点 + 导航链接 + 建立 IntersectionObserver
        function rebuildChatRail() {
            const rail = document.getElementById('chatRail');
            const linksBox = document.getElementById('chatRailLinks');
            const headings = document.querySelectorAll('#chatMsgs .chat-msg--ai .chat-msg-content h1, #chatMsgs .chat-msg--ai .chat-msg-content h2, #chatMsgs .chat-msg--ai .chat-msg-content h3, #chatMsgs .chat-msg--ai .chat-msg-content h4');
            if (!headings.length) { resetChatRail(); return; }

            chatSectionEls = [];
            headings.forEach(function (h) {
                if (!h.id) h.id = 'chatsec-' + (chatSectionSeq++);
                const title = (h.textContent || '').trim();
                if (title) chatSectionEls.push({ id: h.id, title: title, el: h });
            });
            if (!chatSectionEls.length) { resetChatRail(); return; }

            linksBox.innerHTML = chatSectionEls.map(function (s) {
                return '<a class="chat-rail-link" href="#' + s.id + '" onclick="chatRailJump(event, \'' + s.id + '\')">' + escapeHtml(s.title) + '</a>';
            }).join('');
            rail.hidden = false;

            if (chatObserver) chatObserver.disconnect();
            chatObserver = new IntersectionObserver(chatRailOnObserve, {
                root: document.getElementById('chatPanelBody'),
                // 顶边按导航条高度偏移（CHAT_RAIL_OFFSET），底部让出 60% 视区，
                // 使"当前章节"只在顶部激活区判定，且同一时刻仅一个章节命中
                rootMargin: '-' + CHAT_RAIL_OFFSET + 'px 0px -60% 0px',
                threshold: 0
            });
            chatSectionEls.forEach(function (s) { chatObserver.observe(s.el); });
            setChatRailActive(chatSectionEls[0].id);
        }

        // 计算当前章节：越过激活线（容器顶部 + CHAT_RAIL_OFFSET）的最后一个章节。
        // 不依赖 IO 回调的 entries（点击跳转时目标恰好停在边界上，entries 不会上报它），
        // 而是遍历全部章节按实际位置判定，保证点击后高亮与滚动位置严格一致。
        function chatRailPickCurrent() {
            const body = document.getElementById('chatPanelBody');
            const zoneTop = body.getBoundingClientRect().top + CHAT_RAIL_OFFSET + 2;
            let current = null;
            for (let i = 0; i < chatSectionEls.length; i++) {
                if (chatSectionEls[i].el.getBoundingClientRect().top <= zoneTop) current = chatSectionEls[i].id;
            }
            return current || (chatSectionEls.length ? chatSectionEls[0].id : null);
        }

        function chatRailOnObserve() {
            const id = chatRailPickCurrent();
            if (id) setChatRailActive(id);
        }

        function setChatRailActive(id) {
            document.querySelectorAll('.chat-rail-link').forEach(function (a) {
                const on = a.getAttribute('href') === '#' + id;
                a.classList.toggle('active', on);
                if (on) a.setAttribute('aria-current', 'location');
                else a.removeAttribute('aria-current');
            });
        }

        // 导航点击：平滑滚动到目标章节（补偿导航条高度）
        function chatRailJump(event, id) {
            event.preventDefault();
            const el = document.getElementById(id);
            if (!el) return;
            const body = document.getElementById('chatPanelBody');
            const target = body.scrollTop + el.getBoundingClientRect().top - body.getBoundingClientRect().top - CHAT_RAIL_OFFSET;
            body.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
        }

        // 顶部横杠拖拽移动面板（等待 DOM 就绪后再绑定，避免脚本先于元素执行）
        document.addEventListener('DOMContentLoaded', function () {
            const panel = document.getElementById('chatPanel');
            const bar = document.getElementById('chatDragBar');
            if (!panel || !bar) return;
            let dragging = false, startX = 0, startY = 0, baseLeft = 0, baseTop = 0;
            bar.addEventListener('pointerdown', function (e) {
                if (e.button !== 0) return;
                // 将固定定位从 right/bottom 切换为 left/top，以当前位置为基准
                const r = panel.getBoundingClientRect();
                panel.style.right = 'auto';
                panel.style.bottom = 'auto';
                panel.style.left = r.left + 'px';
                panel.style.top = r.top + 'px';
                dragging = true;
                startX = e.clientX;
                startY = e.clientY;
                baseLeft = r.left;
                baseTop = r.top;
                try { bar.setPointerCapture(e.pointerId); } catch (err) {}
                document.body.style.userSelect = 'none';
            });
            bar.addEventListener('pointermove', function (e) {
                if (!dragging) return;
                let nx = baseLeft + (e.clientX - startX);
                let ny = baseTop + (e.clientY - startY);
                // 限制在视口内（保留 8px 边距）
                const maxX = Math.max(8, window.innerWidth - panel.offsetWidth - 8);
                const maxY = Math.max(8, window.innerHeight - panel.offsetHeight - 8);
                nx = Math.max(8, Math.min(nx, maxX));
                ny = Math.max(8, Math.min(ny, maxY));
                panel.style.left = Math.round(nx) + 'px';
                panel.style.top = Math.round(ny) + 'px';
            });
            function endDrag() {
                if (!dragging) return;
                dragging = false;
                document.body.style.userSelect = '';
            }
            bar.addEventListener('pointerup', endDrag);
            bar.addEventListener('pointercancel', endDrag);
        });

        // 右下角手柄拖拽调整面板大小 + 尺寸/位置记忆（localStorage 持久化，桌面端生效）
        (function () {
            const RECT_KEY = 'chat_panel_rect';
            const MIN_W = 360, MIN_H = 420, MARGIN = 26;
            function loadRect() {
                try { const v = JSON.parse(localStorage.getItem(RECT_KEY) || 'null'); return v && typeof v === 'object' ? v : null; } catch (e) { return null; }
            }
            function saveRect() {
                const panel = document.getElementById('chatPanel');
                if (!panel) return;
                const r = panel.getBoundingClientRect();
                const rect = { w: Math.round(r.width), h: Math.round(r.height) };
                // 仅当面板被拖拽移动过（内联 left/top 生效）才记忆位置，否则保持 right/bottom 贴角定位
                if (panel.style.left && panel.style.top) { rect.left = Math.round(r.left); rect.top = Math.round(r.top); }
                try { localStorage.setItem(RECT_KEY, JSON.stringify(rect)); } catch (e) {}
            }
            function isMobile() { return window.innerWidth <= 540; }

            // 恢复记忆的尺寸与位置（DOM 就绪后执行一次）
            function restoreRect() {
                const panel = document.getElementById('chatPanel');
                const rect = loadRect();
                if (!panel || isMobile() || !rect) return;
                const vw = window.innerWidth, vh = window.innerHeight;
                const w = Math.max(MIN_W, Math.min(rect.w, vw - MARGIN * 2));
                const h = Math.max(MIN_H, Math.min(rect.h, vh - MARGIN * 2));
                panel.style.width = w + 'px';
                panel.style.height = h + 'px';
                if (typeof rect.left === 'number' && typeof rect.top === 'number') {
                    const maxX = Math.max(8, vw - w - 8);
                    const maxY = Math.max(8, vh - h - 8);
                    panel.style.right = 'auto';
                    panel.style.bottom = 'auto';
                    panel.style.left = Math.max(8, Math.min(rect.left, maxX)) + 'px';
                    panel.style.top = Math.max(8, Math.min(rect.top, maxY)) + 'px';
                }
            }

            // 整圈缩放：四条边 + 四个角（data-x/data-y 标记拖动方向），按住任意边框/角改变大小
            function initResizeHandles() {
                const panel = document.getElementById('chatPanel');
                if (!panel) return;
                const handles = document.querySelectorAll('.chat-resize');
                if (!handles.length) return;
                let resizing = null; // { x, y, base, sx, sy, moved }
                function onDown(e) {
                    if (e.button !== 0 || isMobile()) return;
                    const handle = e.currentTarget;
                    const x = handle.getAttribute('data-x'); // 'none' | 'w' | 'e'
                    const y = handle.getAttribute('data-y'); // 'none' | 'n' | 's'
                    const r = panel.getBoundingClientRect();
                    // moved：面板此前已被拖拽移动（内联 left/top 生效）。
                    // 未移动的面板保持 right/bottom 贴角锚定：只缩放 w/n 侧时才固化为 left/top，
                    // 纯 e/s/se 缩放保持锚定，浏览器窗口变化时面板仍能自动贴角。
                    const moved = !!(panel.style.left && panel.style.top);
                    if (!moved && (x === 'w' || y === 'n')) {
                        panel.style.right = 'auto';
                        panel.style.bottom = 'auto';
                        panel.style.left = r.left + 'px';
                        panel.style.top = r.top + 'px';
                    }
                    resizing = { x, y, base: { left: r.left, top: r.top, right: r.right, bottom: r.bottom }, sx: e.clientX, sy: e.clientY, moved: moved || x === 'w' || y === 'n' };
                    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
                    document.body.style.userSelect = 'none';
                    e.preventDefault();
                }
                function onMove(e) {
                    if (!resizing) return;
                    const s = resizing, base = s.base, dx = e.clientX - s.sx, dy = e.clientY - s.sy;
                    const vw = window.innerWidth, vh = window.innerHeight;
                    // 被拖动的一侧在最小尺寸与视口内夹取；另一侧保持基准位置不动（对角/对边同时夹取）
                    let L = base.left, R = base.right, T = base.top, B = base.bottom;
                    if (s.x === 'w') L = Math.max(8, Math.min(base.left + dx, base.right - MIN_W));
                    else if (s.x === 'e') R = Math.max(base.left + MIN_W, Math.min(base.right + dx, vw - 8));
                    if (s.y === 'n') T = Math.max(8, Math.min(base.top + dy, base.bottom - MIN_H));
                    else if (s.y === 's') B = Math.max(base.top + MIN_H, Math.min(base.bottom + dy, vh - 8));
                    if (s.moved) {
                        panel.style.left = Math.round(L) + 'px';
                        panel.style.top = Math.round(T) + 'px';
                    }
                    panel.style.width = Math.round(R - L) + 'px';
                    panel.style.height = Math.round(B - T) + 'px';
                }
                function endResize() {
                    if (!resizing) return;
                    resizing = null;
                    document.body.style.userSelect = '';
                    saveRect();
                }
                handles.forEach(function (h) {
                    h.addEventListener('pointerdown', onDown);
                    h.addEventListener('pointermove', onMove);
                    h.addEventListener('pointerup', endResize);
                    h.addEventListener('pointercancel', endResize);
                });
            }

            document.addEventListener('DOMContentLoaded', restoreRect);
            document.addEventListener('DOMContentLoaded', initResizeHandles);
            // 顶栏拖拽移动结束后也记忆位置（saveRect 仅在面板被移动过时记录位置）
            document.addEventListener('DOMContentLoaded', function () {
                const bar = document.getElementById('chatDragBar');
                if (bar) bar.addEventListener('pointerup', saveRect);
            });
        })();

        // 输入框自适应高度
        document.addEventListener('input', function (e) {
            if (e.target && e.target.id === 'chatInput') {
                e.target.style.height = 'auto';
                e.target.style.height = Math.min(e.target.scrollHeight, 110) + 'px';
            }
        });

    </script>

        <div class="chat-resize chat-resize--n"  data-x="none" data-y="n"></div>

        <div class="chat-resize chat-resize--sw" data-x="w" data-y="s"></div>
        <div class="chat-resize chat-resize--se" data-x="e" data-y="s"></div>
        <div class="chat-resize-handle" id="chatResizeHandle" title="拖拽边框或右下角调整大小" aria-hidden="true"><i class="fas fa-up-right-and-down-left-from-center"></i></div>
    </div>

    <!-- 错题本弹层 -->
    <div class="overlay" id="mistakeOverlay" hidden>
        <div class="overlay-panel" role="dialog" aria-label="错题本">
            <div class="overlay-header">
                <div class="overlay-title"><i class="fas fa-book-medical" style="color:var(--primary)"></i> 错题本 <span class="overlay-count" id="mistakeCount"></span></div>
                <div class="overlay-actions">
                    <button class="chip" id="mistakeFilterBtn" onclick="toggleMistakeFilter()">未复习</button>
                    <button class="overlay-close" onclick="closeOverlay('mistakeOverlay')" title="关闭"><i class="fas fa-xmark"></i></button>
                </div>
            </div>
            <div class="overlay-body" id="mistakeList"></div>
        </div>
    </div>

    <!-- 学情诊断弹层 -->
    <div class="overlay" id="diagOverlay" hidden>
        <div class="overlay-panel overlay-panel--wide" role="dialog" aria-label="学情诊断">
            <div class="overlay-header">
                <div class="overlay-title"><i class="fas fa-chart-line" style="color:var(--primary)"></i> 学情诊断</div>
                <div class="overlay-actions">
                    <button class="chip" onclick="openDiagnostics()"><i class="fas fa-rotate"></i> 重新诊断</button>
                    <button class="chip" onclick="exportDiagnostics()"><i class="fas fa-download"></i> 导出报告</button>
                    <button class="overlay-close" onclick="closeOverlay('diagOverlay')" title="关闭"><i class="fas fa-xmark"></i></button>
                </div>
            </div>
            <div class="overlay-body" id="diagBody"></div>
        </div>
    </div>

</body>
</html>
