            }
        }

        function playVideo() {
            if (!currentVideoKey) return;
            isPlaying = true;
            const hint = document.getElementById('playbackHint');
            if (hint) hint.textContent = generatedAudio ? '正在播放讲解' : '正在播放课程';
            if (generatedAudio) {
                generatedAudio.muted = isMuted;
                generatedAudio.play().catch(error => {
                    console.warn('音频播放失败：', error);
                    if (hint) hint.textContent = '浏览器阻止了自动播放，请点击“播放”';
                });
            }
            _elOr('playIcon').className = 'fas fa-pause-circle';
            _elOr('playPauseBtn').innerHTML = '<i class="fas fa-pause"></i> 暂停';
            if (subtitleVisible) {
                document.getElementById('subtitleBar').style.display = 'flex';
                updateSubtitle();
            }
            playInterval = setInterval(() => {
                currentTime++;
                if (currentTime >= totalDuration) {
                    stopPlayback();
                    return;
                }
                updateProgress();
                if (subtitleVisible) updateSubtitle();
            }, 1000);
        }

        function pauseVideo() {
            isPlaying = false;
            if (generatedAudio) generatedAudio.pause();
            _elOr('playIcon').className = 'fas fa-play-circle';
            _elOr('playPauseBtn').innerHTML = '<i class="fas fa-play"></i> 播放';
            const hint = document.getElementById('playbackHint');
            if (hint) hint.textContent = '已暂停，点击播放继续';
            clearInterval(playInterval);
        }

        function stopPlayback() {
            isPlaying = false;
            if (generatedAudio) {
                generatedAudio.pause();
                generatedAudio.currentTime = 0;
            }
            clearInterval(playInterval);
            currentTime = 0;
            updateProgress();
            _elOr('playIcon').className = 'fas fa-play-circle';
            _elOr('playPauseBtn').innerHTML = '<i class="fas fa-play"></i> 播放';
            document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
            document.getElementById('subtitleBar').style.display = 'none';
            const hint = document.getElementById('playbackHint');
            if (hint) hint.textContent = '课程已就绪，点击播放';
        }

        function skipTime(sec) {
            currentTime = Math.max(0, Math.min(totalDuration, currentTime + sec));
            if (generatedAudio) generatedAudio.currentTime = Math.min(generatedAudio.duration || currentTime, currentTime);
            updateProgress();
            highlightCurrentScene();
        }

        function seekToScene(index) {
            const v = videoDB[currentVideoKey];
            if (!v) return;
            const perScene = totalDuration / v.scenes;
            currentTime = Math.floor(index * perScene);
            updateProgress();
            highlightCurrentScene();
            document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
            document.getElementById('scene-' + index)?.classList.add('active');
        }

        function toggleMute() {
            isMuted = !isMuted;
            if (generatedAudio) generatedAudio.muted = isMuted;
            _elOr('muteBtn').innerHTML = isMuted
                ? '<i class="fas fa-volume-xmark"></i>'
                : '<i class="fas fa-volume-high"></i>';
        }

        function toggleSubtitle() {
            subtitleVisible = !subtitleVisible;
            const bar = document.getElementById('subtitleBar');
            if (subtitleVisible && isPlaying) {
                bar.style.display = 'flex';
                updateSubtitle();
            } else {
                bar.style.display = 'none';
            }
        }

        function toggleFullscreen() {
            const container = document.getElementById('playerContainer');
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                container.requestFullscreen();
            }
        }
        // 全屏时把聚光框（cw-spot，fixed 层）迁入全屏元素，否则会被全屏 Top Layer 盖住而消失
        // 全屏切换不触发 window resize（文档视口不变），故迁移后主动重算舞台缩放与聚光位置
        document.addEventListener('fullscreenchange', function () {
            const spot = document.getElementById('cwSpot');
            const fsEl = document.fullscreenElement;
            if (spot) (fsEl || document.body).appendChild(spot);
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    try { if (window._deck && window._deck._onResize) window._deck._onResize(); } catch (e) {}
                    try { if (window._cwPlayer && window._cwPlayer._respot) window._cwPlayer._respot(); } catch (e) {}
                });
            });
        });

        function updateProgress() {
            const pct = (currentTime / totalDuration) * 100;
            _elOr('progressFill').style.width = pct + '%';
            const mins = Math.floor(currentTime / 60);
            const secs = Math.floor(currentTime % 60);
            _elOr('currentTime').textContent = mins + ':' + String(secs).padStart(2, '0');
            highlightCurrentScene();
        }

        function highlightCurrentScene() {
            const v = videoDB[currentVideoKey];
            if (!v) return;
            const perScene = totalDuration / v.scenes;
            const idx = Math.min(v.scenes - 1, Math.floor(currentTime / perScene));
            document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
            document.getElementById('scene-' + idx)?.classList.add('active');
        }

        function updateSubtitle() {
            const v = videoDB[currentVideoKey];
            if (!v || !v.subtitles) return;
            const perSub = totalDuration / v.subtitles.length;
            const idx = Math.min(v.subtitles.length - 1, Math.floor(currentTime / perSub));
            const st = document.getElementById('subtitleText');
            if (st.textContent !== v.subtitles[idx]) {
                st.dataset.tk = String((+st.dataset.tk || 0) + 1);
                const tk = st.dataset.tk;
                st.style.opacity = '0';
                setTimeout(function () { if (st.dataset.tk === tk) { st.textContent = v.subtitles[idx]; st.style.opacity = '1'; } }, 150);
            }
        }

        async function loadSlideshow(taskId, query) {
            let slides = [], audioUrl = null;
            const poster = document.getElementById('playerPoster');
            const descEl = document.getElementById('videoDesc');
            const maxAttempts = 300; // 300 × 2s = 最多等待 10 分钟（逐页语音合成较慢）
            let audioRepairAttempted = false;
            let runtimeAudioRepairPromise = null;
            let runtimeAudioRepairCount = 0;
            let autoplayUnlockArmed = false;

            function disarmAutoplayUnlock() {
                if (!autoplayUnlockArmed) return;
                autoplayUnlockArmed = false;
                document.removeEventListener('pointerdown', resumeAfterFirstGesture, true);
                document.removeEventListener('keydown', resumeAfterFirstGesture, true);
            }
            function resumeAfterFirstGesture() {
                disarmAutoplayUnlock();
                if (window._cwPlayer && !window._cwPlayer.playing) window._cwPlayer.play();
                else if (!window._cwPlayer && typeof startPlayback === 'function') startPlayback();
            }
            function armAutoplayUnlock() {
                if (autoplayUnlockArmed) return;
                autoplayUnlockArmed = true;
                document.addEventListener('pointerdown', resumeAfterFirstGesture, true);
                document.addEventListener('keydown', resumeAfterFirstGesture, true);
            }

            // 播放期间某个媒体请求失败时，自动重跑整批 TTS，并把新的一组唯一 URL
            // 原位写回播放器。整个过程停在当前句，修复成功后自动继续，不静默翻页。
            function repairRuntimeAudio(context) {
                if (runtimeAudioRepairPromise) return runtimeAudioRepairPromise;
                if (runtimeAudioRepairCount >= 2) {
                    descEl.textContent = '配音连续两次自动修复失败，播放已停在当前页。请检查服务器 TTS 配置后重试。';
                    return Promise.resolve(false);
                }
                runtimeAudioRepairCount++;
                const pageNo = context && Number.isFinite(context.pageIndex) ? context.pageIndex + 1 : 1;
                descEl.textContent = '第 ' + pageNo + ' 页配音请求异常，正在自动修复（第 ' + runtimeAudioRepairCount + '/2 次）…';
                runtimeAudioRepairPromise = (async function () {
                    try {
                        const repair = await fetch('/api/v1/courseware/resynth', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ task_id: taskId, voice: window._cwVoice || 'zh-CN-XiaoxiaoNeural' })
                        });
                        if (!repair.ok && repair.status !== 409) {
                            const payload = await repair.json().catch(() => ({}));
                            throw new Error((payload.error && payload.error.message) || ('HTTP ' + repair.status));
                        }
                        for (let attempt = 0; attempt < 200; attempt++) {
                            await new Promise(resolve => setTimeout(resolve, 1500));
                            const statusResponse = await fetch('/api/v1/video/status?task_id=' + encodeURIComponent(taskId), { cache: 'no-store' });
                            if (!statusResponse.ok) throw new Error('查询修复进度失败：HTTP ' + statusResponse.status);
                            const statusPayload = await statusResponse.json();
                            const repaired = statusPayload.data;
                            if (repaired && repaired.error && repaired.error.code === 'RESYNTH_FAILED') {
                                throw new Error(repaired.error.message || '重新合成失败');
                            }
                            if (repaired && repaired.status === 'slides_ready') {
                                const narration = (repaired.pages || []).flatMap(page => Array.isArray(page.narration) ? page.narration : []);
                                if (!narration.length || narration.some(sentence => !sentence || !sentence.audio)) {
                                    throw new Error('重新合成完成，但仍有音频缺失');
                                }
                                (repaired.pages || []).forEach((newPage, pageIndex) => {
                                    const oldPage = slides[pageIndex];
                                    if (!oldPage) return;
                                    (newPage.narration || []).forEach((newSentence, sentenceIndex) => {
                                        const oldSentence = oldPage.narration && oldPage.narration[sentenceIndex];
                                        if (!oldSentence) return;
                                        oldSentence.audio = newSentence.audio;
                                        delete oldSentence._dur;
                                    });
                                });
                                descEl.textContent = (query || '课件') + ' · 配音已自动修复，继续播放';
                                return true;
                            }
                            if (repaired && repaired.status === 'failed') {
                                throw new Error((repaired.error && repaired.error.message) || '重新合成失败');
                            }
                        }
                        throw new Error('重新合成超时');
                    } catch (repairError) {
                        console.error('[courseware.audio] runtime repair failed', repairError);
                        descEl.textContent = '第 ' + pageNo + ' 页配音自动修复失败：' + repairError.message + '。播放已停在当前页，请稍后重试。';
                        return false;
                    } finally {
                        runtimeAudioRepairPromise = null;
                    }
                })();
                return runtimeAudioRepairPromise;
            }

            for (let i = 0; i < maxAttempts; i++) {
                try {
                    const res = await fetch(`/api/v1/video/status?task_id=${encodeURIComponent(taskId)}`);
                    if (!res.ok) {
                        // 任务不存在（如服务端数据被清、历史里的 task_id 已失效）→ 提示重新生成，而非误导性的"重试"
                        if (res.status === 404) { descEl.textContent = '该视频已失效或已被清除，请返回搜索页重新生成。'; }
                        else { descEl.textContent = '查询失败，请重试。'; }
                        return;
                    }
                    const payload = await res.json();
                    const data = payload.data;
                    // 真课件 v2：format=2，pages 携带 scene + narration（逐句配音）
                    if (data.format === 2) {
                        window._isCourseware = true;
                        window._cwVoice = data.voice || '';
                        const _notesBtn = document.getElementById('notesToggleBtn');
                        if (_notesBtn) _notesBtn.style.display = '';
                        if (data.status === 'queued') descEl.textContent = '任务已提交，正在排队…';
                        else if (data.status === 'generating_outline') descEl.textContent = 'AI 正在规划真课件大纲… (' + (data.progress || 6) + '%)';
                        else if (data.status === 'generating_pages') descEl.textContent = '逐页生成中' + (data.pages_total ? '：第 ' + (data.pages_done || 0) + '/' + data.pages_total + ' 页' : '') + ' (' + (data.progress || 15) + '%)';
                        else if (data.status === 'generating_narration') descEl.textContent = 'AI 正在撰写逐句讲解脚本… (' + (data.progress || 45) + '%)';
                        else if (data.status === 'generating_tts') descEl.textContent = '正在合成逐句配音' + (data.tts_total ? '：' + (data.tts_done || 0) + '/' + data.tts_total + ' 句' : '') + ' (' + (data.progress || 65) + '%)';
                        else if (data.status === 'failed') {
                            descEl.textContent = '生成失败：' + (data.error?.message || '请稍后重试') + '。请返回重新生成。';
                            return;
                        }
                        else descEl.textContent = '准备就绪…';
                        if (data.pages?.length && data.status === 'slides_ready') {
                            const narration = data.pages.flatMap(page => Array.isArray(page.narration) ? page.narration : []);
                            const hasMissingAudio = narration.length === 0 || narration.some(sentence => !sentence || !sentence.audio);
                            // 兼容升级前已被错误标记为 ready 的无声任务：只自动修复一次，随后继续轮询新音频。
                            if (hasMissingAudio && !audioRepairAttempted) {
                                audioRepairAttempted = true;
                                descEl.textContent = '检测到课件配音缺失，正在自动修复…';
                                try {
                                    const repair = await fetch('/api/v1/courseware/resynth', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ task_id: taskId, voice: data.voice || 'zh-CN-XiaoxiaoNeural' })
                                    });
                                    if (repair.ok || repair.status === 409) {
                                        await new Promise(r => setTimeout(r, 1200));
                                        continue;
                                    }
                                    const repairPayload = await repair.json().catch(() => ({}));
                                    console.warn('[courseware.audio] automatic repair rejected', repairPayload);
                                } catch (repairError) {
                                    console.warn('[courseware.audio] automatic repair failed', repairError);
                                }
                            }
                            slides = data.pages;
                            window._slideStyle = data.style || '教学清新';
                            break;
                        }
                        await new Promise(r => setTimeout(r, 2000));
                        continue;
                    }
                    // 显示进度
                    if (data.status === 'queued') descEl.textContent = '任务已提交，正在排队…';
                    else if (data.status === 'generating_outline') descEl.textContent = 'AI 正在规划课程大纲… (' + (data.progress || 8) + '%)';
                    else if (data.status === 'generating_pages') descEl.textContent = '逐页生成中' + (data.pages_total ? '：第 ' + (data.pages_done || 0) + '/' + data.pages_total + ' 页' : '') + ' (' + (data.progress || 15) + '%)';
                    else if (data.status === 'generating') descEl.textContent = 'Qwen-Max 正在生成教学讲稿… (' + (data.progress || 20) + '%)';
                    else if (data.status === 'generating_tts') descEl.textContent = 'Qwen CosyVoice 正在合成语音配音… (' + (data.progress || 50) + '%)';
                    else if (data.status === 'failed') {
                        descEl.textContent = '生成失败：' + (data.error?.message || '请稍后重试') + '。请返回重新生成。';
                        return;
                    }
                    else descEl.textContent = '准备就绪…';
                    if (data.slides?.length && data.status === 'slides_ready') {
                        slides = data.slides;
                        audioUrl = data.audio_url;
                        window._slideAudioList = data.slide_audio || null;
                        window._slideImages = data.images || {};
                        window._slideStyle = data.style || '教学清新';
                        break;
                    }
                } catch (e) {
                    descEl.textContent = '查询状态失败：' + e.message;
                }
                await new Promise(r => setTimeout(r, 2000));
            }

            if (!slides.length) { descEl.textContent = '生成讲稿超时，请返回重试。'; return; }

            // 设置元数据
            document.getElementById('videoDuration').textContent = slides.length + ' 页';
            document.getElementById('videoScenes').textContent = 'Qwen-Max';
            document.getElementById('videoViews').textContent = 'AI生成';
            document.getElementById('sidebarCol').style.display = 'block';
            window._slidesData = slides;
            window._currentAudio = audioUrl;
            // 预加载音频元数据：保证进度条可立即拖动（无需先播放）
            if (audioUrl) {
                const preload = new Audio(audioUrl);
                preload.preload = 'metadata';
                window._preloadedAudio = preload;
            }
            renderSlides(slides);

            // 知识点标签
            const tagBox = document.querySelector('.video-tags');
            if (tagBox) {
                tagBox.innerHTML = slides.map(s => `<span style="display:inline-block;padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--text-dim);margin:2px 4px 2px 0;"># ${s.title}</span>`).join('');
            }

            // 构建 frontend-slides 固定 16:9 演示舞台（一次性渲染全部胶片）
            loadLessonQuiz(query, taskId);
            buildDeck(poster, slides);
            const deck = window._deck;
            // 手动翻页（键盘/滚轮/触屏，reason=user）时若正在播放则同步切换语音
            deck.onChange = function (e) {
                updateLessonProgress(taskId, { slideIndex: e.index });
                // 真课件模式：讲解推进由 CoursewarePlayer 接管，此处仅同步侧栏高亮
                if (window._cwPlayer) {
                    currentSlideIdx = e.index;
                    window._currentSlideIdx = e.index;
                    highlightScene(e.index);
                    return;
                }
                if (e.index === currentSlideIdx) { highlightScene(e.index); return; }
                currentSlideIdx = e.index;
                window._currentSlideIdx = e.index;
                highlightScene(e.index);
                if (e.reason === 'user' && isSlidePlaying) playPageAudio(e.index);
            };
            // 内联编辑：进入编辑态时暂停并锁定音视频，退出后恢复播放

            const padR = o.padR != null ? o.padR : 60;
            const padT = o.padT != null ? o.padT : 26;
            const padB = o.padB != null ? o.padB : 32;

            // ── 1. 解析为 {label, children} 树 ──
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            let tree = null;
            const hasArrow = lines.some(l => l.includes('->') || l.includes('→'));
            const hasSlash = lines.some(l => l.includes('/'));
            if (hasArrow || hasSlash) {
                // 路径列表格式：每条 "根 -> 子 -> 孙"（或 根/子/孙），按公共前缀合并成树
                const root = { label: null, children: [] };
                const sep = hasArrow ? /->|→/ : '/';
                lines.forEach(line => {
                    const parts = line.split(sep).map(s => s.trim()).filter(Boolean);
                    if (!parts.length) return;
                    let cur = root;
                    parts.forEach(p => {
                        let child = cur.children.find(c => c.label === p);
                        if (!child) { child = { label: p, children: [] }; cur.children.push(child); }
                        cur = child;
                    });
                });
                tree = root.children.length === 1 ? root.children[0] : root;
            } else {
                // 层级列表格式：每行一层，节点以 , 、 | 分隔
                const levels = lines.map(l => l.split(/[,，|]/).map(s => s.trim()).filter(Boolean));
                if (!levels.length || !levels[0].length) return '';
                tree = { label: levels[0][0], children: [] };
                let curLevel = [tree];
                for (let li = 1; li < levels.length; li++) {
                    const next = [];
                    const per = levels[li].length / Math.max(1, curLevel.length);
                    for (let i = 0; i < curLevel.length; i++) {
                        const start = Math.floor(i * per), end = Math.floor((i + 1) * per);
                        for (let ci = start; ci < end && ci < levels[li].length; ci++) {
                            const n = { label: levels[li][ci], children: [] };
                            curLevel[i].children.push(n);
                            next.push(n);
                        }
                    }
                    curLevel = next;
                }
            }
            if (!tree) return '';

            // ── 2. 先测量节点，再布局。坐标必须把圆半径算进去，否则首尾节点会被 SVG 裁切。 ──
            const textW = (s) => { let w = 0; const t = String(s || ''); for (let i = 0; i < t.length; i++) w += t.charCodeAt(i) > 255 ? 1 : 0.55; return w; };
            const nodeR = (label) => Math.max(baseR, Math.round(textW(label) * fontSize * 0.5 + 12));
            let leafCount = 0, maxDepth = 0, maxNodeR = baseR;
            (function walk(n, d) {
                maxDepth = Math.max(maxDepth, d);
                maxNodeR = Math.max(maxNodeR, nodeR(n.label));
                if (!n.children.length) leafCount++;
                n.children.forEach(c => walk(c, d + 1));
            })(tree, 0);
            const safePadL = Math.max(padL, maxNodeR + 8);
            const safePadR = Math.max(padR, maxNodeR + 8);
            const safePadT = Math.max(padT, maxNodeR + 8);
            const safePadB = Math.max(padB, maxNodeR + 8);
            const leafSpacing = (W - safePadL - safePadR) / Math.max(leafCount - 1, 1);
            const levelGap = (H - safePadT - safePadB) / Math.max(maxDepth, 1);
            let leafIdx = 0;
            (function assign(n, d) {
                n.y = safePadT + d * levelGap;
                if (!n.children.length) { n.x = safePadL + leafIdx * leafSpacing; leafIdx++; }
                else {
                    n.children.forEach(c => assign(c, d + 1));
                    const xs = n.children.map(c => c.x);
                    n.x = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
                }
            })(tree, 0);
            // ── 3. 节点半径按标签自适应，完整展示内容不截断 ──
            const edges = [], nodes = [];
            (function draw(n) {
                const r = nodeR(n.label);
                const x = n.x, y = n.y;
                nodes.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${accentLight}" stroke="${accent}" stroke-width="2.5"/>` +
                           `<text x="${x}" y="${y + fontSize * 0.35}" text-anchor="middle" fill="${accent}" font-size="${fontSize}" font-weight="700">${escT(n.label)}</text>`);
                n.children.forEach(c => {
                    edges.push(`<line x1="${x}" y1="${y + r}" x2="${c.x}" y2="${c.y - nodeR(c.label)}" stroke="#94a3b8" stroke-width="2"/>`);
                    draw(c);
                });
            })(tree);

            return edges.join('') + nodes.join('');
        }

        // 根据 diagram 数据生成 SVG 示意图
        function renderDiagram(dia, accent, accentLight, textMain) {
            if (!dia || dia.type === 'none' || !dia.data) return '';
            // 尝试 lieflat-charts 引擎（渐进式增强，失败则回退到原代码）
            if (typeof renderLieflatChart === 'function') {
                try {
                    const lfResult = renderLieflatChart(dia, accent, accentLight, textMain);
                    if (lfResult) return lfResult;
                } catch(e) { /* 回退到原代码 */ }
            }
            const W = 600, H = 200;
            const escape = (s) => String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const wrap = (s) => String(s).length > 9 ? String(s).slice(0,8)+'…' : s;
            const colors = [accent,'#22C55E','#F59E0B','#EF4444','#22C3E6','#A78BFA'];
            let svg = '';

            if (dia.type === 'pie_chart' || dia.type === 'pie') {
                const pairs = dia.data.split('|').map(function(p){var kv=p.split(':');return {k:kv[0].trim(),v:Number(kv[1])||0};});
                const total = pairs.reduce(function(s,p){return s+p.v;},0) || 1;
                const cx = 105, cy = H/2, r = 86;
                let a0 = -Math.PI/2, segs = '', legend = '';
                pairs.forEach(function(p, i){
                    const a1 = a0 + (p.v/total)*Math.PI*2;
                    const la = (a0+a1)/2, lx = cx + r*0.62*Math.cos(la), ly = cy + r*0.62*Math.sin(la);
                    const pct = (p.v/total*100).toFixed(0);
                    segs += '<path d="M'+cx+' '+cy+' L'+(cx+r*Math.cos(a0))+' '+(cy+r*Math.sin(a0))+' A'+r+' '+r+' 0 '+(a1-a0>Math.PI?1:0)+' 1 '+(cx+r*Math.cos(a1))+' '+(cy+r*Math.sin(a1))+' Z" fill="'+colors[i%colors.length]+'"/><text x="'+lx+'" y="'+ly+'" fill="#fff" font-size="15" text-anchor="middle" font-weight="700">'+pct+'%</text>';
                    const lx0 = W/2 + 24, ly0 = 32 + i*40;
                    legend += '<rect x="'+lx0+'" y="'+(ly0-13)+'" width="18" height="18" rx="4" fill="'+colors[i%colors.length]+'"/><text x="'+(lx0+28)+'" y="'+ly0+'" fill="'+textMain+'" font-size="16" font-weight="600">'+escape(p.k)+'</text><text x="'+(W-12)+'" y="'+ly0+'" text-anchor="end" fill="'+textMain+'" font-size="15">'+p.v+' · '+pct+'%</text>';
                    a0 = a1;
                });
                svg = segs + legend;
            } else if (dia.type === 'area_chart' || dia.type === 'area') {
                const pts = dia.data.split(/[|;]/).map(function(p){var kv=p.split(':'); return Number(kv[1]) || 0;});
                const maxv = Math.max.apply(null, pts.concat([1]));
                const padL = 60, padR = 36, padT = 30, padB = 42;
                const plotW = W - padL - padR, plotH = H - padT - padB, by2 = padT + plotH;
                const pw2 = plotW/Math.max(pts.length-1,1);
                let dp = '', fill = '', dots = '';
                pts.forEach(function(v,i){
                    const px = padL + i*pw2, py = by2 - (v/maxv)*plotH;
                    dp += (i?'L':'M')+px+' '+py;
                    fill += px+','+py+' ';
                    dots += '<circle cx="'+px+'" cy="'+py+'" r="5" fill="'+accent+'" stroke="#fff" stroke-width="2"/><text x="'+px+'" y="'+(py-10)+'" text-anchor="middle" fill="'+textMain+'" font-size="13" font-weight="700">'+v+'</text>';
                });
                fill += ' '+(padL+(pts.length-1)*pw2)+','+by2+' '+padL+','+by2;
                svg = '<polygon points="'+fill.trim()+'" fill="'+accent+'" opacity="0.15"/><path d="'+dp+'" fill="none" stroke="'+accent+'" stroke-width="3" stroke-linejoin="round"/>'+dots;
            } else if (dia.type === 'formula') {
                return `<div style="margin-top:14px;padding:18px;background:${accentLight};border-radius:10px;text-align:center;border-left:4px solid ${accent};"><div style="font-size:24px;color:${accent};font-weight:700;">${renderMathExpr(dia.data, true)}</div>${dia.caption ? `<div style="font-size:13px;color:${textMain};margin-top:8px;">${escape(dia.caption)}</div>` : ''}</div>`;
            }

            if (dia.type === 'flow') {
                const steps = dia.data.split('->').map(s => s.trim()).filter(Boolean);
                const y = H/2;
                const w = Math.min(150, Math.max(110, steps.length ? (W - 120) / steps.length : 150));
                const gap = steps.length > 1 ? (W - steps.length*w) / (steps.length - 1) : 0;
                const startX = (W - (steps.length*w + (steps.length-1)*gap)) / 2;
                let nodes = '', arrows = '';
                steps.forEach((step, i) => {
                    const x = startX + (w+gap)*i + w/2;
                    nodes += `<rect x="${x - w/2}" y="${y - 30}" width="${w}" height="60" rx="12" fill="${accentLight}" stroke="${accent}" stroke-width="2.5"/><text x="${x}" y="${y + 7}" text-anchor="middle" fill="${accent}" font-size="17" font-weight="700">${escape(wrap(step))}</text>`;
                    if (i < steps.length - 1) {
                        const nx = startX + (w+gap)*(i+1) + w/2;
                        arrows += `<line x1="${x + w/2}" y1="${y}" x2="${nx - w/2 - 4}" y2="${y}" stroke="${accent}" stroke-width="2.5" marker-end="url(#arrow)"/>`;
                    }
                });
                svg = `<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L12,4 z" fill="${accent}"/></marker></defs>${arrows}${nodes}`;
            } else if (dia.type === 'array') {
                const [vals, highlight] = dia.data.includes('|') ? dia.data.split('|') : [dia.data, ''];
                const items = vals.split(',').map(s => s.trim()).filter(Boolean);
                const gap = items.length > 8 ? 5 : 8;
                const cellW = Math.max(34, Math.min(84, (W - 40 - Math.max(0, items.length - 1) * gap) / Math.max(items.length, 1)));
                const totalW = items.length*cellW + (items.length-1)*gap;
                const startX = (W - totalW) / 2;
                const y = H/2 - 40;
                const hl = new Set(highlight.split(',').map(s => s.trim()).filter(Boolean).map(Number));
                let rects = '', idxs = '';
                items.forEach((v, i) => {
                    const x = startX + i*(cellW+gap);
                    const fill = hl.has(i) ? accent : '#fff';
                    const color = hl.has(i) ? '#fff' : textMain;
                    // 长整数分成两行并按单行最大宽度缩放，禁止文字越过相邻单元格。
                    const chunks = v.length > 6 ? [v.slice(0, Math.ceil(v.length / 2)), v.slice(Math.ceil(v.length / 2))] : [v];
                    const maxUnits = Math.max.apply(null, chunks.map(function(part){ return Array.from(part).reduce(function(sum,ch){ return sum + (ch.charCodeAt(0) > 255 ? 1 : .58); }, 0); }));
                    const valueSize = Math.max(11, Math.min(19, Math.floor((cellW - 10) / Math.max(maxUnits, 1))));
                    const valueText = chunks.length === 1
                        ? `<text x="${x + cellW/2}" y="${y + 44}" text-anchor="middle" fill="${color}" font-size="${valueSize}" font-weight="700">${escape(chunks[0])}</text>`
                        : `<text x="${x + cellW/2}" y="${y + 31}" text-anchor="middle" fill="${color}" font-size="${valueSize}" font-weight="700"><tspan x="${x + cellW/2}" dy="0">${escape(chunks[0])}</tspan><tspan x="${x + cellW/2}" dy="${valueSize + 3}">${escape(chunks[1])}</tspan></text>`;
                    rects += `<rect x="${x}" y="${y}" width="${cellW}" height="72" rx="8" fill="${fill}" stroke="${accent}" stroke-width="2.5"/>${valueText}`;
                    idxs += `<text x="${x + cellW/2}" y="${y + 92}" text-anchor="middle" fill="${textMain}" font-size="14">${i}</text>`;
                });
                svg = `${rects}${idxs}`;
            } else if (dia.type === 'compare') {
                const rows = dia.data.split('\n').filter(l => l.trim()).map(l => l.split('|').map(s => s.trim()));
                const cols = Math.max(...rows.map(r => r.length));
                const colW = (W - 48) / cols;
                const rowH = Math.min(60, (H - 16) / rows.length);
                const startY = (H - rows.length * rowH) / 2;
                let table = '';
                rows.forEach((row, r) => {
                    row.forEach((cell, c) => {
                        const x = 24 + c * colW;
                        const y = startY + r * rowH;
                        const isHeader = r === 0;
                        const fill = isHeader ? accent : (c === 0 ? accentLight : '#fff');
                        const color = isHeader ? '#fff' : (c === 0 ? accent : textMain);
                        table += `<rect x="${x}" y="${y}" width="${colW}" height="${rowH}" rx="4" fill="${fill}" stroke="#e2e8f0"/><text x="${x + colW/2}" y="${y + rowH/2 + 8}" text-anchor="middle" fill="${color}" font-size="17" font-weight="${isHeader||c===0?700:400}">${escape(wrap(cell))}</text>`;
                    });
                });
                svg = table;
            } else if (dia.type === 'tree') {
                svg = renderTreeSvg(dia.data, accent, accentLight, textMain, W, H);
            } else if (dia.type === 'line_chart' || dia.type === 'bar_chart') {
                // 兼容两种格式："标签1:5|标签2:8|标签3:3" 或 "1,5;2,8;3,3"
                const isBar = dia.type === 'bar_chart';
                let labels = [], values = [];
                const d = String(dia.data || '');
                if (d.includes('|')) {
                    d.split('|').map(p => p.trim()).filter(Boolean).forEach(p => {
                        const i = p.indexOf(':');
                        if (i > 0) { labels.push(p.slice(0, i).trim()); const v = parseFloat(p.slice(i + 1)); if (!isNaN(v)) values.push(v); }
                    });
                } else {
                    d.split(';').map(p => p.trim()).filter(Boolean).forEach(p => {
                        const parts = p.split(',');
                        if (parts.length >= 2) { labels.push(parts[0].trim()); const v = parseFloat(parts[1]); if (!isNaN(v)) values.push(v); }
                    });
                }
                if (values.length) {
                    const padL = 64, padR = 40, padT = 30, padB = 44;
                    const plotW = W - padL - padR, plotH = H - padT - padB;
                    const maxV = Math.max(...values, 1) * 1.1;
                    const xOf = (i) => padL + (values.length > 1 ? i / (values.length - 1) : 0.5) * plotW;
                    const yOf = (v) => padT + plotH - (v / maxV) * plotH;
                    const grid = [0.25, 0.5, 0.75, 1].map(g => `<line x1="${padL}" y1="${padT + plotH * (1 - g)}" x2="${padL + plotW}" y2="${padT + plotH * (1 - g)}" stroke="#eef2f7" stroke-width="1"/>`).join('');
                    const xLabels = labels.map((l, i) => `<text x="${xOf(i)}" y="${padT + plotH + 20}" text-anchor="middle" fill="#64748b" font-size="14">${escape(wrap(l))}</text>`).join('');
                    if (isBar) {
                        const bw = Math.min(52, plotW / Math.max(values.length, 1) * 0.62);
                        svg = grid + values.map((v, i) => `<rect x="${xOf(i) - bw / 2}" y="${yOf(v)}" width="${bw}" height="${Math.max(1, padT + plotH - yOf(v))}" fill="${colors[i % colors.length]}" rx="6" opacity=".88"/><text x="${xOf(i)}" y="${yOf(v) - 8}" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="700">${escape(v)}</text>`).join('') + xLabels;
                    } else {
                        const pts = values.map((v, i) => `${xOf(i)},${yOf(v)}`).join(' ');
                        svg = grid + `<polyline points="${pts}" fill="none" stroke="${colors[0]}" stroke-width="3.5" stroke-linejoin="round"/>` + values.map((v, i) => `<circle cx="${xOf(i)}" cy="${yOf(v)}" r="6" fill="${colors[0]}" stroke="#fff" stroke-width="2"/><text x="${xOf(i)}" y="${yOf(v) - 11}" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="700">${escape(v)}</text>`).join('') + xLabels;
                    }
                }
            } else if (dia.type === 'complexity_curve') {
                // 多复杂度曲线对比："O(1)=1,4,16,64,256;O(n)=1,4,16,64,256;O(n²)=1,16,256,1024,4096"，横坐标 n=1,4,16,64,256
                const d = String(dia.data || '');
                const series = d.split(';').map(s => s.trim()).filter(Boolean).map(s => {
                    const eq = s.indexOf('=');
                    const name = eq > 0 ? s.slice(0, eq).trim() : s;
                    const vals = (eq > 0 ? s.slice(eq + 1) : s).split(',').map(v => parseFloat(v.trim())).filter(n => !isNaN(n) && n > 0);
                    return { name, vals };
                }).filter(s => s.vals.length > 0);
                const xs = [1, 4, 16, 64, 256];
                const padL = 64, padR = 54, padT = 30, padB = 44;
                const plotW = W - padL - padR, plotH = H - padT - padB;
                const allVals = series.flatMap(s => s.vals);
                const minY = Math.min(...allVals), maxY = Math.max(...allVals);
                const logMin = Math.log(Math.max(minY, 1)), logMax = Math.log(Math.max(maxY, logMin + 1));
                const xOf = (n) => padL + (Math.log(n) - Math.log(1)) / (Math.log(256) - Math.log(1)) * plotW;
                const yOf = (v) => padT + plotH - (Math.log(v) - logMin) / (logMax - logMin) * plotH;
                const grid = xs.map(n => `<line x1="${xOf(n)}" y1="${padT}" x2="${xOf(n)}" y2="${padT + plotH}" stroke="#eef2f7" stroke-width="1"/><text x="${xOf(n)}" y="${padT + plotH + 20}" text-anchor="middle" fill="#64748b" font-size="13">${n}</text>`).join('');
                const yLabels = [1, 10, 100, 1000, 10000].filter(v => v >= minY && v <= maxY * 1.05).map(v => `<line x1="${padL}" y1="${yOf(v)}" x2="${padL + plotW}" y2="${yOf(v)}" stroke="#eef2f7" stroke-width="1"/><text x="${padL - 6}" y="${yOf(v) + 4}" text-anchor="end" fill="#64748b" font-size="12">${v}</text>`).join('');
                let paths = '', legend = '';
                series.forEach((s, si) => {
                    const color = colors[si % colors.length];
                    const pts = s.vals.map((v, i) => `${xOf(xs[i] || (i + 1))},${yOf(v)}`).join(' ');
                    paths += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>` + s.vals.map((v, i) => `<circle cx="${xOf(xs[i] || (i + 1))}" cy="${yOf(v)}" r="4.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>`).join('');
                    legend += `<text x="${padL + plotW + 10}" y="${padT + 18 + si * 22}" fill="${color}" font-size="14" font-weight="700">${escape(s.name)}</text>`;
                });
                svg = `${grid}${yLabels}${paths}${legend}`;
            } else if (dia.type === 'scatter_chart' || dia.type === 'scatter') {
                // 散点图：数据 "x,y;x,y;..."，展示数据分布/相关性
                const sp = String(dia.data || '').trim();
                const pts = sp.includes(';') || sp.includes(',')
                    ? sp.split(';').map(p => p.trim()).filter(Boolean).map(p => {
                        const i = p.indexOf(',');
                        const x = i > 0 ? parseFloat(p.slice(0, i)) : NaN;
                        const y = i > 0 ? parseFloat(p.slice(i + 1)) : NaN;
                        return { x, y };
                      }).filter(p => isFinite(p.x) && isFinite(p.y))
                    : [];
                if (pts.length) {
                    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
                    const minX = Math.min(...xs), maxX = Math.max(...xs);
                    const minY = Math.min(...ys), maxY = Math.max(...ys);
                    const padL = 60, padR = 44, padT = 30, padB = 46;
                    const plotW = W - padL - padR, plotH = H - padT - padB;
                    const xOf = (x) => padL + ((x - minX) / (maxX - minX || 1)) * plotW;
                    const yOf = (y) => padT + plotH - ((y - minY) / (maxY - minY || 1)) * plotH;
                    const grid = [0.25, 0.5, 0.75, 1].map(g => `<line x1="${padL}" y1="${padT + plotH * (1 - g)}" x2="${padL + plotW}" y2="${padT + plotH * (1 - g)}" stroke="#eef2f7" stroke-width="1"/>`).join('');
                    const dots = pts.map((p, i) => `<circle cx="${xOf(p.x)}" cy="${yOf(p.y)}" r="7" fill="${colors[i % 6]}" opacity=".9" stroke="#fff" stroke-width="1.5"/>`).join('');
                    const axes = `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#cbd5e1" stroke-width="2"/><line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="#cbd5e1" stroke-width="2"/>`;
                    const ticks = `<text x="${padL - 8}" y="${padT + 16}" text-anchor="end" fill="#64748b" font-size="13">${maxY}</text><text x="${padL - 8}" y="${padT + plotH + 16}" text-anchor="end" fill="#64748b" font-size="13">${minY}</text><text x="${padL + 8}" y="${padT + plotH + 20}" fill="#64748b" font-size="13">${minX}</text><text x="${padL + plotW}" y="${padT + plotH + 20}" text-anchor="end" fill="#64748b" font-size="13">${maxX}</text>`;
                    svg = grid + axes + ticks + dots;
                }
            } else if (dia.type === 'donut_chart' || dia.type === 'donut') {
                // 环形图：数据 "标签:值|标签:值"，中间显示总数/核心数值
                const dp = String(dia.data || '').split('|').map(p => { const kv = p.split(':'); return { k: kv[0].trim(), v: Number(kv[1]) || 0 }; }).filter(p => p.v > 0);
                const total = dp.reduce((s, p) => s + p.v, 0) || 1;
                const cx = 120, cy = H/2, r = 92, inner = r * 0.62;
                let a0 = -Math.PI / 2, segs = '', legend = '';
                dp.forEach((p, i) => {
                    const a1 = a0 + (p.v / total) * Math.PI * 2;
                    const large = (a1 - a0) > Math.PI ? 1 : 0;
                    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
                    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
                    const xi0 = cx + inner * Math.cos(a0), yi0 = cy + inner * Math.sin(a0);
                    const xi1 = cx + inner * Math.cos(a1), yi1 = cy + inner * Math.sin(a1);
                    const la = (a0 + a1) / 2, lx = cx + (r + inner) / 2 * Math.cos(la), ly = cy + (r + inner) / 2 * Math.sin(la);
                    const pct = (p.v / total * 100).toFixed(0);
                    segs += `<path d="M${xi0} ${yi0} L${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} L${xi1} ${yi1} A${inner} ${inner} 0 ${large} 0 ${xi0} ${yi0} Z" fill="${colors[i % colors.length]}"/><text x="${lx}" y="${ly}" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">${pct}%</text>`;
                    const lx0 = W/2 + 20, ly0 = 32 + i * 40;
                    legend += `<rect x="${lx0}" y="${ly0 - 13}" width="18" height="18" rx="4" fill="${colors[i % colors.length]}"/><text x="${lx0 + 28}" y="${ly0}" fill="${textMain}" font-size="16" font-weight="600">${escape(p.k)}</text><text x="${W - 12}" y="${ly0}" text-anchor="end" fill="${textMain}" font-size="15">${p.v} · ${pct}%</text>`;
                    a0 = a1;
                });
                svg = segs + `<text x="${cx}" y="${cy - 4}" text-anchor="middle" fill="${accent}" font-size="30" font-weight="800">${total}</text><text x="${cx}" y="${cy + 22}" text-anchor="middle" fill="#64748b" font-size="14">总计</text>` + legend;
            } else if (dia.type === 'funnel') {
                // 漏斗图：数据 "阶段:数量|阶段:数量"（逐级递减），展示转化链路
                const stages = String(dia.data || '').split('|').map(p => { const kv = p.split(':'); return { k: kv[0].trim(), v: Number(kv[1]) || 0 }; }).filter(p => p.v > 0);
                if (stages.length) {
                    const maxV = Math.max(...stages.map(s => s.v), 1);
                    const bw0 = W - 120, bh = H / stages.length, cx = W / 2;
                    let fg = '';
                    stages.forEach((s, i) => {
                        const wCur = bw0 * (s.v / maxV);
                        const wNext = i < stages.length - 1 ? bw0 * (stages[i + 1].v / maxV) : wCur * 0.6;
                        const y0 = i * bh + 6, y1 = (i + 1) * bh - 6;
                        const color = colors[i % colors.length];
                        let shape;
                        if (i === stages.length - 1) {
                            shape = `<rect x="${cx - wCur / 2}" y="${y0}" width="${wCur}" height="${y1 - y0}" rx="10" fill="${color}"/>`;
                        } else {
                            shape = `<polygon points="${cx - wCur / 2},${y0} ${cx + wCur / 2},${y0} ${cx + wNext / 2},${y1} ${cx - wNext / 2},${y1}" fill="${color}" opacity=".92"/>`;
                        }
                        fg += `<g>${shape}<text x="${cx}" y="${(y0 + y1) / 2 + 6}" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">${escape(wrap(s.k))}</text><text x="${cx}" y="${(y0 + y1) / 2 + 30}" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">${s.v}</text></g>`;
                    });
                    svg = fg;
                }
            } else if (dia.type === 'radar_chart' || dia.type === 'radar') {
                // 雷达图：数据 "指标:得分|指标:得分"（多维属性对比）
                const axes = String(dia.data || '').split('|').map(p => { const kv = p.split(':'); return { k: kv[0].trim(), v: Number(kv[1]) || 0 }; }).filter(p => p.k);
                if (axes.length >= 3) {
                    const maxV = Math.max(...axes.map(a => a.v), 1) * 1.2;
                    const cx = W / 2, cy = H / 2 + 6, r = Math.min(W, H) / 2 - 42;
                    const n = axes.length;
                    const pt = (i, scale) => { const ang = -Math.PI / 2 + (i / n) * Math.PI * 2; return { x: cx + r * scale * Math.cos(ang), y: cy + r * scale * Math.sin(ang) }; };
                    let grid = '', spokes = '';
                    for (let g = 1; g <= 4; g++) {
                        const poly = Array.from({ length: n }, (_, i) => { const p = pt(i, g / 4); return `${p.x},${p.y}`; }).join(' ');
                        grid += `<polygon points="${poly}" fill="${g === 4 ? accentLight : 'none'}" stroke="#cbd5e1" stroke-width="1.5"/>`;
                    }
                    axes.forEach((a, i) => { const p = pt(i, 1); spokes += `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#e2e8f0" stroke-width="1.5"/>`; });
                    const dataPoly = axes.map((a, i) => { const p = pt(i, a.v / maxV); return `${p.x},${p.y}`; }).join(' ');
                    const dataPts = axes.map((a, i) => { const p = pt(i, a.v / maxV); return `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${accent}" stroke="#fff" stroke-width="2"/>`; }).join('');
                    const labels = axes.map((a, i) => { const p = pt(i, 1.3); return `<text x="${p.x}" y="${p.y + 4}" text-anchor="middle" fill="#64748b" font-size="14" font-weight="700">${escape(wrap(a.k))}</text>`; }).join('');
                    svg = grid + spokes + `<polygon points="${dataPoly}" fill="${accent}" opacity="0.28"/><polyline points="${dataPoly}" fill="none" stroke="${accent}" stroke-width="3" stroke-linejoin="round"/>` + dataPts + labels;
                }
            } else if (dia.type === 'bubble_chart' || dia.type === 'bubble') {
                // 气泡图：数据 "名称:x,y,大小;名称:x,y,大小"（大小>0），展示分布与量级
                const bb = String(dia.data || '').split(';').map(p => p.trim()).filter(Boolean).map(p => {
                    const ci = p.indexOf(':');
                    let name = '', nums = p;
                    if (ci > 0) { name = p.slice(0, ci).trim(); nums = p.slice(ci + 1); }
                    const parts = nums.split(',').map(Number);
                    return { name, x: parts[0], y: parts[1], r: isFinite(parts[2]) ? Math.abs(parts[2]) : 1 };
                }).filter(b => isFinite(b.x) && isFinite(b.y));
                if (bb.length) {
                    const xs = bb.map(b => b.x), ys = bb.map(b => b.y);
                    const minX = Math.min(...xs), maxX = Math.max(...xs);
                    const minY = Math.min(...ys), maxY = Math.max(...ys);
                    const padL = 60, padR = 44, padT = 34, padB = 46;
                    const plotW = W - padL - padR, plotH = H - padT - padB;
                    const xOf = (x) => padL + ((x - minX) / (maxX - minX || 1)) * plotW;
                    const yOf = (y) => padT + plotH - ((y - minY) / (maxY - minY || 1)) * plotH;
                    const maxR = Math.max(...bb.map(b => b.r), 1);
                    const grid = [0.25, 0.5, 0.75, 1].map(g => `<line x1="${padL}" y1="${padT + plotH * (1 - g)}" x2="${padL + plotW}" y2="${padT + plotH * (1 - g)}" stroke="#eef2f7" stroke-width="1"/>`).join('');
                    const bubs = bb.map((b, i) => {
                        const bx = xOf(b.x), by = yOf(b.y), br = 6 + (b.r / maxR) * 26;
                        return `<circle cx="${bx}" cy="${by}" r="${br}" fill="${colors[i % 6]}" opacity=".55" stroke="${colors[i % 6]}" stroke-width="2"/>` + (b.name ? `<text x="${bx}" y="${by - br - 6}" text-anchor="middle" fill="${textMain}" font-size="13" font-weight="600">${escape(wrap(b.name))}</text>` : '');
                    }).join('');
                    const axes = `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#cbd5e1" stroke-width="2"/><line x1="${padL}" y1="${padT + plotH}" x2="${padL + plotW}" y2="${padT + plotH}" stroke="#cbd5e1" stroke-width="2"/>`;
                    svg = grid + axes + bubs;
                }
            } else if (dia.type === 'waterfall') {
                // 瀑布图：数据 "阶段:增减值|阶段:增减值"，展示累计分解
                const st = String(dia.data || '').split(/[|;]/).map(p => { const kv = p.split(':'); return { k: kv[0].trim(), v: Number(kv[1]) || 0 }; }).filter(p => p.k);
                if (st.length) {
                    const padL = 64, padR = 36, padT = 36, padB = 44;
                    const plotW = W - padL - padR, plotH = H - padT - padB;
                    const step = plotW / Math.max(st.length, 1), bw = Math.min(70, plotW / Math.max(st.length, 1) * 0.55);
                    let cum = 0, maxAbs = 0;
                    st.forEach(s => { cum += s.v; maxAbs = Math.max(maxAbs, Math.abs(cum), Math.abs(s.v)); });
                    const baseY = padT + plotH, scale = plotH / (maxAbs * 1.15 || 1);
                    let cum2 = 0, out = '';
                    st.forEach((s, i) => {
                        const x = padL + i * step + (step - bw) / 2;
                        const barTop = baseY - Math.max(cum2, cum2 + s.v) * scale;
                        const barBot = baseY - Math.min(cum2, cum2 + s.v) * scale;
                        const color = s.v >= 0 ? '#22C55E' : '#EF4444';
                        out += `<rect x="${x}" y="${barTop}" width="${bw}" height="${Math.max(1, barBot - barTop)}" rx="4" fill="${color}" opacity=".9"/><text x="${x + bw / 2}" y="${barTop - 8}" text-anchor="middle" fill="${textMain}" font-size="14" font-weight="700">${s.v > 0 ? '+' : ''}${s.v}</text><text x="${x + bw / 2}" y="${baseY + 20}" text-anchor="middle" fill="#64748b" font-size="13">${escape(wrap(s.k))}</text>`;
                        if (i < st.length - 1) {
                            const nx = padL + (i + 1) * step + (step - bw) / 2;
                            out += `<line x1="${x + bw + 6}" y1="${baseY - (cum2 + s.v) * scale}" x2="${nx - 6}" y2="${baseY - (cum2 + s.v) * scale}" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>`;
                        }
                        cum2 += s.v;
                    });
                    svg = out;
                }
            } else if (dia.type === 'gauge') {
                // 仪表盘：数据 "指标:0-100 数值"，展示达成率/占比
                const gp = String(dia.data || '').trim();
                const ci = gp.indexOf(':');
                const label = ci > 0 ? gp.slice(0, ci).trim() : '完成度';
                const val = Math.max(0, Math.min(100, parseFloat(ci > 0 ? gp.slice(ci + 1) : gp) || 0));
                const cx = W / 2, cy = 104, r = 62;
                const a1 = Math.PI * (1 - val / 100);
                const x1 = cx + r * Math.cos(a1), y1 = cy - r * Math.sin(a1);
                const bgArc = `<path d="M${cx - r} ${cy} A${r} ${r} 0 0 0 ${cx + r} ${cy}" fill="none" stroke="#e2e8f0" stroke-width="24" stroke-linecap="round"/>`;
                const fgArc = val > 0 ? `<path d="M${cx - r} ${cy} A${r} ${r} 0 0 0 ${x1} ${y1}" fill="none" stroke="${accent}" stroke-width="24" stroke-linecap="round"/>` : '';
                const needle = `<line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="9" fill="#1e293b"/>`;
                const txt = `<text x="${cx}" y="${cy + 46}" text-anchor="middle" fill="${accent}" font-size="40" font-weight="800">${val}%</text><text x="${cx}" y="${cy + 70}" text-anchor="middle" fill="#64748b" font-size="17" font-weight="600">${escape(label)}</text><text x="${cx - r - 8}" y="${cy + 18}" text-anchor="middle" fill="#94a3b8" font-size="14">0</text><text x="${cx + r + 8}" y="${cy + 18}" text-anchor="middle" fill="#94a3b8" font-size="14">100</text>`;
                svg = bgArc + fgArc + needle + txt;
            } else if (dia.type === 'heatmap' || dia.type === 'heatmap_chart') {
                // 热力图：数值网格（首行可为列标签），展示矩阵强度
                const lines = String(dia.data || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                let colLabels = null, rows = [];
                lines.forEach((ln, li) => {
                    if (li === 0 && ln.indexOf(':') < 0 && ln.split(',').every(t => isNaN(parseFloat(t.trim())))) {
                        colLabels = ln.split(',').map(s => s.trim()).filter(Boolean);
                        return;
                    }
                    const ci = ln.indexOf(':');
                    const rowLabel = ci > 0 ? ln.slice(0, ci).trim() : '';
                    const nums = (ci > 0 ? ln.slice(ci + 1) : ln).split(',').map(s => parseFloat(s.trim())).filter(n => isFinite(n));
                    if (nums.length) rows.push({ label: rowLabel, vals: nums });
                });
                if (rows.length) {
                    const cols = colLabels ? colLabels.length : Math.max(...rows.map(r => r.vals.length));
                    const allV = rows.flatMap(r => r.vals);
                    const vMin = Math.min(...allV), vMax = Math.max(...allV), span = (vMax - vMin) || 1;
                    const labelW = rows.some(r => r.label) ? 96 : 24;
                    const padL = labelW, padT = colLabels ? 36 : 14;
                    const cellW = (W - padL - 24) / cols, cellH = Math.min(46, (H - padT - 18) / rows.length);
                    const startY = padT + Math.max(0, (H - padT - cellH * rows.length - 16) / 2);
                    const c1 = { r: 224, g: 231, b: 255 }, c2 = { r: 79, g: 70, b: 229 };
                    let out = '';
                    if (colLabels) colLabels.forEach((c, ci) => { const x = padL + ci * cellW + cellW / 2; out += `<text x="${x}" y="${startY - 12}" text-anchor="middle" fill="#64748b" font-size="14" font-weight="600">${escape(wrap(c))}</text>`; });
                    rows.forEach((r, ri) => {
                        const y = startY + ri * cellH;
                        if (r.label) out += `<text x="${padL - 12}" y="${y + cellH / 2 + 5}" text-anchor="end" fill="${textMain}" font-size="14" font-weight="600">${escape(wrap(r.label))}</text>`;
                        r.vals.slice(0, cols).forEach((v, ci) => {
                            const t = (v - vMin) / span;
                            const rr = Math.round(c1.r + (c2.r - c1.r) * t), gg = Math.round(c1.g + (c2.g - c1.g) * t), bb = Math.round(c1.b + (c2.b - c1.b) * t);
                            const x = padL + ci * cellW + 2;
                            out += `<rect x="${x}" y="${y + 2}" width="${cellW - 4}" height="${cellH - 4}" rx="6" fill="rgb(${rr},${gg},${bb})" stroke="#ffffff" stroke-width="1.5"/><text x="${x + (cellW - 4) / 2}" y="${y + cellH / 2 + 5}" text-anchor="middle" fill="${t > 0.55 ? '#fff' : '#1e293b'}" font-size="14" font-weight="700">${v}</text>`;
                        });
                    });
                    svg = out;
                }
            }

            if (!svg) return '';
            const caption = dia.caption ? `<div style="text-align:center;font-size:16px;color:${textMain};margin-top:8px;line-height:1.4;">${escape(dia.caption)}</div>` : '';
            return `<div style="margin-top:14px;background:#f8fafc;border-radius:12px;padding:16px;border:1px solid #e2e8f0;"><svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto;aspect-ratio:${W}/${H};"><g>${svg}</g></svg>${caption}</div>`;
        }

        // 渲染单个 visual 元素为紧凑卡片
        function renderVisual(v, accent, accentLight, textMain, textSub) {
            if (!v || !v.type) return '';
            const esc = (s) => String(s || '').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            const d = String(v.data || '');
            const caption = v.caption ? `<div style="font-size:16px;color:${textSub};text-align:center;margin-top:8px;line-height:1.4;">${esc(v.caption)}</div>` : '';

            // 紧凑表格
            if (v.type === 'table' && d.includes('|')) {
                const rows = d.split('\n').filter(l => l.trim());
                const ths = rows[0].split('|').map(c => `<th style="padding:8px 10px;background:${accent};color:#fff;font-weight:600;font-size:18px;text-align:left;">${c.trim()}</th>`).join('');
                const tds = rows.slice(1).map(row => row.split('|').map((c,ci) => `<td style="padding:7px 10px;font-size:18px;background:${ci===0?accentLight:'#fff'};color:${ci===0?accent:textMain};font-weight:${ci===0?'700':'400'};">${c.trim()}</td>`).join('')).map(r => `<tr>${r}</tr>`).join('');
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px;overflow:hidden;"><table style="width:100%;border-collapse:collapse;">${ths?`<thead><tr>${ths}</tr></thead>`:''}<tbody>${tds}</tbody></table>${caption}</div>`;
            }
            // 要点列表
            if (v.type === 'list') {
                const items = d.split('\n').filter(l => l.trim()).map(l => l.replace(/^[-••]\s*/, ''));
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px;"><ul style="margin:0;padding-left:22px;font-size:20px;color:${textMain};line-height:1.5;">${items.map(it => `<li style="margin-bottom:4px;">${esc(it)}</li>`).join('')}</ul>${caption}</div>`;
            }
            // 代码块（深色代码卡片，可带语言标注）
            if (v.type === 'code') {
                const langLabel = v.lang || 'code';
                return `<div class="visual-card" style="background:#0f172a;border-radius:8px;overflow:hidden;"><div style="padding:5px 12px;font-size:14px;letter-spacing:1px;color:#8fa3c0;background:#1e293b;text-transform:uppercase;font-family:Consolas,Menlo,monospace;">${esc(langLabel)}</div><pre style="margin:0;padding:10px 12px;overflow-x:auto;font-size:17px;line-height:1.5;color:#e2e8f0;font-family:Consolas,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;">${esc(d)}</pre>${caption}</div>`;
            }
            // 公式（KaTeX 渲染）
            if (v.type === 'formula') {
                return `<div class="visual-card" style="background:${accentLight};border:1px solid ${accent};border-radius:8px;padding:14px;text-align:center;"><span style="font-size:18px;color:${accent};font-weight:700;">${renderMathExpr(d, false)}</span>${caption}</div>`;
            }
            // 强调框
            if (v.type === 'highlight') {
                return `<div class="visual-card" style="background:${accent};color:#fff;border-radius:8px;padding:14px 16px;font-size:19px;font-weight:600;text-align:center;line-height:1.45;overflow-wrap:anywhere;">${esc(d)}${caption ? `<div style="font-size:15px;opacity:.86;margin-top:6px;">${esc(v.caption)}</div>` : ''}</div>`;
            }
            // 标签云
            if (v.type === 'badge') {
                return `<div class="visual-card" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:12px;">${d.split(',').map(w => `<span style="display:inline-block;background:${accentLight};color:${accent};padding:5px 11px;border-radius:16px;font-size:16px;font-weight:600;border:1px solid ${accent};">${esc(w.trim())}</span>`).join('')}${caption}</div>`;
            }
            // 引用框
            if (v.type === 'quote') {
                return `<div class="visual-card" style="background:#f8fafc;border-left:4px solid ${accent};border-radius:4px;padding:14px 16px;font-size:18px;color:${textMain};font-style:italic;line-height:1.5;">"${esc(d)}"${caption}</div>`;
            }
            // 流程图
            if (v.type === 'flow') {
                const steps = d.split('->').map(s => s.trim()).filter(Boolean);
                const w = steps.map(s => Math.min(80, Math.max(50, s.length * 9)));
                const totalW = w.reduce((a, b) => a + b + 30, 0);
                const nodes = steps.map((s,i) => {
                    const left = w.slice(0,i).reduce((a,b)=>a+b+30,0);
                    return `<rect x="${left}" y="8" width="${w[i]}" height="38" rx="7" fill="${accentLight}" stroke="${accent}" stroke-width="1.5"/><text x="${left+w[i]/2}" y="33" text-anchor="middle" fill="${accent}" font-size="14" font-weight="600">${esc(s.length>6?s.slice(0,5)+'…':s)}</text>${i<steps.length-1?`<line x1="${left+w[i]}" y1="27" x2="${left+w[i]+14}" y2="27" stroke="${accent}" stroke-width="1.5" marker-end="url(#va)"/>`:''}`;
                }).join('');
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px;overflow:hidden;"><svg viewBox="0 0 ${totalW+20} 52" width="100%" height="52"><defs><marker id="va" markerWidth="8" markerHeight="8" refX="7" refY="2" orient="auto"><path d="M0,0 L0,4 L7,2 z" fill="${accent}"/></marker></defs>${nodes}</svg>${caption}</div>`;
            }
            // 数组
            if (v.type === 'array') {
                const [vals, hl] = d.includes('|') ? d.split('|') : [d, ''];
                const items = vals.split(',').map(s => s.trim()).filter(Boolean);
                const hlSet = new Set(hl.split(',').map(s=>s.trim()).filter(Boolean).map(Number));
                const cells = items.map((val, i) => {
                    const cellFont = Math.max(12, Math.min(18, Math.floor(88 / Math.max(String(val).length, 1))));
                    return `<div style="flex:1;min-width:52px;max-width:92px;padding:10px 6px;text-align:center;font-weight:700;font-size:${cellFont}px;line-height:1.25;overflow-wrap:anywhere;word-break:break-all;background:${hlSet.has(i)?accent:'#fff'};color:${hlSet.has(i)?'#fff':accent};border:2px solid ${accent};border-radius:6px;">${esc(val)}</div>`;
                }).join('');
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px;"><div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap;">${cells}</div>${caption}</div>`;
            }
            // 树形图
            if (v.type === 'tree') {
                const H = 180, W = 400;
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:6px;overflow:hidden;"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${renderTreeSvg(d, accent, accentLight, textMain, W, H, { nodeSize: 18, fontSize: 12, padL: 28, padR: 28, padT: 24, padB: 24 })}</svg>${caption}</div>`;
            }
            // 对比图
            if (v.type === 'compare') {
                const rows = d.split('\n').filter(l => l.trim()).map(l => l.split('|').map(s => s.trim()));
                const cols = Math.max(...rows.map(r => r.length), 1);
                const colW = Math.floor(100 / cols);
                return `<div class="visual-card" style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;padding:6px;"><table style="width:100%;border-collapse:collapse;font-size:18px;">${rows.map((row,r) => `<tr>${row.map((c,ci) => `<td style="width:${colW}%;padding:8px 10px;text-align:center;background:${r===0?accent:ci===0?accentLight:'#fff'};color:${r===0?'#fff':ci===0?accent:textMain};font-weight:${r===0||ci===0?'700':'400'};">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>${caption}</div>`;
            }
            // 图表类（折线/柱状/复杂度曲线）复用大图渲染器

        function renderContentBlock(content, accent, accentLight, textMain, isRight) {
            if (!content) return '';

            if (c.includes('|')) {
                const rows = c.split('\n').filter(l => l.trim());
                const ths = rows[0].split('|').map(cell => `<th style="padding:9px 11px;background:${accent};color:#fff;font-weight:600;font-size:20px;text-align:left;border:1px solid ${accent};">${cell.trim()}</th>`).join('');

                    }).join('');

                }).join('');

        function fitDeckSlideContent(sec) {
            const pad = sec && sec.querySelector('.dk-pad-area');

            sec.classList.remove('dk-fit-compact', 'dk-fit-tight', 'dk-fit-emergency');
            const overflows = function () {
                if (pad.scrollHeight > pad.clientHeight + 2 || pad.scrollWidth > pad.clientWidth + 2) return true;
                const bounds = pad.getBoundingClientRect();
                return Array.from(pad.querySelectorAll('.dk-panel,.dk-card,.visual-card,svg,canvas,table,pre')).some(function(el){
                    const r = el.getBoundingClientRect();
                    return r.bottom > bounds.bottom + 2 || r.right > bounds.right + 2 || r.left < bounds.left - 2;
                });
            };
            if (!overflows()) return;
            sec.classList.add('dk-fit-compact');
            if (overflows()) sec.classList.add('dk-fit-tight');
            if (overflows()) sec.classList.add('dk-fit-emergency');

        // 构建完整演示舞台（一次性渲染全部胶片）
        function buildDeck(poster, slides) {

            });
            // ── 追加随堂测验（最后一页） ──

                    '<div class="quiz-cover" id="quizCover">'

                    + '<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A78BFA" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 共 '+(QN*QPT)+' 分</span>'
                    + '</div>'
                    + '<button class="quiz-start-btn" id="quizStartBtn" type="button">开始答题 &rsaquo;</button>'
                    + '<p class="quiz-err" id="quizErr" style="display:none"></p>'
                    + '</div>'
                    + '<div id="quizArea" style="display:none;flex:1;flex-direction:column;min-height:0;"></div>';

                var area = sec.querySelector('#quizArea');
                var startBtn = sec.querySelector('#quizStartBtn');
                var errEl = sec.querySelector('#quizErr');
                var quizQ = window._currentQuery || (typeof videoQuery !== 'undefined' ? videoQuery : '') || '';
                function begin(){
                    startBtn.disabled = true;

                        method: 'POST',

                    }).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j};});})
                    .then(function(o){
                        var list = o.ok && o.j && o.j.data && o.j.data.questions;
                        if(!list || !list.length) throw new Error((o.j && o.j.error && o.j.error.message) || '未生成有效题目');
                        renderQuiz(list.slice(0, QN));

                    .catch(function(e){
                        startBtn.disabled = false;
                        startBtn.innerHTML = '开始答题 &rsaquo;';

                        errEl.style.display = 'block';

                function renderQuiz(qs){
                    cover.style.display = 'none';

                    var h = '<div class="quiz-top"><div class="qt-left"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b>答题中</b><span class="qt-count" id="qCount">0/'+qs.length+'</span></div><button class="quiz-submit-btn" id="qSubmit" type="button">提交答案</button></div>'

                    h += '<div class="quiz-done" id="qDone"></div></div>';
