<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>栈知映 · 视频播放</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="mdrender.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #4F6BF0;
            --primary-light: #6D83F5;
            --primary-dark: #3B4FE0;
            --primary-soft: #EEF2FF;
            --cyan: #22C3E6;
            --accent: #F59E0B;
            --success: #16A34A;
            --danger: #DC2626;
            --bg: #F7F9FC;
            --bg-card: #FFFFFF;
            --bg-dark: #0B1220;
            --ink-light: #E6EDF7;
            --ink-dim: #8CA3C0;
            --border: #E2E8F0;
            --border-focus: #C7D2FE;
            --text: #0F172A;
            --text-dim: #475569;
            --text-muted: #64748B;
            --ease-out: cubic-bezier(.23,1,.32,1);
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* ── 顶栏 ── */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 24px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px) saturate(180%);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .topbar-logo i {
            font-size: 20px;
            color: var(--primary);
            background: rgba(79,107,240,0.12);
            padding: 8px;
            border-radius: 10px;
        }
        .topbar-logo span {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
        }
        .topbar-search {
            flex: 1;
            max-width: 480px;
            position: relative;
            margin: 0 auto;
        }
        .topbar-search input {
            width: 100%;
            height: 40px;
            padding: 0 44px 0 16px;
            background: var(--bg);
            border: 1.5px solid #e6edf4;
            border-radius: 24px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            font-family: inherit;
            transition: 0.2s;
        }
        .topbar-search input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79,107,240,0.12);
            background: #fff;
        }
        .topbar-search input::placeholder { color: var(--text-muted); }
        .topbar-search button {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .topbar-search button:hover { background: var(--primary-light); }
        .topbar-nav {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .topbar-nav button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #e6edf4;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .topbar-nav button:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
        .topbar-nav button.active { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 2px rgba(79,107,240,.25); }

        /* ── 主布局 ── */
        .main-layout {
            display: flex;
            gap: 0;
            max-width: none;
            margin: 0;
            padding: 16px 20px 16px 0;
        }
        /* 整页不滚；左右两栏各自内部滚动 */
        body { overflow: hidden; }
        #mainLayout { height: calc(100vh - 64px); overflow: hidden; }
        #sidebarCol { height: 100%; overflow-y: auto; }
        #playerPanel { max-width: 1200px; margin: 0 auto; width: 100%; }
        /* 隐藏左右滚动条（保留滚动） */
        #sidebarCol, .player-col { scrollbar-width: none; }
        #sidebarCol::-webkit-scrollbar, .player-col::-webkit-scrollbar { width: 0; height: 0; display: none; }
        .player-col {
            flex: 1;
            min-width: 0;
        }
        .sidebar-col {
            order: -1;
            width: 220px;
            flex-shrink: 0;
            padding-left: 0;
            padding-right: 16px;
        }
        .player-col {
            flex: 1;
            min-width: 0;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* ── 视频播放器区域 ── */
        .player-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
            margin-bottom: 20px;
            cursor: pointer;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
        }
        .player-poster {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(800px 400px at 50% 0%, rgba(79,107,240,.30), transparent 70%), linear-gradient(160deg, #0B1220 0%, #12203C 55%, #0B1220 100%);
            position: relative;
        }
        /* PPT 展示页右下角全屏按钮 */
        .deck-fullscreen-btn {
            position: absolute; right: 16px; bottom: 16px; z-index: 900;
            width: 44px; height: 44px; border: none; border-radius: 12px; cursor: pointer;
            background: rgba(15,23,42,.55); color: #fff; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            transition: background .2s, transform .2s;
        }
        .deck-fullscreen-btn:hover { background: rgba(79,107,240,.85); transform: scale(1.05); }

        /* ── 视频信息 ── */
        .video-info-section {
            margin-bottom: 24px;
        }
        .video-info-section h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .video-meta-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .video-meta-chip {
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 14px;
            background: var(--bg-card);
            color: var(--text-dim);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .video-meta-chip i { color: var(--primary); font-size: 11px; }
        .video-desc {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.7;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px 18px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
        }
        .video-desc:hover { border-color: var(--border-focus); }

        /* ── 字幕区 ── */
        .subtitle-bar {
            text-align: center;
            padding: 12px 0;
            font-size: 16px;
            color: var(--ink-light);
            background: var(--bg-dark);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(140,163,192,.18);
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #subtitleText { transition: opacity .15s ease; }

        /* ── 右侧：场景导航 ── */
        .sidebar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 14px;
        }
        .scene-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .scene-item {
            display: flex;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .scene-item:hover { background: var(--bg-card); border-color: var(--border); }
        .scene-item.active { background: var(--bg-card); border-color: var(--primary); }
        .scene-thumb {
            width: 100px;
            height: 56px;
            border-radius: 8px;
            background: linear-gradient(135deg, #e8f0fe, #d8e4fa);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .scene-thumb i { color: rgba(79,107,240,0.18); font-size: 20px; }
        .scene-item.active .scene-thumb i { color: var(--primary); }
        .scene-info { flex: 1; min-width: 0; }
        .scene-info .scene-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .scene-info .scene-dur {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── 知识测评 ── */
        .quiz-section {
            margin-top: 8px;
        }
        .quiz-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px 26px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            transition: 0.2s;
        }
        .quiz-card:hover { border-color: var(--border-focus); }
        .quiz-card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 18px;
        }
        .quiz-num {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quiz-question {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.6;
            padding-top: 4px;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 44px;
        }
        .quiz-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1.5px solid #e6edf4;
            cursor: pointer;
            transition: all 0.18s;
            background: #FBFCFE;
        }
        .quiz-option:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
            transform: translateX(3px);
        }
        .quiz-option.selected {
            border-color: var(--primary);
            background: #eef5ff;
            box-shadow: 0 0 0 3px rgba(79,107,240,0.1);
        }
        .quiz-option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
            box-shadow: 0 0 0 3px rgba(76,175,80,0.1);
        }
        .quiz-option.wrong {
            border-color: #f44336;
            background: #ffebee;
            box-shadow: 0 0 0 3px rgba(244,67,54,0.08);
        }
        .quiz-option-label {
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 8px;
            background: #ecf3ff;
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.18s;
        }
        .quiz-option.selected .quiz-option-label {
            background: var(--primary);
            color: #fff;
        }
        .quiz-option.correct .quiz-option-label {
            background: #4caf50;
            color: #fff;
        }
        .quiz-option.wrong .quiz-option-label {
            background: #f44336;
            color: #fff;
        }
        .quiz-option-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
        }
        .quiz-feedback {
            padding: 10px 16px;
            margin-left: 44px;
            margin-top: 8px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }
        .quiz-feedback.correct-fb {
            background: #e8f5e9;
            color: #2e7d32;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-feedback.wrong-fb {
            background: #ffebee;
            color: #c62828;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .quiz-score {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .quiz-score-val {
            font-weight: 700;
            color: var(--primary);
            font-size: 18px;
        }
        .quiz-reset {
            padding: 8px 20px;
            border-radius: 20px;
            background: #fff;
            border: 1px solid #e6edf4;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            font-family: inherit;
        }
        .quiz-reset:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-soft);
        }
        .quiz-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .quiz-explanation {
            padding: 12px 16px;
            margin-left: 44px;
            margin-top: 6px;
            border-radius: 10px;
            background: #f8fafd;
            border-left: 4px solid var(--primary);
            font-size: 13px;
            color: #3d517e;
            line-height: 1.65;
            display: none;
        }
        .quiz-card.answered .quiz-explanation {
            display: block;
        }

        /* ── 搜索无结果 ── */
        .search-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 40px 20px;
        }
        .search-hero i { font-size: 72px; color: rgba(79,107,240,0.15); margin-bottom: 20px; }
        .search-hero h2 { font-size: 22px; color: var(--text-dim); font-weight: 400; margin-bottom: 8px; }
        .search-hero p { font-size: 14px; color: var(--text-muted); max-width: 500px; }

        /* ── 参赛增强：背景光晕 + 扫描光带 ── */
        body {
            background:
                radial-gradient(1100px 560px at 12% -10%, rgba(79,107,240,.10), transparent 60%),
                radial-gradient(800px 480px at 90% -5%, rgba(109,131,245,.08), transparent 55%),
                var(--bg);
        }
        body::after {
            content: '';
            position: fixed;
            left: -10%;
            width: 120%;
            height: 26vh;
            top: -36vh;
            background: linear-gradient(180deg, transparent, rgba(109,131,245,.06), transparent);
            pointer-events: none;
            z-index: 0;
            animation: scanLine 16s linear infinite;
        }
        @keyframes scanLine { 0% { transform: translateY(0); } 100% { transform: translateY(175vh); } }

        /* ── 参赛增强：滚动条 ── */
        *::-webkit-scrollbar { width: 8px; height: 8px; }
        *::-webkit-scrollbar-thumb { background: #C7D2FE; border-radius: 8px; }
        *::-webkit-scrollbar-thumb:hover { background: #9dbdf5; }
        *::-webkit-scrollbar-track { background: transparent; }

        /* ── 参赛增强：logo 呼吸 ── */
        .topbar-logo i { animation: iconGlow 3.4s ease-in-out infinite; }
        @keyframes iconGlow {
            0%, 100% { box-shadow: 0 0 0 rgba(79,107,240,0); }
            50% { box-shadow: 0 0 16px rgba(79,107,240,.35); }
        }

        /* ── 参赛增强：播放器光晕 ── */
        .player-container { transition: box-shadow .3s, transform .3s; }
        .player-container:hover { box-shadow: 0 6px 44px rgba(79,107,240,.35); transform: translateY(-2px); }

        /* ── 参赛增强：卡片 hover 上浮 ── */
        .scene-item { position: relative; }
        .scene-item::before {
            content: '';
            position: absolute;
            left: 0; top: 24%; bottom: 24%;
            width: 3px;
            border-radius: 2px;
            background: linear-gradient(180deg, var(--primary), var(--primary-light));
            opacity: 0;
            transition: opacity .2s;
        }
        .scene-item:hover { transform: translateX(2px); }
        .scene-item:hover::before { opacity: 1; }
        .quiz-card, .video-desc { transition: box-shadow .25s, transform .25s, border-color .25s; }
        .quiz-card:hover, .video-desc:hover { box-shadow: 0 6px 24px rgba(79,107,240,.10); transform: translateY(-2px); }

        /* ── AI 解题助手 ── */
        .chat-fab {
            position: fixed;
            right: 26px;
            bottom: 26px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 26px rgba(79,107,240,.4);
            transition: transform .25s, box-shadow .25s;
            z-index: 300;
        }
        .chat-fab:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 34px rgba(79,107,240,.5); }
        .chat-fab .chat-fab-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ef4444;
            border: 2px solid #fff;
        }

        .chat-panel {
            position: fixed;
            right: 26px;
            bottom: 26px;
            width: 480px;
            max-width: min(1200px, calc(100vw - 52px));
            height: min(660px, calc(100vh - 140px));
            min-width: 360px;
            min-height: 420px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 60px rgba(20,50,110,.22);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 310;
            transform: translateY(24px) scale(.96);
            opacity: 0;
            visibility: hidden;
            transition: transform .28s ease, opacity .28s ease, visibility .28s;
        }
        .chat-panel.open { transform: none; opacity: 1; visibility: visible; }
        /* 整圈边框缩放：四条边 + 四个角都是热区，悬停显示对应方向的光标并高亮边框，按住拖动即缩放。
           手柄在面板内层（overflow:hidden 不影响），7px 宽热区落在边框内侧，几乎与边框重合。 */
        .chat-resize {
            position: absolute;
            z-index: 6;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .chat-resize--n  { top: 0; left: 0; right: 0; height: 8px; cursor: n-resize; }
        .chat-resize--s  { bottom: 0; left: 0; right: 0; height: 8px; cursor: s-resize; }
        .chat-resize--e  { right: 0; top: 0; bottom: 0; width: 8px; cursor: e-resize; }
        .chat-resize--w  { left: 0; top: 0; bottom: 0; width: 8px; cursor: w-resize; }
        .chat-resize--nw { top: 0; left: 0; width: 18px; height: 18px; cursor: nwse-resize; }
        .chat-resize--ne { top: 0; right: 0; width: 18px; height: 18px; cursor: nesw-resize; }
        .chat-resize--sw { bottom: 0; left: 0; width: 18px; height: 18px; cursor: nesw-resize; }
        .chat-resize--se { bottom: 0; right: 0; width: 18px; height: 18px; cursor: nwse-resize; }
        /* 悬停时整条边框亮起蓝环，明确"此处可拖拽缩放" */
        .chat-resize:hover { background: rgba(79,107,240,.22); box-shadow: inset 0 0 0 1.5px rgba(79,107,240,.55); }
        /* 右下角图标仅作视觉提示（不拦截鼠标事件），缩到 16x16 角热区内，避免"点了图标却拖不动" */
        .chat-resize-handle {
            position: absolute;
            right: 1px;
            bottom: 1px;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a6bce0;
            font-size: 11px;
            pointer-events: none;
            z-index: 5;
        }
        /* 顶部"虚幻"拖拽横杠：半透明渐变 + 流动高光 */
        .chat-panel-dragbar {
            height: 18px;
            flex-shrink: 0;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, rgba(79,107,240,.03), rgba(79,107,240,.14) 50%, rgba(79,107,240,.03));
            border-bottom: 1px solid rgba(79,107,240,.10);
        }
        .chat-panel-dragbar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, transparent 25%, rgba(255,255,255,.6) 50%, transparent 75%);
            background-size: 240% 100%;
            background-position: 120% 0;
            animation: dragbar-sheen 3.6s linear infinite;
            pointer-events: none;
        }

        /* ── 通用弹层（错题本 / 学情诊断） ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 30, 60, 0.45);
            backdrop-filter: blur(4px);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .overlay[hidden] { display: none; }
        .overlay-panel {
            width: min(720px, 100%);
            max-height: 85vh;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 24px 80px rgba(10, 30, 70, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .overlay-panel--wide { width: min(880px, 100%); }
        /* ══ UI 优化：弹层入场 + 按压反馈 + 减少动态效果 ══ */
        .overlay { animation: overlayScrimIn .2s ease-out; }
        .overlay-panel { animation: overlayPopIn .25s var(--ease-out); }
        @keyframes overlayScrimIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes overlayPopIn { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }
        button:active { transform: scale(.97); }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
        .overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

        .overlay-close {
            width: 32px; height: 32px; border-radius: 50%;

        }

        .quiz-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .mistake-opt.ok { border-color: #b5e3c4; background: #f0fbf4; }

        .mistake-flag { font-size: 11.5px; color: #B45309; background: #FEF3C7; border: 1px solid #FDE68A; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }

        .diag-overview { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }

        .diag-weak-head { font-size: 13.5px; font-weight: 600; color: #c05a2b; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        /* ===========================================
           FRONTEND-SLIDES 固定 16:9 演示舞台（作用域：仅播放器内）
           参照 _frontend-slides-tmp/viewport-base.css，整份引入并作用域化
           =========================================== */
        #playerPoster .deck-viewport {
            position: absolute; inset: 0; overflow: hidden;
            background: var(--dk-bg-deep, #0b1220);
        }
        #playerPoster .deck-stage {
            position: absolute; left: 0; top: 0;
            width: 1920px; height: 1080px;
            transform-origin: 0 0;
            overflow: hidden;
            background: var(--dk-bg, #fff);
            will-change: transform;
        }
        #playerPoster .slide {
            position: absolute; inset: 0;
            width: 1920px; height: 1080px;
            overflow: hidden;
            display: block;
            visibility: hidden; opacity: 0; pointer-events: none;
            background: var(--dk-bg, #fff);
        }
        #playerPoster .slide.active,
        #playerPoster .slide.visible {
            visibility: visible; opacity: 1; pointer-events: auto; z-index: 1;
        }
        #playerPoster img, #playerPoster video, #playerPoster canvas, #playerPoster svg {
            max-width: 100%; max-height: 100%;
        }
        /* ===========================================
           Chart animations (lieflat-charts)
           当 slide 进入 active 时触发
           =========================================== */
        @keyframes chartGrowBar {
            from { transform: scaleY(0); }
            to { transform: scaleY(1); }
        }
        @keyframes chartDrawLine {
            from { stroke-dashoffset: var(--line-len, 800); }
            to { stroke-dashoffset: 0; }
        }
        @keyframes chartFadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes chartScaleIn {
            from { opacity: 0; transform: scale(0); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes chartFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes chartDrawArc {
            from { stroke-dashoffset: var(--arc-len, 280); }
            to { stroke-dashoffset: 0; }
        }
        @keyframes chartSwing {
            from { transform: rotate(var(--swing-from, -90deg)); }
            to { transform: rotate(0deg); }
        }
        @keyframes chartSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* 图表动画触发：slide 进入 active 时播放 */
        .slide.active .ca-bar { animation: chartGrowBar 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; transform-origin: var(--bar-origin, bottom); }
        .slide.active .ca-line { animation: chartDrawLine 0.7s ease-out both; }
        .slide.active .ca-area { animation: chartFadeInUp 0.5s ease-out both; }
        .slide.active .ca-pie { animation: chartScaleIn 0.4s ease-out both; }
        .slide.active .ca-point { animation: chartScaleIn 0.35s ease-out both; }
        .slide.active .ca-fade { animation: chartFadeIn 0.4s ease-out both; }
        .slide.active .ca-arc { animation: chartDrawArc 0.7s ease-out both; }
        .slide.active .ca-needle { animation: chartSwing 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        .slide.active .ca-text { animation: chartFadeIn 0.3s ease-out both; }
        .slide.active .ca-slide { animation: chartSlideIn 0.4s ease-out both; }
        .slide.active .ca-grow { animation: chartFadeInUp 0.5s ease-out both; }
        /* 舞台外控件（页码提示） */
        .deck-controls {
            position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
            z-index: 1000; display: none;
        }
        .deck-page-flash {
            position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%);
            z-index: 1001; background: rgba(10,15,28,.9); color: #fff;

        .dk-reveal { opacity: 0; transform: translateY(30px); transition: opacity .6s var(--dk-ease), transform .6s var(--dk-ease); }

        #playerPoster .slide.visible .dk-reveal:nth-child(1) { transition-delay: .1s; }

        #playerPoster .slide.visible .dk-reveal:nth-child(3) { transition-delay: .3s; }
        #playerPoster .slide.visible .dk-reveal:nth-child(4) { transition-delay: .4s; }
        /* 让现有色值信息卡在深色舞台上保持可读（亮底） */
        #playerPoster .dk-col .vcard,

        #playerPoster .dk-col .chart-box,

        // ===== 动态生成测验：根据搜索关键词匹配知识题库 ====
        const keywordMap = {
            '排序|快排|归并|冒泡|选择|堆排|sort|quick': 'sort',
            'tcp|握手|挥手|传输|网络|协议|syn|ack|fin|time_wait': 'tcp',
            '进程|线程|调度|死锁|同步|并发': 'process',
            '二叉|树|遍历|前序|中序|后序|层序|bst|tree|b树|红黑': 'tree',
            '操作系统|虚拟内存|分页|分段|页面置换|lru|银行家|os': 'os',
            '数据库|sql|join|事务|acid|索引|db|mysql': 'db',
            'http|https|状态码|url|rest|api|ssl|tls|加密': 'http',
            '图|dijkstra|最短路径|bfs|dfs|最小生成树|拓扑|graph|prim|kruskal': 'graph',
            '二分|查找|search|检索': 'search',
            '哈希|hash|散列|冲突|map': 'hash',
            'rsa|加密|crypto|密码|签名|aes': 'crypto',
            '栈|stack|push|pop': 'stack',
            '队列|queue|fifo|bfs|消息队列': 'queue',
        };

        function generateQuiz(query) {
            const qLower = query.toLowerCase();
            const allQuestions = [];

            for (const [pattern, key] of Object.entries(keywordMap)) {
                const regex = new RegExp(pattern, 'i');
                if (regex.test(qLower) && quizBank[key]) {
                    allQuestions.push(...quizBank[key]);
                }
            }

            if (allQuestions.length === 0) {
                allQuestions.push(...quizBank.sort, ...quizBank.tcp, ...quizBank.process, ...quizBank.tree);
            }

            const seen = new Set();
            const unique = allQuestions.filter(t => {
                if (seen.has(t.q)) return false;
                seen.add(t.q);
                return true;
            });

            for (let i = unique.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [unique[i], unique[j]] = [unique[j], unique[i]];
            }

            const selected = unique.slice(0, 3);

            return selected.map(item => {
                const indices = [0, 1, 2, 3];
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                const shuffledOpts = indices.map(idx => item.opts[idx]);
                const newAnsIdx = shuffledOpts.indexOf(item.ans);
                return {
                    q: item.q,
                    opts: shuffledOpts,
                    ans: newAnsIdx,
                    exp: item.exp,
                };
            });
        }

        // 课程页始终有一组可立即作答的题目；后端生成的课件没有题目字段时，
        // 使用同一套按关键词匹配的题库，答题仍通过 /attempts 记录到错题本。
        function loadLessonQuiz(query, taskId) {
            videoQuery = String(query || '').trim();
            window._currentTaskId = taskId || window._currentTaskId || null;
            const key = quizKey();
            const saved = readLessonProgress(window._currentTaskId);
            const savedQuiz = Array.isArray(saved?.quiz)
                ? saved.quiz.filter(item => item && typeof item.q === 'string' && Array.isArray(item.opts)).slice(0, 10)
                : [];
            currentQuiz = savedQuiz.length ? savedQuiz : generateQuiz(videoQuery);
            if (saved?.quizAi) currentQuiz._ai = true;
            quizState[key] = restoreQuizState(saved?.quizState, currentQuiz.length);
            // 即使尚未作答也固定本次题目顺序，返回课程时不会重新随机一套题。
            saveLessonQuizProgress();
            renderQuiz();
        }

        // ===== 播放器状态 =====
        let isPlaying = false;
        let currentTime = 0;
        let totalDuration = 154;
        let playInterval = null;
        let currentVideoKey = null;
        let isMuted = false;
        let subtitleVisible = false;
        let subtitleIndex = 0;
        let quizState = {}; // { videoKey: { answered: Set, score: number, selections: {} } }
        let currentQuiz = null; // 动态生成的当前测验数据
        let videoQuery = ''; // 生成视频时在 search 页输入的原始知识点文字
        let generatedAudio = null;
        let generatedAudioUrl = null;
        const LESSON_PROGRESS_PREFIX = 'zx_lesson_progress_v1:';

        function lessonProgressKey(taskId) {
            return taskId ? LESSON_PROGRESS_PREFIX + String(taskId) : null;
        }

        function readLessonProgress(taskId) {
            const key = lessonProgressKey(taskId);
            if (!key) return null;
            try {
                const value = JSON.parse(localStorage.getItem(key) || 'null');
                return value && typeof value === 'object' ? value : null;
            } catch (e) { return null; }
        }

        function updateLessonProgress(taskId, patch) {
            const key = lessonProgressKey(taskId);
            if (!key) return;
            try {
                const previous = readLessonProgress(taskId) || {};
                localStorage.setItem(key, JSON.stringify({
                    ...previous,
                    ...patch,
                    taskId: String(taskId),
                    query: videoQuery || previous.query || '',
                    updatedAt: Date.now(),
                }));
            } catch (e) { /* 浏览器禁用本地存储时不影响课程播放 */ }
        }

        function restoreQuizState(saved, total) {
            const raw = saved && typeof saved === 'object' ? saved : {};
            const answered = new Set((Array.isArray(raw.answered) ? raw.answered : [])
                .map(Number).filter(index => Number.isInteger(index) && index >= 0 && index < total));
            const selections = raw.selections && typeof raw.selections === 'object' ? raw.selections : {};
            const correctness = raw.correctness && typeof raw.correctness === 'object' ? raw.correctness : {};
            let score = 0;
            answered.forEach(index => { if (correctness[index]) score++; });
            return { answered, score, selections, correctness, pending: new Set() };
        }

        function saveLessonQuizProgress() {
            const taskId = window._currentTaskId;
            const key = quizKey();
            const state = quizState[key];
            if (!taskId || !currentQuiz || !state) return;
            updateLessonProgress(taskId, {
                quiz: Array.from(currentQuiz).map(item => ({ ...item })),
                quizAi: Boolean(currentQuiz._ai),
                quizState: {
                    answered: Array.from(state.answered || []),
                    score: Number(state.score || 0),
                    selections: state.selections || {},
                    correctness: state.correctness || {},
                },
            });
        }

        function rememberCourseTask(query, taskId) {
            if (!query || !taskId) return;
            try {
                const storageKey = 'search_history_v2';
                let list = JSON.parse(localStorage.getItem(storageKey) || '[]');
                if (!Array.isArray(list)) list = [];
                list = list.filter(item => item && item.query !== query);
                list.unshift({ query, task_id: String(taskId), time: Date.now() });
                localStorage.setItem(storageKey, JSON.stringify(list.slice(0, 20)));
            } catch (e) { /* 不影响课程 */ }
            const nextUrl = 'watch.html?task_id=' + encodeURIComponent(taskId) + '&q=' + encodeURIComponent(query);
            try { history.replaceState(null, '', nextUrl); } catch (e) {}
        }

        async function resolveCourseTask(query) {
            try {
                const response = await fetch('/api/v1/video/tasks?query=' + encodeURIComponent(query));
                if (!response.ok) return null;
                const payload = await response.json();
                const data = payload.data;
                return data && data.task_id && data.status !== 'failed' ? data.task_id : null;
            } catch (e) { return null; }
        }

        const colorMap = { '算法': 'var(--primary)', '计算机网络': '#4caf50', '操作系统': '#ff9800', '数据结构': '#9c27b0', '数据库': '#e91e63' };

        // ===== 搜索 =====
        function doTopSearch() {
            const q = document.getElementById('topSearch').value.trim();
            if (q) loadVideo(q);
        }

        function doHeroSearch() {
            const q = document.getElementById('heroSearch').value.trim();
            if (q) loadVideo(q);
        }

        // 搜索页和播放页统一走真课件流水线，避免旧的 /generations 接口只返回一张封面。
        // 播放页不显示可拖动时间轴，课程按页面/语音自动播放。
        async function loadVideo(query) {
            query = String(query || '').trim();
            if (!query) return;
            videoQuery = query;
            if (location.protocol === 'file:') return loadLocalVideo(query);
            try {
                showGenerationState(query, '正在查找上次生成的课程…');
                let taskId = await resolveCourseTask(query);
                if (taskId) {
                    window._currentTaskId = taskId;
                    window._isCourseware = false;
                    if (window._cwPlayer?.destroy) window._cwPlayer.destroy();
                    window._cwPlayer = null;
                    const loaded = await loadSlideshow(taskId, query);
                    if (!loaded) throw new Error('已保存的课程无法读取');
                    rememberCourseTask(query, taskId);
                    return;
                }
                showGenerationState(query, '没有找到已生成课程，AI 正在生成音频、课程视频和测评题…');
                const response = await fetch('/api/v1/courseware/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query,
                        source: 'watch-page',
                        style: '电子演播室',
                        mode: 'staged'
                    })
                });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error?.message || '创建生成任务失败');
                taskId = payload.data?.task_id;
                if (!taskId) throw new Error('生成接口未返回 task_id');
                window._currentTaskId = taskId;
                window._isCourseware = false;
                if (window._cwPlayer?.destroy) window._cwPlayer.destroy();
                window._cwPlayer = null;
                const loaded = await loadSlideshow(taskId, query);
                if (!loaded) throw new Error('课程内容未生成，请稍后重试');
                rememberCourseTask(query, taskId);
            } catch (error) {
                console.warn('后端生成不可用，已切换为本地演示：', error);
                loadLocalVideo(query);
            }
        }

        function showGenerationState(query, message) {
            document.getElementById('searchHero').style.display = 'none';
            document.getElementById('playerPanel').style.display = 'block';
            document.getElementById('sidebarCol').style.display = 'block';
            document.getElementById('videoTitle').textContent = query;
            document.getElementById('videoDesc').textContent = message;
            document.getElementById('playerPoster').style.backgroundImage = 'linear-gradient(135deg, #152a52, var(--primary))';
            const hint = document.getElementById('playbackHint');
            if (hint) hint.textContent = '生成完成后自动播放';
            const quizContainerEl = document.getElementById('quizContainer');
            if (quizContainerEl) quizContainerEl.innerHTML = '<div style="padding:18px;color:var(--text-muted)">正在生成教学测评，请稍候…</div>';
        }

        async function pollGeneration(task) {
            for (let attempt = 0; attempt < 90; attempt++) {
                const response = await fetch(task.statusUrl);
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error?.message || '无法获取生成状态');
                const info = payload.data;
                document.getElementById('videoDesc').textContent = `生成进度 ${info.progress || 0}%：正在准备“${document.getElementById('videoTitle').textContent}”`;
                if (info.status === 'completed') {
                    const resultResponse = await fetch(info.resultUrl);
                    const resultPayload = await resultResponse.json();
                    if (!resultResponse.ok) throw new Error(resultPayload.error?.message || '无法读取生成结果');
                    return resultPayload.data;
                }
                if (info.status === 'failed') throw new Error(info.error?.message || '生成任务失败');
                await new Promise(resolve => setTimeout(resolve, 800));
            }
            throw new Error('生成超时，请稍后重试');
        }

        function applyGeneratedLesson(query, taskId, result) {
            const scenes = result.scenes || [];
            videoDB[taskId] = {
                title: result.topic?.title || query,
                subject: result.topic?.subject || '综合学习',
                duration: formatGeneratedDuration(scenes.reduce((sum, scene) => sum + (scene.durationSeconds || 0), 0) || 36),
                totalSec: scenes.reduce((sum, scene) => sum + (scene.durationSeconds || 0), 0) || 36,
                scenes: scenes.length || 1,
                views: '新生成',
                desc: `题目：${result.lessonPlan?.questionText || query}\n\n解题思路：${result.lessonPlan?.solutionOverview || '先提取题干条件，再分步骤推导并检验结论。'}\n\n讲解内容已覆盖题干展示、关键步骤标注、关系图/表格分析与同步音频解说。`,
                scenesList: scenes.map(scene => ({ name: `${scene.index}. ${scene.name}`, dur: formatGeneratedDuration(scene.durationSeconds || 12), visual: scene.visual })),
                subtitles: scenes.map(scene => scene.narration || scene.name)
            };
            videoQuery = query;
            window._currentTaskId = taskId;
            loadLocalVideo(taskId);
            currentQuiz = (result.questions || []).map(question => ({
                id: question.id,
                q: question.content,
                opts: question.options || [],
                ans: question.options?.length ? question.options.indexOf(question.correctAnswer) : question.correctAnswer,
                exp: question.explanation,
                type: question.type
            }));
            quizState[taskId] = { answered: new Set(), score: 0, selections: {}, correctness: {}, pending: new Set() };
            renderQuiz();
            const poster = result.poster?.url || (result.video?.mimeType === 'image/svg+xml' ? result.video.url : null);
            if (poster) document.getElementById('playerPoster').style.backgroundImage = `linear-gradient(rgba(10,25,55,.15), rgba(10,25,55,.15)), url("${poster}")`;
            generatedAudioUrl = result.audio?.url || null;
            if (generatedAudioUrl) generatedAudio = new Audio(generatedAudioUrl);
            const hint = document.getElementById('playbackHint');
            if (hint) hint.textContent = generatedAudio ? '正在自动播放讲解' : '课程已就绪，点击播放';
            if (generatedAudio) playVideo();
        }

        function formatGeneratedDuration(seconds) {
            return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
        }

        function loadLocalVideo(query) {
            generatedAudio = null;
            generatedAudioUrl = null;
            // 模糊匹配
            let key = null;
            const qLower = query.toLowerCase();
            for (const k of Object.keys(videoDB)) {
                if (k.toLowerCase().includes(qLower) || qLower.includes(k.toLowerCase())) {
                    key = k; break;
                }
            }
            if (!key) {
                // 取第一个作为默认
                key = Object.keys(videoDB)[0];
            }

            currentVideoKey = key;
            const v = videoDB[key];
            totalDuration = v.totalSec;
            currentTime = 0;
            isPlaying = false;
            subtitleIndex = 0;

            // 显示播放面板，隐藏搜索英雄区
            document.getElementById('searchHero').style.display = 'none';
            document.getElementById('playerPanel').style.display = 'block';
            document.getElementById('sidebarCol').style.display = 'block';

            // 更新信息
            document.getElementById('videoTitle').textContent = v.title;
            document.getElementById('videoSubject').textContent = v.subject;
            document.getElementById('videoDuration').textContent = v.duration;
            document.getElementById('videoScenes').textContent = v.scenes + ' 个场景';
            document.getElementById('videoViews').textContent = v.views + ' 次观看';
            document.getElementById('videoDesc').textContent = v.desc;
            _elOr('totalTime').textContent = v.duration;
            setQuizStatus('', false);

            // 更新顶栏搜索
            document.getElementById('topSearch').value = v.title;

            // 更新进度
            updateProgress();

            // 更新场景列表
            renderScenes(v);

            // 更新知识测评 —— 根据搜索词动态生成
            currentVideoKey = key;
            currentQuiz = generateQuiz(query);
            renderQuiz();

            // 停止之前的播放
            stopPlayback();
            _elOr('playIcon').className = 'fas fa-play-circle';
            _elOr('playPauseBtn').innerHTML = '<i class="fas fa-play"></i> 播放';
            document.getElementById('subtitleBar').style.display = 'none';
            subtitleVisible = false;
            const hint = document.getElementById('playbackHint');
            if (hint) hint.textContent = '课程已就绪，点击播放';
        }

        function renderScenes(v) {
            const list = document.getElementById('sceneList');
            list.innerHTML = v.scenesList.map((s, i) => `
                <div class="scene-item" id="scene-${i}" onclick="seekToScene(${i})">
                    <div class="scene-thumb"><i class="fas fa-chalkboard"></i></div>
                    <div class="scene-info">
                        <div class="scene-name">${s.name}</div>
                        <div class="scene-dur" title="${s.visual || ''}">${s.dur}${s.visual ? ' · ' + s.visual : ''}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderQuiz() {
            if (!currentQuiz) return;
            const container = document.getElementById('quizContainer');
            if (!container) return;
            const key = quizKey();
            const state = quizState[key] || { answered: new Set(), score: 0, selections: {}, correctness: {}, pending: new Set() };
            state.pending = state.pending || new Set();
            quizState[key] = state;
            const answered = state.answered;
            const total = currentQuiz.length;
            const score = state.score;

            // 更新得分
            document.getElementById('quizScore').textContent = answered.size === total ? score + ' / ' + total : '—';
            document.getElementById('quizSummary').textContent = answered.size === total
                ? (score === total ? '  🎉 全部正确！' : '  答题完成')
                : '（已答 ' + answered.size + '/' + total + '）';

            const labels = ['A', 'B', 'C', 'D'];
            container.innerHTML = currentQuiz.map((item, i) => `
                <div class="quiz-card${answered.has(i) ? ' answered' : ''}">
                    <div class="quiz-card-header">
                        <div class="quiz-num">${i + 1}</div>
                    <div class="quiz-question">${escapeHtml(item.q)}</div>
                    </div>
                    <div class="quiz-options">
                        ${item.type === 'fill_blank' ? `
                            <div style="display:flex;gap:8px;width:100%">
                                <input id="fill-${i}" aria-label="第 ${i + 1} 题答案" placeholder="输入答案" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--bg-card);color:var(--text)" ${answered.has(i) ? 'disabled' : ''}>
                                <button class="quiz-reset" onclick="submitFillAnswer('${key}', ${i})" ${answered.has(i) ? 'disabled' : ''}>提交</button>
                            </div>` : item.opts.map((opt, j) => {
                            let cls = '';
                            if (answered.has(i)) {
                                if (j === item.ans) cls = 'correct';
                                else if (j !== item.ans && quizState[key] && j === getSelectedIdx(key, i)) cls = 'wrong';
                            }
                            return `<div class="quiz-option${cls ? ' ' + cls : ''}"
                                onclick="selectOption('${key}', ${i}, ${j})">
                                <span class="quiz-option-label">${labels[j]}</span>
                                <span class="quiz-option-text">${escapeHtml(opt)}</span>
                            </div>`;
                        }).join('')}
                    </div>
                    ${answered.has(i) ? `
                    <div class="quiz-feedback ${isQuestionCorrect(key, i) ? 'correct-fb' : 'wrong-fb'}">
                        <i class="fas fa-${isQuestionCorrect(key, i) ? 'check-circle' : 'times-circle'}"></i>
                        ${isQuestionCorrect(key, i) ? '回答正确！' : (item.type === 'fill_blank' ? '请参考解析中的答案。' : '回答错误！正确答案是 ' + labels[item.ans] + '. ' + item.opts[item.ans])}
                    </div>
                    <div class="quiz-explanation">
                        <i class="fas fa-lightbulb" style="color:var(--primary);margin-right:6px;"></i>${item.exp || '暂无解析'}
                    </div>
                    ${item.type === 'fill_blank' ? '' : `
                    <div class="quiz-card-actions">
                        <button class="quiz-reset" onclick="genVariants(${i})" title="基于本题生成 2 道同知识点变式题"><i class="fas fa-repeat"></i>&nbsp;举一反三</button>
                    </div>`}` : ''}
                </div>
            `).join('');
        }

        function getSelectedIdx(videoKey, qIdx) {
            // We need to track which option was selected. Store it in quizState.
            if (!quizState[videoKey] || !quizState[videoKey].selections) return -1;
            return quizState[videoKey].selections[qIdx] ?? -1;
        }

        function isQuestionCorrect(videoKey, qIdx) {
            return Boolean(quizState[videoKey]?.correctness?.[qIdx]);
        }

        async function selectOption(videoKey, qIdx, optIdx) {
            if (!currentQuiz) return;
            if (quizState[videoKey]?.answered?.has(qIdx)) return;
            const state = quizState[videoKey] || (quizState[videoKey] = { answered: new Set(), score: 0, selections: {}, correctness: {}, pending: new Set() });
            state.pending = state.pending || new Set();
            if (state.pending.has(qIdx)) return;
            state.pending.add(qIdx);

            const item = currentQuiz[qIdx];
            const correct = item.ans;
            let isCorrect = optIdx === correct;
            let syncError = null;
            try {
                isCorrect = await recordQuizAttempt(item, item.type === 'choice' ? ['A', 'B', 'C', 'D'][optIdx] : item.opts[optIdx], isCorrect);
            } catch (error) { syncError = error; console.warn('答题记录失败，已使用本地结果：', error); }

            state.pending.delete(qIdx);
            if (!state.selections) state.selections = {};
            if (!state.correctness) state.correctness = {};
            state.selections[qIdx] = optIdx;
            state.correctness[qIdx] = isCorrect;
            state.answered.add(qIdx);
            if (isCorrect) state.score++;
            saveLessonQuizProgress();
            setQuizStatus(syncError ? '本次答案已显示，但暂时未同步到错题本，请检查网络后重新作答。' : '', Boolean(syncError));

            renderQuiz();
        }

        async function submitFillAnswer(videoKey, qIdx) {
            if (quizState[videoKey]?.answered?.has(qIdx)) return;
            const answer = document.getElementById('fill-' + qIdx).value.trim();
            if (!answer) return;
            const item = currentQuiz[qIdx];
            let isCorrect = answer.toLowerCase() === String(item.ans).toLowerCase();
            let syncError = null;
            try {
                isCorrect = await recordQuizAttempt(item, answer, isCorrect);
            } catch (error) { syncError = error; console.warn('答题记录失败，已使用本地结果：', error); }
            if (!quizState[videoKey]) quizState[videoKey] = { answered: new Set(), score: 0, selections: {}, correctness: {}, pending: new Set() };
            quizState[videoKey].selections[qIdx] = answer;
            quizState[videoKey].correctness[qIdx] = isCorrect;
            quizState[videoKey].answered.add(qIdx);
            if (isCorrect) quizState[videoKey].score++;
            saveLessonQuizProgress();
            setQuizStatus(syncError ? '本次答案已显示，但暂时未同步到错题本，请检查网络后重新作答。' : '', Boolean(syncError));
            renderQuiz();
        }

        async function recordQuizAttempt(item, answer, localCorrect) {
            const request = {
                questionId: item.id || null,
                taskId: window._currentTaskId || null,
                topic: currentTopic(),
                type: item.type || 'choice',
                answer,
                correct: localCorrect,
                question: item.q,
                correctAnswer: typeof item.ans === 'number' ? item.opts[item.ans] : String(item.ans ?? ''),
                options: item.opts || item.options || [],
            };
            let lastError;
            for (let attempt = 0; attempt < 2; attempt++) {
                try {
                    const response = await fetch('/api/v1/attempts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-client-id': getClientId() },
                        body: JSON.stringify(request),
                    });
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(payload.error?.message || '记录失败');
                    return Boolean(payload.data?.correct);
                } catch (error) {
                    lastError = error;
                    if (attempt === 0) await new Promise(resolve => setTimeout(resolve, 250));
                }
            }
            throw lastError || new Error('记录失败');
        }

        function setQuizStatus(message, isError) {
            const el = document.getElementById('quizStatus');
            if (!el) return;
            el.textContent = message || '';
            el.style.display = message ? 'block' : 'none';
            el.style.background = isError ? '#fff7ed' : '#f0fdf4';
            el.style.color = isError ? '#9a3412' : '#166534';
        }

        function resetQuiz() {
            const key = quizKey();
            quizState[key] = { answered: new Set(), score: 0, selections: {}, correctness: {}, pending: new Set() };
            // AI 生成的题目保留原题；本地演示题才重新随机生成。
            if (!currentQuiz?._ai && !currentQuiz?.some(item => item.id)) currentQuiz = generateQuiz(videoQuery || document.getElementById('topSearch')?.value || key);
            saveLessonQuizProgress();
            renderQuiz();
        }

        // ===== 学情：客户端标识 / 知识点（答题采集） =====
        function getClientId() {
            let id = localStorage.getItem('zx_client_id');
            if (!id) {
                id = 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
                localStorage.setItem('zx_client_id', id);
            }
            return id;
        }
        function currentTopic() {
            const text = (videoQuery || document.getElementById('topSearch')?.value || currentVideoKey || '综合学习').trim();
            return { title: text.slice(0, 60), subject: '综合学习' };
        }
        // 测验状态统一键：本地演示模式用 currentVideoKey，幻灯片模式用 task_id
        function quizKey() { return window._currentTaskId || currentVideoKey || 'local'; }

        // ===== 错题本 =====
        let mistakeFilter = 'false';
        let _mistakeCache = [];

        function closeOverlay(id) { document.getElementById(id).hidden = true; }
        function openMistakes() { document.getElementById('mistakeOverlay').hidden = false; loadMistakes(); }
        function toggleMistakeFilter() {
            mistakeFilter = mistakeFilter === 'false' ? 'all' : 'false';
            document.getElementById('mistakeFilterBtn').textContent = mistakeFilter === 'false' ? '未复习' : '全部';
            loadMistakes();
        }

        async function loadMistakes() {
            const list = document.getElementById('mistakeList');
            list.innerHTML = '<div class="overlay-empty"><i class="fas fa-spinner fa-spin"></i> 加载中…</div>';
            try {
                const res = await fetch('/api/v1/mistakes?reviewed=' + mistakeFilter, { headers: { 'x-client-id': getClientId() } });
                const payload = await res.json();
                if (!res.ok) throw new Error(payload.error?.message || '加载失败');
                const items = payload.data.items;
                _mistakeCache = items;
                document.getElementById('mistakeCount').textContent = items.length ? '(' + items.length + ')' : '';
                if (!items.length) {
                    list.innerHTML = '<div class="overlay-empty"><i class="fas fa-inbox"></i><br>暂无' + (mistakeFilter === 'false' ? '待复习' : '') + '错题，去"知识测评"答几道题吧。</div>';
                    return;
                }
                list.innerHTML = items.map((m) => `
                    <div class="mistake-card" id="mistake-${m.id}">
                        <div class="mistake-card-head">
                            <span class="mistake-topic">${escapeHtml(m.topic?.title || '未分类')}</span>
                            <span class="mistake-head-right">
                                <span class="mistake-date">${formatMistakeDate(m.createdAt)}</span>
                                <span class="mistake-cause ${m.cause ? 'cause-' + m.cause : 'cause-pending'}">${m.causeLabel || '归因中…'}</span>
                            </span>
                        </div>
                        <div class="mistake-q">${escapeHtml(m.question) || '（无题干）'}</div>
                        ${renderMistakeOptions(m)}
                        <div class="mistake-ans">
                            <span class="mistake-badge bad">你的答案：${escapeHtml(m.userAnswer) || '（空）'}</span>
                            <span class="mistake-badge good">正确答案：${escapeHtml(m.correctAnswer) || '（空）'}</span>
                        </div>
                        ${m.pending
                            ? '<div class="mistake-pending"><i class="fas fa-spinner fa-spin"></i> AI 归因分析中…</div>'
                            : `
                        <div class="mistake-cause-text"><span class="mistake-cause-label">错误原因：</span>${escapeHtml(m.causeText || '')}</div>
                        <div class="mistake-suggestion"><i class="fas fa-lightbulb"></i> ${escapeHtml(m.suggestion || '')}</div>`}
                        <div class="mistake-actions">
                            <button class="chip" onclick="reworkMistake('${m.id}')">${m.reviewed ? '再练一次' : '重做本题'}</button>
                            ${!m.pending ? '<button class="chip" onclick="reAnalyzeMistake(\'' + m.id + '\')" title="用更新的归因模型重新分析"><i class="fas fa-rotate"></i> 重新归因</button>' : ''}
                            ${m.reviewed ? '<span class="mistake-reviewed"><i class="fas fa-check-circle"></i> ' + (m.reviewCorrect ? '复习通过' : '复习待巩固') + '</span>' : '<span class="mistake-flag"><i class="fas fa-circle"></i> 未复习</span>'}
                        </div>
                    </div>`).join('');
                // 对未归因的错题自动触发 AI 归因，完成后局部刷新
                for (const m of items.filter((x) => x.pending)) {
                    analyzeMistake(m.id).then((ok) => { if (ok) refreshMistakeCard(m.id); });
                }
            } catch (error) {
                list.innerHTML = '<div class="overlay-empty">加载失败：' + escapeHtml(error.message) + '</div>';
            }
        }

        async function analyzeMistake(id, force) {
            try {
                const res = await fetch('/api/v1/mistakes/' + id + '/analyze', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-client-id': getClientId() },
                    body: JSON.stringify({ force: Boolean(force) })
                });
                return res.ok;
            } catch (e) { return false; }
        }

        // 用最新的归因模型重新分析（老错题可点击"重新归因"）
        async function reAnalyzeMistake(id) {
            const card = document.getElementById('mistake-' + id);
            if (!card) return;
            const cause = card.querySelector('.mistake-cause');
            if (cause) { cause.className = 'mistake-cause cause-pending'; cause.textContent = '归因中…'; }
            const ok = await analyzeMistake(id, true);
            if (ok) refreshMistakeCard(id);
        }

        async function refreshMistakeCard(id) {
            try {
                const res = await fetch('/api/v1/mistakes?reviewed=all', { headers: { 'x-client-id': getClientId() } });
                const payload = await res.json();
                const item = (payload.data.items || []).find((x) => x.id === id);
                if (!item) return;
                const card = document.getElementById('mistake-' + id);
                if (!card) return;
                const pending = card.querySelector('.mistake-pending');
                if (pending) {
                    pending.outerHTML = `
                        <div class="mistake-cause-text"><span class="mistake-cause-label">错误原因：</span>${escapeHtml(item.causeText || '')}</div>
                        <div class="mistake-suggestion"><i class="fas fa-lightbulb"></i> ${escapeHtml(item.suggestion || '')}</div>`;
                } else {
                    const ct = card.querySelector('.mistake-cause-text');
                    if (ct) ct.innerHTML = '<span class="mistake-cause-label">错误原因：</span>' + escapeHtml(item.causeText || '');
                    const sg = card.querySelector('.mistake-suggestion');
                    if (sg) sg.innerHTML = '<i class="fas fa-lightbulb"></i> ' + escapeHtml(item.suggestion || '');
                }
                const cause = card.querySelector('.mistake-cause');
                if (cause) { cause.className = 'mistake-cause cause-' + item.cause; cause.textContent = item.causeLabel; }
            } catch (e) { /* 忽略局部刷新失败 */ }
        }

        function reworkMistake(id) {
            const card = document.getElementById('mistake-' + id);
            if (!card) return;
            const existing = card.querySelector('.rework-box');
            if (existing) { existing.remove(); return; }
            const item = _mistakeCache.find((x) => x.id === id);
            const box = document.createElement('div');
            box.className = 'rework-box';
            box.innerHTML = '<input class="rework-input" placeholder="输入你的答案，重新作答…"><button class="chip" onclick="submitRework(\'' + id + '\', this)">提交</button>';
            card.querySelector('.mistake-actions').before(box);
            const input = box.querySelector('input');
            input.focus();
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitRework(id, box.querySelector('button')); });
        }

        async function submitRework(id, btn) {
            const box = btn.closest('.rework-box');
            const input = box.querySelector('input');
            const answer = input.value.trim();
            if (!answer) return;
            const item = _mistakeCache.find((x) => x.id === id);
            const reviewCorrect = item
                ? answer.normalize('NFC').trim().toLowerCase() === String(item.correctAnswer || '').normalize('NFC').trim().toLowerCase()
                : false;
            try {
                await fetch('/api/v1/mistakes/' + id + '/review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-client-id': getClientId() },
                    body: JSON.stringify({ reviewCorrect })
                });
            } catch (e) { /* 忽略 */ }
            loadMistakes();
        }

        // ===== 学情诊断 =====
        async function openDiagnostics() {
            document.getElementById('diagOverlay').hidden = false;
            const body = document.getElementById('diagBody');
            body.innerHTML = '<div class="overlay-empty"><i class="fas fa-spinner fa-spin"></i> 正在生成学情诊断…</div>';
            try {
                const res = await fetch('/api/v1/diagnostics', { headers: { 'x-client-id': getClientId() } });
                const payload = await res.json();
                if (!res.ok) throw new Error(payload.error?.message || '诊断失败');
                renderDiagnostics(payload.data.summary);
            } catch (error) {
                body.innerHTML = '<div class="overlay-empty">诊断失败：' + escapeHtml(error.message) + '</div>';
            }
        }

        function renderDiagnostics(s) {
            const pct = (x) => Math.round((x || 0) * 100) + '%';
            const acc = s.accuracy;
            const accColor = acc >= 0.8 ? '#1a9c5c' : (acc >= 0.6 ? '#d99a1a' : '#d94a4a');
            const topicsHtml = s.topics.length ? s.topics.map((t) => {
                const width = Math.round((t.correctRate || 0) * 100);
                const lvColor = t.masteryLevel === '掌握' ? '#1a9c5c' : t.masteryLevel === '一般' ? '#d99a1a' : '#d94a4a';
                return `<div class="diag-topic">
                    <div class="diag-topic-row"><span>${escapeHtml(t.topic)}</span><span style="color:${lvColor}">${t.masteryLevel} · ${t.attempts} 题</span></div>
                    <div class="diag-bar"><div class="diag-bar-fill" style="width:${width}%;background:${lvColor}"></div></div>
                </div>`;
            }).join('') : '<div class="diag-none">暂无答题记录</div>';
            const weakHtml = s.weakTopics.length ? s.weakTopics.map((w) => `
                <div class="diag-weak">
                    <div class="diag-weak-head"><i class="fas fa-triangle-exclamation"></i> ${escapeHtml(w.topic)}${w.reason ? '<span class="diag-weak-sub">' + escapeHtml(w.reason) + '</span>' : ''}</div>
                    ${w.suggestion ? '<div class="diag-weak-sugg"><i class="fas fa-lightbulb"></i> ' + escapeHtml(w.suggestion) + '</div>' : ''}
                </div>`).join('') : '<div class="diag-none"><i class="fas fa-circle-check" style="color:#1a9c5c"></i> 暂无薄弱知识点，继续保持！</div>';
            const trendHtml = s.trend.length ? s.trend.map((t) =>
                `<span class="diag-trend-day" title="${t.date}：${t.attempts} 题，正确率 ${pct(t.accuracy)}"><span class="diag-trend-bar" style="height:${Math.max(8, Math.round((t.accuracy || 0) * 72))}px"></span>${t.date.slice(5)}</span>`
            ).join('') : '<span class="diag-none">暂无趋势数据</span>';
            document.getElementById('diagBody').innerHTML = `
                <div class="diag-overview">
                    <div class="diag-stat"><div class="diag-stat-num" style="color:${accColor}">${pct(acc)}</div><div class="diag-stat-label">总正确率</div></div>
                    <div class="diag-stat"><div class="diag-stat-num">${s.totalAttempts}</div><div class="diag-stat-label">答题数</div></div>
                    <div class="diag-stat"><div class="diag-stat-num">${s.correctCount}</div><div class="diag-stat-label">答对数</div></div>
                    <div class="diag-stat"><div class="diag-stat-num">${s.mistakeCount}</div><div class="diag-stat-label">错题</div></div>
                    <div class="diag-stat"><div class="diag-stat-num">${pct(s.reviewRate)}</div><div class="diag-stat-label">复习率</div></div>
                </div>
                <div class="diag-section"><div class="diag-section-title"><i class="fas fa-bullseye"></i> 知识点掌握度</div>${topicsHtml}</div>
                <div class="diag-section"><div class="diag-section-title"><i class="fas fa-triangle-exclamation"></i> 薄弱点分析与建议</div>${weakHtml}</div>
                <div class="diag-section"><div class="diag-section-title"><i class="fas fa-chart-simple"></i> 每日正确率趋势</div><div class="diag-trend">${trendHtml}</div></div>`;
        }

        function exportDiagnostics() {
            const text = document.getElementById('diagBody').innerText;
            const blob = new Blob(['栈知映 · 学情诊断报告\n生成时间：' + new Date().toLocaleString() + '\n\n' + text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '学情诊断报告_' + new Date().toISOString().slice(0, 10) + '.txt';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // 遮罩点击关闭 / ESC 关闭（事件委托，兼容脚本先于弹层 DOM）
        document.addEventListener('click', function (e) {
            const ov = e.target.closest('.overlay');
            if (ov && e.target === ov) ov.hidden = true;
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.overlay:not([hidden])').forEach(function (ov) { ov.hidden = true; });
            }
        });

        // ===== AI 生成相关题目（调用后端 /api/v1/video/quiz） =====
        function escapeHtml(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        // 错题卡片选项渲染：绿色标记正确答案、红色标记用户选错的选项
        function renderMistakeOptions(m) {
            const opts = m.options;
            if (!Array.isArray(opts) || !opts.length) return '';
            const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
            const norm = (s) => String(s ?? '').normalize('NFC').trim().toLowerCase();
            let userIdx = -1;
            if (typeof m.userAnswer === 'string' && m.userAnswer.trim()) {
                const ltr = letters.indexOf(m.userAnswer.trim().toUpperCase());
                if (ltr >= 0 && ltr < opts.length) userIdx = ltr;
                else userIdx = opts.findIndex((o) => norm(o) === norm(m.userAnswer));
            }
            const correctIdx = opts.findIndex((o) => norm(o) === norm(m.correctAnswer));
            return '<div class="mistake-opts">' + opts.map((o, i) => {
                const isCorrect = i === correctIdx;
                const isUser = i === userIdx;
                let cls = 'mistake-opt';
                if (isCorrect) cls += ' ok';
                else if (isUser) cls += ' wrong';
                const tag = isCorrect ? '<span class="mistake-opt-tag ok">正确答案</span>' : (isUser ? '<span class="mistake-opt-tag wrong">你的答案</span>' : '');
                return '<div class="' + cls + '"><span class="mistake-opt-key">' + letters[i] + '</span><span class="mistake-opt-text">' + escapeHtml(o) + '</span>' + tag + '</div>';
            }).join('') + '</div>';
        }
        // 错题日期格式化：YYYY-MM-DD HH:mm
        function formatMistakeDate(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            if (isNaN(d.getTime())) return '';
            const pad = (n) => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        async function generateAIQuiz() {
            // 优先使用 search 页生成视频时输入的原始知识点文字
            const query = (videoQuery || document.getElementById('topSearch').value || currentVideoKey || '').trim();
            if (!query) {
                const container = document.getElementById('quizContainer');
                if (container) container.innerHTML = '<div style="padding:18px;color:var(--text-muted);line-height:1.6;">请先在页面顶部搜索或进入一个知识点视频，再点击"AI 生成题目"。</div>';
                console.warn('[AI Quiz] 缺少知识点关键词，无法生成题目', { topSearch: document.getElementById('topSearch')?.value, currentVideoKey });
                return;
            }
            console.log('[AI Quiz] 请求参数:', { query, time: new Date().toISOString() });
            const container = document.getElementById('quizContainer');
            const btn = document.getElementById('aiQuizBtn');
            btn.disabled = true;
            container.innerHTML = '<div style="padding:18px;color:var(--text-muted);display:flex;align-items:center;gap:8px;"><i class="fas fa-spinner fa-spin"></i> 正在根据「' + escapeHtml(query) + '」生成 3 道相关题目，请稍候…</div>';
            try {
                const res = await fetch('/api/v1/video/quiz', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const payload = await res.json();
                console.log('[AI Quiz] 响应:', { status: res.status, source: payload.data?.source, questionCount: payload.data?.questions?.length, requestId: payload.requestId, time: new Date().toISOString() });
                if (!res.ok) throw new Error(payload.error?.message || '生成失败');
                const questions = payload.data?.questions;
                if (!Array.isArray(questions) || !questions.length) throw new Error('未生成有效题目');
                currentQuiz = questions;
                currentQuiz._ai = true;
                quizState[quizKey()] = { answered: new Set(), score: 0, selections: {}, correctness: {} };
                saveLessonQuizProgress();
                renderQuiz();
            } catch (error) {
                console.warn('AI 生成题目失败：', error);
                container.innerHTML = '<div style="padding:18px;color:#e0555a;line-height:1.6;">AI 生成题目失败：' + escapeHtml(error.message) + '</div>';
            } finally {
                btn.disabled = false;
            }
        }

        // ===== 举一反三：基于某道已答题目生成同知识点变式题 =====
        let _variantsLoading = false;
        async function genVariants(qIdx) {
            if (!currentQuiz || !currentQuiz[qIdx]) return;
            if (_variantsLoading) return;
            const item = currentQuiz[qIdx];
            _variantsLoading = true;
            const container = document.getElementById('quizContainer');
            try {
                const res = await fetch('/api/v1/video/quiz', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: currentTopic().title || String(item.q).slice(0, 40),
                        variants_of: {
                            topic: currentTopic().title,
                            question: item.q,
                            options: item.opts || [],
                            answer: item.ans,
                            explanation: item.exp || ''
                        }
                    })
                });
                const payload = await res.json();
                if (!res.ok) throw new Error(payload.error?.message || '生成失败');
                const variants = payload.data?.questions;
                if (!Array.isArray(variants) || !variants.length) throw new Error('未生成变式题');
                variants.forEach((v, idx) => { v._variant = true; v._baseIdx = qIdx; });
                currentQuiz.push(...variants);
                renderQuiz();
                const cards = container.querySelectorAll('.quiz-card');
                cards[cards.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } catch (error) {
                console.warn('生成变式题失败：', error);
                alert('生成变式题失败：' + error.message);
            } finally {
                _variantsLoading = false;
            }
        }

        // ===== 播放控制 =====
        function togglePlay() {
            // 真课件 v2：暂停/播放委托给 CoursewarePlayer（按钮与点击播放器区域共用）
            if (window._cwPlayer) {
                if (window._cwPlayer.playing) {
                    window._cwPlayer.pause();
                } else {
                    window._cwPlayer.play();
                }
                return;
            }
            if (isPlaying) {
                pauseVideo();
            } else {
