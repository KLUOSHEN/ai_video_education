<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="cover" font-family="Microsoft YaHei, Arial, sans-serif"><rect id="bg" x="0" y="0" width="1280" height="720" fill="#0B1220" data-pptx-role="background"/><rect id="accent-bar" x="0" y="0" width="1280" height="10" fill="#A78BFA" data-pptx-role="decoration"/><g id="header" data-pptx-bounds="64 60 1150 140"><text x="64" y="118" fill="#22D3EE" font-size="44" font-weight="bold">快速排序算法详解与复杂度分析</text><text x="64" y="176" fill="#8CA3C0" font-size="24">高效且广泛应用的排序算法</text></g><g id="content" data-pptx-bounds="64 236 620 156"><text x="72" y="264" fill="#E6EDF7" font-size="22">快速排序是一种高效的排序算法，采用分治策略，</text><text x="72" y="298" fill="#E6EDF7" font-size="22">通过递归方式对数组进行排序。</text><text x="72" y="332" fill="#E6EDF7" font-size="22">本节课将详细介绍其核心思想、实现步骤、时间复</text><text x="72" y="366" fill="#E6EDF7" font-size="22">杂度和空间复杂度。</text></g><g id="art" data-pptx-bounds="690 190 540 450"><image href="../images/img-0.png" x="690" y="190" width="540" height="450" preserveAspectRatio="xMidYMid slice"/></g></svg>