<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="cover" font-family="Microsoft YaHei, Arial, sans-serif"><rect id="bg" x="0" y="0" width="1280" height="720" fill="#0B1220" data-pptx-role="background"/><rect id="accent-bar" x="0" y="0" width="1280" height="10" fill="#A78BFA" data-pptx-role="decoration"/><g id="header" data-pptx-bounds="64 60 1150 140"><text x="64" y="118" fill="#22D3EE" font-size="44" font-weight="bold">快速排序算法详解与复杂度分析</text><text x="64" y="176" fill="#8CA3C0" font-size="24">高效且广泛应用的排序算法</text></g><g id="bullets" data-pptx-bounds="64 246 580 360"><circle cx="76" cy="260" r="5" fill="#A78BFA"/><text x="96" y="268" fill="#E6EDF7" font-size="24">快速排序是一种高效的排序算法，采用分治策略，通过递归方式对数组进行排序。本节课将详细介绍其核心思想、实现步骤、时间复杂度和空间复杂度。</text></g></svg>