<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栈知映 · 错题本</title>
<script defer src="https://unpkg.com/lucide@1.21.0/dist/umd/lucide.min.js"></script>
<script defer src="lucide-unify.js"></script>
<style>
  :root {
    --primary: #4F6BF0; --primary-light: #6D83F5; --primary-soft: #EEF2FF; --cyan: #22C3E6;
    --bg: #F7F9FC; --panel: #FFFFFF; --panel-2: #FFFFFF; --border: #E2E8F0;
    --border-soft: #CBD5E1; --text: #0F172A; --text-dim: #475569; --text-muted: #64748B;
    --amber: #F59E0B; --emerald: #16A34A; --yellow: #EAB308; --danger: #DC2626;
    --ease: cubic-bezier(.23,1,.32,1);
    --ease-snap: cubic-bezier(0.2, 0, 0, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-fade: cubic-bezier(0.4, 0, 0.2, 1);
    --dur-fast: 90ms; --dur-base: 180ms; --dur-slow: 260ms; --dur-delight: 400ms;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100vh; }
  body {
    font-family: 'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:
      radial-gradient(1100px 560px at 12% -10%, rgba(79,107,240,.10), transparent 60%),
      radial-gradient(900px 520px at 92% -5%, rgba(109,131,245,.08), transparent 55%),
      radial-gradient(1000px 640px at 50% 115%, rgba(34,195,230,.06), transparent 60%),
      var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(79,107,240,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,107,240,.05) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,.7), transparent 70%);
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.7), transparent 70%);
  }
  body::after {
    content: ''; position: fixed; left: -10%; width: 120%; height: 26vh; top: -36vh; z-index: 0;
    background: linear-gradient(180deg, transparent, rgba(109,131,245,.05), transparent);
    pointer-events: none; animation: scanLine 18s linear infinite;
  }
  @keyframes scanLine { to { transform: translateY(175vh); } }

  /* ── 顶栏 ── */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    height: 60px; padding: 0 18px;
    background: rgba(255,255,255,.85); backdrop-filter: blur(12px) saturate(180%);
    border-bottom: 1px solid var(--border);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff; font-size: 18px;
    box-shadow: 0 6px 16px rgba(79,107,240,.28);
  }
  .brand h1 { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .brand .sub { font-size: 12px; color: var(--text-muted); margin-left: 2px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
    border-radius: 10px; color: var(--text-dim); text-decoration: none; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--border); white-space: nowrap;
    transition: color var(--dur-fast) var(--ease-snap), border-color var(--dur-fast) var(--ease-snap), background var(--dur-fast) var(--ease-snap);
  }
  .back:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none;
    font-family: inherit; transition: all var(--dur-fast) var(--ease-snap);
  }
  .btn:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(79,107,240,.28); }
  .btn.primary:hover { background: var(--primary-dark, #3B4FE0); color: #fff; }
  .btn:active { transform: translateY(1px) scale(.98); }

  /* ── 内容容器 ── */
  .container { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 24px 20px 64px; }

  /* ── 统计卡 ── */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 10px rgba(20,50,110,.04);
    transition: transform var(--dur-base) var(--ease-snap), box-shadow var(--dur-base) var(--ease-snap), border-color var(--dur-base) var(--ease-snap);
  }
  .stat:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(79,107,240,.12); border-color: var(--border-soft); }
  .stat-icon {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .stat-icon.i-total { background: var(--primary-soft); color: var(--primary); }
  .stat-icon.i-pending { background: #FEF3C7; color: #D97706; }
  .stat-icon.i-done { background: #ECFDF5; color: var(--emerald); }
  .stat-icon.i-rate { background: #F0FDF4; color: #059669; }
  .stat-num { font-size: 24px; font-weight: 800; line-height: 1.1; color: var(--text); }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

  /* ── 筛选栏 ── */
  .filter-bar {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    box-shadow: 0 2px 10px rgba(20,50,110,.04); position: relative; z-index: 2;
  }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); gap: 2px; }
  .seg button {
    border: none; background: transparent; padding: 6px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; font-family: inherit;
    transition: all var(--dur-fast) var(--ease-snap); white-space: nowrap;
  }
  .seg button:hover { color: var(--primary); }
  .seg button.active { background: var(--panel); color: var(--primary); box-shadow: 0 2px 8px rgba(20,50,110,.10); }
  .select {
    position: relative; display: inline-flex; align-items: center;
  }
  .select select {
    appearance: none; -webkit-appearance: none;
    height: 36px; padding: 0 32px 0 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; outline: none;
    transition: border-color var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap);
  }
  .select select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79,107,240,.12); }
  .select::after {
    content: ''; position: absolute; right: 12px; pointer-events: none;
    width: 7px; height: 7px; border-right: 1.5px solid var(--text-muted); border-bottom: 1.5px solid var(--text-muted);
    transform: rotate(45deg) translateY(-2px);
  }
  .search {
    flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 12px; border-radius: 10px; background: var(--bg);
    border: 1px solid var(--border); transition: border-color var(--dur-fast) var(--ease-snap), box-shadow var(--dur-fast) var(--ease-snap);
  }
  .search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79,107,240,.12); background: #fff; }
  .search i { color: var(--text-muted); font-size: 15px; }
  .search input { flex: 1; border: none; background: transparent; outline: none; font-size: 13px; color: var(--text); font-family: inherit; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text-dim); cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center;
    transition: all var(--dur-fast) var(--ease-snap); flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
  .icon-btn.spinning i { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 列表 ── */
  .list { display: flex; flex-direction: column; gap: 14px; }
  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .list-title { font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .list-title i { color: var(--primary); }
  .list-count { font-size: 12px; color: var(--text-muted); }

  .mistake-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; box-shadow: 0 2px 10px rgba(20,50,110,.05);
    animation: rise var(--dur-slow) var(--ease-out) both;
    transition: border-color var(--dur-base) var(--ease-snap), box-shadow var(--dur-base) var(--ease-snap);
  }
  .mistake-card:hover { border-color: var(--border-soft); box-shadow: 0 10px 26px rgba(20,50,110,.08); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .m-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .m-topic {
    font-size: 12px; font-weight: 600; color: var(--primary); background: var(--primary-soft);
    padding: 3px 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px;
  }
  .m-topic .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
  .m-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .m-date { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .m-type { font-size: 11px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); padding: 1px 8px; border-radius: 999px; }
  .m-cause { font-size: 12px; font-weight: 600; padding: 3px 11px; border-radius: 999px; white-space: nowrap; }
  .cause-concept { background: #fff3e6; color: #d97b1a; }
  .cause-confusion { background: #fdf1ff; color: #a44fd8; }
  .cause-method { background: #f0ecff; color: #6f4fd8; }
  .cause-misread { background: #eafff3; color: #1a9c5c; }
  .cause-careless { background: #eaf6ff; color: #1a7fd9; }
  .cause-calc { background: #fff4e0; color: #cf8a12; }
  .cause-unknown { background: #f2f4f8; color: var(--text-muted); }
  .cause-pending { background: #fff8e1; color: #c99a13; }

  .m-q { font-size: 14.5px; font-weight: 500; color: var(--text); line-height: 1.7; margin-bottom: 10px; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
  .m-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .m-opt {
    display: flex; align-items: center; gap: 9px; padding: 7px 11px;
    border: 1px solid var(--border); border-radius: 9px; font-size: 13px; color: var(--text); line-height: 1.5;
  }
  .m-opt.ok { border-color: #b5e3c4; background: #f0fbf4; }
  .m-opt.wrong { border-color: #f0b8b8; background: #fff2f2; }
  .m-opt-key {
    width: 21px; height: 21px; min-width: 21px; border-radius: 50%; background: #F1F5F9; color: var(--text-dim);
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .m-opt.ok .m-opt-key { background: #16a34a; color: #fff; }
  .m-opt.wrong .m-opt-key { background: #dc2626; color: #fff; }
  .m-opt-tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; margin-left: auto; flex-shrink: 0; font-weight: 500; }
  .m-opt-tag.ok { background: #e8f8ee; color: #16a34a; }
  .m-opt-tag.wrong { background: #ffecec; color: #dc2626; }

  .m-ans { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .m-badge { font-size: 12px; padding: 3px 11px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; }
  .m-badge.bad { background: #ffecec; color: #dc2626; }
  .m-badge.good { background: #e8f8ee; color: #16a34a; }

  .m-analysis { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 2px; }
  .m-pending { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 7px; }
  .m-pending i { animation: spin 1.4s linear infinite; }
  .m-cause-text { font-size: 13px; color: #5a6a8c; line-height: 1.6; margin-bottom: 8px; }
  .m-cause-text b { color: #3a4a6e; }
  .m-suggestion {
    font-size: 13px; color: var(--text); background: var(--primary-soft);
    border-left: 3px solid var(--primary); padding: 9px 12px; border-radius: 0 9px 9px 0; line-height: 1.6;
    display: flex; gap: 8px; align-items: flex-start;
  }
  .m-suggestion i { color: var(--primary); margin-top: 1px; flex-shrink: 0; }

  .m-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 13px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text-dim);
    font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: all var(--dur-fast) var(--ease-snap);
  }
  .chip:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
  .chip:active { transform: scale(.97); }
  .m-status { font-size: 12px; font-weight: 600; margin-left: auto; display: inline-flex; align-items: center; gap: 5px; }
  .m-status.done { color: var(--emerald); }
  .m-status.fail { color: var(--amber); }
  .m-status.flag { color: #D97706; background: #FEF3C7; border: 1px solid #FDE68A; padding: 3px 10px; border-radius: 999px; }

  .rework-box {
    display: flex; flex-direction: column; gap: 8px; margin-top: 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    animation: rise var(--dur-base) var(--ease-out) both;
  }
  .rework-title { font-size: 12px; font-weight: 700; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .rework-opts { display: flex; flex-direction: column; gap: 6px; }
  .rework-opt {
    display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--panel); font-size: 13px; color: var(--text);
    cursor: pointer; text-align: left; font-family: inherit; line-height: 1.5;
    transition: all var(--dur-fast) var(--ease-snap);
  }
  .rework-opt:hover { border-color: var(--primary); background: var(--primary-soft); }
  .rework-opt .rk { width: 21px; height: 21px; min-width: 21px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .rework-opt.correct { border-color: #b5e3c4; background: #f0fbf4; }
  .rework-opt.incorrect { border-color: #f0b8b8; background: #fff2f2; }
  .rework-row { display: flex; gap: 8px; }
  .rework-input {
    flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 13px; outline: none; font-family: inherit; background: var(--panel); color: var(--text);
  }
  .rework-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79,107,240,.12); }
  .rework-result { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .rework-result.ok { color: var(--emerald); }
  .rework-result.no { color: var(--danger); }

  /* ── 空状态 / 加载 ── */
  .empty {
    background: var(--panel); border: 1.5px dashed var(--border-soft); border-radius: 16px;
    padding: 60px 24px; text-align: center; color: var(--text-muted);
  }
  .empty .ic { font-size: 44px; color: #cbd5e1; display: block; margin-bottom: 14px; }
  .empty h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .empty p { font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 60px 0; color: var(--text-muted); font-size: 14px; }
  .loading i { animation: spin 1.2s linear infinite; color: var(--primary); }
  .error-box { text-align: center; padding: 40px 20px; color: var(--text-muted); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    body::after { animation: none; }
  }
  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .brand .sub { display: none; }
    .back span { display: none; }
    .filter-bar { gap: 8px; }
    .search { min-width: 100%; order: 5; }
    .m-status { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="back" href="search.html" title="返回首页"><i data-lucide="arrow-left" aria-hidden="true"></i><span>返回</span></a>
      <div class="brand">
        <span class="logo"><i data-lucide="book-open" aria-hidden="true"></i></span>
        <h1>错题本</h1>
        <span class="sub">栈知映 · 学情复盘</span>
      </div>
    </div>
    <div class="topbar-right">
      <a class="btn primary" href="watch.html"><i data-lucide="pen-line" aria-hidden="true"></i>去答题</a>
    </div>
  </header>

  <main class="container">
    <section class="stats" aria-label="错题统计">
      <div class="stat">
        <span class="stat-icon i-total"><i data-lucide="clipboard-list" aria-hidden="true"></i></span>
        <div><div class="stat-num" id="statTotal">—</div><div class="stat-label">错题总数</div></div>
      </div>
      <div class="stat">
        <span class="stat-icon i-pending"><i data-lucide="flame" aria-hidden="true"></i></span>
        <div><div class="stat-num" id="statPending">—</div><div class="stat-label">待复习</div></div>
      </div>
      <div class="stat">
        <span class="stat-icon i-done"><i data-lucide="circle-check" aria-hidden="true"></i></span>
        <div><div class="stat-num" id="statDone">—</div><div class="stat-label">已复习</div></div>
      </div>
      <div class="stat">
        <span class="stat-icon i-rate"><i data-lucide="target" aria-hidden="true"></i></span>
        <div><div class="stat-num" id="statRate">—</div><div class="stat-label">复习通过率</div></div>
      </div>
    </section>

    <section class="filter-bar" aria-label="筛选">
      <div class="seg" id="statusSeg" role="tablist" aria-label="复习状态筛选">
        <button data-status="all" class="active">全部</button>
        <button data-status="unreviewed">待复习</button>
        <button data-status="reviewed">已复习</button>
      </div>
      <div class="select">
        <select id="topicFilter" aria-label="按知识点筛选"><option value="all">全部知识点</option></select>
      </div>
      <div class="select">
        <select id="causeFilter" aria-label="按错误原因筛选"><option value="all">全部原因</option></select>
      </div>
      <div class="search">
        <i data-lucide="search" aria-hidden="true"></i>
        <input id="searchInput" type="text" placeholder="搜索题目或知识点…" aria-label="搜索">
      </div>
      <button class="icon-btn" id="refreshBtn" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw" aria-hidden="true"></i></button>
    </section>

    <div class="list-head">
      <div class="list-title"><i data-lucide="book-marked" aria-hidden="true"></i>错题列表</div>
      <div class="list-count" id="listCount"></div>
    </div>
    <section class="list" id="mistakeList" aria-live="polite"></section>
  </main>

<script>
(function () {
  'use strict';
  const CAUSE_LABELS = {
    concept: '概念不清', confusion: '概念混淆', method: '方法不当',
    misread: '审题失误', careless: '粗心失误', calc: '计算失误', unknown: '暂无法判断'
  };
  const CAUSE_ORDER = ['concept', 'confusion', 'method', 'misread', 'careless', 'calc', 'unknown'];
  const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

  const state = { items: [], status: 'all', topic: 'all', cause: 'all', keyword: '' };
  const els = {
    list: document.getElementById('mistakeList'),
    listCount: document.getElementById('listCount'),
    statTotal: document.getElementById('statTotal'),
    statPending: document.getElementById('statPending'),
    statDone: document.getElementById('statDone'),
    statRate: document.getElementById('statRate'),
    topicFilter: document.getElementById('topicFilter'),
    causeFilter: document.getElementById('causeFilter'),
    searchInput: document.getElementById('searchInput'),
    refreshBtn: document.getElementById('refreshBtn'),
    statusSeg: document.getElementById('statusSeg')
  };

  function getClientId() {
    let id = localStorage.getItem('zx_client_id');
    if (!id) {
      id = 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('zx_client_id', id);
    }
    return id;
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function norm(s) { return String(s ?? '').normalize('NFC').trim().toLowerCase(); }
  function formatDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    const pad = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  async function api(path, opts) {
    const res = await fetch('/api/v1' + path, Object.assign({
      headers: { 'x-client-id': getClientId() }
    }, opts || {}));
    const payload = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(payload.error?.message || ('请求失败 ' + res.status));
    return payload;
  }

  function setLoading() {
    els.list.innerHTML = '<div class="loading"><i data-lucide="loader-circle" aria-hidden="true"></i>加载中…</div>';
    window.lucide && window.lucide.createIcons({ root: els.list });
  }
  function showEmpty() {
    els.list.innerHTML = '<div class="empty"><span class="ic"><i data-lucide="inbox" aria-hidden="true"></i></span>' +
      '<h3>' + (state.items.length ? '没有符合筛选条件的错题' : '还没有错题记录') + '</h3>' +
      '<p>' + (state.items.length ? '试试调整筛选条件，或清空搜索关键词。' : '去「知识测评」答几道题，做错的题目会自动收录到这里。') + '</p>' +
      (!state.items.length ? '<a class="btn primary" href="watch.html"><i data-lucide="pen-line" aria-hidden="true"></i>去答题</a>' : '') +
      '</div>';
    window.lucide && window.lucide.createIcons({ root: els.list });
  }
  function showError(msg) {
    els.list.innerHTML = '<div class="error-box"><p>' + escapeHtml(msg) + '</p><br>' +
      '<button class="btn" onclick="location.reload()">重试</button></div>';
  }

  function renderStats() {
    const items = state.items;
    const total = items.length;
    const pending = items.filter((m) => !m.reviewed).length;
    const done = items.filter((m) => m.reviewed).length;
    const passed = items.filter((m) => m.reviewed && m.reviewCorrect === true).length;
    els.statTotal.textContent = total;
    els.statPending.textContent = pending;
    els.statDone.textContent = done;
    els.statRate.textContent = done ? Math.round((passed / done) * 100) + '%' : '—';
  }

  function fillFilters() {
    const topics = [...new Set(state.items.map((m) => m.topic?.title).filter(Boolean))].sort();
    els.topicFilter.innerHTML = '<option value="all">全部知识点</option>' +
      topics.map((t) => '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>').join('');
    els.topicFilter.value = state.topic;
    els.causeFilter.innerHTML = '<option value="all">全部原因</option>' +
      CAUSE_ORDER.map((c) => '<option value="' + c + '">' + CAUSE_LABELS[c] + '</option>').join('') +
      '<option value="pending">待归因</option>';
    els.causeFilter.value = state.cause;
  }

  function filtered() {
    return state.items.filter((m) => {
      if (state.status === 'unreviewed' && m.reviewed) return false;
      if (state.status === 'reviewed' && !m.reviewed) return false;
      if (state.topic !== 'all' && (m.topic?.title || '未分类') !== state.topic) return false;
      if (state.cause === 'pending' && m.cause) return false;
      if (state.cause !== 'all' && state.cause !== 'pending' && m.cause !== state.cause) return false;
      if (state.keyword) {
        const kw = state.keyword.toLowerCase();
        const hay = ((m.question || '') + ' ' + (m.topic?.title || '') + ' ' + (m.correctAnswer || '') + ' ' + (m.userAnswer || '')).toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    });
  }

  function renderOptions(m) {
    const opts = m.options;
    if (!Array.isArray(opts) || !opts.length) return '';
    let userIdx = -1;
    if (typeof m.userAnswer === 'string' && m.userAnswer.trim()) {
      const ltr = LETTERS.indexOf(m.userAnswer.trim().toUpperCase());
      if (ltr >= 0 && ltr < opts.length) userIdx = ltr;
      else userIdx = opts.findIndex((o) => norm(o) === norm(m.userAnswer));
    }
    const correctIdx = opts.findIndex((o) => norm(o) === norm(m.correctAnswer));
    return '<div class="m-opts">' + opts.map((o, i) => {
      const isCorrect = i === correctIdx;
      const isUser = i === userIdx;
      let cls = 'm-opt';
      if (isCorrect) cls += ' ok';
      else if (isUser) cls += ' wrong';
      const tag = isCorrect ? '<span class="m-opt-tag ok">正确答案</span>' : (isUser ? '<span class="m-opt-tag wrong">你的答案</span>' : '');
      return '<div class="' + cls + '"><span class="m-opt-key">' + LETTERS[i] + '</span><span>' + escapeHtml(o) + '</span>' + tag + '</div>';
    }).join('') + '</div>';
  }

  function statusBadge(m) {
    if (!m.reviewed) return '<span class="m-status flag"><i data-lucide="flame" aria-hidden="true"></i>未复习</span>';
    if (m.reviewCorrect === true) return '<span class="m-status done"><i data-lucide="circle-check" aria-hidden="true"></i>复习通过</span>';
    return '<span class="m-status fail"><i data-lucide="circle-alert" aria-hidden="true"></i>复习待巩固</span>';
  }

  function renderCard(m) {
    const analysis = m.pending
      ? '<div class="m-analysis"><div class="m-pending"><i data-lucide="loader-circle" aria-hidden="true"></i>AI 正在诊断错误原因…</div></div>'
      : '<div class="m-analysis">' +
          '<div class="m-cause-text"><b>错误原因：</b>' + escapeHtml(m.causeText || '') + '</div>' +
          '<div class="m-suggestion"><i data-lucide="lightbulb" aria-hidden="true"></i><span>' + escapeHtml(m.suggestion || '暂无建议') + '</span></div>' +
        '</div>';
    return '<div class="mistake-card" data-id="' + escapeHtml(m.id) + '">' +
      '<div class="m-head">' +
        '<span class="m-topic"><span class="dot"></span>' + escapeHtml(m.topic?.title || '未分类') + '</span>' +
        '<span class="m-meta">' +
          (m.type ? '<span class="m-type">' + escapeHtml(m.type) + '</span>' : '') +
          '<span class="m-date">' + escapeHtml(formatDate(m.createdAt)) + '</span>' +
          '<span class="m-cause ' + (m.cause ? 'cause-' + m.cause : 'cause-pending') + '">' + escapeHtml(m.causeLabel || (m.pending ? '归因中…' : '未归因')) + '</span>' +
        '</span>' +
      '</div>' +
      '<div class="m-q">' + escapeHtml(m.question) + '</div>' +
      renderOptions(m) +
      '<div class="m-ans">' +
        '<span class="m-badge bad"><i data-lucide="circle-x" aria-hidden="true"></i>你的答案：' + escapeHtml(m.userAnswer || '（空）') + '</span>' +
        '<span class="m-badge good"><i data-lucide="circle-check" aria-hidden="true"></i>正确答案：' + escapeHtml(m.correctAnswer || '（空）') + '</span>' +
      '</div>' +
      analysis +
      '<div class="m-actions">' +
        '<button class="chip" data-action="rework"><i data-lucide="pen-line" aria-hidden="true"></i>重做本题</button>' +
        (!m.pending ? '<button class="chip" data-action="reanalyze"><i data-lucide="refresh-ccw" aria-hidden="true"></i>重新归因</button>' : '') +
        statusBadge(m) +
      '</div>' +
    '</div>';
  }

  function renderList() {
    const list = filtered();
    els.listCount.textContent = list.length ? '共 ' + list.length + ' 题' : '';
    if (!list.length) { showEmpty(); return; }
    els.list.innerHTML = list.map((m, i) => {
      return '<div style="animation-delay:' + Math.min(i * 25, 300) + 'ms">' + renderCard(m) + '</div>';
    }).join('');
    window.lucide && window.lucide.createIcons({ root: els.list });
  }

  async function loadAll() {
    setLoading();
    try {
      const payload = await api('/mistakes?reviewed=all');
      state.items = payload.data?.items || [];
      renderStats();
      fillFilters();
      renderList();
      // 对未归因的错题自动触发 AI 归因
      state.items.filter((m) => m.pending).forEach((m) => {
        analyze(m.id, false).then(() => refreshCard(m.id));
      });
    } catch (e) {
      showError(e.message);
    }
  }

  async function analyze(id, force) {
    try {
      await api('/mistakes/' + id + '/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ force: Boolean(force) })
      });
      return true;
    } catch (e) { return false; }
  }

  async function refreshCard(id) {
    try {
      const payload = await api('/mistakes?reviewed=all');
      const item = (payload.data?.items || []).find((x) => x.id === id);
      if (!item) return;
      const idx = state.items.findIndex((x) => x.id === id);
      if (idx >= 0) state.items[idx] = item;
      renderStats();
      renderList();
    } catch (e) { /* 忽略局部刷新失败 */ }
  }

  async function reAnalyze(id) {
    const card = document.querySelector('.mistake-card[data-id="' + CSS.escape(id) + '"]');
    if (card) {
      const cause = card.querySelector('.m-cause');
      if (cause) { cause.className = 'm-cause cause-pending'; cause.textContent = '归因中…'; }
      const an = card.querySelector('.m-analysis');
      if (an) an.innerHTML = '<div class="m-pending"><i data-lucide="loader-circle" aria-hidden="true"></i>AI 正在重新诊断…</div>';
      window.lucide && window.lucide.createIcons({ root: card });
    }
    const ok = await analyze(id, true);
    if (ok) await refreshCard(id);
  }

  function isCorrect(m, answer) {
    const a = String(answer ?? '').trim();
    const c = String(m.correctAnswer ?? '').trim();
    if (norm(a) === norm(c)) return true;
    const aIdx = LETTERS.indexOf(a.toUpperCase());
    if (aIdx >= 0 && Array.isArray(m.options) && m.options[aIdx] && norm(m.options[aIdx]) === norm(c)) return true;
    const cIdx = LETTERS.indexOf(c.toUpperCase());
    if (cIdx >= 0 && Array.isArray(m.options) && m.options[cIdx] && norm(a) === norm(m.options[cIdx])) return true;
    return false;
  }

  function toggleRework(id) {
    const card = document.querySelector('.mistake-card[data-id="' + CSS.escape(id) + '"]');
    if (!card) return;
    const existing = card.querySelector('.rework-box');
    if (existing) { existing.remove(); return; }
    const m = state.items.find((x) => x.id === id);
    if (!m) return;
    const box = document.createElement('div');
    box.className = 'rework-box';
    const hasOpts = Array.isArray(m.options) && m.options.length;
    if (hasOpts) {
      box.innerHTML = '<div class="rework-title"><i data-lucide="pen-line" aria-hidden="true"></i>重新作答（点击选项）</div>' +
        '<div class="rework-opts">' + m.options.map((o, i) =>
          '<button class="rework-opt" data-opt="' + i + '"><span class="rk">' + LETTERS[i] + '</span><span>' + escapeHtml(o) + '</span></button>'
        ).join('') + '</div>';
    } else {
      box.innerHTML = '<div class="rework-title"><i data-lucide="pen-line" aria-hidden="true"></i>重新作答</div>' +
        '<div class="rework-row"><input class="rework-input" placeholder="输入你的答案…"><button class="chip" data-action="submit-text">提交</button></div>';
    }
    card.querySelector('.m-actions').before(box);
    window.lucide && window.lucide.createIcons({ root: box });
    const input = box.querySelector('input');
    if (input) {
      input.focus();
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitRework(id, input.value, -1); });
    }
  }

  async function submitRework(id, answer, answerIndex) {
    const m = state.items.find((x) => x.id === id);
    if (!m) return;
    const val = String(answer ?? '').trim();
    if (!val) return;
    const correct = isCorrect(m, val);
    const card = document.querySelector('.mistake-card[data-id="' + CSS.escape(id) + '"]');
    const box = card && card.querySelector('.rework-box');
    // 视觉反馈
    if (box) {
      const allOpts = box.querySelectorAll('.rework-opt');
      allOpts.forEach((b) => {
        const i = Number(b.getAttribute('data-opt'));
        if (i === answerIndex) b.classList.add(correct ? 'correct' : 'incorrect');
        b.disabled = true;
      });
      const input = box.querySelector('.rework-input');
      if (input) input.disabled = true;
      const submitBtn = box.querySelector('[data-action="submit-text"]');
      if (submitBtn) submitBtn.disabled = true;
      const result = document.createElement('div');
      result.className = 'rework-result ' + (correct ? 'ok' : 'no');
      result.innerHTML = correct
        ? '<i data-lucide="circle-check" aria-hidden="true"></i>回答正确，已标记为复习通过！'
        : '<i data-lucide="circle-x" aria-hidden="true"></i>还不够准确，正确答案是「' + escapeHtml(m.correctAnswer || '') + '」，已记录为待巩固。';
      box.appendChild(result);
      window.lucide && window.lucide.createIcons({ root: box });
    }
    try {
      await api('/mistakes/' + id + '/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reviewCorrect: correct })
      });
    } catch (e) { /* 忽略网络错误，界面已反馈 */ }
    await loadAll();
  }

  // 事件委托
  els.list.addEventListener('click', (e) => {
    const card = e.target.closest('.mistake-card');
    if (!card) return;
    const id = card.getAttribute('data-id');
    const actionBtn = e.target.closest('[data-action]');
    const optBtn = e.target.closest('.rework-opt');
    if (actionBtn) {
      const action = actionBtn.getAttribute('data-action');
      if (action === 'rework') toggleRework(id);
      else if (action === 'reanalyze') reAnalyze(id);
      else if (action === 'submit-text') {
        const input = card.querySelector('.rework-input');
        if (input) submitRework(id, input.value, -1);
      }
    } else if (optBtn && !optBtn.disabled) {
      const idx = Number(optBtn.getAttribute('data-opt'));
      const m = state.items.find((x) => x.id === id);
      if (m && Array.isArray(m.options) && m.options[idx] != null) submitRework(id, m.options[idx], idx);
    }
  });

  // 筛选交互
  els.statusSeg.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-status]');
    if (!btn) return;
    state.status = btn.getAttribute('data-status');
    els.statusSeg.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
    renderList();
  });
  els.topicFilter.addEventListener('change', () => { state.topic = els.topicFilter.value; renderList(); });
  els.causeFilter.addEventListener('change', () => { state.cause = els.causeFilter.value; renderList(); });
  let searchTimer = null;
  els.searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.keyword = els.searchInput.value.trim(); renderList(); }, 200);
  });
  els.refreshBtn.addEventListener('click', () => {
    els.refreshBtn.classList.add('spinning');
    loadAll().finally(() => setTimeout(() => els.refreshBtn.classList.remove('spinning'), 500));
  });

  // 初始化
  document.addEventListener('DOMContentLoaded', loadAll);
})();
</script>
</body>
</html>
